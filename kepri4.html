window.__SOAL_TEMPLATE_CONFIG = {"title":"Paket Kepri 4 - JAGOPSI","examType":"KEPRI","examName":"Kepribadian Paket 4","examFile":"kepri4.html","packageCode":"KEPRI_4","sectionLabel":"Kepribadian","introTitle":"Template Kepribadian","introText":"Soal kepribadian ditampilkan dengan format seragam seperti soal.html, khusus satu bagian kepribadian.","durationMinutes":35,"scoringMode":"points","extraPaths":["hasil_kepri"],"sessionSize":32,"randomBank":false,"requireLogin":true,"requireVIP":true,"vipMessage":"Kepribadian Paket 4 hanya untuk akun VIP.","storageKey":"kepri4_fixed_session_v2","backUrl":"kepribadian_list.html"};
window.__SOAL_TEMPLATE_QUESTIONS = [{"number": 1, "text": "Universitas Anda mengadakan kejuaraan olahraga futsal antar kampus. Tim futsal universitas Anda masuk final dan akan melawan tim dari universitas lain yang menang di tahun lalu. Anda termasuk ketua seksi keamanan di acara tersebut. Kedua tim memiliki supporter yang fanatik sehingga saat pertandingan berjalan ricuh dan anarkis. Apa yang akan Anda lakukan?", "options": {"A": "Menggerakan anggota untuk mengamankan dan menenangkan supporter saat pertandingan", "B": "Menegur supporter lawan yang membuat kericuhan dan anarkis saat pertandingan berlangsung", "C": "Mengarahkan seluruh anggota untuk menjaga supporter universitas Anda dari tindakan anarkis lawan", "D": "Memerintahkan anggota untuk segera mengamankan supporter yang bertindak anarkis saat pertandingan"}, "points": {"A": 3, "B": 2, "C": 1, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 2, "text": "Anda adalah anggota pramuka di sekolah yang setiap tahunnya mengadakan acara Kemah Ceria. Anda bertugas sebagai ketua seksi acara dan wali kelas meminta untuk membuat acara semenarik mungkin. Namun, Anda bingung membuat konsep acara dengan waktu yang terbatas dan Anda meragukan kinerja anggota. Apa yang akan Anda lakukan?", "options": {"A": "Menunggu arahan selanjutnya dari wali kelas acara apa yang ingin ditampilkan", "B": "Meminta saran dari beberapa anggota kelompok tentang tema acara yang menarik", "C": "Mencoba membuat konsep acara dengan mempertimbangkan ide dari setiap anggota kelompok", "D": "Mendorong seluruh anggota untuk memberikan ide menarik yang dapat dilakukan demi keberhasilan acara"}, "points": {"A": 1, "B": 2, "C": 3, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 3, "text": "Sebagai Ketua Karang Taruna, Anda diminta untuk memasang umbul-umbul di sepanjang jalan desa dalam memperingati 17 Agustus. Seminggu sebelum acara, umbul-umbul belum terpasang sehingga Anda ditegur oleh ketua RW. Tim perlengkapan kekurangan anggota dan banyak umbul-umbul yang rusak. Apa yang akan Anda lakukan?", "options": {"A": "Percaya kepada tim perlengkapan dapat menyelesaikan sebelum acara dilaksanakan", "B": "Berdiskusi dengan tim untuk mencari jalan keluar terkait kendala yang dihadapi", "C": "Meminta bantuan tim lain untuk membantu tim perlengkapan", "D": "Melaporkan kepada ketua RW dan meminta saran terkait permasalahan tersebut"}, "points": {"A": 1, "B": 3, "C": 4, "D": 2}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 4, "text": "Sebagai ketua divisi Seni Budaya Anda ditunjuk menjadi pelaksana kegiatan lomba kebersihan. Para siswa tidak mengetahui adanya penilaian agar juri dapat menilai ruangan dan kerja sama dalam membersihkan kelas. Panitia lain meragukan Anda sebagai ketua pelaksana karena kelas Anda tergolong kotor. Apa yang akan Anda lakukan?", "options": {"A": "Mengantisipasi skor rendah dengan menginformasikan kegiatan kepada ketua kelas", "B": "Menghimbau panitia lain untuk merahasiakan rencana kegiatan lomba kebersihan", "C": "Menjaga informasi pelaksanaan kegiatan agar memperoleh hasil yang adil", "D": "Memberitahu beberapa teman kelas secara diam-diam untuk membersihkan kelas"}, "points": {"A": 2, "B": 3, "C": 4, "D": 1}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 5, "text": "Anda adalah seorang siswa pindahan di kelas X. Di sekolah Anda memiliki peraturan yang cukup ketat, salah satunya masuk sekolah pada pukul 06.45 pagi. Beberapa hari yang lalu Anda juga sudah datang terlambat ke sekolah karena bangun kesiangan. Jika sudah tiga kali datang terlambat maka akan berpengaruh pada nilai Anda. Apa yang akan Anda lakukan?", "options": {"A": "Segera menghubungi wali kelas untuk menjelaskan situasi terlambat melalui telepon", "B": "Berangkat ke sekolah dengan waktu yang sama seperti sekolah sebelumnya", "C": "Menghadap wali kelas untuk menjelaskan situasi yang dialami dan meminta maaf", "D": "Membiasakan untuk datang ke sekolah dan bersedia menerima sanksi karena terlambat"}, "points": {"A": 2, "B": 1, "C": 3, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 6, "text": "Anda merupakan anak dari seorang petani. Anda diwajibkan membantu pekerjaan orang tua setiap pulang sekolah. Anda membutuhkan barang-barang baru untuk sekolah dan berinisiatif menjadi juru parkir untuk menambah uang. Saat ini musim panen sehingga Anda akan sibuk membantu orang tua. Apa yang akan Anda lakukan?", "options": {"A": "Bercerita kepada orang tua dan mengatakan Anda perlu beli perlengkapan sekolah", "B": "Mengusahakan untuk tetap membantu orang tua agar keuntungan panen membantu membeli kebutuhan", "C": "Membantu orang tua dengan maksimal, setelah selesai langsung bergegas menjadi juru parkir", "D": "Menjadi juru parkir untuk memenuhi kebutuhan barang baru untuk sekolah"}, "points": {"A": 2, "B": 3, "C": 4, "D": 1}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 7, "text": "Sebagai ketua seksi perlengkapan HUT Sekolah, Anda bertanggung jawab terhadap sound system yang akan digunakan saat puncak acara. Pada saat gladi, salah satu sound system tidak berfungsi. Sementara itu dana perlengkapan hampir habis. Apa yang akan Anda lakukan?", "options": {"A": "Mencari sound system pengganti dengan sisa dana yang tersedia", "B": "Berusaha mencari orang untuk memperbaiki sound system yang rusak", "C": "Menunggu saran tindakan yang harus dilakukan dari ketua panitia", "D": "Menggunakan sound system seadanya karena dana perlengkapan hampir habis"}, "points": {"A": 3, "B": 4, "C": 1, "D": 2}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 8, "text": "Anda sebagai ketua seksi acara dalam pentas seni sekolah. Akan tetapi 20 menit sebelum acara stand up comedy, tiba-tiba komika yang akan mengisi membatalkan karena jatuh sakit. Padahal sebelum acara dimulai Anda sudah memastikan dan melaporkan kepada ketua pelaksana bahwa acara telah siap. Apa yang akan Anda lakukan?", "options": {"A": "Menunggu arahan tentang tindakan yang harus dilakukan dari ketua pelaksana", "B": "Menanyakan teman tentang komika yang dapat segera menggantikan", "C": "Menghapus stand up comedy dari susunan acara dan melanjutkan ke acara selanjutnya", "D": "Menghubungi ketua pelaksana untuk meminta maaf pada penonton"}, "points": {"A": 1, "B": 4, "C": 3, "D": 2}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 9, "text": "Saat memasuki kelas XII, Anda berkeinginan kuliah di jurusan hukum sesuai cita-cita Anda. Akan tetapi, orang tua tidak setuju karena tidak memiliki dana untuk membiayai kuliah. Orang tua Anda menyarankan untuk langsung bekerja agar dapat menghasilkan uang. Apa yang akan Anda lakukan?", "options": {"A": "Mengikuti saran orang tua untuk langsung bekerja agar meringankan biaya", "B": "Meyakinkan orang tua untuk dapat kuliah dengan baik dan nantinya akan langsung bekerja", "C": "Mencari informasi tentang beasiswa kuliah untuk meringankan beban orang tua", "D": "Menabung untuk membiayai kuliah jurusan hukum sesuai cita-cita"}, "points": {"A": 1, "B": 2, "C": 4, "D": 3}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 10, "text": "Anda mengikuti ekstrakurikuler Sains dan saat ini terdapat tugas kelompok. Setiap kelompok diminta membuat alat yang membutuhkan peran dari masing-masing anggota. Ketua kelompok dan beberapa anggota bersepakat setiap harinya melaporkan perkembangan dari hasil alat. Namun Anda keberatan karena di kelas sedang fokus ujian harian. Apa yang akan Anda lakukan?", "options": {"A": "Mengerjakan sebisanya dan memberikan perkembangan hasil alat beberapa hari sekali", "B": "Berfokus kepada ujian harian terlebih dahulu karena merasa ada anggota kelompok lain yang dapat membantu", "C": "Berusaha ikut berkontribusi setiap harinya dengan melaporkan perkembangan hasil alat", "D": "Membagi waktu belajar dan mendorong partisipasi kelompok agar semua ujian tercapai dengan baik"}, "points": {"A": 2, "B": 1, "C": 3, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 11, "text": "Anda adalah murid kelas XII di SMA Negeri. Anda terbilang menonjol dalam pelajaran Bahasa Inggris di kelas Anda. Anda ditunjuk sebagai perwakilan sekolah untuk mengikuti lomba Bahasa Inggris tingkat kabupaten. Anda belum pernah mengikuti lomba Bahasa Inggris sebelumnya, padahal perlombaan akan dilaksanakan sepuluh hari lagi. Apa yang akan Anda lakukan?", "options": {"A": "Memberikan kesempatan pada teman lain yang pernah mengikuti perlombaan Bahasa Inggris", "B": "Menerima untuk menjadi perwakilan sekolah untuk mengikuti perlombaan dan berusaha semaksimal mungkin", "C": "Meminta guru Bahasa Inggris menemani proses latihan dan mencari informasi pada yang pernah mengikuti perlombaan", "D": "Menerima untuk menjadi perwakilan sekolah asalkan guru Bahasa Inggris membantu latihan"}, "points": {"A": 1, "B": 3, "C": 4, "D": 2}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 12, "text": "Pada pelajaran Bahasa Inggris dibagikan beberapa kelompok belajar yang setiap kelompoknya terdiri dari lima orang. Di kelompok Anda terdapat dua teman yang sering bertengkar sejak awal masuk sekolah. Sebenarnya terdapat dua teman lainnya yang terganggu dengan sikap mereka setiap kali bertengkar. Apa yang akan Anda lakukan?", "options": {"A": "Mendiskusikan pembagian tugas dan mendorong agar penyelesaian tugas tidak terlambat", "B": "Berbicara kepada teman yang bertengkar untuk memperhatikan penyelesaian tugas kelompok", "C": "Tidak terlalu memikirkan hal lainnya dan fokus pada penyelesaian tugas sendiri", "D": "Berdiskusi dengan anggota kelompok lain untuk mengatasi kendala kelompok sehingga tugas dapat selesai"}, "points": {"A": 3, "B": 2, "C": 1, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 13, "text": "Anda adalah pemain gitar dalam suatu band di sekolah. Anda dan teman-teman sudah berlatih keras untuk tampil di perpisahan kelas. Selama latihan Anda mendapatkan kritik bahwa permainan gitar Anda kurang baik, sehingga menjadi pemain gitar cadangan. Apa yang akan Anda lakukan?", "options": {"A": "Mencari band lain yang dapat menerima kekurangan untuk menjadi pemain gitar utama", "B": "Mendengarkan kritik teman atas kekurangan Anda saat berlatih", "C": "Meminta masukan dari teman selama berlatih untuk meningkatkan kemampuan", "D": "Menerapkan kritik dari teman sebagai bahan evaluasi untuk memperbaiki diri"}, "points": {"A": 1, "B": 2, "C": 3, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 14, "text": "Anda belum terampil bermain gitar. Saat pentas seni tahunan, dari kelas sebelah akan menampilkan band kelas. Tiba-tiba pemain gitarnya terkilir sehingga tidak bisa bermain gitar. Karena tidak bisa menemukan pemain gitar lain, ketua kelas meminta Anda untuk menjadi pemain pengganti. Apa yang akan Anda lakukan?", "options": {"A": "Memberikan nama lain yang jauh lebih terampil", "B": "Mau menjadi pengganti agar teman yang Anda taksir terkesan", "C": "Berusaha bermain sebaik mungkin yang Anda bisa", "D": "Berlatih di sisa waktu menjadi pemain gitar pengganti"}, "points": {"A": 2, "B": 1, "C": 3, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 15, "text": "Sejak SD hingga SMP, Anda bersekolah di yayasan yang sama. Pada sekolah yayasan tersebut guru dan siswanya memiliki latar belakang agama yang sama. Saat masuk SMA, Anda diminta untuk melanjutkan ke SMA Negeri favorit yang memiliki guru dan siswa dengan latar belakang yang beragam. Apa yang akan Anda lakukan?", "options": {"A": "Meminta orang tua untuk mempertimbangkan sekolah lain agar lebih mudah menyesuaikan diri", "B": "Menerima permintaan orang tua untuk masuk SMA Negeri favorit dengan ragam latar belakang guru dan siswanya", "C": "Masuk SMA Negeri favorit agar menambah pengalaman dan teman baru dari berbagai latar belakang", "D": "Meminta waktu kepada orang tua untuk mempertimbangkan sekolah mana yang akan Anda pilih"}, "points": {"A": 1, "B": 3, "C": 4, "D": 2}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 16, "text": "Saat ini Anda sedang ujian dan telah selesai mengisi semua lembar soal. Anda sudah berusaha mengerjakan soal dengan sebaiknya. Beberapa teman dekat Anda sudah meninggalkan kelas, sementara waktu ujian masih tersisa 15 menit lagi. Apa yang akan Anda lakukan?", "options": {"A": "Memeriksa kembali lembar ujian dari awal sampai akhir agar tidak ada yang terlewat", "B": "Memeriksa kembali soal serta jawaban yang sudah diisi jika masih ada yang ragu", "C": "Bertanya kepada teman terkait soal yang belum dianggap yakin jawabannya", "D": "Mengumpulkan lembar ujian karena sudah selesai dan yakin dengan jawaban"}, "points": {"A": 4, "B": 3, "C": 1, "D": 2}, "key": "A", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 17, "text": "Anda sudah memiliki rencana untuk pergi liburan ke pantai bersama keluarga pada hari Minggu. Tiba-tiba wali kelas meminta Anda untuk pergi ke sekolah. Wali kelas meminta Anda berlatih menjadi petugas upacara untuk menggantikan teman yang sedang opname. Padahal Anda dan keluarga sudah merencanakan liburan dari jauh hari. Apa yang akan Anda lakukan?", "options": {"A": "Mencoba pergi ke sekolah dengan konsekuensi harus merelakan liburan bersama keluarga", "B": "Tetap pergi ke sekolah karena berwisata dengan keluarga bisa dilakukan di lain waktu", "C": "Berusaha pergi ke sekolah karena menjadi petugas upacara hal yang biasa dilakukan", "D": "Memilih pergi ke sekolah karena wali kelas tersebut adalah guru favorit di sekolah"}, "points": {"A": 3, "B": 4, "C": 2, "D": 1}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 18, "text": "Anda merupakan siswa SMA semi militer yang baru saja masuk. Anda mengetahui bahwa di sekolah barunya ini, terdapat tes jasmani seperti lari, chinning, shuttle run, dan hal itu tidak pernah Anda lakukan sebelumnya. Tes tersebut merupakan tes wajib setiap tiga bulan sekali. Apa yang Anda lakukan?", "options": {"A": "Menyampaikan kendala yang dialami kepada orang tua saat bersekolah di SMA semi militer", "B": "Berusaha melakukan tes jasmani karena orang tua selalu mendukung kegiatan positif di sekolah", "C": "Berlatih dan menyadari manfaat dari tes jasmani untuk penilaian juga bermanfaat untuk kesehatan tubuh", "D": "Mencoba melakukan dengan optimal sesuai kemampuan untuk mencapai target penilaian"}, "points": {"A": 1, "B": 2, "C": 4, "D": 3}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 19, "text": "Saat sedang asyik berbincang-bincang dengan teman-teman, Anda melihat adik kelas terlihat bingung mencari sesuatu. Sebentar lagi bel masuk kelas berbunyi. Teman Anda mengatakan bahwa ia sudah bolak-balik melewati depan kelas tetapi masih belum menemukan barang yang dicarinya. Apa yang akan Anda lakukan?", "options": {"A": "Menawarkan bantuan mencari barang yang hilang", "B": "Bertanya tentang barang yang dicarinya", "C": "Berpura-pura tidak tahu agar ia tidak terganggu", "D": "Melanjutkan perbincangan karena pembicaraan sedang seru"}, "points": {"A": 4, "B": 3, "C": 2, "D": 1}, "key": "A", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 20, "text": "Pada akhir semester, sekolah mengadakan pentas seni. Kelas Anda akan menampilkan seni musik. Anda diminta oleh wali kelas untuk menampilkan kemampuan Anda bermain biola karena wali kelas tahu Anda mengikuti les biola. Anda merasa belum siap bermain biola, namun pelaksanaan pentas seni sudah dekat. Apa yang akan Anda lakukan?", "options": {"A": "Bertanya pada guru les tentang kelayakan diri dalam menampilkan musik biola", "B": "Meminta wali kelas untuk menunjuk teman lain daripada Anda tampil kurang maksimal", "C": "Menerima menjadi perwakilan kelas untuk menampilkan seni musik biola", "D": "Menantang diri Anda mengikuti pentas seni dengan kemampuan yang dimiliki"}, "points": {"A": 2, "B": 1, "C": 3, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 21, "text": "Anda adalah ketua ekstrakurikuler paduan suara di sekolah dan sering memenangkan perlombaan tingkat kota. Anda diminta untuk menjadi ketua ekstrakurikuler seni drama yang selama ini belum pernah meraih prestasi. Pihak sekolah meminta Anda membuat ekstrakurikuler seni drama berprestasi sama seperti ekstrakurikuler paduan suara. Apa yang akan Anda lakukan?", "options": {"A": "Menerapkan beberapa sistem di ekstrakurikuler paduan suara yang sesuai pada ekstrakurikuler seni drama", "B": "Melakukan beberapa perbaikan dari sistem yang sudah ada untuk meningkatkan kualitas ekstrakurikuler seni drama", "C": "Membutuhkan waktu untuk mempelajari bagaimana sistem yang akan diterapkan seni drama", "D": "Sepenuhnya memberlakukan sistem di ekstrakurikuler paduan suara pada ekstrakurikuler seni drama"}, "points": {"A": 3, "B": 4, "C": 2, "D": 1}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 22, "text": "Teman Anda dirawat di rumah sakit, namun karena keluarganya jauh sehingga tidak ada yang menjaganya. Di sisi lain Anda ingin menjaga teman, namun sebagai kapten Anda harus memimpin dan berlatih untuk turnamen basket tingkat provinsi. Apa yang akan Anda lakukan?", "options": {"A": "Memimpin latihan dan meminta izin kepada tim pulang mendahului untuk menjaga teman", "B": "Menjaga teman yang sakit karena suatu saat ia akan melakukan hal yang sama kepada Anda", "C": "Menjaga teman yang sakit karena suatu saat ia akan melakukan hal yang sama kepada Anda", "D": "Meminta izin kepada tim untuk mengikuti jadwal latihan berikutnya karena menjaga teman"}, "points": {"A": 4, "B": 1, "C": 1, "D": 3}, "key": "A", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 23, "text": "Anda diminta membuat karya seni miniatur bangunan pada pelajaran seni rupa. Waktu yang diberikan satu minggu dan dikerjakan secara berkelompok. Selain itu ada tugas individu mata pelajaran lain yang juga harus diselesaikan. Teman sekelompok tidak mau ikut serta mengerjakan tugas tersebut. Apa yang akan Anda lakukan?", "options": {"A": "Mencoba tenang menyikapi kondisi tersebut dan mengajak kelompok untuk menyelesaikan tugas", "B": "Memperingati teman-teman untuk menyelesaikan tugas karena itu adalah tanggung jawab bersama", "C": "Berusaha tenang dan menyampaikan kepada kelompok bahwa tugas tersebut juga memiliki nilai", "D": "Bersikap tenang dan berdiskusi dengan kelompok jika dikerjakan bersama pasti akan selesai"}, "points": {"A": 3, "B": 2, "C": 1, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 24, "text": "Anda baru pertama kali mengikuti seleksi anggota Polri dan berasal dari luar kota. Selama ini Anda sering kesulitan terkait lokasi tes, harus berangkat pagi, menunggu pelaksanaan tes yang lama, dan pulang larut malam. Anda sudah berusaha maksimal, namun nilai seleksi yang Anda peroleh kurang memuaskan. Apa yang akan Anda lakukan?", "options": {"A": "Mempersiapkan diri pada tahapan seleksi berikutnya untuk meningkatkan bobot nilai secara keseluruhan", "B": "Menyelesaikan hingga tahap akhir karena menurut orang tua menjadi anggota Polri merupakan hal yang baik", "C": "Memilih untuk berhenti melanjutkan tahapan seleksi berikutnya sembari mencari alternatif pekerjaan lain", "D": "Bertahan sampai akhir seleksi karena hal ini merupakan tantangan menjadi anggota Polri"}, "points": {"A": 4, "B": 2, "C": 1, "D": 3}, "key": "A", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 25, "text": "Orang tua sahabat Anda baru bercerai, dampaknya ia bersedih dan beberapa kali tidak masuk sekolah. Ia juga tidak pernah piket membersihkan kelas. Padahal kemarin hujan deras yang membuat kelas menjadi sangat kotor, sehingga Anda harus bekerja keras untuk membersihkannya. Menghadapi kondisi ini apa yang akan Anda lakukan?", "options": {"A": "Memahami dan bersedia membantu bila dibutuhkan", "B": "Memaklumi apa yang dirasakan oleh sahabat", "C": "Berpikir untuk menegur sahabat Anda", "D": "Berempati apa yang dirasakan oleh sahabat"}, "points": {"A": 4, "B": 2, "C": 3, "D": 1}, "key": "A", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 26, "text": "Anda mendaftar turnamen karate di kota, sedangkan tempat tinggal Anda berada jauh di kampung. Lalu lintas di tempat tinggal Anda tidak terlalu ramai, sehingga Anda jarang menggunakan helm ketika berkendara. Setibanya di kota ternyata banyak masyarakat menggunakan helm karena wajib sesuai aturan dan lalu lintas di kota sangat padat. Padahal waktu pendaftaran sudah mepet. Apa yang akan Anda lakukan?", "options": {"A": "Menuju tempat pendaftaran dengan keadaan seadanya karena waktu yang terbatas", "B": "Mencoba mengikuti aturan yang berlaku karena Anda adalah pendatang di wilayah tersebut", "C": "Mengikuti aturan yang berlaku di wilayah tersebut dan menerima konsekuensinya jika melanggar", "D": "Mencoba untuk membiasakan diri menggunakan helm untuk sementara waktu"}, "points": {"A": 1, "B": 3, "C": 4, "D": 2}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 27, "text": "Pada pelajaran Sejarah, kelas Anda berencana akan mengunjungi museum. Sebagai bendahara kelas, Anda diminta untuk menentukan iuran transportasi dan konsumsi untuk kegiatan tersebut. Setelah Anda tetapkan, beberapa teman mengeluh dan merasa keberatan dengan anggaran biaya yang sudah ditentukan. Apa yang akan Anda lakukan?", "options": {"A": "Mendata teman yang keberatan dengan biaya kunjungan untuk mengubah anggaran biaya", "B": "Memfasilitasi diskusi untuk menyepakati bersama seluruh teman kelas tentang biaya kunjungan", "C": "Mendiskusikan dengan pengurus kelas tentang kondisi teman yang keberatan dengan biaya", "D": "Mendiskusikan dengan teman terdekat tentang kondisi teman yang keberatan dengan biaya"}, "points": {"A": 3, "B": 4, "C": 2, "D": 1}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 28, "text": "Saat perjalanan menuju sekolah motor Anda mengalami pecah ban. Padahal Anda membawa bahan yang dibutuhkan untuk presentasi tugas kelompok di jam pertama. Anda masih harus menempuh jarak 3 km untuk menuju sekolah, sementara jam pelajaran pertama akan dimulai 15 menit lagi. Apa yang akan Anda lakukan?", "options": {"A": "Memeriksa dan mencari tahu penyebab dari ban motor yang pecah", "B": "Menelepon keluarga untuk menyampaikan kendala yang terjadi", "C": "Berusaha mendorong motor sambil mencari tukang tambal ban", "D": "Menelepon teman kelompok untuk mengambil bahan presentasi"}, "points": {"A": 1, "B": 2, "C": 3, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 29, "text": "Anda ditunjuk perwakilan sekolah untuk mengikuti Jambore Nasional di Jatinangor selama 5 hari. Pada pelaksanaan kegiatan, peserta Jambore dibagi menjadi beberapa regu yang anggotanya berasal dari berbagai sekolah dan daerah yang berbeda. Sedangkan Anda baru pertama kali berinteraksi dengan orang dari berbagai daerah. Apa yang akan Anda lakukan?", "options": {"A": "Mempelajari bahasa sapaan dari berbagai daerah agar dapat berkomunikasi dengan teman satu regu", "B": "Melibatkan diri dengan membangun komunikasi untuk mempelajari ragam budaya dari teman satu regu", "C": "Mencari tahu peserta Jambore berasal dari daerah mana saja agar bisa menyesuaikan saat berkomunikasi", "D": "Meminta pendampingan dari guru untuk menemani selama kegiatan Jambore berlangsung"}, "points": {"A": 3, "B": 4, "C": 2, "D": 1}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 30, "text": "Anda ditunjuk oleh wali kelas sebagai penanggung jawab acara makan bersama dengan teman-teman kelas. Saat dibicarakan, beberapa teman mengusulkan untuk makan bersama di restoran yang sebelumnya karena rasanya sudah terjamin enak, yang lain mengusulkan restoran baru karena mendapat promo tetapi belum mengetahui bagaimana rasanya. Apa yang akan Anda lakukan?", "options": {"A": "Mencari restoran lain yang jaraknya lebih dekat dari sekolah", "B": "Membandinginya kedua restoran tersebut dari segi kualitas dan harga", "C": "Memilih restoran dengan pemilihan suara terbanyak dari teman-teman", "D": "Memilih makan bersama di restoran sebelumnya karena sudah pasti enak"}, "points": {"A": 1, "B": 4, "C": 3, "D": 2}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 31, "text": "Saat asyik berbincang-bincang dengan beberapa teman, Anda melihat salah satu teman duduk di kursi paling belakang menangis terisak-isak. Kebetulan teman tersebut pernah bertengkar hebat dengan teman baik Anda. Apa yang akan Anda lakukan?", "options": {"A": "Berpura-pura tidak mendengar agar ia tidak malu", "B": "Membiarkannya karena ia pernah bertengkar dengan teman Anda", "C": "Mengecilkan suara agar tidak mengganggunya", "D": "Membiarkannya agar ia lega menumpahkan perasaannya"}, "points": {"A": 2, "B": 1, "C": 4, "D": 3}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 32, "text": "Dua bulan lagi akan dilaksanakan UAS bersamaan dengan dibukanya penerimaan Polri yang merupakan profesi impian Anda. Jadwal penerimaan Polri di luar prediksi Anda karena sebelumnya penerimaan akan dibuka setelah UAS. Sementara persiapan menghadapi UAS masih belum maksimal. Apa yang akan Anda lakukan?", "options": {"A": "Meminta pendapat orang tua untuk menentukan pilihan atas kebingungan yang dialami", "B": "Belajar dan latihan lebih giat agar semuanya dapat terlaksana sesuai dengan keinginan", "C": "Membuat jadwal belajar dan latihan serta menetapkan target agar keduanya tercapai", "D": "Mempersiapkan diri untuk mendaftar Polri tahun depan agar hasil lebih maksimal"}, "points": {"A": 1, "B": 3, "C": 4, "D": 2}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}];
