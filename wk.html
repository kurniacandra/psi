window.__SOAL_TEMPLATE_CONFIG = {"title":"WK Random 50 - JAGOPSI","examType":"WK","examName":"Wawasan Kebangsaan","examFile":"wk.html","packageCode":"WK_1","sectionLabel":"Wawasan Kebangsaan","introTitle":"Template Wawasan Kebangsaan","introText":"Bank soal akan diacak menjadi 50 soal per sesi dengan tampilan seragam seperti soal.html.","durationMinutes":75,"scoringMode":"correct","sessionSize":50,"randomBank":true,"storageKey":"wk_random50_template_session_v2","requireVIP":true,"vipMessage":"Wawasan Kebangsaan hanya untuk akun VIP.","requireLogin":true,"backUrl":"tryout_polri.html"};
window.__SOAL_TEMPLATE_QUESTIONS = [{"number": 1, "type": "single", "text": "Pancasila merupakan dasar dan ideologi negara yang ditetapkan oleh para pendiri Bangsa Indonesia. Alasan utama yang melatarbelakangi penetapan Pancasila sebagai ideologi negara adalah ….", "options": {"A": "Pancasila mencerminkan karakteristik bangsa Indonesia yang majemuk mulai dari sabang sampai merauke", "B": "Pancasila mampu memperkuat kedaulatan negara dan merupakan ideologi yang dirasa paling tepat untuk NKRI", "C": "Pancasila merupakan hasil dari proses konsensus nasional yang melibatkan semua elemen bangsa", "D": "Pancasila dapat memperkuat persatuan dan kesatuan bangsa sehingga tidak mudah terjadi konflik", "E": "Pancasila dianggap lebih cocok untuk Indonesia dibandingkan dengan ideologi negara lainnya"}, "answer": "C"}, {"number": 2, "type": "single", "text": "Nilai yang termuat dalam pancasila pada dasarnya merupakan nilai yang ada dan berdasar pada kondisi keberagaman bangsa Indonesia. Pernyataan yang menunjukkan hubungan antara nilai Pancasila dengan nilai yang ada dalam masyarakat tradisional Indonesia adalah ….", "options": {"A": "Keduanya menekankan pentingnya kompetisi", "B": "Keduanya merupakan hasil perenungan dari tokoh pendiri bangsa", "C": "Kedua-duanya menekankan pentingnya sekularisme", "D": "Keduanya menekankan pentingnya persatuan dan kebersamaan", "E": "Keduanya terbuka terhadap perkembangan jaman"}, "answer": "D"}, {"number": 3, "type": "single", "text": "Sistem pemerintahan Indonesia adalah menganut sistem pemerintahan Presidensial. Bukti dari pernyataan tersebut adalah…", "options": {"A": "Pemilihan presiden dan anggota parlemen dilakukan bersamaan", "B": "Presiden sebagai kepala negara dan juga sebagai kepala pemerintahan", "C": "Presiden berhak melakukan intervensi pada urusan legislatif dan yudikatif", "D": "Menteri bertanggung jawab kepada kekuasaan eksekutif dan legislatif", "E": "Presiden berkuasa atas semuanya dan berhak membubarkan parlemen"}, "answer": "B"}, {"number": 4, "type": "single", "text": "Dalam sebuah rapat komunitas, terdapat beberapa usulan dari anggota-anggota lainnya yang berbeda pendapat. Salah satu anggota mengajukan usulan yang belum pernah dipertimbangkan sebelumnya. Sikap yang mencerminkan budaya demokrasi dalam situasi tersebut adalah ….", "options": {"A": "Memilih untuk mengabaikan usulan tersebut karena berbeda dengan pendapat mayoritas", "B": "Menerima usulan tersebut meski tanpa memberikan pertimbangan yang cukup", "C": "Memberikan ruang kepada usulan tersebut untuk dibahas dan dipertimbangkan bersama-sama", "D": "Meminta anggota tersebut untuk menarik usulannya karena tidak sesuai dengan pendapat semua anggota", "E": "Membuat keputusan secara sepihak tanpa mempertimbangkan usulan tersebut"}, "answer": "C"}, {"number": 5, "type": "single", "text": "Di suatu desa diadakan acara Musyawarah Desa. Acara ini diadakan untuk membahas berbagai masalah yang terjadi di desa tersebut. Para pemimpin dan warga desa berkumpul untuk membahas masalah yang dihadapi dan mencari solusi terbaik. Dalam musyawarah ini, semua pendapat didengarkan dengan seksama dan setiap orang diberikan kesempatan untuk berbicara dan memberikan masukan. Setelah diskusi panjang, para pemimpin dan warga desa mencapai kesepakatan yang terbaik untuk desa mereka. Dampak positif jika anggota masyarakat menerapkan budaya demokrasi dalam hubungan antaranggota masyarakat tersebut adalah ….", "options": {"A": "Meningkatkan partisipasi aktif dalam pengambilan keputusan", "B": "Menjaga stabilitas politik di negara demokrasi", "C": "Mengurangi ketidakpuasan anggota masyarakat", "D": "Meningkatkan kekuasaan elit politik dalam masyarakat", "E": "Mengurangi intervensi pemerintah daerah dalam urusan masyarakat"}, "answer": "A"}, {"number": 6, "type": "single", "text": "E. Mengurangi intervensi pemerintah daerah dalam urusan masyarakat Peran masyarakat sipil dalam pengawasan jalannya pemerintahan di Indonesia yaitu ….", "options": {"E": "Melakukan advokasi dan kampanye untuk meningkatkan kesadaran masyarakat tentang pentingnya pengawasan pemerintahan", "A": "Memberikan informasi dan laporan dugaan pelanggaran oleh pejabat pemerintahan", "B": "Mengajukan keberatan terhadap kebijakan pemerintah yang dianggap merugikan", "C": "Melakukan monitoring dan evaluasi terhadap program dan kebijakan pemerintah", "D": "Berpartisipasi dalam penyusunan peraturan perundang-undangan yang berkaitan dengan pengawasan pemerintahan"}, "answer": "C"}, {"number": 7, "type": "single", "text": "Penetapan kebijakan yang tidak didahului dengan kajian dan transparansi kepada masyarakat dapat berdampak pada kehidupan dalam masyarakat. Dampak yang mungkin dialami masyarakat akibat kebijakan pemerintah yang tidak transparan dalam penetapan kebijakan yang berhubungan dengan kepentingan masyarakat adalah ….", "options": {"A": "Program prioritas pemerintah tidak terlaksana dengan baik", "B": "Kepatuhan masyarakat atas kebijakan pemerintah menurun", "C": "Muncul prasangka negatif masyarakat kepada pemerintah", "D": "Menurunnya hubungan baik masyarakat dengan pemerintah", "E": "Kesejahteraan masyarakat dipastikan akan turun secara drastis"}, "answer": "C"}, {"number": 8, "type": "single", "text": "Untuk menjaga transparansi, akuntabilitas, dan integritas dalam menjalankan tugas pemerintahan, keterbukaan pemerintah sangat penting dilaksanakan. Salah satu bukti program pemerintah yang mencerminkan keterbukaan dalam bidang pengelolaan negara adalah ….", "options": {"A": "Membangun jaringan telekomunikasi lebih luas lagi untuk menjangkau wilayah terdalam", "B": "Menempatkan aparat hukum disetiap kantor pemerintah untuk menjaga keamanan dan ketertiban", "C": "Membuat sebuah aplikasi yang memungkinkan seluruh proses program pemerintah dilakukan secara transparan dan efisien", "D": "Memberikan bantuan sosial kepada masyarakat yang berkontribusi dalam kepentingan instansi pemerintah", "E": "Menyusun anggaran untuk program pemerintah seefisien mungkin sehingga dana masyarakat aman"}, "answer": "C"}, {"number": 9, "type": "single", "text": "E. Menyusun anggaran untuk program pemerintah seefisien mungkin sehingga dana masyarakat aman Perubahan demokrasi di Indonesia dari masa Orde Baru ke Orde Reformasi dipicu oleh beberapa faktor. Salah satu latar belakang utama perubahan ini adalah .…", "options": {"E": "Perlunya meningkatkan keadilan ekonomi dan pembagian sumber daya nasional", "A": "Adanya krisis ekonomi yang memengaruhi stabilitas politik dan sosial di Indonesia", "B": "Keinginan rakyat untuk mengakhiri praktik nepotisme dan penyalahgunaan kekuasaan", "C": "Adanya perubahan konstelasi politik global yang memengaruhi hubungan internasional Indonesia", "D": "Kebutuhan untuk memperkuat kelembagaan dan mekanisme pengawasan pemerintahan"}, "answer": "B"}, {"number": 10, "type": "single", "text": "Kehidupan demokrasi di suatu negara sangat dipengaruhi oleh peran pers yang bebas dan independen. Pers bebas merupakan salah satu instrumen yang dapat membantu dalam mengevaluasi pelaksanaan pemerintahan dan menyampaikan informasi yang penting kepada masyarakat. Dari pernyataan di atas, pentingnya pers dalam kehidupan demokrasi adalah … .", "options": {"A": "Mengkritisi pemerintah, sehingga pemerintah akan selalu bekerja keras", "B": "Memberikan informasi yang menguntungkan kebijakan pemerintah", "C": "Menjamin pemerintahan yang demokratis yang bersih dari korupsi", "D": "Memudahkan masyarakat untuk mendapatkan informasi yang akurat", "E": "Pers bebas akan menghindari munculnya pemerintahan otoriter"}, "answer": "D"}, {"number": 11, "type": "single", "text": "Organisasi internasional memfasilitasi kerja sama antarnegara, termasuk dalam bidang kemanusiaan. Dalam konteks ini, keikutsertaan Indonesia dalam organisasi internasional membantu .…", "options": {"A": "Memperkuat kapasitas nasional dalam penanggulangan bencana dan krisis kemanusiaan", "B": "Memfasilitasi akses ke teknologi dan sumber daya untuk meningkatkan kualitas hidup", "C": "Meningkatkan kerja sama regional dan global dalam penanggulangan wabah penyakit", "D": "Memperluas jaringan dan akses ke sumber daya internasional untuk bantuan kemanusiaan", "E": "Mendukung diplomasi kemanusiaan dan menciptakan citra positif Indonesia di tingkat Internasional"}, "answer": "D"}, {"number": 12, "type": "single", "text": "Setiap manusia disamping makan, juga memerlukan air untuk minum. Ketika kita merasa tenggorokan kering saat itulah tubuh membutuhkan asupan cairan. Nilai yang terkandung dalam situasi tersebut adalah ….", "options": {"A": "Material", "B": "Kebenaran", "C": "Kerohanian", "D": "Vital", "E": "Keindahan"}, "answer": "D"}, {"number": 13, "type": "single", "text": "Dalam sebuah komunitas, anggota yang memiliki latar belakang ekonomi tinggi cenderung mendapatkan penghargaan dan keistimewaan, sementara anggota dengan latar belakang ekonomi rendah sering diabaikan. Norma yang melandasi ilustrasi ini adalah ….", "options": {"A": "Adat Istiadat", "B": "Hukum", "C": "Kesusilaan", "D": "Kesopanan", "E": "Keagamaan"}, "answer": "C"}, {"number": 14, "type": "single", "text": "Empati merupakan salah satu faktor pendorong interaksi sosial yang dapat memotivasi seseorang untuk melakukan tindakan. Manakah di antara pilihan berikut yang merupakan contoh penerapan empati dalam interaksi sosial?", "options": {"A": "Seorang karyawan mengabaikan temannya yang sedang berduka karena kehilangan anggota keluarganya.", "B": "Seorang ibu memarahi anaknya yang sedang menangis tanpa mencoba memahami perasaannya terlebih dahulu.", "C": "Seorang pelajar mengajak temannya yang pemalu untuk bergabung dengan kelompoknya dan membantu mengembangkan kemampuan sosialnya.", "D": "Seorang pemimpin kelompok mengabaikan usulan anggota kelompoknya dan memaksakan kehendaknya sendiri.", "E": "Seorang karyawan mengkritik temannya di depan rekan kerja lain tanpa mempertimbangkan perasaannya."}, "answer": "C"}, {"number": 15, "type": "single", "text": "Salah satu cara yang tepat untuk memperkuat penerapan hukum yang adil di Indonesia adalah dengan ...", "options": {"A": "Menyerang institusi hukum yang ada dengan anarkis", "B": "Mengabaikan putusan pengadilan yang tidak adil", "C": "Meningkatkan kesadaran masyarakat tentang hak dan kewajibannya", "D": "Melakukan tindakan kekerasan terhadap pihak yang dianggap melanggar hukum", "E": "Membentuk kelompok untuk melakukan sabotase terhadap pihak yang dianggap tidak adil"}, "answer": "C"}, {"number": 16, "type": "single", "text": "Bagaimana cara melakukan verifikasi kebenaran sebuah berita dalam era digital yang memungkinkan penyebaran informasi yang sangat cepat agar tidak mudah terjebak dalam penyebaran berita palsu atau hoaks?", "options": {"A": "Sebagai cara konfirmasi, memeriksa kebenaran berita dengan meneruskannya ke teman atau keluarga.", "B": "Membagikan berita penting tanpa memeriksanya terlebih dahulu untuk kebenarannya.", "C": "Mengecek sumber berita dan mencari informasi tambahan dari sumber-sumber terpercaya untuk memeriksa kebenaran berita.", "D": "Menyebarluaskan berita ke media sosial karena berita tersebut sudah banyak disebarkan oleh orang lain.", "E": "Hanya membaca paragraph awal berita sebagai cara untuk memeriksa kebenaran berita dan langsung mempercayainya karena sudah terbiasa dengan media tersebut."}, "answer": "C"}, {"number": 17, "type": "single", "text": "Seorang ahli asing memberikan sumbangsih besar dalam bidang teknologi kepada Indonesia. Atas jasanya tersebut, Presiden dapat memberikan kewarganegaraan Republik Indonesia kepada ahli tersebut. Menurut pasal 20 UU No. 12 Tahun 2006 tentang Kewarganegaraan, pemberian kewarganegaraan tersebut tidak dapat dilakukan apabila ...", "options": {"A": "ahli asing yang bersangkutan memilih kewarganegaraan lain atas kemauannya sendiri.", "B": "ahli asing yang bersangkutan menjadi memiliki kewarganegaraan ganda.", "C": "ahli yang bersangkutan terbukti pernah melakukan kejahatan di luar negeri.", "D": "ahli yang bersangkutan pernah mengalami pencabutan kewarganeraan sebelumnya.", "E": "ahli yang bersangkutan masuk dalam dinas tentara asing tanpa izin terlebih dahulu."}, "answer": "B"}, {"number": 18, "type": "single", "text": "Pada hakikatnya, Pancasila dan Pembukaan UUD NRI Tahun 1945 memiliki hubungan yang erat dan saling melengkapi dalam konteks kehidupan berbangsa dan bernegara Indonesia. Secara praksis, hubungan antara keduanya dijelaskan sebagai berikut ….", "options": {"A": "Keduanya mencerminkan nilai-nilai luhur yang menjadi dasar bagi tatanan hukum dan kebijakan di Indonesia", "B": "Pancasila dan Pembukaan UUD NRI Tahun 1945 merupakan sumber hukum yang sama dalam sistem hukum Indonesia", "C": "Keduanya menggambarkan prinsip-prinsip yang menjadi landasan bagi sistem pemerintahan di Indonesia", "D": "Pancasila dan Pembukaan UUD NRI Tahun 1945 berfungsi sebagai pedoman dalam menyusun undang-undang dan peraturan yang berlaku", "E": "Pembukaan UUD NRI Tahun 1945 menjelaskan secara rinci tentang Pancasila sebagai dasar negara"}, "answer": "A"}, {"number": 19, "type": "single", "text": "Dalam perkembangan zaman dan aspirasi masyarakat, suatu ideologi harus dapat mengikuti perubahan dan tetap relevan untuk tetap dipertahankan dengan syarat yaitu ….", "options": {"A": "Memiliki dasar filosofis yang tidak berubah sepanjang masa", "B": "Mengikuti tren dan gaya hidup modern sesuai dengan perkembangan saat ini", "C": "Dapat mengintegrasikan nilai-nilai luhur bangsa dengan tuntutan zaman", "D": "Mampu menyesuaikan diri dengan perubahan politik dan sosial yang terjadi", "E": "Memiliki ide-ide revolusioner yang radikal untuk merespon tuntutan masa kini"}, "answer": "C"}, {"number": 20, "type": "single", "text": "Suatu negara sangat membutuhkan ideologi yang kuat dan kokoh. Dalam hal ini, Pancasila dianggap sebagai ideologi negara yang sangat dibutuhkan oleh masyarakat Indonesia. Alasan bangsa Indonesia membutuhkan ideologi Pancasila karena Pancasila .…", "options": {"A": "Merupakan panduan dalam melakukan kegiatan politik", "B": "Menjadi dasar dalam pembuatan kebijakan publik masyarakat", "C": "Sebagai pengatur sistem hubungan sosial antarwarga negara", "D": "Menjadi landasan bagi pemerintah dalam menyelesaikan masalah sosial", "E": "Sumber motivasi dan semangat untuk membangun negara yang lebih baik"}, "answer": "E"}, {"number": 21, "type": "single", "text": "Sebagai konsumen yang baik di era global, warga negara Indonesia harus memiliki sikap yang bijak dan cerdas dalam menghadapi barang impor. Sikap yang sebaiknya dimiliki sebagai warga negara Indonesia sesuai dengan ilustrasi tersebut adalah ….", "options": {"A": "Tidak membeli produk impor sama sekali, agar industri dalam negeri dapat berkembang", "B": "Memilih produk impor meskipun harganya lebih mahal, sebagai bentuk dukungan terhadap perekonomian global", "C": "Membeli produk impor yang sesuai dengan kebutuhan, namun tetap memperhatikan produk lokal untuk mendukung perekonomian dalam negeri", "D": "Memilih produk impor karena memiliki kualitas yang lebih baik, tanpa memperhatikan dampak terhadap industri dalam negeri", "E": "Memilih produk impor yang memiliki merek terkenal dan status sosial yang tinggi, tanpa mempertimbangkan faktor lain seperti harga dan kualitas"}, "answer": "C"}, {"number": 22, "type": "single", "text": "Dalam era globalisasi, perkembangan IPTEK mempengaruhi segala aspek kehidupan, termasuk dalam bidang militer. Organisasi militer telah mengintegrasikan teknologi komputer dan telekomunikasi untuk meningkatkan kemampuan komando dan kendali, intelijen, pengintaian, dan pengamatan. Dalam konteks ini, perkembangan IPTEK tersebut termasuk dalam bidang...", "options": {"A": "Politik", "B": "Komunikasi", "C": "Pendidikan", "D": "Sosial budaya", "E": "Pertahanan dan keamanan"}, "answer": "E"}, {"number": 23, "type": "single", "text": "Dalam era digital, penggunaan media sosial oleh remaja semakin meningkat. Terkadang, remaja menghabiskan banyak waktu untuk memamerkan gaya hidup mewah mereka di media sosial, seperti mengunggah foto liburan mewah, pesta, dan barang-barang mahal. Hal ini menimbulkan dampak negatif terutama terkait rasa kebangsaan, salah satunya adalah ....", "options": {"A": "Membuat remaja menjadi kurang peduli terhadap lingkungan", "B": "Memicu terjadinya penyalahgunaan informasi pribadi", "C": "Lebih mementingkan popularitas daripada prestasi akademik", "D": "Berkurangnya toleransi terhadap perbedaan dan keragaman bangsa", "E": "Menganggu kesehatan fisik dan mental remaja di masa pertumbuhan"}, "answer": "D"}, {"number": 24, "type": "single", "text": "Perhatikan pernyataan-pernyataan berikut! (1) P enyebaran sistem demokrasi ke berbagai negara (2) Adanya intervensi asing dalam penentuan dasar negara (3) Terbentuknya kerjasama regional dan internasional (4) Munculnya dominasi negara adikuasa di dunia (5) Terbentuknya lembaga-lembaga internasional Dampak globalisasi di bidang politik ditunjukkan oleh nomor ....", "options": {"A": "(1), (2), dan (3),", "B": "(1), (2), dan (4)", "C": "(1), (3), dan (4)", "D": "(1), (3), dan (5)", "E": "(2), (4), dan (5)"}, "answer": "D"}, {"number": 25, "type": "single", "text": "Dalam menghadapi penyebaran ideologi politik asing yang tidak sesuai dengan Pancasila, upaya yang perlu dilakukan oleh masyarakat dan pemerintah adalah ....", "options": {"A": "Mengamalkan nilai-nilai Pancasila dalam kehidupan sehari-hari", "B": "Memperkuat produksi dalam negeri sehingga perekonomian meningkat", "C": "Menguatkan konsep Bhinneka Tunggal Ika dan nasionalisme", "D": "Menanamkan sikap tenggang rasa dalam kehidupan berbangsa dan bernegara", "E": "Memperkuat aparat khusus anti teror dalam mencegah aksi terorisme"}, "answer": "A"}, {"number": 26, "type": "single", "text": "Seorang anak mengambil uang dari dompet orang tuanya tanpa sepengetahuan mereka. Berdasarkan ilustrasi tersebut, perbedaan penerapan antara norma hukum dan norma kesusilaan adalah ....", "options": {"A": "Dalam norma hukum anak tersebut dihukum sesuai undang-undang, sedangkan pada norma kesusilaan anak tersebut dibiarkan", "B": "Anak dalam norma hukum tidak dikenai sanksi, sedangkan dalam norma kesusilaan anak tersebut dianggap tidak beretika", "C": "Anak dalam norma hukum tidak dihukum, sedangkan dalam norma kesusilaan sanksinya berupa teguran atau rasa bersalah", "D": "Dalam norma hukum mencuri uang orang tua merupakan perbuatan berdosa, sedangkan dalam norma kesusilaan perbuatan tersebut bisa diterima", "E": "Anak berdasarkan norma hukum tidak mendapatkan sanksi, sedangkan dalam norma kesusilaan sanksi diserahkan kepada pemuka agama"}, "answer": "C"}, {"number": 27, "type": "single", "text": "Di malam hari, seorang pengendara mobil memilih untuk tidak menghidupkan lampu mobilnya ketika berkendara. Akibatnya, ia mengalami kecelakaan dengan pengendara sepeda motor yang tidak melihatnya. Dalam situasi ini, hukum memiliki arti penting yaitu untuk ….", "options": {"A": "Menjamin warga negara untuk bersikap taat pada aturan pemerintah", "B": "Mendahulukan kepentingan warga daripada kepentingan pribadi", "C": "Menjaga keamanan dan keselamatan warga negara", "D": "Membatasi ruang gerak masyarakat agar tidak semaunya", "E": "Menjaga ketertiban dan dan kerukunan antar warga negara"}, "answer": "C"}, {"number": 28, "type": "single", "text": "E. Menjaga ketertiban dan dan kerukunan antar warga negara Salah satu dampak negatif dari globalisasi adalah memudarnya rasa cinta terhadap produk dalam negeri serta lunturnya nilai-nilai budaya bangsa. Tantangan Pancasila dalam menghadapi dampak globalisasi tersebut adalah ....", "options": {"E": "Menjaga ketertiban dan dan kerukunan antar warga negara Salah satu dampak negatif dari globalisasi adalah memudarnya rasa cinta terhadap produk dalam negeri serta lunturnya nilai-nilai budaya bangsa. Tantangan Pancasila dalam menghadapi dampak globalisasi tersebut adalah ....", "A": "Meningkatkan proteksionisme ekonomi untuk melindungi industri dalam negeri", "B": "Mengurangi keragaman budaya untuk menciptakan identitas nasional yang lebih homogen", "C": "Mengedepankan pendidikan karakter berbasis Pancasila sebagai penguatan nasionalisme dan nilai-nilai budaya", "D": "Memfokuskan pembangunan infrastruktur yang merata pada wilayah perkotaan maupun"}, "answer": "C"}, {"number": 29, "type": "single", "text": "pedesaan E. Mengabaikan dampak globalisasi dan hanya fokus pada kepentingan politik dalam negeri Pancasila sebagai ideologi terbuka memiliki nilai praksis dalam perikehidupan bangsa, hal ini menunjukkan bahwa Pancasila sebagai ideologi terbuka memiliki sifat ….", "options": {"E": "Relevan dengan perubahan masyarakat meski tidak sesuai dengan ideologi", "A": "Fleksibel terhadap ideologi lain yang masuk dalam masyarakat", "B": "Bersifat dogmatis dan tidak mengikuti perubahan zaman", "C": "Statis dengan ideologi asli yang ada sejak Pancasila lahir", "D": "Dinamis dengan perkembangan zaman serta aspirasi rakyat"}, "answer": "D"}, {"number": 30, "type": "single", "text": "Aspek penting yang menjadi alasan Pancasila dijadikan sebagai ideologi terbuka bagi bangsa Indonesia karena ….", "options": {"A": "Mengakomodasi pihak asing dalam pengambilan kebijakan nasional", "B": "Mengedepankan supremasi militer dalam pengelolaan pemerintahan", "C": "Memberikan dasar yang fleksibel untuk menghadapi dinamika sosial", "D": "Merupakan hasil dari peniruan ideologi-ideologi yang ada di negara lain", "E": "Pancasila hanya relevan untuk kelompok etnis dan agama tertentu"}, "answer": "C"}, {"number": 31, "type": "single", "text": "Dalam konteks keberagaman bangsa Indonesia, bukti yang menunjukkan bahwa nilainilai Pancasila berakar pada budaya nasional masyarakat Indonesia adalah ….", "options": {"A": "Kesadaran masyarakat terhadap keanekaragaman bahasa daerah dan adat istiadat yang ada di Indonesia", "B": "Kebiasaan masyarakat yang menjunjung tinggi semangat kebersamaan dan gotong royong", "C": "Pengaruh nilai-nilai agama yang dianut oleh masyarakat dalam rjuangan merebut kemerdekaan Indonesia secara nyata dan terus menerus", "C": "Sebagai langkah awal menuju integrasi politik dan ekonomi regional di Asia T enggara", "D": "Untuk memperingati kemenangan Indonesia atas penjajahan Belanda pada masa itu", "E": "sebagai peristiwa seremonial yang memengaruhi kondisi politik dan sosial di Indonesia"}, "answer": "B"}, {"number": 35, "type": "single", "text": "Tokoh penting dalam sidang PPKI tanggal 19 Agustus 1945 dan berhasil mendorong terjadinya pengunduran diri Soekarno sebagai ketua BPUPKI yaitu ….", "options": {"A": "Mohammad Hatta", "B": "Ki Hadjar Dewantara", "C": "Soebadio Sastrosatomo", "D": "K.H. Mas Mansyur", "E": "Abdul Kahar Muzakir"}, "answer": "C"}, {"number": 36, "type": "single", "text": "Pada saat Proklamasi Kemerdekaan Indonesia pada tanggal 17 Agustus 1945, Soekarno dan Hatta juga menetapkan Pembukaan UUD 1945 sebagai bagian penting dari proklamasi. Keterkaitan antara Proklamasi dan Pembukaan UUD 1945 adalah ….", "options": {"A": "Pembukaan UUD 1945 adalah penjabaran dari isi Proklamasi Kemerdekaan Indonesia", "B": "Pembukaan UUD 1945 memberikan landasan filosofis dan ideologis bagi Proklamasi Kemerdekaan Indonesia", "C": "Pembukaan UUD 1945 menjabarkan prinsip-prinsip demokrasi yang akan diterapkan dalam pemerintahan Indonesia", "D": "Pembukaan UUD 1945 menjabarkan hak-hak asasi manusia yang menjadi dasar bagi kemerdekaan Indonesia", "E": "Pembukaan UUD 1945 menegaskan keberadaan negara Indonesia sebagai sebuah negara yang berdaulat dan merdeka"}, "answer": "B"}, {"number": 37, "type": "single", "text": "Dalam menghadapi era globalisasi, nilai-nilai Pancasila menjadi penting untuk mempertahankan jati diri dan kepribadian bangsa Indonesia. Upaya yang paling sesuai dengan penerapan nilai-nilai Pancasila tersebut adalah ….", "options": {"A": "Mengutamakan kepentingan ekonomi nasional dengan mengorbankan hak asasi manusia", "B": "Menutup diri dari pengaruh global sehingga budaya nasional tetap terjaga keasliannya", "C": "Mengedepankan toleransi dan dialog antarbudaya dalam menghadapi perubahan sosial dan budaya yang datang dari luar", "D": "Menggantikan semua sistem pendidikan dan budaya tradisional dengan sistem modern yang berasal dari negara maju", "E": "Mengabaikan keberagaman budaya dan agama demi mencapai kesatuan nasional"}, "answer": "C"}, {"number": 38, "type": "single", "text": "Contoh penerapan sila Ketuhanan Y ang maha Esa dalam kehidupan antara lain memberikan kebebasan beragama bagi seluruh WNI tanpa pemaksaan dan diskriminasi. Bukti bahwa Pancasila merupakan ideologi terbuka terkait dengan penerapan nilai tersebut adalah .…", "options": {"A": "Isi dari nilai-nilai Pancasila merupakan bagian dari hasil interaksi dengan ideologi lain", "B": "Nilai-nilainya merupakan tuntutan konkret, operasional, dan mutlak yang tidak dapat ditafsirkan", "C": "Nilai-nilai Pancasila membuka diri dengan perkembangan nilai-nilai keagamaan dan kemanusiaan", "D": "Nilai-nilai yang ada di masyarakat selalu mendapat tempat dalam ideologi Pancasila", "E": "Nilai-nilai yang berkembang di masyarakat sebagai rujukan merubah nilai-nilai dalam Pancasila"}, "answer": "C"}, {"number": 39, "type": "single", "text": "Pancasila merupakan dasar dan ideologi negara yang ditetapkan oleh para pendiri Bangsa Indonesia. Pertimbangan dalam penetapan Pancasila sebagai ideologi negara adalah ….", "options": {"A": "Perkembangan situasi politik dan sosial di Indonesia pada saat itu", "B": "Pengaruh kuat dari luar dalam pembentukan ideologi negara Indonesia", "C": "Adanya tekanan dari pihak asing yang ingin menguasai Indonesia", "D": "Agar penyelenggaraan pemerintahan Indonesia segera terbentuk", "E": "Adanya kebutuhan untuk menciptakan kesatuan dan persatuan bangsa"}, "answer": "E"}, {"number": 40, "type": "single", "text": "E. Adanya kebutuhan untuk menciptakan kesatuan dan persatuan bangsa Makna yang terkandung dalam Pembukaan UUD 1945 merupakan amanat luhur dan suci dari proklamasi kemerdekaan. Dam mencapai tujuan-tujuan pembangunan nasional"}, "answer": "A"}, {"number": 74, "type": "single", "text": "Makna penting peristiwa Proklamasi bagi bangsa Indonesia dari aspek sosial politik yaitu ….", "options": {"A": "Menjadi awal dari keberhasilan Indonesia dalam melawan penjajahan dan mengembangkan negara", "B": "Menandai akhir dari masa kekuasaan Belanda di Indonesia dan dimulainya era kemerdekaan", "C": "Sebagai bentuk kesatuan dan persatuan bangsa Indonesia dalam memperjuangkan kemerdekaannya", "D": "Menjadi landasan bagi terbentuknya sistem pemerintahan dan hukum yang berdasarkan konstitusi", "E": "Mendorong terciptanya hubungan diplomatik yang kuat antara Indonesia dengan negara-negara lain di dunia"}, "answer": "D"}, {"number": 75, "type": "single", "text": "Pembukaan UUD 1945 dibacakan saat proklamasi kemerdekaan Indonesia. Hubungan proklamasi kemerdekaan Indonesia dengan pembukaan UUD 1945 dalam segi politik yaitu ….", "options": {"A": "Proklamasi kemerdekaan Indonesia dan pembukaan UUD 1945 sama-sama merupakan dokumen politik yang saling terpisah dan tidak berkaitan", "B": "Pembukaan UUD 1945 hanya menjabarkan rinci tentang dasar negara Indonesia yang tercantum dalam proklamasi kemerdekaan", "C": "Proklamasi kemerdekaan Indonesia hanya sekadar sebuah deklarasi, sedangkan pembukaan UUD 1945 menjadi dasar hukum yang kuat bagi kemerdekaan Indonesia", "D": "Proklamasi kemerdekaan Indonesia dan pembukaan UUD 1945 merupakan dua dokumen politik yang saling berkaitan, di mana pembukaan UUD 1945 menjelaskan rinci tentang dasar negara Indonesia yang tercantum dalam proklamasi kemerdekaan", "E": "Proklamasi kemerdekaan Indonesia dan pembukaan UUD 1945 sama-sama hanya mengatur tentang struktur pemerintahan Indonesia, tanpa menjelaskan rinci tentang dasar negara Indonesia D2"}, "answer": "D"}, {"number": 76, "type": "single", "text": "Pancasila merupakan unsur pokok dalam Pembukaan UUD 1945. Apa peran Pembukaan UUD 1945 dalam memperkuat kedaulatan negara Indonesia?", "options": {"A": "Menjelaskan hak-hak dasar rakyat Indonesia yang harus dilindungi oleh pemerintah", "B": "Mempertegas kemerdekaan Indonesia dalam bidang pertahanan dan keamanan", "C": "Menetapkan struktur dan tugas sistem keamanan negara Indonesia", "D": "Memberikan legitimasi pemerintahan Indonesia di mata dunia internasional", "E": "Menjelaskan batas-batas wilayah Indonesia yang harus dilindungi oleh pemerintah B2"}, "answer": "B"}, {"number": 77, "type": "single", "text": "Tanggung jawab presiden dalam menjalankan fungsi eksekutif sebagai kepala pemerintahan adalah ….", "options": {"A": "Pancasila hanya relevan pada zaman dahulu dan tidak berlaku pada zaman sekarang", "B": "Pancasila hanya mengandung nilai-nilai instrumental yang statis dan tidak berkembang", "C": "Pancasila tidak memisahkan masyarakat Indonesia berdasarkan perbedaan agama dan budaya", "D": "Pancasila menghargai keragaman dan menghasilkan solusi yang sesuai dengan perkembangan zaman", "E": "Pancasila tidak memperhatikan perbedaan kelas dan status sosial dalam masyarakat"}, "answer": "C"}, {"number": 78, "type": "single", "text": "Dalam menghadapi perkembangan global yang semakin kompleks, salah satu alasan mengapa Pancasila ditetapkan sebagai ideologi terbuka bagi Indonesia karena ….", "options": {"A": "Memiliki kemampuan untuk memadukan nilai-nilai tradisional dengan nilai-nilai modern", "B": "Hanya mengutamakan nilai-nilai tradisional dalam menghadapi tantangan global", "C": "Kurang mengakomodasi perubahan dan perkembangan zaman yang dinamis", "D": "Mengedepankan prinsip proteksionisme dalam menghadapi pengaruh globalisasi", "E": "Bersifat eksklusif dan tidak toleran terhadap perbedaan pandangan dari manapun"}, "answer": "A"}, {"number": 79, "type": "single", "text": "Nilai-nilai Pancasila pada hakikatnya digali dari keberagaman bangsa Indonesia. Bukti bahwa Pancasila nilai-nilainya berakar pada budaya nasional masyarakat Indonesia adalah ….", "options": {"A": "Kesatuan dalam keberagaman yang tercermin dalam nilai-nilai Pancasila sebagai dasar negara", "B": "Implementasi sistem pemerintahan yang demokratis sehingga semua keberagaman dapat menyatu dengan baik", "C": "Pengaruh budaya Hindu-Buddha pada masa kerajaan yang membuat bangsa Indonesia beragam", "D": "Pengakuan terhadap berbagai agama dan kepercayaan oleh semua kalangan masyarakat", "E": "Penerapan nilai-nilai adat istiadat daerah yang dipegang teguh dalam kehidupan sehari-hari"}, "answer": "A"}, {"number": 80, "type": "single", "text": "Pancasila sebagai paradigma pembangunan nasional adalah suatu proses yang berkesinambungan yang melingkupi segala aspek kehidupan berbangsa, bermasyarakat, dan bernegara. Hambatan penerapan Pancasila dalam kondisi tersebut ….", "options": {"A": "T erdapat perbedaan pendapat dan kepentingan antara pemerintah dan rakyat yang dapat mengakibatkan kesenjangan sosial", "B": "Adanya penyebaran ideologi yang bertentangan dengan Pancasila yang dapat memengaruhi pandangan dan nilai-nilai masyarakat", "C": "Tidak adanya komitmen bersama dari seluruh elemen bangsa untuk menerapkan Pancasila sebagai landasan dalam pembangunan", "D": "Adanya perubahan sosial yang begitu cepat sehingga masyarakat tidak mampu mengikuti serta mengadopsi nilai-nilai Pancasila dalam kehidupan sehari-hari", "E": "Terjadinya krisis ekonomi yang mengakibatkan masyarakat lebih mementingkan kebutuhan ekonomi daripada nilai-nilai luhur Pancasila"}, "answer": "C"}, {"number": 81, "type": "single", "text": "Pemerintah setempat bekerja sama dengan berbagai organisasi pemuda dan masyarakat untuk membantu proses pemulihan pasca-bencana setelah terjadi bencana alam banjir bandang. Berikut ini adalah salah satu contoh implementasi nilai-nilai Pancasila dalam situasi tersebut yaitu ….", "options": {"A": "Memprioritaskan peningkatan kualitas hidup masyarakat melalui pembangunan infrastruktur yang ramah lingkungan", "B": "Menjalin kerja sama yang baik antarmasyarakat agar mendapatkan bantuan pascabencana", "C": "Menyelenggarakan gotong royong untuk memperkuat rasa persatuan, toleransi, dan kebersamaan di tengah bencana", "D": "Mengadakan seminar dan pelatihan mengenai manajemen bencana bagi para relawan dan warga yang terkena dampak", "E": "Mengusulkan revisi peraturan perundang-undangan terkait pengelolaan lingkungan hidup dan mitigasi bencana"}, "answer": "C"}, {"number": 82, "type": "single", "text": "C1 Dalam menghadapi era globalisasi, bangsa Indonesia perlu menjaga dan mempertahankan identitas nasional sekaligus mengembangkan potensi ekonomi dan teknologi. Penerapan nilai-nilai Pancasila yang paling sesuai untuk mencapai tujuan tersebut adalah ….", "options": {"A": "Menutup diri terhadap pengaruh budaya asing dan fokus pada tradisi lokal agar tetap terjaga kelestariannya", "B": "Memusatkan pengembangan teknologi pada kelompok usia produktif tanpa memperhatikan keberagaman masyarakat", "C": "Membangun kerja sama internasional yang mengedepankan prinsip saling menghormati, keadilan, dan kepentingan bersama", "D": "Mengutamakan ekspor produk dan jasa demi meningkatkan perekonomian tanpa mempertimbangkan dampak lingkungan", "E": "Mengadopsi sistem ekonomi yang hanya mengutamakan pertumbuhan ekonomi tanpa memperhatikan kesejahteraan masyarakat"}, "answer": "C"}, {"number": 83, "type": "single", "text": "Contoh penerapan sila kerakyatan yang dipimpin oleh hikmat kebijaksanaan dalam permusyawaratan/perwakilan dalam kehidupan antara lain adalah membangun sistem demokrasi yang melibatkan partisipasi masyarakat. Bukti bahwa Pancasila merupakan ideologi terbuka terkait dengan penerapan nilai tersebut adalah ....", "options": {"A": "Nilai-nilai yang ada di masyarakat selalu mendapat tempat dalam ideologi Pancasila", "B": "Isi dari nilai-nilai Pancasila merupakan bagian dari hasil interaksi dengan ideologi lain", "C": "Nilai-nilainya merupakan tuntutan konkret, operasional, dan mutlak yang tidak dapat ditafsirkan", "D": "Nilai-nilai Pancasila terbuka dengan perkembangan nilai-nilai demokrasi yang ada dalam masyarakat", "E": "Nilai-nilai yang berkembang di masyarakat sebagai rujukan merubah nilai-nilai dalam Pancasila"}, "answer": "D"}, {"number": 84, "type": "single", "text": "Pancasila merupakan dasar dan ideologi negara yang ditetapkan oleh para pendiri Bangsa Indonesia. Alasan kenapa Pancasila dipilih sebagai ideologi negara Indonesia adalah ….", "options": {"A": "Memiliki nilai-nilai yang mengakomodasi keberagaman bangsa Indonesia", "B": "Merupakan ideologi yang berbeda dengan ideologi yang dianut negara lain", "C": "Dianggap sebagai pandangan filosofis resmi Indonesia", "D": "Lebih mudah dipahami dan diaplikasikan oleh masyarakat Indonesia", "E": "Merupakan hasil musyawarah pemimpin-pemimpin pertama Indonesia"}, "answer": "A"}, {"number": 85, "type": "single", "text": "Pada era globalisasi ini, tantangan terbesar dalam mempertahankan nilai-nilai Pancasila sebagai bagian dari budaya nasional masyarakat Indonesia yaitu ….", "options": {"A": "Adanya upaya-upaya untuk menggantikan Pancasila dengan ideologi lain", "B": "Mudahnya budaya asing masuk dan merusak nilai-nilai tradisional Indonesia", "C": "Pergeseran fokus pembangunan negara dari kebudayaan ke ekonomi", "D": "Menurunnya minat generasi muda mempelajari sejarah dan budaya bangsa", "E": "Melemahnya semangat gotong royong dan persatuan di tengah arus individualisme global"}, "answer": "B"}, {"number": 86, "type": "single", "text": "Pemuda desa Suka Damai sering mengalami konflik karena adanya perbedaan agama dan kepercayaan. Untuk mengatasinya kepala desa, tokoh masyarakat serta pemuda desa melakukan sebuah kegiatan bersama yang melibatkan warga dari berbagai latar belakang agama dan kepercayaan. Tujuan utama dari kegiatan tersebut adalah ….", "options": {"A": "Meningkatkan partisipasi seluruh warga dalam pembangunan desa", "B": "Mengurangi tingkat pengangguran pemuda di desa tersebut", "C": "Membentuk generasi muda yang menghargai keberagaman", "D": "Mengembangkan potensi ekonomi desa m n kebijakan proteksionisme dalam perdagangan internasional untuk melilndungi industri dalam negeri dari persaingan global yang tidak adil", "E": "Menegakkan supremasi hukum dan menjamin perlindungan hak asasi manusia bagi semua warga negara tanpa memandang latar belakang etnis, agama, dan golongan."}, "answer": "C"}, {"number": 97, "type": "single", "text": "Dalam masyarakat madani, warga negara diharapkan untuk berperan aktif dalam mengawasi kinerja pemerintah. Salah satu dampak positif dari budaya demokrasi dalam menciptakan masyarakat madani adalah ….", "options": {"A": "Pemerintah tidak perlu mempertimbangkan aspirasi masyarakat", "B": "Pemerintah selalu mendapatkan dukungan penuh dari masyarakat", "C": "Masyarakat dapat lebih mudah menyesuaikan diri dengan kebijakan baru", "D": "Meningkatnya transparansi dan akuntabilitas kecakapan pemerintah", "E": "Masyarakat lebih toleran terhadap perbedaan pendapat dan pandangan"}, "answer": "D"}, {"number": 98, "type": "single", "text": "Pada suatu negara yang menerapkan sistem demokrasi, partisipasi warga negara dalam pemilihan umum sangat penting untuk menentukan arah kebijakan publik. Bagaimana budaya demokrasi dapat meningkatkan partisipasi politik warga negara?", "options": {"A": "Dengan memberi informasi yang luas terkait teknis pemilihan umum", "B": "Dengan memperkuat kekuasaan pemerintahan atas masyarakat", "C": "Dengan membudayakan sikap terbuka terhadap pemilihan umum", "D": "Dengan meningkatkan keterbukaan masyarakat terhadap budaya asing", "E": "Dengan menyediakan akses yang mudah bagi warga negara untuk terlibat"}, "answer": "E"}, {"number": 99, "type": "single", "text": "Perjuangan arek-arek Suroboyoterhadap Belanda dan NICA merupakan bagian dari sejarah bangsa Indonesia. Salah satu faktor yang mempengaruhi semangat kebangsaan para pejuang dalam pertempuran ini adalah .…", "options": {"A": "Keinginan untuk mendapatkan kekuasaan politik dalam pemerintahan", "B": "Perebutan sumber daya alam yang ada di Surabaya", "C": "Dukungan dari negara-negara asing terhadap perjuangan Indonesia", "D": "Kegigihan dalam mempertahankan kedaulatan bangsa dari penjajah", "E": "Keinginan untuk memperoleh pengakuan internasional"}, "answer": "D"}, {"number": 100, "type": "single", "text": "UUDS 1950 berlaku di Indonesia selama periode 1950 hingga 1959, di mana sistem pemerintahan parlementer diterapkan dengan demokrasi liberal. Namun, pada 5 Juli 1959, sistem pemerintahan beralih menjadi presidensial melalui dekrit presiden. Salah satu faktor yang mendorong kembali ke sistem presidensial adalah ....", "options": {"A": "Keterlibatan militer yang lebih besar dalam politik", "B": "Pembatasan kebebasan pers sebagai bentuk kontrol pemerintah", "C": "Pemilihan umum yang lebih transparan dan demokratis", "D": "Adanya konsolidasi partai politik untuk mengurangi fragmentasi politik", "E": "Adanya tekanan internasional untuk mengubah sistem pemerintahan 465 Pada era Orde Reformasi, demokrasi di Indonesia mengalami perubahan signifikan dibandingkan dengan era sebelumnya. Perubahan yang terjadi pada era ini antara lain adalah .…"}, "answer": "B"}, {"number": 101, "type": "single", "text": "Selama transisi dari era Orde Lama ke Orde Reformasi, Indonesia mengalami perubahan dalam praktik demokrasi, terutama dalam interaksi antara legislatif dan eksekutif. Perbedaan utama dalam perilaku demokratis antara kedua era ini adalah ....", "options": {"A": "Adanya peningkatan kebebasan berpendapat dan berorganisasi", "B": "Peningkatan peran parlemen dalam mengawasi kebijakan pemerintah", "C": "Adanya kebijakan yang lebih fokus pada peningkatan kesejahteraan rakyat", "D": "Perubahan dalam sistem pemilihan kepala daerah secara langsung", "E": "Peningkatan keberpihakan pemerintah terhadap partai politik tertentu"}, "answer": "B"}, {"number": 102, "type": "single", "text": "Demokrasi di Indonesia mengalami perubahan seiring dengan berjalannya pemerintahan. Salah satu faktor yang mendorong perubahan demokrasi dari masa estari", "B": "Menolak segala bentuk pengaruh asing yang tidak sesuai", "C": "Menyebarkan nilai-nilai kebudayaan ke seluruh dunia", "D": "Memperluas jaringan perdagangan internasional", "E": "Mengikuti gaya hidup dan budaya luar negeri yang baik saja"}, "answer": "A"}, {"number": 118, "type": "single", "text": "Kemanusiaan yang adil dan beradab adalah nilai yang mengajarkan bahwa setiap manusia harus diperlakukan dengan adil dan beradab. Manfaat memiliki sikap positif terhadap nilai-nilai Pancasila tersebut adalah ….", "options": {"A": "Meningkatkan kualitas hidup dan kesejahteraan warga negaranya", "B": "Membuat warga negaranya menjadi lebih mencintai negaranya", "C": "Mampu beradaptasi dengan lingkungan sosial yang berbeda-beda", "D": "Meningkatkan perekonomian dan kesejahteraan warga negaranya", "E": "Membentuk karakter warga negaranya menjadi lebih kuat dan Tangguh"}, "answer": "C"}, {"number": 119, "type": "single", "text": "Dalam sistem negara presidensial, presiden sebagai kepala eksekutif memiliki kedudukan yang sederajat dengan DPR sebagai pemegang kekuasaan legislatif, oleh karenanya Presiden tidak dapat membubarkan parlemen dan demikian sebaliknya. Berdasarkan uraian tersebut salah satu hubungan kerjasama antara Presiden dan DPR adalah .…", "options": {"A": "Presiden dan DPR bekerja sama dalam hal pengangkatan menteri dan pejabat negara lainnya", "B": "DPR mengajukan rancangan anggaran kepada Presiden dan Presiden memutuskan untuk menyetujui atau menolak rancangan tersebut", "C": "Presiden dan DPR berkoordinasi dalam hal pemberian grasi dan rehabilitasi", "D": "Presiden dan DPR bekerja sama dalam pemilihan kepala lembaga negara seperti BPK", "E": "Presiden dapat bersama DPR membentuk Tim Panitia Khusus untuk membahas isu-isu penting dalam kebijakan pemerintah"}, "answer": "D"}, {"number": 120, "type": "single", "text": "Bentuk pemerintahan yang dianut oleh Indonesia semenjak merdeka hingga saat ini adalah republik. Hal yang melatarbelakangi Indonesia meng ersenjata dalam kebijakan ekonomi", "C": "Pemisahan antara peran angkatan bersenjata dalam politik dan sosial", "D": "Keterlibatan angkatan bersenjata dalam pembangunan infrastruktur", "E": "Pengurangan jumlah anggota angkatan bersenjata di parlemen"}, "answer": "C"}, {"number": 123, "type": "single", "text": "Dalam masyarakat demokrasi, pers memiliki peran penting yang berkaitan dengan kebebasan pers dan demokrasi. Hubungan tersebut terlihat pada ....", "options": {"A": "Keberagaman pandangan dan informasi yang disampaikan oleh pers yang bebas", "B": "Peran pers dalam mengawasi kebijakan pemerintah dan mengkritik keputusan yang tidak tepat", "C": "Pers yang bebas memungkinkan masyarakat untuk berpartisipasi dalam proses demokratis", "D": "Kebebasan pers menciptakan lingkungan yang kondusif untuk menghormati hak asasi manusia", "E": "Pers yang bebas memastikan bahwa informasi yang disampaikan kepada publik tidak disensor atau dibatasi"}, "answer": "B"}, {"number": 124, "type": "single", "text": "Keikutsertaan Indonesia dalam organisasi internasional membawa berbagai manfaat, salah satunya di bidang kemanusiaan. Manfaat tersebut meliputi ....", "options": {"A": "Kerja sama dalam mengatasi masalah hak asasi manusia dan pengungsi korban perang", "B": "Peningkatan akses terhadap pendanaan dan sumber daya untuk pembangunan manusia", "C": "Memperoleh dukungan teknis dan sumber daya untuk penanggulangan bencana alam", "D": "Memperkuat diplomasi kemanusiaan dan mempromosikan perdamaian seluruh dunia", "E": "Meningkatkan kemampuan Indonesia dalam melindungi warga negara di luar negeri"}, "answer": "C"}, {"number": 125, "type": "single", "text": "Andika, siswa kelas 8, sedang mengerjakan proyek sejarah bersama kelompoknya. Saat berdiskusi, Andika mengolok-olok Rani sampai ia merasa tersinggung dan marah. Tindakan Andika diketahui oleh Pak Budi. Sanksi yang tepat diberikan kepada Andika adalah ....", "options": {"A": "Meminta Andika berhenti berbicara agar tidak mengganggu kelompok", "B": "Melaporkan Andika kepada guru BK dan kepala sekolah untuk diberi teguran", "C": "Melaporkan Andika ke piket agar diberi hukuman yang setimpal", "D": "Meminta Andika minta maaf dan berjanji tidak akan mengulangi perbuatannya", "E": "Mencatat perbuatan Andika dalam catatan pelanggaran siswa"}, "answer": "D"}, {"number": 126, "type": "single", "text": "Dalam upaya memerangi balapan liar yang seringkali terjadi di tengah malam, berbagai pihak perlu bekerja sama untuk menciptakan lingkungan yang aman dan kondusif. Salah satu cara efektif yang dapat dilakukan untuk mengurangi angka kejadian balapan liar adalah .…", "options": {"A": "Meningkatkan kesadaran masyarakat tentang bahaya balapan liar melalui kampanye dan edukasi", "B": "Menyediakan fasilitas olahraga dan hiburan yang menarik minat para remaja sehingga teralihkan dari balap liar", "C": "Mengadakan program bimbingan bagi remaja yang tertarik menggeluti pada balapan liar", "D": "Menghukum pembalap liar dengan sanksi yang lebih berat sebagai efek jera sehingga tidak akan mengulangi", "E": "Membatasi kecepatan kendaraan secara umum di jalan raya untuk menghindari balapan liar"}, "answer": "B"}, {"number": 127, "type": "single", "text": "Nilai-nilai Pancasila pada hakikatnya digali dari keberagaman bangsa Indonesia. Bukti bahwa Pancasila nilai-nilainya berakar pada budaya nasional masyarakat Indonesia adalah ….", "options": {"A": "T erdapat dalam pidato Bung Karno tentang Pancasila yang kemudian menjadi dasar filosofis negara", "B": "T erkandung dalam semboyan Bhinneka Tunggal Ika yang mencerminkan keragaman suku dan budaya di Indonesia", "C": "Tercermin dari hasil musyawarah para pendiri bangsa yang mendasarkan Pancasila pada prinsip-prinsip dasar adat istiadat dan kearifan lokal", "D": "Ditemukan dalam nilai-nilai luhur yang terkandung dalam empat sumpah pemuda yang menggambarkan semangat persatuan dan keberagaman", "E": "T erdapat dalam UUD 1945 yang merupakan dasar hukum negara dan mencerminkan nilai-nilai luhur bangsa Indonesia"}, "answer": "C"}, {"number": 128, "type": "single", "text": "Pancasila sebagai paradigma pembangunan nasional adalah suatu proses yang berkesinambungan yang melingkupi segala aspek kehidupan berbangsa, bermasyarakat, dan bernegara. Penerapan Pancasila dalam kondisi tersebut dapat mengalami hambatan ketika ….", "options": {"A": "Masyarakat mulai menciptakan teknologi yang membantu pembangunan infrastruktur", "B": "Pemerintah menggalakkan program pendidikan untuk meningkatkan kualitas sumber daya manusia", "C": "Terjadi peningkatan partisipasi masyarakat dalam kegiatan sosial dan politik", "D": "Nilai-nilai individualisme dan egoisme lebih diutamakan daripada kepentingan bersama", "E": "Pemerintah dan masyarakat bekerja sama dalam pembangunan berkelanjutan"}, "answer": "D"}, {"number": 129, "type": "single", "text": "Beberapa pemuda desa Suka Maju dari kelompok yang berbeda diundang untuk mengikuti kegiatan diskusi dan berbagai kegiatan sosial yang dirancang untuk mempromosikan nilai-nilai Pancasila. Diharapkan pemuda tersebut bisa menjadi contoh dalam mengatasi perbedaan dan meningkatkan keharmonisan di masyarakat. Tujuan utama dari kegiatan tersebut adalah ….", "options": {"A": "Sebagai landasan dalam menyelesaikan konflik hukum antar kelompok masyarakat", "B": "Sebagai acuan dalam mengambil kebijakan politik dan pemerintahan di tingkat lokal", "C": "Sebagai dasar dalam mengembangkan program ekonomi inklusif untuk meningkatkan kesejahteraan masyarakat", "D": "Sebagai pedoman dalam memupuk rasa persatuan, toleransi, dan kebersamaan di tengah keberagaman", "E": "Sebagai dasar dalam mengatur hubungan internasional dan kerja sama antar negara"}, "answer": "D"}, {"number": 130, "type": "single", "text": "Pancasila dan Pembukaan UUD NRI Tahun 1945 memiliki hubungan yang sangat erat dalam penyelenggaraan negara Indonesia. Secara praksis, hubungan keduanya dapat dijelaskan melalui pernyataan berikut, yaitu ….", "options": {"A": "Pancasila diwujudkan dalam Pembukaan UUD NRI Tahun 1945 sebagai dasar filosofis dan ideologi negara", "B": "Pembukaan UUD NRI Tahun 1945 menjabarkan cita-cita nasional yang berasal dari nilai-nilai Pancasila", "C": "Pancasila dan Pembukaan UUD NRI Tahun 1945 saling melengkapi dalam mengatur aspek kehidupan bernegara", "D": "Pembukaan UUD NRI Tahun 1945 menjelaskan landasan hukum untuk menerapkan Pancasila dalam kebijakan dan perundang-undangan", "E": "Pancasila mempengaruhi konten dan semangat yang terkandung dalam Pembukaan UUD NRI Tahun 1945"}, "answer": "A"}, {"number": 131, "type": "single", "text": "Dalam konteks perkembangan zaman dan aspirasi masyarakat, ideologi yang dianut suatu negara harus dapat mengikuti perubahan yang terjadi di masyarakat dengan syarat yaitu ….", "options": {"A": "Ideologi tersebut harus menekankan pada nilai-nilai tradisional dan konservatif", "B": "Ideologi tersebut harus mempertahankan nilai-nilai lama dan tidak berubah sedikit pun", "C": "Ideologi tersebut harus menyesuaikan diri dengan tuntutan dan aspirasi masyarakat yang berubah-ubah", "D": "Ideologi tersebut harus mengandalkan otoritas dan kekuasaan pemerintah untuk mempertahankan eksistensinya", "E": "Ideologi tersebut harus menekankan pada kepentingan elit politik dan tidak memperhatikan aspirasi rakyat"}, "answer": "C"}, {"number": 132, "type": "single", "text": "Suatu negara akan mengalami kemajuan dan kemakmuran apabila ideologinya dipahami dan dijadikan sebagai pedoman dalam kehidupan. Oleh karena itu, alasan mengapa Pancasila menjadi ideologi negara yang sangat dibutuhkan oleh masyarakat adalah karena Pancasila ...", "options": {"A": "merupakan dasar hukum yang kuat bagi negara", "B": "menjadi panduan dalam pembuatan kebijakan publik", "C": "mendorong kemajuan dan pembangunan bangsa", "D": "menjadi acuan dalam pembuatan konstitusi negara", "E": "menjadi sumber dalam kehidupan berbangsa dan bernegara"}, "answer": "E"}, {"number": 133, "type": "single", "text": "Dalam era global, Indonesia menghadapi masalah fluktuasi nilai tukar rupiah yang dapat mempengaruhi harga barang impor. Sebagai warga negara yang baik, kita harus memiliki sikap yang tepat terhadap barang impor. Sikap tersebut antara lain adalah ....", "options": {"A": "Mencari alternatif produk lokal yang sejenis dengan produk barang impor", "B": "Memboyong barang impor sebanyak-banyaknya untuk menunjang gaya hidup", "C": "Menolak produk impor secara keseluruhan untuk mendukung produk dalam negeri", "D": "Menerima kenaikan harga pada barang impor sebagai sesuatu yang wajar", "E": "Membandingkan harga dan kualitas produk impor dengan lokal sebelum membeli"}, "answer": "E"}, {"number": 134, "type": "single", "text": "Globalisasi membawa pengaruh budaya dari luar yang dapat menggeser identitas dan menghilangkan ciri khas budaya lokal. Dalam era globalisasi ini, perdagangan antar negara semakin terbuka dan bebas sehingga perdagangan internasional semakin meningkat. Cara yang dapat dilakukan oleh seseorang untuk menjaga kualitas produk lokal dalam menghadapi dampak negatif globalisasi adalah ….", "options": {"A": "Membuang produk-produk impor dan beralih ke produk lokal", "B": "Membeli produk lokal yang lebih murah dan berkualitas", "C": "Mendukung produk lokal dengan mempromosikannya ke pasar global", "D": "Menggunakan produk lokal meski dianggap ketinggalan zaman", "E": "Kembali ke alam sehingga tidak memerlukan produk-produk luar negeri"}, "answer": "C"}, {"number": 135, "type": "single", "text": "Nilai Pancasila Ketuhanan Y ang Maha Esa menegaskan bahwa Tuhan adalah pencipta alam semesta dan sumber kebenaran tertinggi. Manfaat memiliki sikap positif terhadap nilai-nilai Pancasila tersebut adalah ….", "options": {"A": "Meningkatkan kualitas hidup dan kesejahteraan warga negaranya", "B": "Meningkatkan toleransi dan kerukunan sesama warga Indonesia", "C": "Mampu beradaptasi dengan lingkungan sosial yang berbeda-beda", "D": "Meningkatkan rasa bangga dan cinta tanah air pada warga Indonesia", "E": "Membentuk karakter warga negaranya menjadi lebih kuat dan tangguh"}, "answer": "B"}, {"number": 136, "type": "single", "text": "Dalam masyarakat madani, keberagaman budaya dan keyakinan menjadi unsur penting yang harus dihargai. Manfaat budaya demokrasi dalam menciptakan harmoni dalam kehidupan bermasyarakat adalah...", "options": {"A": "Meningkatkan kerjasama antar kelompok sosial", "B": "Menekankan pentingnya asimilasi budaya agar dapat membaur", "C": "Menghargai dan mengakui keberagaman sebagai kekayaan bersama", "D": "Mengutamakan kelompok mayoritas dalam pengambilan keputusan", "E": "Memaksa masyarakat untuk mengadopsi budaya dominan"}, "answer": "C"}, {"number": 137, "type": "single", "text": "Dalam suatu negara, terdapat beberapa kelompok masyarakat yang memiliki kepentingan yang berbeda-beda terkait suatu kebijakan publik. Bagaimana budaya demokrasi dapat membantu mewujudkan keputusan publik yang lebih inklusif dan responsif?", "options": {"A": "Membatasi partisipasi politik warga agar suasana kondusif", "B": "Mengutamakan kepentingan individu daripada kepentingan umum", "C": "Memperkuat kekuasaan pemerintahan atas masyarakat", "D": "Membudayakan sikap saling menghargai dan toleransi dalam masyarakat", "E": "Meniadakan peran masyarakat dalam pengambilan keputusan publik"}, "answer": "D"}, {"number": 138, "type": "single", "text": "Selama perjuangan arek-arek Suroboyo, rakyat Surabaya berani melawan Belanda meskipun menghadapi banyak kesulitan dan kekurangan. Alasan yang melatarbelakangi keberanian mereka dalam mewujudkan semangat kebangsaan adalah .…", "options": {"A": "Kepercayaan akan kekuatan gaib untuk melindungi mereka", "B": "Tekad untuk melindungi kehormatan bangsa dan negara", "C": "Ingin menjadi terkenal sebagai pahlawan nasional", "D": "Keharusan untuk melaksanakan perintah dari pemimpin perjuangan", "E": "Adanya janji imbalan dari pemerintah setelah kemerdekaan"}, "answer": "B"}, {"number": 139, "type": "single", "text": "Selama berlakunya UUDS 1950, sistem pemerintahan di Indonesia menerapkan parlementer dengan demokrasi liberal. Namun, pada 5 Juli 1959, sistem pemerintahan presidensial kembali diterapkan melalui dekrit presiden. Alasan utama di balik perubahan ini adalah ....", "options": {"A": "Konflik internal yang terjadi antara partai-partai politik", "B": "Adanya desakan dari pihak militer untuk menggulingkan pemerintahan", "C": "T ekanan ekonomi yang menyebabkan ketidakstabilan sosial", "D": "Perubahan konstelasi politik di tingkat internasional", "E": "Adanya kebijakan yang tidak popular dari pemerintah parlementer"}, "answer": "A"}, {"number": 140, "type": "single", "text": "Sebagai akibat dari perubahan sistem pemerintahan yang dialami Indonesia, praktik demokrasi di era Orde Reformasi mengalami perubahan. Salah satu perubahan yang terjadi pada era ini adalah .…", "options": {"A": "Pemilu yang lebih terbuka dan kompetitif", "B": "Kebijakan yang lebih proteksionis dalam bidang ekonomi", "C": "Penguatan peran pemerintah pusat dalam pemerintahan daerah", "D": "Adanya pembatasan kebebasan berorganisasi dan berkumpul", "E": "Peningkatan keterlibatan militer dalam urusan sipil"}, "answer": "A"}, {"number": 141, "type": "single", "text": "Rakyat memiliki hak untuk menentukan dan mengendalikan pemerintahan, dan kedaulatan tertinggi dalam negara sebenarnya adalah rakyat. Prinsip ini merupakan perwujudan pokok pikiran ketiga dalam Pembukaan UUD Negara Republik Indonesia 1945, yaitu…", "options": {"A": "Mewujudkan keadilan sosial yang merata bagi seluruh lapisan masyarakat tanpa membeda-bedakan", "B": "Mewujudkan kedaulatan rakyat yang berdasarkan permusyawaratan perwakilan", "C": "Menjunjung tinggi harkat dan martabat manusia serta perwujudan nilai kemanusiaan yang luhur", "D": "Berdasarkan Ketuhanan yang Maha Esa menurut dasar kemanusiaan yang adil dan beradab", "E": "Melindungi segenap bangsa Indonesia dan seluruh tumpah darah Indonesia berdasar asas persatuan"}, "answer": "B"}, {"number": 142, "type": "single", "text": "Fungsi konstitusi dalam melindungi hak asasi manusia yaitu ….", "options": {"A": "Mendorong masyarakat untuk menjunjung tinggi hak asasi manusia secara kolektif", "B": "Menetapkan dan melindungi hak asasi manusia yang tidak dapat dilanggar oleh pemerintah", "C": "Menyediakan sumber daya ekonomi yang ada untuk memenuhi hak asasi manusia", "D": "Mengatur sistem pendidikan yang fokus mengajarkan nilai-nilai hak asasi manusia", "E": "Mengendalikan dan mengawasi organisasi non-pemerintah yang bekerja untuk hak asasi manusia"}, "answer": "B"}, {"number": 143, "type": "single", "text": "Alasan utama mengapa Proklamasi Kemerdekaan Indonesia diproklamirkan pada 17 Agustus 1945 karena .…", "options": {"A": "Indonesia ingin merdeka secara damai dengan mendapat dukungan dari dunia internasional", "B": "Kondisi politik dunia pada saat itu sedang tidak stabil, sehingga Indonesia mengambil kesempatan untuk memproklamirkan kemerdekaannya", "C": "Belanda sedang lemah pada saat itu dan tidak mampu menguasai Indonesia secara penuh", "D": "Mendapatkan ancaman dari Jepang yang ingin memperkuat kekuasaannya di Asia T enggara", "E": "Rakyat Indonesia menginginkan kemerdekaan dan keinginan tersebut semakin kuat setelah Jepang menyerah kepada sekutu pada Agustus 1945"}, "answer": "E"}, {"number": 144, "type": "single", "text": "Sidang PPKI pada 18 Agustus 1945 menghasilkan ….", "options": {"A": "Proklamasi kemerdekaan Indonesia", "B": "Deklarasi Kemerdekaan Indonesia", "C": "Pembentukan pemerintahan sementara Indonesia", "D": "Penetapan Undang-Undang Dasar Indonesia", "E": "Penentuan tanggal Hari Kemerdekaan Indonesia"}, "answer": "D"}, {"number": 145, "type": "single", "text": "Pembukaan Undang-Undang Dasar atau UUD 1945 alinea 1-4 dibacakan saat proklamasi kemerdekaan Republik Indonesia tanggal 17 Agustus 1945. Keterkaitan antara Proklamasi Kemerdekaan Indonesia dan Pembukaan UUD 1945 adalah ….", "options": {"A": "Proklamasi Kemerdekaan Indonesia merupakan bagian dari Pembukaan UUD 1945", "B": "Pembukaan UUD 1945 berisi tentang dasar-dasar negara Indonesia yang diperjuangkan dalam Proklamasi Kemerdekaan Indonesia", "C": "Proklamasi Kemerdekaan Indonesia berisi tentang cita-cita dan tujuan pembentukan UUD 1945", "D": "Pembukaan UUD 1945 merujuk pada Proklamasi Kemerdekaan Indonesia sebagai tonggak sejarah penting dalam pembentukan negara Indonesia", "E": "Pembukaan UUD 1945 dan Proklamasi Kemerdekaan tidak memiliki keterkaitan yang signifikan meski peristiwanya bersamaan"}, "answer": "B"}, {"number": 146, "type": "single", "text": "Dalam kehidupan bernegara, masyarakat mengharapkan suatu kebijakan pemerintah yang transparan dan melalui kajian terlebih dahulu sebelum ditetapkan agar dapat diterima dan tidak bertentangan dalam pemenuhan kebutuhan masyarakat. Jika kebijakan ditetapkan tanpa melalui kajian akan sangat mungkin terjadi dampak dalam masyarakat seperti ….", "options": {"A": "terhambatnya pelaksanaan pembangunan nasional dan akan semakin tertinggal dengan negara lain", "B": "timbulnya aksi protes seperti demonstrasi terkait kebijakan yang ditetapkan pemerintah", "C": "semakin banyaknya masyarakat yang ingin terlibat dalam proses penetapan kebijakan", "D": "rendahnya keyakinan masyarakat terkait efektifitas pemerintah dalam menetapkan kebijakan", "E": "terjadi konflik antar kelompok dan golongan masyarakat yang memiliki kepentingan"}, "answer": "B"}, {"number": 147, "type": "single", "text": "Jika terdapat korban kasus kriminal dari Indonesia membutuhkan perawatan medis darurat di luar negeri maka yang dilakukan KBRI adalah ….", "options": {"A": "Membawa korban ke rumah sakit terdekat tanpa melaporkan kasus kriminal yang dialami.", "B": "Melaporkan kasus kriminal yang dialami kepada pihak berwenang setempat dan meminta bantuan medis darurat.", "C": "Minta bantuan medis darurat dari pihak asing tanpa melaporkan kasus kriminal yang dialami.", "D": "Memberikan obat-obatan dan perawatan medis darurat kepada korban di tempat kejadian.", "E": "Meminta keluarga korban untuk membiayai perawatan medis darurat."}, "answer": "B"}, {"number": 148, "type": "single", "text": "Salah satu langkah yang dapat ditempuh oleh masyarakat guna memperkuat penegakan hukum yang adil di Indonesia adalah dengan...", "options": {"A": "Mengajukan petisi untuk menyerang institusi hukum", "B": "Menghindari proses hukum yang dianggap tidak adil", "C": "Meningkatkan pengetahuan dan pemahaman masyarakat tentang hak dan kewajiban", "D": "Melakukan tindakan kekerasan terhadap pihak yang dianggap melanggar hukum", "E": "Mendirikan kelompok untuk melakukan tindakan protes terhadap kebijakan hukum yang tidak adil"}, "answer": "C"}, {"number": 149, "type": "single", "text": "Dalam konteks informasi yang mudah menyebar, penting untuk melakukan verifikasi sebelum mempercayai dan membagikan sebuah berita. Bagaimana kita dapat memastikan bahwa sebuah berita yang kita terima benar adanya dan tidak hanya hoaks semata?", "options": {"A": "Meminta opini dari keluarga atau teman untuk memastikan keaslian informasi tersebut.", "B": "Langsung mengedarkan berita karena dianggap berita itu penting dan perlu disebarluaskan.", "C": "Menyebarluaskan berita di media sosial tanpa melakukan verifikasi karena berita tersebut sudah tersebar luas di kalangan pengguna media sosial.", "D": "Hanya membaca judul berita sebagai cara untuk menilai kebenaran berita dan langsung mempercayainya karena sudah terbiasa dengan sumber media tersebut.", "E": "Mengecek keaslian suatu berita dengan mencari sumber-sumber tepercaya dan mencari informasi tambahan untuk memverifikasi kebenarannya."}, "answer": "E"}, {"number": 150, "type": "single", "text": "Orang asing dapat mengajukan permohonan pewarganegaraan untuk mendapatkan Kewarganegaraan Republik Indonesia. Menurut Pasal 9 UU No. 12 Tahun 2006 tentang Kewarganegaraan, syarat yang harus dipenuhi oleh orang asing untuk mendapatkan Kewarganegaraan Republik Indonesia adalah ….", "options": {"A": "Telah berusia
