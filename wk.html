bangsa Indonesia adalah memastikan kesejahteraan rakyat dan keberlanjutan lingkungan hidup. Penerapan nilainilai Pancasila yang sesuai dengan kebijakan tersebut adalah ….", "options": {"A": "mendorong eksploitasi sumber daya alam tanpa batasan demi meningkatkan pertumbuhan ekonomi", "B": "mengabaikan keberagaman budaya lokal demi menarik investasi asing agar lebih maju", "C": "melarang penggunaan teknologi informasi dan komunikasi demi melindungi indentitas budaya bangsa", "D": "menerapkan kebijakan pembangunan berkelanjutan yang mengintegrasikan perumbuhan ekonomi, keadilan sosial, dan pelestarian lingkungan", "E": "membatasi akses pendidikan dan peluang kerja bagi kelompok-kelompok tertentu demi mengurangi pengaruh budaya asing"}, "answer": "D"}, {"number": 154, "type": "single", "text": "Contoh penerapan sila kemanusiaan yang adil dan beradab dalam kehidupan antara lain mengakui dan memperlakukan manusia sesuai dengan harkat dan martabatnya sebagai makhluk Tuhan serta mengembangkan sikap saling mencintai sesama manusia. Bukti bahwa Pancasila merupakan ideologi terbuka terkait dengan penerapan nilai tersebut adalah .…", "options": {"A": "nilai-nilainya membuka diri dengan perkembangan nilai-nilai sosial kemasyarakatan", "B": "nilai-nilainya merupakan tuntutan konkret, operasional, dan mutlak yang tidak dapat ditafsirkan", "C": "nilai-nilai yang berkembang di masyarakat sebagai rujukan merubah nilai-nilai dalam Pancasila", "D": "nilai-nilai yang ada di masyarakat selalu mendapat tempat dalam ideologi Pancasila", "E": "isi dari nilai-nilai Pancasila merupakan bagian dari hasil interaksi dengan ideologi lain"}, "answer": "A"}, {"number": 155, "type": "single", "text": "Semasa pandemi, presiden menetapkan beberapa kebijakan ekonomi nasional, khususnya regulasi keuangan. Dalam kasus ini, presiden menjalankan kewenangannya sebagai ….", "options": {"A": "Kepala eksekutif", "B": "Kepala negara", "C": "Pemegang kedaulatan rakyat", "D": "Panglima tertinggi TNI", "E": "Mandataris MPR"}, "answer": "C"}, {"number": 156, "type": "single", "text": "Perhatikan beberapa kewenangan Presiden berikut! 1) Mengangkat duta dan konsul. 2) Mengangkat dan memberhentikan menteri. 3) Membuat Peraturan Presiden 4) Membuat perjanjian internasional. 5) Menyatakan perang dengan negara lain. 6) Memberi grasi dengan pertimbangan dari DPR. Kewenangan Presiden sebagai kepala negara ditunjukkan oleh nomor ….", "options": {"A": "(2), (4), (6)", "B": "(1), (3), (6)", "C": "(1), (2), (5)", "D": "(1), (4), (5)", "E": "(2), (3), (4)"}, "answer": "D"}, {"number": 157, "type": "single", "text": "Dalam sistem negara presidensial, presiden sebagai kepala eksekutif memiliki kedudukan yang sederajat dengan DPR sebagai pemegang kekuasaan legislatif, oleh karenanya Presiden tidak dapat membubarkan parlemen dan demikian sebaliknya. Berdasarkan uraian tersebut salah satu hubungan kerjasama antara Presiden dan DPR adalah .…", "options": {"A": "Presiden dan DPR bersama-sama menyusun rancangan undang-undang", "B": "Presiden mengajukan rancangan undang-undang ke DPR dan kemudian ditandatangan bersamasama", "C": "Presiden memberikan persetujuan terhadap rancangan undang-undang yang disusun oleh DPR", "D": "Presiden membuat rancangan undang-undang dan DPR akan menyetujui atau menolak pengajuan rancangan tersebut", "E": "Presiden dapat membuat rancangan undang-undang dan memberlakukan RUU tersebut tanpa persetujuan DPR"}, "answer": "D"}, {"number": 158, "type": "single", "text": "Bentuk pemerintahan yang dianut oleh Indonesia semenjak merdeka hingga saat ini adalah republik. Hal yang melatarbelakangi Indonesia menganut bentuk pemerintahan tersebut adalah .…", "options": {"A": "Sebagai negara merdeka Indonesia bebas menentukan bentuk pemerintahan yang akan digunakan", "B": "Dianggap mampu mengakomodasi perubahan dan perkembangan sosial, ekonomi, dan politik di Indonesia", "C": "Bentuk pemerintahan dimana DPR sebagai perwakilan rakyat mempunyai kuasa tertinggi", "D": "Kondisi demografis Indonesia cocok menggunakan bentuk pemerintahan republik", "E": "Kondisi geografis Indonesia ketika awal kemerdekaan mendukung penggunaan bentuk pemerintahan republik"}, "answer": "B"}, {"number": 159, "type": "single", "text": "Pembukaan UUD Tahun 1945 bagi bangsa Indonesia merupakan sumber motivasi dan aspirasi, tekad dan semangat bangsa Indonesia. Bagaimana pembukaan UUD Tahun 1945 memengaruhi aspek keamanan negara Indonesia?", "options": {"A": "Mendorong peningkatan kerjasama antara instansi-instansi keamanan negara Indonesia", "B": "Memberikan kekuasaan yang lebih besar pada lembaga-lembaga keamanan negara Indonesia", "C": "Menentukan kebijakan-kebijakan keamanan negara Indonesia secara terperinci", "D": "Menjelaskan struktur dan tugas sistem keamanan negara Indonesia secara rinci", "E": "Tidak memiliki pengaruh apa-apa terhadap aspek keamanan negara Indonesia"}, "answer": "A"}, {"number": 160, "type": "single", "text": "Tanggung jawab utama presiden sebagai kepala negara yaitu ….", "options": {"A": "Mengawasi tugas-tugas menteri dan pejabat publik lainnya", "B": "Menjalankan peran sebagai pemimpin partai politik", "C": "Membuat kebijakan yang berpihak kepada negara dan rakyat", "D": "Mengambil keputusan militer yang strategis", "E": "Mengadakan pertemuan dengan sejumlah pimpinan partai politik"}, "answer": "C"}, {"number": 161, "type": "single", "text": "Penerapan sistem presidensial di Indonesia dalam Undang-Undang Dasar NRI 1945 didasarkan pada ….", "options": {"A": "Pasal 1 ayat 1", "B": "Pasal 4 ayat 1", "C": "Pasal 7 ayat 1", "D": "Pasal 11 ayat 1", "E": "Pasal 18 ayat 1"}, "answer": "B"}, {"number": 162, "type": "single", "text": "Tujuan Pancasila sebagai dasar negara yang dijelaskan dalam Pembukaan UUD 1945 adalah ….", "options": {"A": "Menciptakan sistem politik yang membatasi kebebasan individu", "B": "Menciptakan keadilan sosial bagi seluruh rakyat Indonesia", "C": "Memisahkan agama dengan kehidupan bernegara", "D": "Memajukan teknologi dan ekonomi negara Indonesia.", "E": "Menjalin kerjasama internasional agar memeperkuat posisi Indonesia"}, "answer": "B"}, {"number": 163, "type": "single", "text": "Contoh perwujudan semangat kebangsaan dalam dunia pendidikan yaitu ….", "options": {"A": "Pendidikan yang menjamin kesetaraan dan keadilan gender", "B": "Pendidikan yang mengedepankan kompetisi dan prestasi", "C": "Pendidikan yang menekankan penguasaan teknologi dan ilmu pengetahuan", "D": "Pendidikan yang berfokus pada pengembangan keterampilan praktis", "E": "Pendidikan berkarakter yang mengajarkan nilai-nilai kebangsaan"}, "answer": "E"}, {"number": 164, "type": "single", "text": "Upaya yang dapat dilakukan untuk memperkuat pengawasan jalannya pemerintahan di Indonesia adalah ….", "options": {"A": "Meningkatkan gaji pejabat pemerintahan agar tidak tergoda melakukan Tindakan korupsi", "B": "Membentuk badan pengawas independen yang bekerja secara profesional sehingga tidak ada intervensi dari manapun", "C": "Memberikan hukuman berat bagi pejabat yang melakukan korupsi agar pemerintahan bersih", "D": "Membatasi kebebasan pers untuk menghindari publikasi negatif mengenai pemerintah", "E": "Memberikan bonus besar bagi pejabat yang berhasil mencapai target pembangunan nasional"}, "answer": "B"}, {"number": 165, "type": "single", "text": "Kajian dan transparansi pemerintah dalam menetapkan suatu kebijakan terutama yang terkait kepentingan masyarakat sangat diperlukan agar tidak menimbulkan reaksi dalam masyarakat. Dampak yang mungkin terjadi akibat tidak transparannya pemerintah dalam menetapkan kebijakan dapat menimbulkan reaksi seperti ….", "options": {"A": "Kebijakan yang ditetapkan pemerintah tidak akan berjalan lancar", "B": "Adanya penetapan kebijakan sendiri oleh kelompok masyarakat", "C": "Berkurangnya rasa persatuan dan kesatuan dalam masyarakat", "D": "Hilangnya kepercayaan masyarakat terhadap pemerintahan", "E": "T atanan negara yang semakin rendah karena adanya kebijakan baru"}, "answer": "D"}, {"number": 166, "type": "single", "text": "Manakah di antara pilihan berikut yang paling tepat menjelaskan mengenai kepastian hukum dalam konteks asas kewarganegaraan yang diterapkan dalam suatu negara?", "options": {"A": "Kepastian hukum menjamin bahwa setiap warga negara dapat memilih dan dipilih dalam pemilihan umum", "B": "Kepastian hukum menjamin bahwa setiap orang di negara tersebut memiliki hak yang sama", "C": "Kepastian hukum menjamin bahwa setiap warga negara mendapat hak atas tempat tinggal di negara yang bersangkutan", "D": "Kepastian hukum menjamin bahwa setiap orang di negara tersebut bebas untuk berpendapat dan berkumpul", "E": "Kepastian hukum menjamin bahwa setiap warga negara memiliki hak untuk bepergian ke luar negeri"}, "answer": "B"}, {"number": 167, "type": "single", "text": "Rudi lahir di Malaysia dari orangtua WNI, sehingga saat ini Rudi memiliki status kewarganegaraan ganda antara Indonesia dan Malaysia. Namun, Rudi ingin mengubah status kewarganegaraannya menjadi Warga Negara Indonesia. Langkah apa yang harus dilakukan oleh Rudi untuk dapat memperoleh status kewarganegaraan Indonesia?", "options": {"A": "Menunggu sampai usia 30 tahun untuk secara otomatis kehilangan kewarganegaraan asingnya.", "B": "Mengurus surat keterangan ganda di kedutaan besar Indonesia.", "C": "Melakukan perekaman data kependudukan di Dukcapil setempat di Indonesia.", "D": "Mengurus surat pernyataan tentang kehilangan kewarganegaraan asing ke Kmenhukham", "E": "Mengajukan permohonan untuk memperoleh kewarganegaraan Indonesia di Kantor Imigrasi setempat."}, "answer": "D"}, {"number": 168, "type": "single", "text": "Setelah kasus kriminal yang melibatkan warga negara Indonesia selesai ditangani oleh pihak berwenang setempat maka yang harus dilakukan oleh KBRI adalah ….", "options": {"A": "Melakukan pernyataan ke masyarakat bahwa kasus sudah selesai ditangani dengan baik", "B": "Memantau kondisi korban untuk memastikan bahwa hak-hak korban terpenuhi.", "C": "Memberikan bantuan finansial kepada korban karena korban sudah tidak bekerja", "D": "Mengabaikan kasus tersebut karena tidak ada lagi yang bisa dilakukan dan menjadi keptusan negara tersebut", "E": "Menjaga kerahasiaan kasus dan tidak memberikan informasi kepada pihak lain."}, "answer": "B"}, {"number": 169, "type": "single", "text": "Dalam sistem negara presidensial, presiden sebagai kepala eksekutif memiliki kedudukan yang sederajat dengan DPR sebagai pemegang kekuasaan legislatif, oleh karenanya Presiden tidak dapat membubarkan parlemen dan demikian sebaliknya. Berdasarkan uraian tersebut salah satu hubungan kerjasama antara Presiden dan DPR adalah .…", "options": {"A": "Presiden dan DPR bekerja sama dalam hal pembubaran partai politik", "B": "Presiden dan DPR bekerja sama dalam hal pemberian amnesti dan abolisi", "C": "Presiden dan DPR mengerjakan rancangan anggaran bersama-sama", "D": "Setiap undang-undang yang berlaku harus disetujui oleh Presiden dan disahkan oleh DPR", "E": "Presiden meminta persetujuan kepada DPR dalam hal mengeluarkan keputusan presiden"}, "answer": "B"}, {"number": 170, "type": "single", "text": "Bentuk pemerintahan yang dianut oleh Indonesia semenjak merdeka hingga saat ini adalah republik. Hal yang melatarbelakangi Indonesia menganut bentuk pemerintahan tersebut adalah .…", "options": {"A": "Kondisi demografis penduduk Indonesia cocok menggunakan bentuk pemerintahan republik", "B": "Kondisi goegrafis dan sosial politik Indonesia mendukung penggunaan bentuk pemerintahan republik", "C": "Membantu membatasi kekuasaan penguasa dengan memisahkan kekuasaan eksekutif, legislatif, dan yudikatif", "D": "Kebutuhan akan sebuah bentuk pemerintahan yang mengakomodir seluruh daerah dan seluruh lapisan masyarakat Indonesia melalui partai politik", "E": "Indonesia menginginkan adanya kekuasaan tertinggi pada parlemen supaya suara rakyat terwakilkan"}, "answer": "C"}, {"number": 171, "type": "single", "text": "Pemerintah negara Indonesia selalu berupaya untuk mencapai pembangunan yang menyeluruh untuk seluruh Indonesia, sehingga setiap lapisan masyarakat dimanapun berada dapat merasakan kesejahteraan dan hidup yang layak. Niat ini sejalan dengan pokok pikiran kedua dalam Pembukaan UUD Negara Republik Indonesia, yaitu ….", "options": {"A": "Mewujudkan kedaulatan rakyat yang berdasarkan permusyawaratan perwakilan", "B": "Mewujudkan keadilan sosial yang merata bagi seluruh lapisan masyarakat yang majemuk", "C": "Melindungi segenap bangsa Indonesia dan seluruh tumpah darah Indonesia berdasarasas persatuan", "D": "Berdasarkan Ketuhanan yang Maha Esa menurut dasar kemanusiaan yang adil danberadab", "E": "Menjunjung tinggi harkat dan martabat manusia serta perwujudan nilai kemanusiaan yang luhur"}, "answer": "B"}, {"number": 172, "type": "single", "text": "Alasan amandemen konstitusi diperlukan dalam suatu negara adalah ….", "options": {"A": "Menyesuaikan konstitusi dengan perubahan sosial, politik, dan teknologi yang terjadi", "B": "Mengurangi kompleksitas konstitusi dan memudahkan pemahaman masyarakat", "C": "Memberikan kekuatan lebih kepada pemerintah dalam mengambil keputusan yang penting", "D": "Mengubah sistem pemerintahan negara secara keseluruhan mengikuti perkembangan jaman", "E": "Melarang adanya perubahan dalam konstitusi yang telah dibentuk semenjak awal"}, "answer": "A"}, {"number": 173, "type": "single", "text": "Pernyataan yang tepat terkait \"Sumpah Pemuda\" dan hubungannya dengan peristiwa Proklamasi yaitu ….", "options": {"A": "Sumpah Pemuda adalah pernyataan persatuan dan kesatuan para pemuda Indonesia dan tidak ada hubungannya dengan peristiwa Proklamasi", "B": "Sumpah Pemuda adalah perjanjian antara para pemuda Indonesia untuk memperjuangkan kemerdekaan Indonesia dan merupakan bagian dari peristiwa Proklamasi", "C": "Sumpah Pemuda adalah upaya para pemuda Indonesia untuk menjaga keberagaman budaya dan etnis di Indonesia dan tidak ada hubungannya dengan peristiwa Proklamasi", "D": "Sumpah Pemuda adalah aksi demonstrasi para pemuda Indonesia untuk menuntut kemerdekaan Indonesia dan merupakan pemicu terjadinya peristiwa Proklamasi", "E": "Sumpah Pemuda adalah deklarasi kemerdekaan Indonesia yang dilakukan sebelum peristiwa Proklamasi"}, "answer": "B"}, {"number": 174, "type": "single", "text": "T okoh yang memperjuangkan agar Indonesia menggunakan sistem demokrasi parlementer dalam Sidang PPKI pada 18 Agustus 1945 adalah ….", "options": {"A": "Soekarno", "B": "Moh. Hatta", "C": "Radjiman Wedyodiningrat", "D": "Ki Hadjar Dewantara", "E": "Mohammad Y amin"}, "answer": "E"}, {"number": 175, "type": "single", "text": "Keterbukaan pemerintah sangat penting untuk menjaga transparansi, akuntabilitas, dan integritas dalam menjalankan tugas pemerintahan. Contoh bukti kebijakan pemerintah yang mencerminkan keterbukaan pemerintah dalam bidang pengelolaan negara adalah ….", "options": {"A": "Diberikannya semua akses data-data rahasia pemerintah terhadap seluruh lapisan masyarakat", "B": "Ditampilkannya proses dan hasil rapat suatu instansi pemerintah melalui media sosial", "C": "Memberikan bantuan sosial serta pelatihan kerja kepada masyarakat yang membutuhkan", "D": "Membangun infrastruktur demi kelancaran transportasi serta perekonomian masyarakat", "E": "Menggunakan produk-produk dalam negeri untuk keperluan kedinasan serta membatasi produk impor"}, "answer": "B"}, {"number": 176, "type": "single", "text": "Pembangunan di bidang hukum diperlukan untuk mewujudkan pemerintahan yang bersih dan terbuka. Y ang menjadi salah satu faktor pendukung dalam pembangunan di bidang hukum adalah ….", "options": {"A": "Partisipasi masyarakat dalam penyusunan undang-undang dan kebijakan publik", "B": "Keterbatasan akses masyarakat terhadap informasi publik dan kurangnya partisipasi politik", "C": "Kesenjangan sosial-ekonomi yang besar dan kurangnya perhatian terhadap hak asasi manusia.", "D": "Kurangnya investasi dalam infrastruktur dan teknologi untuk memperkuat sistem hukum", "E": "Ketidakpercayaan masyarakat atas lembaga pemerintah karena banyaknya praktik hukum yang meyimpang"}, "answer": "A"}, {"number": 177, "type": "single", "text": "Masyarakat madani adalah masyarakat yang beradab, menjunjung tinggi nilai-nilai kemanusiaan, yang maju dalam penguasaan ilmu pengetahuan, dan teknologi. Manfaat utama dari budaya demokrasi dalam menciptakan masyarakat madani tersebut adalah ….", "options": {"A": "Menjaga keseimbangan antara hak dan kewajiban warga negara", "B": "Mendorong partisipasi politik dari seluruh masyarakat", "C": "Memperkuat hak-hak individu dan kelompok yang rentan", "D": "Menciptakan kesempatan bagi masyarakat untuk maju sebagai pemimpin", "E": "Menciptakan kebebasan berpendapat masyarakat tanpa batasan"}, "answer": "A"}, {"number": 178, "type": "single", "text": "Masyarakat yang memiliki cenderung patuh pada aturan dan regulasi yang telah ditetapkan oleh pemerintah atau lembaga terkait dan menyadari bahwa aturan tersebut dibuat untuk kepentingan bersama dan demi menjaga ketertiban masyarakat. Kondisi tersebut menunjukkan kondisi pada masyarakat madani yang ….", "options": {"A": "Memiliki kesadaran hukum yang tinggi", "B": "T akut akan sanksi yang mengancam dirinya", "C": "Mengedepankan kepentingan kelompok", "D": "Memiliki latar pendidikan yang tinggi", "E": "Patuh kepada aparat penegak hukum"}, "answer": "A"}, {"number": 179, "type": "single", "text": "Sistem pemerintahan Indonesia adalah menganut sistem pemerintahan Presidensial. Bukti dari pernyataan tersebut adalah ….", "options": {"A": "Pemilihan presiden dan anggota parlemen dilakukan bersamaan", "B": "Presiden merupakan kepala pemerintahan dan kepala negara", "C": "Presiden berhak melakukan intervensi pada urusan legislatif dan yudikatif", "D": "Pemilihan presiden dilakukan oleh parlemen", "E": "Menteri bertanggung jawab langsung kepada presiden"}, "answer": "E"}, {"number": 180, "type": "single", "text": "Presiden melaksanakan tugasnya dengan menetapkan kebijakan dalam bidang pendidikan dan menunjuk pejabat tinggi negara seperti menteri atau gubernur bank sentral. Dalam kasus ini, presiden menjalankan kewenangannya sebagai ….", "options": {"A": "Seorang siswa memilih untuk belajar di perpustakaan karena melihat temannya juga melakukan hal yang sama.", "B": "Seorang mahasiswa menjadi aktif di kegiatan organisasi karena merasa tertarik dengan program yang diusulkan.", "C": "Seorang karyawan membantu rekan kerjanya yang sedang kesulitan menyelesaikan tugas karena ingin memperbaiki hubungan di tempat kerja.", "D": "Seorang ibu mengajak anaknya berbelanja barang-barang mahal karena terpengaruh dengan iklan yang sering dilihat di televisi.", "E": "Seorang pemuda merasa terpanggil untuk membantu orang yang sedang dalam kesulitan setelah melihat video inspiratif di media sosial."}, "answer": "E"}, {"number": 181, "type": "single", "text": "Asas kewarganegaraan memiliki tujuan untuk memberikan kepastian hukum bagi warga negara. Manakah di antara pilihan berikut yang menjelaskan secara tepat mengenai kepastian hukum dalam konteks ini?", "options": {"A": "Mengurus surat keterangan ganda di kedutaan besar Indonesia yang ada di Australia", "B": "Mengajukan permohonan kewarganegaraan ke pengadilan negeri setempat", "C": "Mengajukan permohonan ke Kemenkumham untuk memperoleh kewarganegaraan Indonesia.", "D": "Mengajukan permohonan ke Dinas Kependudukan dan Catatan Sipil untuk menjadi WNI.", "E": "Tidak perlu mengajukan permohonan karena Maya sudah kehilangan kewarganegaraan Australia secara otomatis."}, "answer": "C"}, {"number": 182, "type": "single", "text": "Langkah - langkah yang dapat dilakukan KBRI untuk memastikan bahwa proses hukum atas kasus kriminal yang menimpa warga negara Indonesia di luar negeri berjalan dengan adil antara lain ….", "options": {"A": "Membantu memberikan perlindungan selama persidangan berlangsung", "B": "Melakukan negosiasi dengan agar hukuman tersebut dapat di cabut", "C": "Memberikan uang jaminan kepada negara tersebut agar persidangan di ringankan", "D": "Memberikan pembelaan secara aktif dan memonitor jalannya persidangan", "E": "Tidak memiliki kewenangan dalam menangani kasus kriminal di luar negeri"}, "answer": "D"}, {"number": 183, "type": "single", "text": "Upaya paling tepat yang dapat dilakukan oleh masyarakat dalam memperkuat penegakan hukum yang adil di Indonesia adalah dengan ...", "options": {"A": "Memperjuangkan hak-hak melalui jalur hukum yang ada", "B": "Meningkatkan pengetahuan dan pemahaman masyarakat tentang hak dan kewajiban", "C": "Menerima putusan pengadilan tanpa syarat", "D": "Mengadakan aksi demonstrasi secara intensif", "E": "Mengambil tindakan kekerasan untuk menyelesaikan masalah hukum."}, "answer": "B"}, {"number": 184, "type": "single", "text": "Unsur budaya politik yang mencerminkan minat dan keterlibatan warga dalam kegiatan politik seperti pemilihan umum adalah ….", "options": {"A": "Media massa", "B": "Partisipasi politik", "C": "Kebijakan publik", "D": "Ideologi politik", "E": "Orientasi politik"}, "answer": "B"}, {"number": 185, "type": "single", "text": "Dalam sebuah proses pemilihan kepala Desa, seluruh calon bertarung secara adil dan bersaing tanpa melakukan tindakan curang. Para calon kepala Desa meyampaikan rencana program-programnya jika terpilih dalam berbagai kesempatan dan berbagai media komunikasi warga. Sikap masyarakat yang mencerminkan budaya demokrasi dalam situasi tersebut adalah ….", "options": {"A": "Menggunakan media komunikasi sebagai sarana kampanye", "B": "Menyampaikan program kepala desa dalam berbagai kesempatan", "C": "Menyampaikan rencana program calon kepala desa secara transparan", "D": "Memberikan kesempatan yang sama dan adil bagi semua calon", "E": "Menghilangkan suara pemilih yang tidak mendukung calon tertentu"}, "answer": "D"}, {"number": 186, "type": "single", "text": "Di sebuah desa di Indonesia, para pemimpin desa mengadakan rapat partisipatif untuk membahas kebijakan dan program untuk desa tersebut. Seluruh warga desa diundang untuk hadir, memberikan masukan, dan memilih kebijakan yang terbaik untuk desa mereka. Pemimpin desa mendengarkan setiap pendapat dan memberikan kesempatan yang sama untuk semua orang untuk berbicara dan memilih. Y ang dapat dilakukan oleh anggota masyarakat untuk meningkatkan budaya demokrasi dalam hubungan antaranggota masyarakat tersebut adalah ….", "options": {"A": "Menghadiri setiap rapat yang membahas kebijakan dan program desa", "B": "Menghindari diskusi dan debat yang melibatkan anggota masyarakat", "C": "Mendengarkan setiap pendapat dan masukan dari peserta rapat", "D": "Meningkatkan partisipasi aktif dalam pengambilan keputusan", "E": "Mempercepat proses diskusi agar tidak berkepanjangan"}, "answer": "D"}, {"number": 187, "type": "single", "text": "Globalisasi membawa pengaruh budaya dari luar yang dapat menggeser identitas seseorang untuk menjaga kebudayaan dan tradisi lokal dalam menghadapi era tersebut adalah ….", "options": {"A": "Menutup akses budaya luar yang lambat laun menghilangkan ciri khas budaya lokal", "B": "Menghidupkan kembali semangat toleransi, kekeluargaan, dan solidaritas yang tinggi", "C": "Menghindari kegiatan-kegiatan yang bertentangan dengan identitas dan nilai-nilai budaya lokal", "D": "Mempromosikan kebudayaan lokal melalui media sosial dan internet agar semua masyarakat mengetahuinya", "E": "Menggunakan tradisi-tradisi lama dalam kehidupan sehari-hari sehingga tidak akan tergeser"}, "answer": "A"}, {"number": 188, "type": "single", "text": "Pernyataan yang benar mengenai seorang anak yang lahir di wilayah negara Republik Indonesia yang pada waktu lahir tidak jelas status kewarganegaraan ayah dan ibunya adalah ...", "options": {"A": "Ia hanya dapat memperoleh kewarganegaraan Indonesia jika telah mengajukan permohonan", "B": "Ia hanya dapat memperoleh kewarganegaraan Indonesia jika statusnya diakui oleh ayahnya", "C": "Ia dapat memperoleh kewarganegaraan Indonesia secara otomatis sesuai hukum yang berlaku", "D": "Ia tidak dapat memperoleh kewarganegaraan Indonesia karena status kewarganegaraan ayah dan ibunya tidak jelas", "E": "Ia hanya dapat memperoleh status kewarganegaraan yang diturunkan ayahnya"}, "answer": "C"}, {"number": 189, "type": "single", "text": "Menurut Pasal 9 UU No. 12 Tahun 2006 tentang Kewarganegaraan Indonesia, seseorang yang kehilangan Kewarganegaraan Republik Indonesia dapat memperoleh kembali kewarganegaraannya melalui prosedur pewarganegaraan apabila telah memenuhi salah satu syarat berikut, yaitu …", "options": {"A": "T elah menikah dengan WNI dan telah menetap di wilayah Indonesia selama minimal 10 tahun berturut-turut sejak perkawinan", "B": "Telah berusia 18 tahun dan yang bersangkutan telah memiliki pekerjaan atau penghasilan tetap", "C": "T elah menempuh pendidikan di Indonesia dan mendapatkan gelar akademik dan telah menetap di Indonesia minimal 2 tahun berturut-turut setelah lulus", "D": "Tidak pernah terbukti menjadi anggota partai politik atau organisasi terlarang apapun di Indonesia", "E": "Telah memiliki penghasilan yang berasal dari Indonesia selama minimal 10 tahun tidak berturutturut"}, "answer": "B"}, {"number": 190, "type": "single", "text": "Negara Z memiliki asas kewarganegaraan yaitu ‘ius domicilii’, yang berarti kewarganegaraan diperoleh dari tempat tinggal. Latar belakang negara Z yang memengaruhi asas kewarganegaraannya adalah ...", "options": {"A": "kebijakan pemerintah negara Z untuk menarik investor asing.", "B": "kondisi geografis yang membuat negara Z menjadi tempat transit banyak imigran.", "C": "sejarah penjajahan yang memengaruhi konsep identitas nasional negara Z.", "D": "kebijakan pemerintah negara Z untuk menjaga kemurnian ras.", "E": "tingginya tingkat migrasi di negara Z menimbulkan keinginan untuk membatasi jumlah warga negara."}, "answer": "B"}, {"number": 191, "type": "single", "text": "Salah satu dampak negatif dari globalisasi meliputi memudarnya rasa nasionalisme, lunturnya nilai-nilai budaya serta memudarnya rasa cinta terhadap produk dalam negeri. Untuk mengatasi dampak globalisasi tersebut, langkah penting yang perlu ditempuh dalam menjalankan nilai-nilai Pancasila adalah ….", "options": {"A": "Meningkatkan kerjasama internasional dalam bidang politik, ekonomi, dan terutama budaya.", "B": "Memfokuskan pembangunan infrastruktur di daerah perkotaan agar cepat berkembang", "C": "Selalu mengedepankan kepentingan pribadi dan kelompok dalam pengambilan kebijakan", "D": "Mempromosikan keberagaman budaya dan pendidikan karakter berbasis Pancasila sebagai fondasi persatuan bangsa", "E": "Mengurangi anggaran negara untuk program pengentasan kemiskinan dan dialihkan ke pelestarian budaya"}, "answer": "D"}, {"number": 192, "type": "single", "text": "Perbedaan pemilihan kepala negara pada sistem presidensial dan sistem parlementer adalah ….", "options": {"A": "Pemilihan kepala negara pada sistem presidensial dilakukan secara tidak langsung melalui pemilihan elektoral, sedangkan pada sistem parlementer, pemilihan kepala negara dilakukan secara langsung melalui pemilihan umum", "B": "Pemilihan kepala negara pada sistem presidensial dilakukan secara langsung melalui pemilihan umum, sedangkan pada sistem parlementer, pemilihan kepala negara dilakukan secara tidak langsung melalui pemilihan elektoral", "C": "Pemilihan kepala negara pada sistem presidensial dan sistem parlementer dilakukan dengan cara yang sama, yaitu melalui pemilihan umum", "D": "Pemilihan kepala negara pada sistem presidensial dan sistem parlementer sama-sama dilakukan melalui pemilihan elektoral", "E": "Tidak ada perbedaan dalam sistem pemilihan kepala negara antara sistem presidensial dan sistem parlementer"}, "answer": "B"}, {"number": 193, "type": "single", "text": "Peran Pancasila dalam Pembukaan UUD 1945 dalam konteks pendidikan karakter bangsa yaitu ….", "options": {"A": "Pancasila merupakan dasar kurikulum pendidikan di Indonesia", "B": "Pancasila memberikan pedoman bagi pengembangan sistem pendidikan yang inklusif", "C": "Pancasila menjadi landasan moral dan etika yang harus ditanamkan dalam pendidikan", "D": "Pancasila digunakan sebagai indikator keberhasilan dalam pendidikan karakter bangsa", "E": "Pancasila menjadi dasar penilaian kinerja lembaga pendidikan di Indonesia"}, "answer": "C"}, {"number": 194, "type": "single", "text": "Contoh perwujudan semangat kebangsaan dalam bidang pertahanan keamanan yaitu ….", "options": {"A": "Pemenuhan hak asasi manusia bagi prajurit TNI dan Polri sebagai satuan keamanan negara", "B": "Pengembangan sistem persenjataan serta teknologi pertahanan dan keamanan yang canggih", "C": "Kerjasama internasional dalam penanggulangan terorisme serta ancaman dari luar", "D": "Penegakan kedaulatan dan keutuhan wilayah negara melalui upaya pertahanan dan keamanan yang kuat", "E": "Pemberian insentif dan tunjangan yang memadai bagi anggota serta keluarga TNI dan Polri"}, "answer": "D"}, {"number": 195, "type": "single", "text": "Masyarakat madani yang demokratis menghargai perbedaan dan mampu menoleransi perbedaan dalam masyarakat, seperti perbedaan agama, suku bangsa, budaya, gender, dan lain sebagainya. Masyarakat madani yang demokratis tidak hanya menghargai perbedaan, tetapi juga mampu mengakomodasi perbedaan tersebut dengan tetap menjaga kerukunan dan kebersamaan dalam masyarakat. Dalam budaya demokrasi, masyarakat tersebut diberikan kebebasan untuk ....", "options": {"A": "Melakukan tindakan kekerasan terhadap kelompok lawan politik", "B": "Menyalahkan pihak lain atas kegagalan atau masalah di masyarakat", "C": "Tidak mematuhi peraturan dan hukum yang berlaku di daerah lain", "D": "Berpendapat dan menyampaikan aspirasi secara terbuka dan konstruktif", "E": "Membuat keputusan sendiri tanpa memperdulikan pendapat orang lain"}, "answer": "D"}, {"number": 196, "type": "single", "text": "Masyarakat yang demokratis salah satunya yaitu masyarakat yang mengajak orang lain untuk berpartisipasi aktif dalam kegiatan politik dan sosial serta mempromosikan nilainilai kebaikan dan perdamaian di lingkungan sekitar. Salah satu contoh kondisi masyarakat madani yang sesuai dalam kondisi tersebut adalah ....", "options": {"A": "Kebijakan publik", "B": "Ideologi politik", "C": "Media massa", "D": "Partisipasi politik", "E": "Orientasi politik"}, "answer": "A"}, {"number": 197, "type": "single", "text": "Dalam sebuah organisasi masyarakat, terdapat anggota yang memiliki pendapat yang berbeda terkait kegiatan yang akan dilakukan. Sikap yang mencerminkan budaya demokrasi dalam situasi tersebut adalah ….", "options": {"A": "Memilih untuk mengabaikan pendapat anggota tersebut karena tidak sejalan dengan mayoritas.", "B": "Menerima pendapat anggota tersebut tanpa memberikan pertimbangan yang cukup.", "C": "Membuka ruang untuk mendengarkan dan mempertimbangkan pendapat anggota tersebut bersama dengan pendapat mayoritas.", "D": "Menolak pendapat anggota tersebut dengan alasan tidak sesuai dengan aturan yang berlaku.", "E": "Mengabaikan pendapat anggota mayoritas dan membuat keputusan secara sepihak"}, "answer": "C"}, {"number": 198, "type": "single", "text": "Di sebuah lingkungan kompleks perumahan, para tetangga mengadakan pertemuan RT berkala untuk membahas berbagai masalah seperti memperbaiki infrastruktur dan menjaga kebersihan lingkungan. Semua warga diundang untuk hadir dan memberikan masukan. Pentingnya penerapan budaya demokrasi dalam hubungan seperti wacana tersebut adalah ….", "options": {"A": "Meningkatkan kekuasaan ketua RT dalam kompleks perumahan", "B": "Menjaga stabilitas keamanan lingkungan perumahan", "C": "Meningkatkan partisipasi aktif warga RT dalam pengambilan keputusan", "D": "Meningkatkan kepercayaan pemerintah daerah kepada pengurus RT", "E": "Meningkatkan rasa bangga warga pada sistem demokrasi yang diterapkan"}, "answer": "C"}, {"number": 199, "type": "single", "text": "Globalisasi membawa persaingan yang semakin ketat antara produk lokal dengan produk impor yang masuk ke dalam pasar domestik. Hal ini bisa menyebabkan perusahaan lokal kesulitan bersaing dengan produk impor yang lebih murah dan berkualitas. Dampak positif jika seseorang dapat memperkuat produk lokal dalam menghadapi dampak negatif globalisasi bagi perekonomian adalah ….", "options": {"A": "Menjaga kemandirian perekonomian lokal", "B": "Meningkatkan impor produk asing", "C": "Menurunkan daya saing produk lokal", "D": "Menurunkan nilai tukar rupiah", "E": "Meningkatkan kerjasama antar negara"}, "answer": "A"}, {"number": 200, "type": "single", "text": "Teknologi realitas virtual (VR) dan realitas tertambah (AR) juga telah diterapkan dalam untuk meningkatkan pengalaman teknologi virtual. Dengan teknologi ini, kitaa dapat menjelajahi lingkungan virtual yang mendukung pemahaman konsep dan materi yang diajarkan. Misalnya, kita dapat mengunjungi rekonstruksi situs bersejarah, melakukan eksperimen dalam lingkungan simulasi. Penggunaan VR dan AR ini dapat meningkatkan pengetahuan dan pemahaman masyarakat terhadap materi tertentu. Dalam konteks ini, perkembangan IPTEK tersebut termasuk dalam bidang...", "options": {"A": "Pertahanan dan keamanan", "B": "Komunikasi", "C": "Sosial budaya", "D": "Politik", "E": "Pendidikan"}, "answer": "E"}, {"number": 201, "type": "single", "text": "Gaya hidup konsumtif yang menjadi ciri khas generasi modern sering kali membuat remaja tidak memikirkan dampak jangka panjang dari keputusan mereka. Mereka cenderung mengikuti tren dan gaya hidup yang mementingkan kesenangan sesaat. Hal ini menimbulkan dampak negatif terutama terkait rasa kebangsaan, salah satunya adalah ....", "options": {"A": "Lebih mementingkan popularitas daripada prestasi akademik", "B": "Mudahnya terpapar konten radikal atau ekstrem dari luar", "C": "Kurang tolerannya terhadap perbedaan dan keragaman buadaya", "D": "Menyempitkan pandangan tentang suatu suku bangsa tertentu", "E": "Cenderung hidup hedonistik dan mengabaikan nilai budaya lokal"}, "answer": "E"}, {"number": 202, "type": "single", "text": "Perhatikan pernyataan-pernyataan berikut. (1) P eningkatan diplomasi multilateral (2) Terbentuknya lembaga-lembaga internasional yang membantu penyelesaian konflik (3) P enerapan sistem demokrasi yang lebih transparan (4) Munculnya gerakan politik global yang mendukung hak asasi manusia (5) P eningkatan saling pengertian antarbudaya politik Dampak positif globalisasi di bidang politik ditunjukkan oleh nomor ….", "options": {"A": "(1), (2), dan (3)", "B": "(1), (3), dan (4)", "C": "(2), (3), dan (5)", "D": "(2), (4), dan (5)", "E": "(3), (4), dan (5)"}, "answer": "D"}, {"number": 203, "type": "single", "text": "Dalam menghadapi ancaman integrasi nasional yang disebabkan oleh polarisasi politik yang tajam, upaya yang dapat dilakukan untuk mengatasi ancaman tersebut adalah ....", "options": {"A": "Mengamalkan nilai-nilai Pancasila dalam kehidupan sehari-hari", "B": "Memperkuat produksi dalam negeri sehingga perekonomian rakyat meningkat", "C": "Meningkatkan rasa nasionalisme dan menguatkan konsep Bhinneka Tunggal Ika", "D": "Menanamkan sikap tenggang rasa dalam kehidupan berbangsa dan bernegara", "E": "Memperkuat aparat khusus anti teror dalam mencegah dan menindak aksi terorisme"}, "answer": "C"}, {"number": 204, "type": "single", "text": "Seorang pria tertangkap basah mencuri buah di kebun milik tetangganya. Dalam konteks norma hukum dan norma kesusilaan, perbedaan penanganan kasus ini adalah ....", "options": {"A": "pencuri berdasarkan norma hukum akan mendapatkan sanksi yang tegas, sedangkan dalam norma kesusilaan sanksi diserahkan kepada", "B": "dalam norma hukum mencuri merupakan perbuatan berdosa, sedangkan dalam norma kesusilaan pencuri bisa merasa berdosa bisa juga merasa tidak berdosa", "C": "pencuri dalam norma hukum diberi sanksi yang tegas (penjara), sedangkan dalam norma kesusilaan sanksinya tidak tegas (berupa permintaan maaf)", "D": "pencuri dalam norma hukum bisa mengelabui polisi, sedangkan dalam norma kesusilaan polisi tidak bisa dibohongi oleh pencuri", "E": "dalam norma hukum pencuri dihukum sesuai undang-undang, sedangkan pada norma kesusilaan pencuri dibiarkan berkeliaran"}, "answer": "C"}, {"number": 205, "type": "single", "text": "Seorang pengemudi bus melanggar rambu lalu lintas dan mengakibatkan kecelakaan. Berdasarkan ilustrasi ini, hukum memiliki arti penting yaitu untuk ….", "options": {"A": "Menjamin keamanan dan kerukunan antarwarga negara", "B": "Menjamin warga negara untuk bersikap taat pada aturan pemerintah", "C": "Mendahulukan kepentingan warga daripada kepentingan pribadi", "D": "Menjaga keamanan dan keselamatan bagi setiap warga negara", "E": "Membatasi ruang gerak masyarakat agar tidak semaunya"}, "answer": "D"}, {"number": 206, "type": "single", "text": "Ketika terjadinya hujan dan kita hendak keluar rumah maka payung ataupun jas hujan merupakan barang yang sungguh kita perlukan guna melindungi dari air hujan dengan cara langsung biar badan kita tak berair. Nilai yang terkandung dalam penggunaan payung dalam situasi tersebut adalah ….", "options": {"A": "Material", "B": "Vital", "C": "Kerohanian", "D": "Kebenaran", "E": "Keindahan"}, "answer": "B"}, {"number": 207, "type": "single", "text": "Seorang pelayan di sebuah restoran hanya memberikan pelayanan yang baik kepada pelanggan yang diperkirakan akan memberikan tip besar, sementara pelanggan lainnya diperlakukan secara tidak adil. Norma yang melandasi ilustrasi ini adalah ….", "options": {"A": "Kesusilaan", "B": "Adat Istiadat", "C": "Keagamaan", "D": "Kesopanan", "E": "Hukum"}, "answer": "A"}, {"number": 208, "type": "single", "text": "Sugesti merupakan salah satu faktor pendorong seseorang untuk melakukan sesuatu. Manakah di antara pilihan berikut yang merupakan contoh penerapan sugesti pada interaksi sosial?", "options": {"A": "Seorang siswa menolak untuk mengikuti kegiatan sekolah yang diusulkan oleh temannya karena sudah memiliki rencana lain.", "B": "Seorang mahasiswa memilih untuk mengikuti kegiatan seminar yang diadakan kampus karena ingin meningkatkan kemampuan akademiknya.", "C": "Seorang karyawan menolak permintaan bantuan dari rekan kerjanya karena sudah terlalu banyak pekerjaan yang harus diselesaikan sendiri.", "D": "Seorang ibu membeli produk kecantikan tertentu karena terpengaruh dengan testimoni selebriti di televisi.", "E": "Seorang pemuda memilih untuk tidak membantu orang yang sedang dalam kesulitan karena tidak ingin terlibat masalah yang tidak ada kaitannya dengan dirinya."}, "answer": "B"}, {"number": 209, "type": "single", "text": "Mana yang menjelaskan secara tepat mengenai hubungan antara asas kewarganegaraan dan kepastian hukum di suatu negara?", "options": {"A": "Asas kewarganegaraan menjamin bahwa setiap warga negara dapat memilih dan dipilih dalam pemilihan umum", "B": "Asas kewarganegaraan menjamin bahwa setiap orang di negara tersebut memiliki hak yang sama", "C": "Asas kewarganegaraan menjamin bahwa setiap warga negara mendapat hak atas tempat tinggal di negara yang bersangkutan", "D": "Asas kewarganegaraan menjamin bahwa setiap orang di negara tersebut bebas untuk berpendapat dan berkumpul", "E": "Asas kewarganegaraan menjamin bahwa hak dan kewajiban warga negara ditetapkan secara jelas dan pasti"}, "answer": "E"}, {"number": 210, "type": "single", "text": "Seorang individu lahir di Amerika Serikat dari orangtua Indonesia dan memiliki kewarganegaraan ganda antara Indonesia dan Amerika Serikat. Individu tersebut memutuskan untuk mempertahankan kewarganegaraan Amerika Serikat dan ingin melepaskan kewarganegaraan Indonesia. Langkah apa yang harus dilakukan individu tersebut untuk melepaskan kewarganegaraan Indonesia?", "options": {"A": "Mengajukan permohonan untuk melepaskan kewarganegaraan Indonesia ke kedutaan besar Indonesia di Amerika Serikat.", "B": "Menunggu sampai usianya telah mencapai 21 tahun lebih untuk dapat memilih kewarganegaraan asing secara otomatis.", "C": "Menunggu sampai usia 30 tahun untuk secara otomatis kehilangan kewarganegaraan Indonesia.", "D": "Mendaftarkan diri ke kedutaan besar Amerika Serikat dan melepaskan kewarganegaraan Indonesia secara otomatis.", "E": "Mengurus surat keterangan ganda di kedutaan besar Indonesia dan melakukan permohonan naturalisasi warga negara asing"}, "answer": "A"}, {"number": 211, "type": "single", "text": "Nilai-nilai Pancasila mengajarkan tentang kejujuran, kesederhanaan, keadilan, dan kebersamaan yang dapat membentuk karakter bangsa yang berkualitas. Salah satu dampak jika seseorang memiliki sikap positif terhadap nilai tersebut dalam kehidupan bermasyarakat dan bernegara dalam jangka panjang adalah ….", "options": {"A": "Meningkatkan keberhasilan seseorang dalam suatu pertandingan", "B": "Meningkatkan rasa saling menghargai dan toleransi antarmasyarakat", "C": "Membentuk kepribadian bangsa yang kuat dan berakhlak mulia", "D": "Meningkatkan kedaulatan dan kesejahteraan bangsa Indonesia", "E": "Menciptakan masyarakat yang menjunjung tinggi kemanusiaan"}, "answer": "C"}, {"number": 212, "type": "single", "text": "Dalam konteks masyarakat madani, partisipasi politik yang aktif dan sehat sangat penting untuk menciptakan tata kelola yang baik. Pernyataan ini menggambarkan peran budaya demokrasi dalam masyarakat madani. Manfaat utama dari budaya tersebut dalam mewujudkan masyarakat madani adalah ….", "options": {"A": "Menyediakan mekanisme untuk menyampaikan keluhan masyarakat kepada pemerintah", "B": "Mendorong masyarakat untuk tunduk pada keputusan pemerintah agar suasana kondusif", "C": "Menciptakan lingkungan yang kondusif bagi interaksi antarbudaya agar demokrasi berjalan baik", "D": "Memfasilitasi pembentukan komunitas politik yang saling menghormati dan bekerja sama", "E": "Menjamin hak individu untuk mengekspresikan diri secara bebas dan tanpa batasan"}, "answer": "D"}, {"number": 213, "type": "single", "text": "Dalam suatu negara, terdapat beberapa kelompok masyarakat yang memiliki perbedaan pandangan dan kepentingan dalam memilih pemimpin pada suatu pemilihan umum. Bagaimana budaya demokrasi dapat membantu mengatasi konflik dan meningkatkan partisipasi politik warga negara?", "options": {"A": "Membatasi kebebasan berpendapat sehingga tidak timbul konflik", "B": "Mengabaikan perbedaan pandangan dan kepentingan masyarakat", "C": "Memperkuat kekuasaan pemerintahan atas masyarakat", "D": "Meningkatkan keterbukaan masyarakat terhadap budaya asing", "E": "Membudayakan sikap saling menghargai dan toleransi dalam masyarakat"}, "answer": "E"}, {"number": 214, "type": "single", "text": "Dalam pertempuran Surabaya, banyak pejuang yang gugur pada tanggal 10 November 1945. Semangat kebangsaan para pejuang saat itu sangat tinggi, karena mereka ingin...", "options": {"A": "Mendapatkan keuntungan ekonomi dari hasil perjuangan", "B": "Mengambilalih posisi politik yang dikuasai Belanda untuk di kuasai Indonesia", "C": "Menggantikan kekuasaan para kolaborator yang mendukung Belanda", "D": "Memiliki pemimpin yang baru setelah kemenangan melawan Belanda", "E": "Membuktikan eksistensi dan keberanian bangsa Indonesia dalam melawan penjajah"}, "answer": "E"}, {"number": 215, "type": "single", "text": "Selama masa berlakunya UUDS 1950, sistem pemerintahan di Indonesia mengalami berbagai permasalahan. Salah satu faktor yang mendorong adanya perubahan dari sistem parlementer ke sistem presidensial adalah...", "options": {"A": "Keinginan untuk mengadopsi sistem pemerintahan yang lebih berkeadilan", "B": "Perubahan dalam konstitusi yang memperkuat kekuasaan presiden", "C": "Adanya desakan dari pihak asing untuk mengubah sistem pemerintahan", "D": "Seringnya pergantian pemerintahan yang menghambat pembangunan", "E": "Keinginan untuk membatasi peran pemerintah pusat terhadap masyarakat"}, "answer": "D"}, {"number": 216, "type": "single", "text": "Perubahan sistem pemerintahan dari era Orde Lama, Orde Baru, hingga Orde Reformasi telah membawa perubahan signifikan dalam praktik demokrasi di Indonesia. Salah satu karakteristik utama demokrasi pada era Orde Reformasi adalah...", "options": {"A": "Partisipasi politik yang lebih luas dan inklusif dari masyarakat", "B": "Adanya dukungan internasional yang lebih besar terhadap Indonesia", "C": "Peningkatan kebijakan ekonomi yang mendukung rakyat", "D": "Pembentukan lembaga-lembaga pengawasan untuk mencegah korupsi", "E": "Adanya pembatasan jumlah partai politik yang berpartisipasi dalam pemilu"}, "answer": "A"}, {"number": 217, "type": "single", "text": "Perubahan sistem pemerintahan di Indonesia dari era Orde Lama hingga Orde Reformasi menghasilkan perbedaan dalam praktik demokrasi, terutama dalam hubungan antara legislatif dan eksekutif. Salah satu perbedaan perilaku demokratis antara kedua era ini adalah .…", "options": {"A": "Peningkatan transparansi dalam proses pengambilan keputusan", "B": "Perubahan sistem pemerintahan dari parlementer ke presidensial", "C": "Adanya kebijakan yang lebih mengutamakan kepentingan ekonomi", "D": "Peningkatan kebebasan pers dan kebebasan berbicara", "E": "Adanya keterlibatan militer yang lebih besar dalam politik"}, "answer": "A"}, {"number": 218, "type": "single", "text": "Perubahan demokrasi di Indonesia dari masa Orde Baru ke Orde Reformasi dipengaruhi oleh berbagai faktor. Salah satu faktor utama yang mendorong perubahan ini adalah .…", "options": {"A": "Tuntutan akan keterbukaan dan transparansi dalam pemerintahan", "B": "Keinginan untuk mengurangi korupsi dan penyalahgunaan kekuasaan", "C": "Adanya gerakan untuk mengurangi peran militer dalam pemerintahan", "D": "Perlunya meningkatkan keadilan sosial dan kesetaraan ekonomi", "E": "Desakan untuk menciptakan sistem politik yang lebih inklusif dan partisipatif"}, "answer": "B"}, {"number": 219, "type": "single", "text": "Remaja di era modern memiliki akses mudah ke informasi dan hiburan. Banyak dari mereka mengikuti tren dan gaya hidup yang dipopulerkan oleh selebriti dan influencer, seperti mengonsumsi makanan cepat saji, mengikuti mode terbaru, dan menggunakan produk kecantikan mahal. Hal ini menimbulkan dampak negatif terutama terkait rasa kebangsaan, salah satunya adalah ....", "options": {"A": "Mudahnya terpapar konten radikal atau ekstrem dari luar", "B": "Kurang tolerannya terhadap perbedaan dan keragaman buadaya", "C": "Remaja cenderung hidup hedonistik dan mengabaikan nilai budaya lokal", "D": "Menyempitkan pandangan tentang suatu suku bangsa tertentu", "E": "Menjadi lebih individualis dan tidak mau bersosialisasi dengan orang lain"}, "answer": "C"}, {"number": 220, "type": "single", "text": "Perhatikan pernyataan-pernyataan berikut. (1) Kemudahan akses informasi politik global (2) P eningkatan keanekaragaman budaya politik (3) Terbentuknya aliansi antarnegara untuk menghadapi ancaman bersama (4) Munculnya konflik internal antara kelompok politik dalam negeri (5) Terbentuknya koalisi global untuk menangani isu-isu internasional Dampak globalisasi di bidang politik ditunjukkan oleh nomor ....", "options": {"A": "(1), (2), dan (3)", "B": "(1), (2), dan (5)", "C": "(1), (3), dan (5)", "D": "(2), (3), dan (4)", "E": "(2), (4), dan (5)"}, "answer": "C"}, {"number": 221, "type": "single", "text": "Dalam menghadapi ancaman integrasi nasional yang disebabkan oleh propaganda politik luar negeri, langkah yang tepat untuk mengatasinya adalah ....", "options": {"A": "Memperkuat aparat khusus anti teror dalam mencegah dan menindak aksi terorisme", "B": "Menanamkan sikap tenggang rasa dalam kehidupan berbangsa dan bernegara", "C": "Meningkatkan rasa nasionalisme dan menguatkan konsep Bhinneka Tunggal Ika", "D": "Memperkuat produksi dalam negeri sehingga perekonomian rakyat meningkat", "E": "Mengamalkan nilai-nilai Pancasila dalam kehidupan sehari-hari"}, "answer": "C"}, {"number": 222, "type": "single", "text": "Seorang karyawan mengambil barang milik kantor untuk kepentingan pribadi tanpa seizin atasan. Perbedaan antara norma hukum dan norma kesusilaan berdasarkan kasus tersebut adalah ....", "options": {"A": "dalam norma hukum karyawan dihukum sesuai undang-undang, sedangkan pada norma kesusilaan karyawan dibiarkan", "B": "karyawan dalam norma hukum dilakukan pemecatan, sedangkan dalam norma kesusilaan karyawan tersebut dikucilkan oleh teman kantornya", "C": "karyawan dalam norma hukum bisa mengelabui atasan, sedangkan dalam norma kesusilaan atasan tidak bisa dibohongi oleh karyawan", "D": "dalam norma hukum mengambil barang kantor merupakan perbuatan berdosa, sedangkan dalam norma kesusilaan karyawan merasa berdosa atau tidak", "E": "karyawan berdasarkan norma hukum akan mendapatkan sanksi, sedangkan dalam norma kesusilaan sanksi diserahkan kepada masyarakat"}, "answer": "B"}, {"number": 223, "type": "single", "text": "Seorang pejalan kaki melintasi jalan raya tanpa menggunakan zebra cross. Akibatnya, ia nyaris tertabrak oleh sepeda motor yang melaju kencang. Berdasarkan ilustrasi ini, hukum memiliki arti penting yaitu untuk ....", "options": {"A": "Mendahulukan kepentingan warga daripada kepentingan pribadi", "B": "Membatasi ruang gerak masyarakat agar tidak semaunya", "C": "Menjamin warga negara untuk bersikap taat pada aturan pemerintah", "D": "Menjaga keamanan dan keselamatan bagi setiap warga negara", "E": "Menjaga ketertiban dan keamanan bagi setiap warga negara"}, "answer": "D"}, {"number": 224, "type": "single", "text": "Manusia memerlukan makan untuk dapat bertahan hidup, alasannya adalah masakan merupakan bahan bakar kalori (energi) bagi tubuh untuk bisa melaksanakan fungsinya dengan baik. Nilai yang terkandung dalam situasi tersebut adalah ….", "options": {"A": "Keindahan", "B": "Kerohanian", "C": "Vital", "D": "Kebenaran", "E": "Material"}, "answer": "E"}, {"number": 225, "type": "single", "text": "Pada hakikatnya Pancasila tidak dapat dipisahkan dengan Pembukaan UUD NRI Tahun 1945, yang mencerminkan cita-cita dan dasar negara Indonesia. Secara praksis, hubungan antara keduanya dijelaskan sebagai berikut ….", "options": {"A": "Pancasila merupakan landasan konstitusional yang diturunkan dari Pembukaan UUD NRI Tahun 1945", "B": "P nekaragaman yang tumbuh dan berkembang di masyarakat", "D": "Memperkuat produksi dalam negeri sehingga perekonomian rakyat meningkat", "E": "Menanamkan sikap tenggang rasa sesama manusia dalam kehidupan berbangsa dan bernegara"}, "answer": "A"}, {"number": 229, "type": "single", "text": "Seorang siswa mengambil buku milik temannya tanpa izin. Perbedaan antara norma hukum dan norma kesusilaan dikaitkan dengan kondisi tersebut adalah ....", "options": {"A": "dalam norma hukum siswa dihukum sesuai undang-undang, sedangkan pada norma kesusilaan siswa dibiarkan", "B": "siswa berdasarkan norma hukum akan mendapatkan sanksi, sedangkan dalam norma kesusilaan sanksi diserahkan kepada guru atau wali kelas", "C": "siswa dalam norma hukum bisa mengelabui temannya, sedangkan dalam norma kesusilaan temannya tidak bisa dibohongi oleh siswa", "D": "dalam norma hukum mengambil buku teman dapat merugikan orang lain, sedangkan dalam norma kesusilaan merupakan perbuatan berdosa", "E": "siswa dalam norma hukum tidak dihukum, sedangkan dalam norma kesusilaan sanksinya berupa teguran dari teman atau rasa bersalah"}, "answer": "E"}, {"number": 230, "type": "single", "text": "Seorang pengendara mobil melaju dengan kecepatan tinggi di jalan yang padat, sehingga mengakibatkan kecelakaan lalu lintas. Dalam situasi ini, hukum memiliki arti penting yaitu untuk ....", "options": {"A": "Membatasi ruang gerak masyarakat agar tidak semaunya", "B": "Mendahulukan kepentingan warga daripada kepentingan pribadi", "C": "Menjamin warga negara untuk bersikap taat pada aturan pemerintah", "D": "Menjaga ketertiban dan kerukunan antar warga negara", "E": "Menjamin keamanan dan keselamatan warga negara"}, "answer": "E"}, {"number": 231, "type": "single", "text": "Perbedaan perilaku demokratis antara era Orde Lama dan Orde Reformasi terutama terlihat dalam hubungan antara legislatif dan eksekutif. Salah satu perbedaan tersebut adalah...", "options": {"A": "Keterbukaan yang lebih besar dalam proses pengambilan k  di Indonesia", "B": "Meningkatkan kemampuan Indonesia untuk menghadapi ancaman non-tradisional seperti terorisme dan perdagangan manusia", "C": "Memperoleh dukungan internasional dalam menghadapi bencana alam dan krisis kemanusiaan", "D": "Meningkatkan kerja sama dalam bidang keamanan pangan dan akses terhadap sumber daya alam", "E": "Mendorong kerja sama teknologi dan pengetahuan untuk mencapai pembangunan berkelanjutan"}, "answer": "C"}, {"number": 235, "type": "single", "text": "Selama pembelajaran Bahasa Indonesia, Arif, siswa kelas 9, diberi tugas untuk bekerja dalam kelompok dan membuat naskah drama. Namun, selama diskusi, Arif menghina temannya, Rani, hingga membuatnya menangis. Tindakan yang seharusnya diambil oleh guru adalah .…", "options": {"A": "Menyuruh Arif meninggalkan kelas agar tidak mengganggu kelompok", "B": "Melaporkan Arif kepada guru bimbingan dan konseling serta kepala sekolah", "C": "Melaporkan Arif ke piket untuk diberikan sanksi skors selama tiga hari", "D": "Meminta Arif minta maaf dan berjanji tidak mengulangi perbuatannya", "E": "Mencatat perbuatan Arif dalam buku catatan pelanggaran siswa"}, "answer": "D"}, {"number": 236, "type": "single", "text": "Pengawasan jalannya pemerintahan merupakan peran penting dalam sistem demokrasi di Indonesia karena ….", "options": {"A": "Memastikan efisiensi penggunaan anggaran negara", "B": "Mencegah penyalahgunaan wewenang oleh pejabat pemerintahan", "C": "Memastikan kebijakan pemerintah mencerminkan kepentingan rakyat", "D": "Menjaga stabilitas politik dan keamanan negara Indonesia", "E": "Mewujudkan akuntabilitas dalam penyelenggaraan pemerintahan"}, "answer": "E"}, {"number": 237, "type": "single", "text": "Dilakukannya transparansi dan kajian yang dilakukan pemerintah dalam proses menetapkan suatu kebijakan dapat memengaruhi bagaimana reaksi masyarakat. Reaksi yang mungkin terjadi pada masyarakat jika pemerintah tidak transparan dalam membuat kebijakan adalah ….", "options": {"A": "Meningkatnya rasa tidak percaya pada pemerintah dan lembaga negara", "B": "Berkurangnya partisipasi masyarakat dalam proses pengambilan keputusan", "C": "Menghilangnya rasa ketidakpuasan dan protes dari masyarakat", "D": "Berkurangnya stabilitas politik dan sosial dari pemerintahanan", "E": "Tumbuhnya korupsi dan nepotisme di dalam pemerintah dan institusi negara"}, "answer": "A"}, {"number": 238, "type": "single", "text": "Keterbukaan pemerintah dalam menyusun kebijakan yang dapat diakses oleh masyarakat sehingga terwujud pemerintah yang bersih, transparan, serta akuntabel sangat dibutuhkan dalam menjalankan pemerintahan. Bukti keterbukaan pemerintah dalam konteks menetapkan kebijakan adalah …", "options": {"A": "Dokumen yang dihasilkan terkait kebijakan tersimpan dengan baik", "B": "Proses pembuatan kebijakan dilakukan secara terbuka dan transparan", "C": "Komunikasi yang intensif antar lembaga pemerintah terkait kebijakan", "D": "Diberikannya akses publik terhadap informasi terkait kebijakan yang disusun", "E": "Kesempatan luas bagi masyarakat untuk mengelola keuangan dan aset negara"}, "answer": "D"}, {"number": 239, "type": "single", "text": "Kebebasan pers merupakan salah satu aspek penting dalam demokrasi. Pers yang bebas memastikan adanya transparansi dalam pemerintahan serta mengawasi penyalahgunaan kekuasaan. Peran kebebasan pers dalam demokrasi terkait dengan ….", "options": {"A": "Memengaruhi opini publik melalui pemberitaan yang seimbang", "B": "Melaporkan berita sesuai dengan fakta dan data yang akurat", "C": "Memberikan kesempatan kepada masyarakat untuk menyampaikan aspirasi", "D": "Mengawasi jalannya pemerintahan dan membantu pencegahan korupsi", "E": "Melindungi kepentingan publik dari kebijakan yang merugikan"}, "answer": "D"}, {"number": 240, "type": "single", "text": "Organisasi internasional memungkinkan negara-negara untuk bekerja sama dalam berbagai bidang, termasuk kemanusiaan. Manfaat keikutsertaan Indonesia dalam organisasi internasional dalam konteks kemanusiaan dapat dilihat melalui .…", "options": {"A": "Peningkatan kerja sama dalam penanganan bencana alam dan krisis kemanusiaan", "B": "Kolaborasi dalam mengurangi kemiskinan dan meningkatkan kualitas hidup masyarakat", "C": "Dukungan internasional dalam upaya pengentasan kemiskinan dan ketidaksetaraan", "D": "Pertukaran pengetahuan dan sumber daya dalam bidang kesehatan dan pendidikan", "E": "Kerja sama dalam perlindungan hak asasi manusia dan pemberdayaan masyarakat sipil"}, "answer": "A"}, {"number": 241, "type": "single", "text": "Rahmat, seorang siswa kelas 9, sedang berpartisipasi dalam proyek kelompok membuat poster ilmiah. Ketika berdiskusi dengan kelompoknya, Rahmat menghina Lisa sampai dia menangis. Perilaku Rahmat tersebut diketahui oleh Pak Haris. Sanksi yang tepat untuk diberikan kepada Rahmat adalah ....", "options": {"A": "Memberikan peringatan keras sehingga jera dan agar tidak mengulangi perbuatan tersebut", "B": "Memberikan tugas tambahan untuk mengembangkan empati dan toleransi dari dirinya", "C": "Melaporkan perbuatan Rahmat kepada orang tua dan meminta dukungan untuk koreksi perilaku", "D": "Meminta Rahmat meminta maaf kepada Lisa dan berjanji tidak akan mengulangi perbuatan tersebut", "E": "Mencatat perbuatan Rahmat dalam catatan pelanggaran dan melakukan evaluasi perilaku secara berkala"}, "answer": "D"}, {"number": 242, "type": "single", "text": "Balapan liar kerap menjadi kegiatan hiburan bagi beberapa remaja yang dilakukan di jalan raya tanpa mempertimbangkan keselamatan diri dan orang lain. Untuk mengatasi masalah ini, pemerintah dan masyarakat perlu bekerja sama, salah satu langkah yang bisa dilakukan adalah .…", "options": {"A": "Mendirikan tempat hiburan alternatif yang aman dan terkontrol untuk remaja", "B": "Menghukum remaja yang tertangkap balapan liar dengan sanksi yang lebih ringan", "C": "Mengizinkan balapan liar pada waktu-waktu tertentu agar lebih teratur", "D": "Menyediakan lintasan balap resmi hanya untuk balapan yang sudah gan kepribadiannya.", "D": "Seorang guru memberikan nilai yang rendah kepada muridnya karena tidak menyukai perilakunya.", "E": "Seorang atlet berprestasi berlatih keras untuk mengejar impian dan memenuhi ekspektasi orang tua."}, "answer": "A"}, {"number": 247, "type": "single", "text": "Latar belakang suatu negara menentukan asas kewarganegaraan yang berlaku bagi warga negaranya ialah untuk memberikan kepastian hukum bagi warga negaranya. Bagaimana penjelasan untuk pernyataan tersebut?", "options": {"A": "Asas kewarganegaraan menentukan siapa yang berhak atas hak dan kewajiban warga negara", "B": "Asas kewarganegaraan menentukan kebebasan untuk berbicara dan berpendapat bagi warga negara", "C": "Asas kewarganegaraan menentukan hak orang asing untuk tinggal di negara tersebut", "D": "Asas kewarganegaraan menentukan hak warga negara untuk menentukan pemimpin negara", "E": "Asas kewarganegaraan menentukan hak warga negara untuk bepergian ke luar negeri"}, "answer": "A"}, {"number": 248, "type": "single", "text": "Globalisasi membawa pengaruh budaya asing yang dapat menggeser identitas budaya lokal dan menghilangkan ciri khas budaya Indonesia. Hal ini bisa menyebabkan kehilangan keunikan budaya Indonesia dan bisa mengancam keberadaan kebudayaan Indonesia di masa depan. Dampak positif jika seseorang dapat menjaga kebudayaan lokal dalam menghadapi globalisasi adalah ….", "options": {"A": "Meningkatkan identitas dan kesadaran budaya pada masyarakat", "B": "Meningkatkan popularitas budaya lokal di kancah dunia", "C": "Memperkuat parktik budaya lokal pada suatu daerah", "D": "Menjaga tradisi agar tetap asli dengan menolak budaya luar", "E": "Menggabungkan kebudayaan luar dengan kebudayaan lokal"}, "answer": "A"}, {"number": 249, "type": "single", "text": "Nilai Pancasila keadilan sosial menegaskan bahwa semua warga negara Indonesia harus merasakan keadilan yang sama baik dalam hal ekonomi, politik, maupun hukum. Manfaat memiliki sikap positif terhadap nilai-nilai Pancasila tersebut adalah ….", "options": {"A": "Meningkatkan kualitas hidup dan kesejahteraan warga negaranya", "B": "Memperkuat keberagaman dalam masyarakat sehingga harmonis", "C": "Mampu beradaptasi dengan lingkungan sosial yang berbeda-beda", "D": "Meningkatkan perasaan kedaerahan yang tinggi saat berinteraksi dengan warga lainnya", "E": "Membentuk karakter warga negaranya menjadi lebih bersikap tenggang rasa"}, "answer": "A"}, {"number": 250, "type": "single", "text": "Tindakan yang paling tepat dilakukan oleh masyarakat guna memperkuat penegakan hukum yang adil di Indonesia yaitu ….", "options": {"A": "Memprotes setiap putusan pengadilan yang dianggap tidak adil", "B": "Mengancam dan memaksa aparat hukum yang dianggap tidak adil", "C": "Mengajukan keberatan terhadap keputusan hukum yang di anggap tidak adil", "D": "Melakukan tindakan kekerasan terhadap pihak yang dianggap melanggar hukum", "E": "Menyebarkan informasi yang dapat merugikan institusi hukum dan pihak tertentu"}, "answer": "C"}, {"number": 251, "type": "single", "text": "Dalam masa digital yang cepat, penyebaran informasi menjadi sangat mudah, termasuk berita bohong. Oleh karena itu, kita perlu melakukan pemeriksaan kebenaran terhadap suatu berita sebelum mempercayainya dan membagikannya kepada orang lain. Apa saja langkah-langkah yang bisa diambil untuk memeriksa kebenaran sebuah berita?", "options": {"A": "Menyebarluaskan suatu berita tanpa memeriksa kebenarannya terlebih dahulu karena merasa informasi itu sangat penting untuk dibagikan.", "B": "Mengkonfirmasi keakuratan suatu berita dengan membagikannya kepada keluarga atau teman.", "C": "Menyebarluaskan suatu berita di media sosial tanpa melakukan verifikasi karena berita tersebut telah menyebar luas oleh orang lain.", "D": "Hanya membaca judul suatu berita sebagai cara untuk memeriksa kebenarannya dan langsung mempercayainya karena sudah terbiasa dengan media tersebut.", "E": "Mengecek keaslian suatu berita dengan mencari informasi tambahan dari sumbersumber yang terpercaya."}, "answer": "E"}, {"number": 252, "type": "single", "text": "Seorang atlet asing berhasil meraih medali emas pada ajang olahraga internasional yang diselenggarakan di Indonesia. Atas jasa-jasanya tersebut, Presiden dapat memberikan kewarganegaraan Republik Indonesia kepada atlet tersebut. Menurut Pasal 20 UU No. 12 Tahun 2006 tentang Kewarganegaraan, pemberian kewarganegaraan tersebut tidak dapat dilakukan apabila ...", "options": {"A": "atlet asing yang bersangkutan memilih kewarganegaraan lain atas kemauannya sendiri.", "B": "atlet asing yang bersangkutan menjadi memiliki kewarganegaraan ganda.", "C": "atlet yang bersangkutan terbukti pernah melakukan doping di luar negeri.", "D": "atlet yang bersangkutan pernah terlibat dalam aksi kejahatan di Indonesia.", "E": "atlet yang bersangkutan terbukti tidak memiliki kemampuan yang dibutuhkan oleh Indonesia."}, "answer": "B"}, {"number": 253, "type": "single", "text": "Contoh penerapan sila keadilan sosial babgi seluruh rakyat Indonesia dalam kehidupan antara lain membangun kebijakan ekonomi yang adil dan merata untuk seluruh rakyat Indonesia. Bukti bahwa Pancasila merupakan ideologi terbuka terkait dengan penerapan nilai tersebut adalah .…", "options": {"A": "Nilai-nilai yang berkembang di masyarakat sebagai rujukan merubah nilai-nilai dalam Pancasila", "B": "Nilai-nilainya merupakan tuntutan konkret, operasional, dan mutlak yang tidak dapat ditafsirkan", "C": "Nilai-nilai Pancasila terbuka terhadap perkembangan nilai-nilai sosial kemasyarakatan", "D": "Nilai-nilai yang ada di masyarakat selalu mendapat tempat dalam ideologi Pancasila", "E": "Isi dari nilai-nilai Pancasila merupakan bagian dari hasil interaksi dengan ideologi lain"}, "answer": "C"}, {"number": 254, "type": "single", "text": "Pancasila merupakan dasar dan ideologi negara Indonesia yang dipercaya dapat menjaga keharmonisan dalam kehidupan berbangsa. Pancasila sebagai ideologi negara dapat menciptakan keharmonisan di antara masyara E": "Agama"}, "answer": "C"}, {"number": 261, "type": "single", "text": "Perkembangan IPTEK juga telah memungkinkan masyarakat untuk mengakses dan menjelajahi budaya dari seluruh dunia melalui teknologi. Misalnya, sebuah platform yang memungkinkan pengguna untuk menjelajahi karya seni, artefak, dan pengetahuan budaya dari berbagai museum dan institusi di seluruh dunia. Dengan demikian, individu yang sebelumnya tidak memiliki akses ke sumber daya budaya ini dapat belajar dan menghargai warisan budaya yang beragam. Dalam konteks ini, perkembangan IPTEK tersebut termasuk dalam bidang ....", "options": {"A": "Komunikasi", "B": "Pendidikan", "C": "Politik", "D": "Pertahanan dan keamanan", "E": "Sosial budaya"}, "answer": "E"}, {"number": 262, "type": "single", "text": "alam era digital yang sangat cepat, penting untuk memeriksa kebenaran sebuah berita sebelum mempercayainya dan membagikannya ke orang lain. Bagaimana cara memeriksa kebenaran sebuah berita dalam era digital yang memungkinkan penyebaran informasi yang sangat cepat?", "options": {"A": "Memeriksa kebenaran berita dengan meneruskannya ke teman atau keluarga sebagai bentuk konfirmasi.", "B": "Membagikan berita tanpa memeriksa kebenarannya terlebih dahulu karena merasa informasi tersebut penting untuk disebarkan.", "C": "Memeriksa kebenaran berita dengan mengecek sumber berita dan mencari informasi tambahan dari sumber-sumber terpercaya.", "D": "Menyebarluaskan berita ke media sosial tanpa verifikasi karena berita tersebut sudah banyak disebarkan oleh orang lain.", "E": "Memeriksa kebenaran berita hanya dari judul berita dan langsung mempercayainya karena sudah terbiasa dengan media tersebut."}, "answer": "C"}, {"number": 263, "type": "single", "text": "Menurut Pasal 4 UU No. 12 Tahun 2006 tentang Kewarganegaraan, siapa saja yang dapat dikatakan berstatus sebagai warga negara Indonesia?", "options": {"A": "Orang yang lahir di Indonesia dari orang tua yang berstatus warga negara Indonesia (WNI)", "B": "Orang yang asyarakat Indonesia", "D": "Elitis yang hanya dapat dimengerti oleh golongan tertentu saja dan sebagian masyarakat", "E": "Subjektif yang tidak mempertimbangkan pandangan masyarakat secara umum"}, "answer": "C"}, {"number": 269, "type": "single", "text": "Dika, siswa kelas 9, sedang mengerjakan proyek kelompok untuk menulis esai dalam Bahasa Jerman. Saat berdiskusi, Dika mengejek Rina hingga ia menangis. Perbuatan Dika diketahui oleh Pak Anton. Sanksi yang tepat untuk Dika adalah .…", "options": {"A": "Diberikan tugas refleksi tentang pentingnya menghargai perasaan orang lain agar jera", "B": "Diberikan sanksi sosial dengan mengekspos perbuatannya di kelas agar tidak diikuti siswa lain", "C": "Dilaporkan kepada komite sekolah untuk dilakukan tindakan lebih lanjut agar tidak diulangi lagi", "D": "Dika meminta maaf kepada Rina dan berjanji tidak akan mengulangi perbuatan tersebut.", "E": "Mencatat perbuatan Dika dalam catatan pelanggaran siswa dan melakukan evaluasi perilaku secara berkala"}, "answer": "D"}, {"number": 270, "type": "single", "text": "Di beberapa daerah, balapan liar menjadi fenomena yang mengkhawatirkan, terutama di kalangan remaja. Selain membahayakan keselamatan mereka, balapan liar juga mengganggu ketertiban umum. Salah satu upaya yang bisa dilakukan untuk mencegah kegiatan ini adalah .…", "options": {"A": "Membatasi jumlah kendaraan yang diizinkan beroperasi pada malam hari", "B": "Menambah patroli kepolisian di daerah yang rawan balapan liar", "C": "Menyediakan kegiatan positif untuk mengalihkan minat negatif remaja", "D": "Menjatuhkan sanksi berupa penyitaan kendaraan bermotor yang melakukan balap liar", "E": "Mengadakan kampanye kesadaran tentang bahaya balapan liar secara rutin"}, "answer": "C"}, {"number": 271, "type": "single", "text": "Si \"A\" mulai tertarik pada tren fashion dan gaya hidup setelah menjadi penggemar artis film dan sinetron terkenal. Meskipun orang tuanya mengingatkan untuk tidak berlebihan dan berasal dari keluarga yang kurang mampu, Si \"A\" tetap mengikuti tren tersebut. Dalam konteks ini, agen sosialisasi yang paling memengaruhi perilaku Si \" A\" adalah .…", "options": {"A": "Eksposur terhadap media massa", "B": "Sistem pendidikan", "C": "Nilai-nilai keluarga", "D": "Interaksi dengan teman-teman sebaya", "E": "Kebiasaan dan tradisi masyarakat"}, "answer": "A"}, {"number": 272, "type": "single", "text": "Seperti yang disebutkan dalam contoh kasus sosial budaya, media sosial juga merupakan contoh perkembangan IPTEK. Media sosisal memungkinkan individu untuk terhubung dengan orang lain, berbagi pemikiran dan ide, serta berpartisipasi dalam diskusi global. Media sosial juga telah memengaruhi cara perusahaan dan organisasi berhubungan dengan khalayak mereka. Dalam konteks ini, perkembangan IPTEK termasuk dalam bidang .…", "options": {"A": "Pendidikan", "B": "Komunikasi", "C": "Pertahanan dan keamanan", "D": "Politik", "E": "Sosial budaya"}, "answer": "B"}, {"number": 273, "type": "single", "text": "Kemajuan teknologi memungkinkan remaja untuk terus terhubung dengan teman dan keluarga melalui internet. Namun, kecanduan internet dan media sosial dapat menimbulkan dampak negatif terutama terkait rasa kebangsaan, salah satunya adalah ....", "options": {"A": "Memicu terjadinya penyalahgunaan informasi pribadi", "B": "Menyempitkan pandangan tentang suatu suku bangsa tertentu", "C": "Membuat remaja menjadi kurang peduli terhadap lingkungan", "D": "Lebih mementingkan popularitas daripada prestasi akademik", "E": "Berkurangnya toleransi terhadap perbedaan dan keragaman bangsa"}, "answer": "E"}, {"number": 274, "type": "single", "text": "Perhatikan pernyataan-pernyataan berikut! (1) Menumbuhkan rasa chouvinisme kedaerahan (2) Mempermudah kolaborasi antarnegara dalam menangani isu global (3) Menyebabkan hilangnya identitas politik nasional (4) Mendorong dialog dan kerjasama antarnegara (5) Menimbulkan banyaknya partai politik peserta pemilu Dampak globalisasi di bidang politik ditunjukkan oleh n gi Indonesia menganut bentuk pemerintahan tersebut adalah .…", "options": {"A": "Dianggap mampu memberikan stabilitas politik yang lebih baik, khususnya pada masa awal kemerdekaan", "B": "Indonesia mengikuti negara-negara sekutu yang menganut bentuk pemerintahan republik", "C": "Kondisi demografis penduduk Indonesia cocok menggunakan bentuk pemerintahan republik", "D": "Indonesia ingin menerapkan bentuk pemerintahan yang berbeda dengan negaranegara Asia lainnya", "E": "Kondisi goegrafis dan sosial politik Indonesia mendukung penggunaan bentuk pemerintahan republik"}, "answer": "A"}, {"number": 278, "type": "single", "text": "Keterbukaan informasi mengenai kebijakan pemerintah dapat mengurangi kemungkinan terjadinya tindakan korupsi atau penyalahgunaan wewenang. Salah satu bukti kebijakan pemerintah yang mencerminkan keterbukaan dalam menyusun kebijakan adalah ….", "options": {"A": "dipublikasikannya pelaporan kinerja program pemerintah melalui media sosial yang disediakan oleh lembaga pemerintahan", "B": "diberikannya kesempatan bagi masyarakat untuk mengelola keuangan dan barang milik negara", "C": "diserahkannya beberapa posisi penting dalam instansi pemerintah kepada perwakilan masyarakat", "D": "menyerahkan keputusan terkait penetapan kebijakan kepada tokoh masyarakat yang dianggap menjadi panutan", "E": "dibukanya ruang partisipasi dan akses informasi publik dalam proses perumusan kebijakan pemerintah"}, "answer": "A"}, {"number": 279, "type": "single", "text": "Arief, seorang siswa kelas 9, sedang bekerja dalam kelompok untuk membuat presentasi Bahasa Inggris. Selama diskusi, Arief mengolok-olok Indah hingga ia menangis. Perbuatan Arief diketahui oleh Bu Sari. Sanksi yang tepat untuk Arief adalah .…", "options": {"A": "Ditegur dan diminta untuk merenungkan dampak dari perbuatannya terhadap pertemanannya", "B": "Dilaporkan kepada wali kelas dan orang tua agar mereka turut membantu memperbaiki sikap Arief", "C": "Diharuskan mengikuti kelas pengembangan karakter untuk memperbaiki perilaku", "D": "Meminta Arief meminta maaf kepada Indah dan menegaskan untuk tidak mengulangi perbuatan tersebut", "E": "Mencatat perbuatan Arief dalam catatan pelanggaran siswa dan melakukan evaluasi perilaku secara berkala"}, "answer": "D"}, {"number": 280, "type": "single", "text": "Di era global saat ini, masyarakat Indonesia semakin mudah mendapatkan barangbarang impor dari berbagai negara. Namun sebagai konsumen yang baik, warga negara Indonesia seharusnya memiliki sikap yang baik dalam memilih barang impor. Sikap tersebut adalah ….", "options": {"A": "Selalu memilih barang impor yang lebih murah dibandingkan dengan barang dalam negeri untuk membantu menghemat pengeluaran", "B": "Tidak memilih barang impor sama sekali agar produk dalam negeri tetap dapat bersaing", "C": "Selalu memilih barang impor yang populer di kalangan masyarakat dunia tanpa mempertimbangkan asal produk", "D": "Memilih barang impor yang berkualitas tinggi dan memenuhi standar keamanan serta lingkungan yang diatur oleh pemerintah", "E": "Membeli barang impor secara sembarangan tanpa mempertimbangkan dampak ekonomi dan sosial bagi industri dalam negeri"}, "answer": "D"}, {"number": 281, "type": "single", "text": "Dalam menghadapi era globalisasi, nilai-nilai Pancasila diimplementasikan untuk memastikan pembangunan yang inklusif dan berkelanjutan di Indonesia. Upaya yang paling sesuai dengan penerapan nilai-nilai Pancasila tersebut adalah ….", "options": {"A": "Menghargai dan melindungi keberagaman budaya dan agama yang ada di Indonesia", "B": "Mendorong pertumbuhan ekonomi dengan memperhatikan pelestarian lingkungan dan distribusi kekayaan yang merata", "C": "Menerapkan sistem pendidikan yang menggabungkan pengetahuan global dan nilainilai budaya lokal", "D": "Memprioritaskan kebijakan proteksionis dan mengabaikan kerjasama internasional", "E": "Menjaga kedaulatan negara dengan membangun hubungan yang seimbang dan saling menguntungkan dengan negara-negara lain"}, "answer": "B"}, {"number": 282, "type": "single", "text": "Contoh penerapan sila persatuan Indonesia dalam kehidupan antara lain menghargai dan merayakan keragaman budaya dan suku bangsa Indonesia. Bukti bahwa Pancasila merupakan ideologi terbuka terkait dengan penerapan nilai tersebut adalah .…", "options": {"A": "Nilai-nilai Pancasila beradaptasi terhadap perkembangan nilai-nilai persatuan negara", "B": "Nilai-nilai yang berkembang di masyarakat sebagai rujukan merubah nilai-nilai dalam Pancasila", "C": "Isi dari nilai-nilai Pancasila merupakan bagian dari hasil interaksi dengan ideologi lain", "D": "Nilai-nilainya merupakan tuntutan konkret, operasional, dan mutlak yang tidak dapat ditafsirkan", "E": "Nilai-nilai yang ada di masyarakat selalu mendapat tempat dalam ideologi Pancasila"}, "answer": "A"}, {"number": 283, "type": "single", "text": "Pancasila merupakan dasar dan ideologi negara yang ditetapkan oleh para pendiri Bangsa Indonesia. Pancasila sebagai ideologi negara dapat membantu membangun karakter bangsa Indonesia dengan cara ….", "options": {"A": "Pemilihan presiden dilakukan melalui pemilihan umum oleh rakyat", "B": "Presiden dapat mengangkat menteri dengan persetujuan parlemen", "C": "Presiden berhak melakukan intervensi pada urusan legislatif dan yudikatif", "D": "Menteri bertanggung jawab kepada kekuasaan eksekutif dan legislatif", "E": "Kepala pemerintahan adalah presiden, wakil presiden, dan para Menteri"}, "answer": "D"}, {"number": 284, "type": "single", "text": "Presiden memberikan arahan kepada menteri untuk menyelesaikan permasalahan sosial seperti kemiskinan di Indonesia. Dalam kasus ini, presiden menjalankan kewenangannya sebagai ….", "options": {"A": "Kepala pemerintahan", "B": "Kepala negara", "C": "Pemegang kedaulatan rakyat", "D": "Panglima tertinggi TNI", "E": "Mandataris MPR"}, "answer": "A"}, {"number": 285, "type": "single", "text": "Perhatikan beberapa kewenangan Presiden berikut! 1) Mengangkat dan memberhentikan menteri. 2) Mengangkat duta dan konsul. 3) Memberi amnesti dengan pertimbangan dari M", "options": {"A": "(1), (2), (5)", "B": "(1), (2), (6)", "C": "(2), (3), (4)", "D": "(2), (3), (6)", "E": "(2), (4), (5)"}, "answer": "E"}, {"number": 286, "type": "single", "text": "Dalam sistem negara presidensial, presiden sebagai kepala eksekutif memiliki kedudukan yang sederajat dengan DPR sebagai pemegang kekuasaan legislatif, oleh karenanya Presiden tidak dapat membubarkan parlemen dan demikian sebaliknya. Berdasarkan uraian tersebut salah satu hubungan kerjasama antara Presiden dan DPR adalah .…", "options": {"A": "DPR mengajukan rancangan anggaran kepada presiden dan disetujui bersama-sama", "B": "Persetujuan kedua belah pihak diperlukan supaya rancangan anggaran bisa diberlakukan", "C": "Presiden beserta dengan DPR bersama-sama menyusun rancangan anggaran negara", "D": "Presiden mengajukan rancangan anggaran ke DPR untuk disetujui dan kemudian ditandatangan bersama-sama", "E": "Presiden dapat membuat rancangan undang-undang dan memberlakukan RUU tersebut tanpa persetujuan DPR"}, "answer": "B"}, {"number": 287, "type": "single", "text": "Bentuk pemerintahan yang dianut oleh Indonesia semenjak merdeka hingga saat ini adalah republik. Hal yang melatarbelakangi Indonesia menganut bentuk pemerintahan tersebut adalah .…", "options": {"A": "Kondisi demografis penduduk Indonesia cocok menggunakan bentuk pemerintahan republik", "B": "Mendukung prinsip demokrasi, yang mencakup kebebasan berpendapat, dan pemilihan umum yang adil", "C": "Indonesia sebagai negara baru berhak memilih bentuk pemerintahannya sendiri yang sesuai dengan kebutuhan", "D": "Kondisi goegrafis dan sosial politik Indonesia mendukung penggunaan bentuk pemerintahan republik", "E": "Bentuk pemerintahan dimana DPR sebagai perwakilan rakyat memiliki kekuasaan tertinggi dalam bernegara"}, "answer": "B"}, {"number": 288, "type": "single", "text": "Seluruh rakyat Indonesia memiliki hak untuk beragama sesuai kepercayaan dan keyakinan masingmasing
