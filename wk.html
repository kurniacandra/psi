n", "B": "Mengangkat langsung perwakilan masyarakat sebagai pegawai pemerintah", "C": "Memberikan akses publik terhadap informasi terkait kebijakan pemerintah", "D": "Berkomunikasi secara tertbuka dengan tokoh masyarakat yang berpengaruh", "E": "Memberikan informasi kepada masyarakat terkait data-data rahasia pemerintah"}, "answer": "C"}, {"number": 295, "type": "single", "text": "Pembangunan di bidang hukum juga dapat memberikan kepastian hukum bagi investor sehingga mereka dapat menanamkan modal dengan lebih percaya diri dan dapat mendorong pertumbuhan ekonomi. Upaya yang dapat dilakukan untuk meningkatkan kepastian hukum bagi investor dan mendorong pertumbuhan ekonomi adalah ….", "options": {"A": "Meningkatkan kualitas pengadilan", "B": "Meningkatkan transparansi pemerintah", "C": "Memperkuat lembaga-lembaga penegak hukum", "D": "Memperbaiki sistem peradilan pidana dan perdata", "E": "Mengembangkan mekanisme pengaduan publik"}, "answer": "B"}, {"number": 296, "type": "single", "text": "Masyarakat madani adalah masyarakat modern yang bercirikan demokratisasi dalam beriteraksi di masyarakat yang semakin plural dan heterogen. Dalam keadan seperti ini masyarakat diharapkan mampu mengorganisasi dirinya, dan tumbuh kesadaran diri dalam mewujudkan peradaban. Manfaat utama dari budaya demokrasi dalam menciptakan masyarakat madani tersebut adalah....", "options": {"A": "Menciptakan keadilan terutama terhadap kelompok minoritas", "B": "Mengurangi tindakan kekerasan dan konflik di masyarakat", "C": "Meningkatkan kesejahteraan sosial dan ekonomi di masyarakat", "D": "Mendorong terciptanya pelayanan masyarakat yang akuntabilitas", "E": "Meningkatkan partisipasi aktif masyarakat dalam kegiatan politik dan sosial"}, "answer": "E"}, {"number": 297, "type": "single", "text": "Masyarakat madani yang terbentuk dalam lingkungan yang demokratis akan menghasilkan warga negara yang lebih sadar akan hak dan kewajiban mereka. Salah satu manfaat budaya demokrasi dalam mewujudkan masyarakat madani adalah ….", "options": {"A": "Mengurangi perbedaan pendapat di antara masyarakat", "B": "Mewujudkan sistem pemerintahan yang lebih kuat dan tangguh", "C": "Menumbuhkan kesadaran masyarakat untuk ikut mengambil keputusan", "D": "Membatasi kebebasan berbicara demi menjaga keutuhan negara", "E": "Menghilangkan perbedaan antara masyarakat urban dan rural"}, "answer": "C"}, {"number": 298, "type": "single", "text": "terdapat beberapa pihak yang meragukan efektivitas sistem demokrasi dalam menyelesaikan permasalahan di suatu negara. Bagaimana budaya demokrasi dapat meningkatkan efektivitas pemerintahan dalam menjalankan tugasnya?", "options": {"A": "Dengan memperkuat kekuasaan pemerintahan atas masyarakat", "B": "Dengan membatasi akses informasi terkait tindakan pemerintah", "C": "Dengan meningkatkan partisipasi politik warga negara", "D": "Dengan meniadakan hak-hak individu dalam masyarakat", "E": "Dengan membudayakan sikap aktif dalam masyarakat"}, "answer": "C"}, {"number": 299, "type": "single", "text": "Pada masa perjuangan kemerdekaan Indonesia, tokoh-tokoh nasional memainkan peran penting dalam menggerakkan rakyat untuk melawan penjajah. Dalam konteks perjuangan arek-arek Suroboyo pada tanggal 10 November 1945, alasan yang mendorong mereka untuk berjuang termasuk dalam mewujudkan semangat kebangsaan adalah .…", "options": {"A": "Pengaruh tokoh-tokoh nasional dalam membangkitkan kesadaran rakyat", "B": "Keinginan untuk mendapatkan kekayaan dan kekuasaan dalam pemerintahan", "C": "Adanya tekanan dari pemerintah kolonial yang ingin menguasai Indonesia", "D": "Keinginan untuk menjalin hubungan diplomatik dengan Belanda", "E": "Ketakutan akan hukuman jika tidak bergabung dalam perjuangan"}, "answer": "A"}, {"number": 300, "type": "single", "text": "UUDS 1950 diberlakukan di Indonesia dari 17 Agustus 1950 hingga 5 Juli 1959. Selama periode 9 tahun ini, sistem pemerintahan berdasarkan sistem parlementer dengan penerapan demokrasi liberal. Namun, dengan Dekrit Presiden 5 Juli 1959, sistem pemerintahan beralih kembali ke sistem presidensial. Salah satu alasan yang mendasari penggunaan kembali sistem presidensial adalah ....", "options": {"A": "Adanya ketidakstabilan politik yang diakibatkan oleh sistem pemerintahan parlementer", "B": "Adanya keresahan di kalangan rakyat terhadap kinerja pemerintahan pada saat itu", "C": "Keinginan untuk memperkuat peran Presiden dalam sistem politik dan pemerintahan", "D": "Adanya ketidaksepakatan antara partai politik yang menyebabkan ketidakstabilan pemerintahan", "E": "Kurangnya koordinasi antara eksekutif dan legislatif dalam menjalankan pemerintahan"}, "answer": "A"}, {"number": 301, "type": "single", "text": "Perubahan sistem pemerintahan yang terjadi sepanjang era orde lama, orde baru, dan orde reformasi di Indonesia menciptakan dinamika yang berbeda dalam praktik demokrasi. Pada era orde reformasi, beberapa elemen demokrasi mengalami perubahan signifikan. Elemen demokrasi yang berkembang pada era orde reformasi mencakup ….", "options": {"A": "Adanya kontrol ketat pemerintah terhadap media massa", "B": "Pembentukan lembaga independen untuk mengawasi proses pemilu", "C": "Pembatasan jumlah partai politik yang bisa berpartisipasi dalam pemilu", "D": "Penekanan pada persatuan nasional dalam proses politik", "E": "Adanya kebijakan proteksionis dalam perekonomian"}, "answer": "B"}, {"number": 302, "type": "single", "text": "Era Orde Reformasi di Indonesia menandai perubahan signifikan dalam praktik demokrasi, terutama dalam hubungan antara legislatif dan eksekutif. Salah satu perbedaan perilaku demokratis pada masa Orde Reformasi jika dibandingkan dengan era Orde Lama adalah .…", "options": {"A": "Peran parlemen yang lebih besar dalam proses pengambilan keputusan politik", "B": "Adanya kebijakan yang lebih mengutamakan kepentingan sektor swasta", "C": "Peningkatan keterlibatan rakyat dalam proses politik secara aktif", "D": "Perubahan dalam sistem pemerintahan dari presidensial ke parlementer", "E": "Peningkatan keberpihakan pemerintah terhadap partai politik tertentu"}, "answer": "A"}, {"number": 303, "type": "single", "text": "Aspek yang menjadi alasan utama Pancasila ditetapkan sebagai ideologi terbuka dan membedakannya dari ideologi-ideologi tertutup karena ….", "options": {"A": "Pancasila menekankan pada pentingnya demokrasi tanpa mengakomodasi nilai-nilai budaya lokal", "B": "Pancasila menegaskan pentingnya otoritas pemerintah dalam mengambil kebijakan publik", "C": "Pancasila memiliki fleksibilitas dalam merespon perubahan sosial dan dinamika global", "D": "Pancasila hanya relevan bagi masyarakat Indonesia dan tidak dapat diterapkan pada negara lain", "E": "Pancasila menekankan pentingnya kekuasaan politik dan militer dalam menjaga keutuhan negara"}, "answer": "C"}, {"number": 304, "type": "single", "text": "Nilai-nilai Pancasila pada hakikatnya digali dari keberagaman bangsa Indonesia dan berakar pada budaya nasional masyarakat Indonesia. Bukti utama bahwa Pancasila merupakan refleksi dari budaya nasional Indonesia ….", "options": {"A": "Proses perumusan Pancasila melibatkan perwakilan dari berbagai suku dan budaya di Indonesia", "B": "Pancasila dijadikan sebagai dasar negara setelah melalui proses konsensus yang melibatkan berbagai golongan dan pemikiran", "C": "Nilai-nilai dalam Pancasila mencerminkan ajaran dan nilai-nilai yang dianut oleh masyarakat Indonesia, seperti gotong royong, kekeluargaan, dan musyawarah", "D": "Pancasila menjadi dasar dalam pembuatan UUD 1945, yang merupakan konstitusi pertama Republik Indonesia", "E": "Adanya peran serta masyarakat Indonesia dalam perjuangan kemerdekaan yang mencerminkan semangat persatuan dan kesatuan"}, "answer": "C"}, {"number": 305, "type": "single", "text": "Pancasila sebagai paradigma pembangunan nasional adalah suatu proses yang berkesinambungan yang melingkupi segala aspek kehidupan berbangsa, bermasyarakat, dan bernegara. Hambatan utama penerapan Pancasila dalam kondisi tersebut adalah ….", "options": {"A": "Terjadi konflik antarpemerintah pusat dan daerah mengenai pengelolaan sumber daya alam", "B": "Globalisasi membawa pengaruh budaya asing yang berpotensi menggoyahkan nilai-nilai Pancasila", "C": "Masyarakat tidak memiliki pemahaman yang cukup mengenai makna dan nilai-nilai Pancasila", "D": "Terjadi peningkatan radikalisme dan intoleransi yang mengancam persatuan dan kesatuan bangsa", "E": "Pembangunan ekonomi yang tidak merata menyebabkan diskriminasi dalam memperoleh pekerjaan"}, "answer": "C"}, {"number": 306, "type": "single", "text": "Bapak Andi, Kepala Desa Konoha, ingin memastikan bahwa nilai-nilai Pancasila tetap dipegang teguh oleh generasi muda desanya. Oleh karena itu, beliau menggagas sebuah program yang melibatkan para pemuda desa dalam membangun fasilitas umum dan kegiatan sosial lainnya. Tujuan utama dari kegiatan tersebut adalah ….", "options": {"A": "Meningkatkan kualitas infrastruktur di desa sehingga menjadi desa yang maju dan modern", "B": "Mempererat hubungan antara warga desa agar bersama-sama dapat menghilangkan perbedaan", "C": "Menanamkan nilai-nilai Pancasila pada generasi muda dalam kehidupan bermasyarakat", "D": "Meningkatkan keterampilan teknis generasi muda desa sehingga mampu bersaing di masyarakat", "E": "Mempromosikan desa tersebut sebagai destinasi wisata sehingga pertumbuhan ekonomi meningkat"}, "answer": "C"}, {"number": 307, "type": "single", "text": "Dampak dari Proklamasi Kemerdekaan Indonesia terhadap pergerakan kemerdekaan di Asia T enggara pada masa itu adalah ….", "options": {"A": "Memberikan inspirasi bagi pergerakan kemerdekaan di negara-negara Asia Tenggara lainnya untuk memperjuangkan kemerdekaannya", "B": "Tidak memiliki dampak signifikan karena pergerakan kemerdekaan di Asia T enggara lebih dipengaruhi oleh faktor ekonomi dan politik internasional", "C": "Menyebabkan ketegangan dan konflik di antara negara-negara Asia Tenggara yang berusaha merebut kemerdekaan mereka masing-masing", "D": "Menyebabkan terjadinya intervensi militer dari negara-negara asing yang ingin memengaruhi keadaan politik di Asia Tenggara", "E": "Tidak ada dampak karena pergerakan kemerdekaan di Asia T enggara saat itu belum mencapai momentum yang signifikan"}, "answer": "A"}, {"number": 308, "type": "single", "text": "Isu utama dalam perdebatan di Sidang PPKI pada tanggal 22 Agustus 1945 adalah ….", "options": {"A": "Penentuan status ibu kota Indonesia setelah merdeka", "B": "Sistem pemerintahan yang akan digunakan di Indonesia", "C": "Masalah keamanan dalam negeri setelah kemerdekaan", "D": "Kedaulatan Indonesia atas wilayah-wilayah bekas jajahan Belanda", "E": "Hubungan Indonesia dengan negara-negara tetangga"}, "answer": "B"}, {"number": 309, "type": "single", "text": "Setelah proklamasi kemerdekaan dikumandangkan, pada tanggal 18 Agustus 1945, PPKI membentuk panitia kecil yang bertugas menyusun naskah dasar negara yang kemudian dibahas dan disahkan pada sidang PPKI tanggal 18-22 Agustus 1945. Keterkaitan antara Proklamasi Kemerdekaan Indonesia dan Pembukaan UUD 1945 adalah ….", "options": {"A": "Proklamasi kemerdekaan Indonesia dilakukan sebelum UUD 1945 disusun sehingga tidak ada keterkaitan yang signifikan antara keduanya", "B": "Pembukaan UUD 1945 disusun setelah Proklamasi Kemerdekaan Indonesia untuk memberikan dasar hukum bagi kemerdekaan Indonesia", "C": "Pembukaan UUD 1945 disusun sebelum Proklamasi Kemerdekaan Indonesia dan menjadi landasan ideologis bagi perjuangan kemerdekaan", "D": "Proklamasi Kemerdekaan Indonesia dan pembukaan UUD 1945 merupakan dua hal yang terpisah dan tidak saling berkaitan", "E": "Proses pembentukan UUD 1945 dan Proklamasi Kemerdekaan Indonesia berjalan secara paralel dan saling mendukung satu sama lain"}, "answer": "B"}, {"number": 310, "type": "single", "text": "Kedudukan Pembukaan UUD Negara Republik Indonesia Tahun 1945 sangatlah penting dalam ketatanegaraan di negara Republik Indonesia. Bagaimana pembentukan sistem keamanan negara Indonesia berdasarkan Pembukaan UUD 1945 tersebut?", "options": {"A": "Berdasarkan pada prinsip-prinsip hak asasi manusia dan demokrasi", "B": "T erpusat pada satu institusi yang bertanggung jawab atas keamanan negara", "C": "Berdasarkan pada prinsip-prinsip hukum yang kuat dan adil", "D": "Dibentuk berdasarkan pada sistem politik yang dipilih oleh pemerintah", "E": "Tidak memengaruhi pembentukan sistem keamanan negara Indonesia"}, "answer": "C"}, {"number": 311, "type": "single", "text": "Wewenang presiden sebagai kepala pemerintahan yaitu ….", "options": {"A": "Menyatakan keadaan bahaya", "B": "Memberikan amnesti dan abolisi", "C": "Menetapkan kebijakan luar negeri", "D": "Menetapkan peraturan pemerintah", "E": "Membubarkan Dewan Perwakilan Rakyat"}, "answer": "D"}, {"number": 312, "type": "single", "text": "Berikut ini yang dimaksud dengan prinsip check and balancedalam sistem parlementer yaitu ….", "options": {"A": "menyediakan akun media sosial sebagai media komunikasi antara pemerintah dengan masyarakat", "B": "Kekuasaan dijalankan secara otoriter oleh eksekutif", "C": "Kekuasaan dibagi di antara beberapa lembaga pemerintahan", "D": "Lembaga pemerintahan saling mengawasi kekuasaan satu sama lain", "E": "Lembaga pemerintahan beroperasi secara terpisah tanpa pengawasan menjadi panutan"}, "answer": "D"}, {"number": 313, "type": "single", "text": "Dengan adanya pembangunan di bidang hukum, maka hukum dan aturan yang ada dapat ditegakkan secara adil dan setiap orang dapat memperoleh perlindungan hukum yang sama. Upaya yang dapat dilakukan untuk meningkatkan keamanan dan ketertiban masyarakat melalui pembangunan di bidang hukum adalah ….", "options": {"A": "Menguatkan sistem peradilan yang kuat dan efektif", "B": "Meningkatkan pembangunan infrastruktur sosial", "C": "Memperkuat lembaga-lembaga keamanan negara", "D": "Meningkatkan keterbukaan informasi publik tentang keamanan", "E": "Meningkatkan kesejahteraan sosial masyarakat"}, "answer": "A"}];
