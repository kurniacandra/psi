window.__SOAL_TEMPLATE_QUESTIONS = [{"number": 1,"text": "Kamu dan beberapa teman sedang belajar kelompok untuk ujian akhir. Salah satu teman tiba-tiba menunjukkan bocoran soal yang ia dapat dari kenalannya di sekolah. Teman-teman lain mulai berdiskusi apakah akan menggunakan bocoran itu atau tidak. Sebagian dari mereka merasa bahwa ini adalah kesempatan untuk mendapatkan nilai tinggi tanpa risiko, sementara yang lain ragu-ragu tetapi takut terlihat tidak solid jika menolak. Saat diskusi berlangsung, kamu menyadari bahwa jika menolak, kamu bisa dianggap sok suci atau malah dikucilkan. Namun, jika ikut melihat bocoran soal, kamu merasa bersalah karena ini tindakan tidak jujur. Di sisi lain, kamu juga khawatir jika melaporkan kejadian ini ke guru, kamu bisa kehilangan teman dan dianggap pengkhianat. Apa yang akan kamu lakukan?","options": {"A": "Menolak menggunakan bocoran soal dan berusaha meyakinkan teman-teman bahwa mereka bisa menghadapi ujian dengan usaha sendiri.","B": "Diam saja tanpa memberikan pendapat, tidak menggunakan bocoran soal, tetapi juga tidak menegur teman-teman yang menggunakannya.","C": "Menggunakan bocoran soal hanya untuk mengetahui jenis pertanyaan yang mungkin keluar, tetapi tetap belajar materi lainnya.","D": "Melaporkan kejadian ini kepada guru dengan tetap berusaha menjaga anonimitas agar tidak diketahui oleh teman-teman bahwa kamu yang melaporkan."},"points": {"A": 3,"B": 2,"C": 1,"D": 4},"key": "D"},{"number": 2,"text": "Kamu baru saja menyampaikan presentasi kelompok di depan kelas, dan setelah selesai, guru memberikan komentar bahwa presentasimu bagus secara isi tetapi kurang menarik dari segi penyampaian. Beberapa teman sekelas juga memberikan kritik yang sama. Kamu merasa sudah berusaha keras untuk berbicara dengan baik, tetapi ternyata masih dianggap kurang maksimal. Bagaimana reaksimu terhadap situasi ini?","options": {"A": "Menyalahkan keadaan atau faktor eksternal, seperti suasana kelas yang kurang mendukung, sehingga menyimpulkan bahwa kritik tersebut tidak sepenuhnya adil.","B": "Menerima kritik tersebut dengan sikap terbuka, lalu bertanya kepada guru dan teman-teman bagaimana cara meningkatkan keterampilan berbicaramu di kesempatan berikutnya.","C": "Merasa kecewa dan kehilangan kepercayaan diri untuk berbicara di depan umum lagi, sehingga memilih untuk menghindari tugas presentasi di masa depan.","D": "Membela diri dengan menjelaskan bahwa gaya penyampaian setiap orang berbeda-beda, sehingga kritik tersebut tidak sepenuhnya relevan untukmu."},"points": {"A": 2,"B": 4,"C": 1,"D": 3},"key": "B"},{"number": 3,"text": "Kamu adalah ketua panitia dalam sebuah proyek besar di sekolah yang memiliki tenggat waktu ketat. Tim kamu terdiri dari beberapa anggota dengan tugas yang sudah dibagi. Salah satu anggota yang bertanggung jawab atas bagian penting sering terlambat mengumpulkan pekerjaannya, jarang hadir dalam pertemuan, dan sulit dihubungi. Jika tugas ini tidak selesai tepat waktu, proyek berisiko gagal, dan nama baik seluruh tim bisa tercoreng. Setelah mencoba menghubungi anggota tersebut, akhirnya ia membalas pesan dan mengaku sedang mengalami masalah pribadi yang membuatnya sulit fokus. Namun, ia tetap bersikeras akan menyelesaikan tugasnya meskipun kamu merasa tidak yakin dengan janjinya. Apa yang akan kamu lakukan?","options": {"A": "Mempertimbangkan situasi pribadinya dan memberikan lebih banyak waktu tanpa menekan, dengan harapan ia akan menyelesaikan tugasnya sendiri.","B": "Mengambil alih sebagian tugasnya dan meminta anggota lain membantu secara sukarela, tanpa mengonfrontasi anggota tersebut agar tidak memperburuk keadaannya.","C": "Berbicara secara langsung dengannya untuk memahami lebih dalam masalahnya, mencari solusi bersama, dan menetapkan batas waktu yang jelas untuk menyelesaikan tugasnya.","D": "Melaporkan situasi ini kepada pembimbing proyek atau guru, menjelaskan bahwa tugas anggota tersebut berisiko menggagalkan proyek, dan meminta mereka menangani masalah ini."},"points": {"A": 2,"B": 3,"C": 4,"D": 1},"key": "C"},{"number": 4,"text": "Kamu telah menghabiskan banyak waktu belajar untuk ujian akhir semester. Kamu merasa sudah memahami materi dengan baik dan yakin bisa mendapatkan nilai tinggi. Namun, saat hasil ujian diumumkan, nilaimu ternyata lebih rendah dari yang kamu harapkan. Beberapa teman dengan usaha yang menurutmu lebih sedikit justru mendapatkan nilai lebih tinggi. Kamu merasa kecewa dan mulai meragukan kemampuanmu. Apa yang paling mungkin kamu lakukan?","options": {"A": "Merasa sangat kecewa dan kehilangan kepercayaan diri, tetapi berusaha untuk tetap belajar dengan harapan nilai berikutnya lebih baik.","B": "Mengabaikan perasaan kecewa dan mencoba meyakinkan diri bahwa nilai bukan segalanya, meskipun sebenarnya masih merasa terganggu.","C": "Menganalisis kesalahan yang mungkin terjadi, membandingkan dengan teman yang mendapatkan nilai lebih tinggi, dan mencari strategi baru untuk meningkatkan performa.","D": "Menganggap hasil ini sebagai kegagalan besar, merasa tertekan, dan mulai berpikir bahwa mungkin kamu memang tidak cukup pintar dalam pelajaran ini."},"points": {"A": 3,"B": 2,"C": 4,"D": 1},"key": "C"},{"number": 5,"text": "Dua teman dekatmu, Andi dan Budi, bertengkar hebat karena kesalahpahaman tentang tugas kelompok. Andi merasa bahwa Budi tidak mengerjakan bagian tugasnya dengan baik, sementara Budi merasa bahwa Andi terlalu menuntut dan tidak menghargai usahanya. Mereka berdua meminta pendapatmu dan berharap kamu berpihak kepada salah satu dari mereka. Bagaimana kamu menangani situasi ini?","options": {"A": "Berusaha menengahi dengan mendengarkan kedua belah pihak dan mencoba membantu mereka menemukan solusi yang adil.","B": "Menyampaikan pendapatmu dengan jujur, tetapi tetap berusaha menjaga hubungan baik dengan keduanya.","C": "Menghindari konflik dengan tidak memihak dan membiarkan mereka menyelesaikan masalahnya sendiri.","D": "Memilih untuk mendukung salah satu pihak yang menurutmu lebih benar agar masalah cepat selesai, meskipun itu berarti bisa merusak hubunganmu dengan teman yang lain."},"points": {"A": 4,"B": 3,"C": 2,"D": 1},"key": "A"},{"number": 6,"text": "Dalam sebuah kompetisi menulis esai tingkat nasional, pemenangnya akan mendapatkan beasiswa ke universitas impianmu. Kamu telah menulis esai yang menurutmu sudah cukup baik, tetapi seorang teman yang lebih berpengalaman di bidang penulisan menawarkan untuk membantumu merevisi dan menyempurnakannya. Namun, ia memberikan banyak masukan yang cukup mengubah gaya dan pendekatan tulisanmu, sehingga esai tersebut akan jauh berbeda dari versi aslimu. Bagaimana kamu menyikapi situasi ini?","options": {"A": "Menerima semua revisi dan saran teman karena dia lebih berpengalaman, dan ini akan meningkatkan peluangmu untuk menang.","B": "Menolak revisi yang mengubah gaya tulisanmu secara drastis, karena kamu ingin mempertahankan orisinalitas meskipun berisiko kalah dalam kompetisi.","C": "Memilih hanya beberapa revisi yang benar-benar memperbaiki kualitas tulisan tanpa menghilangkan ciri khasmu sendiri.","D": "Menggunakan revisi temanmu sebagai referensi, tetapi tetap menulis ulang dengan caramu sendiri agar tetap orisinal dan sesuai dengan visi yang kamu inginkan."},"points": {"A": 1,"B": 2,"C": 3,"D": 4},"key": "D"},{"number": 7,"text": "Kamu bekerja keras dalam tugas kelompok untuk mata pelajaran yang sulit. Kamu mengumpulkan data, menyusun laporan, dan memastikan presentasi berjalan lancar. Namun, saat di kelas, teman kelompokmu mengambil alih seluruh pembicaraan dan menyatakan bahwa dialah yang paling berperan dalam menyelesaikan tugas ini. Guru memuji temanmu, sementara kamu tidak disebutkan sama sekali. Setelah kelas berakhir, kamu merasa kesal dan kecewa. Apa yang akan kamu lakukan?","options": {"A": "Merasa marah dan langsung mengonfrontasi temanmu di depan siswa lain agar mereka tahu siapa yang sebenarnya bekerja keras.","B": "Memendam rasa kecewa dan menjauh dari teman tersebut tanpa pernah membicarakan masalah ini dengannya.","C": "Menenangkan diri terlebih dahulu, lalu mencari waktu yang tepat untuk berbicara dengan temanmu secara pribadi agar ia menyadari kesalahannya dan lebih menghargai kerja sama tim.","D": "Mengajukan protes kepada guru dengan menyampaikan bukti bahwa kamu yang lebih banyak berkontribusi dalam tugas tersebut."},"points": {"A": 1,"B": 2,"C": 4,"D": 3},"key": "C"},{"number": 8,"text": "Kamu adalah salah satu siswa terbaik di kelas dan sedang mempersiapkan diri untuk mengikuti seleksi Olimpiade Matematika tingkat nasional. Kamu sudah berlatih keras selama berbulan-bulan, tetapi beberapa hari sebelum seleksi, seorang guru menawarkanmu kesempatan untuk mengikuti proyek riset bersama dosen universitas ternama. Proyek ini akan sangat berguna untuk pengembangan ilmiah dan portofoliomu di masa depan, tetapi waktunya akan berbenturan dengan latihan intensif Olimpiade. Apa yang akan kamu lakukan?","options": {"A": "Menerima tawaran proyek riset karena ini kesempatan langka yang dapat memberikan dampak besar bagi masa depan akademikmu, meskipun harus mengurangi fokus pada seleksi Olimpiade.","B": "Tetap fokus pada Olimpiade karena ini adalah target utama yang telah kamu persiapkan selama berbulan-bulan, meskipun harus melewatkan kesempatan proyek riset.","C": "Berusaha mengatur waktu untuk menjalani keduanya dengan menyesuaikan jadwal latihan dan proyek riset, meskipun ini akan membuat jadwalmu lebih padat dan melelahkan.","D": "Berdiskusi dengan guru dan mentor untuk mempertimbangkan konsekuensi jangka panjang dari kedua pilihan sebelum mengambil keputusan."},"points": {"A": 2,"B": 3,"C": 1,"D": 4},"key": "D"},{"number": 9,"text": "Kamu telah lama berencana untuk mengikuti kursus tambahan di luar sekolah untuk meningkatkan keterampilanmu dalam bidang yang kamu minati. Namun, mendadak orang tuamu meminta bantuanmu untuk menjaga adik selama beberapa minggu ke depan karena mereka memiliki pekerjaan yang sangat sibuk. Kamu menyadari bahwa jika menerima permintaan ini, kamu harus menunda kursus yang sudah kamu nantikan sejak lama. Bagaimana kamu akan menangani situasi ini?","options": {"A": "Dengan tegas menolak permintaan orang tua dan tetap menjalani kursus karena kamu merasa pendidikanmu adalah prioritas utama yang tidak bisa dikorbankan.","B": "Menerima permintaan orang tua tanpa mencari alternatif, meskipun di dalam hati merasa kecewa karena harus menunda kesempatan yang telah lama kamu nantikan.","C": "Berdiskusi dengan orang tua untuk mencari solusi alternatif, seperti menjadwal ulang kursus atau mencari cara agar tanggung jawab ini bisa dibagi dengan anggota keluarga lain.","D": "Mengabaikan permintaan orang tua dan tetap pergi ke kursus tanpa memberitahu mereka, karena merasa bahwa mereka tidak mempertimbangkan kepentinganmu dengan adil."},"points": {"A": 2,"B": 3,"C": 4,"D": 1},"key": "C"},{"number": 10,"text": "Kamu memiliki sekelompok teman dekat di sekolah. Suatu hari, mereka mengajakmu untuk bolos kelas dan pergi ke kafe yang sedang viral. Mereka mengatakan bahwa satu hari tanpa sekolah tidak akan berdampak besar dan bahwa semua orang melakukannya sesekali. Beberapa bahkan mengejek bahwa kamu terlalu serius jika menolak. Saat itu, kamu merasa dilema. Kamu tidak ingin merusak reputasi di antara teman-teman, tetapi kamu juga sadar bahwa jika bolos, kamu bisa tertinggal pelajaran. Selain itu, salah satu guru dikenal sangat ketat dan sering mengadakan kuis mendadak yang nilainya bisa memengaruhi rapormu. Apa tindakanmu?","options": {"A": "Menolak dengan tegas dan tetap menghadiri kelas, meskipun harus menghadapi ejekan dari teman-teman.","B": "Berbohong bahwa kamu tidak enak badan atau memiliki urusan lain agar mereka tidak menekanmu lebih jauh.","C": "Ikut pergi dengan mereka untuk menjaga hubungan sosial, tetapi berjanji pada diri sendiri untuk belajar ekstra di rumah.","D": "Menolak secara halus tanpa menegur mereka, tetapi tetap membiarkan mereka mengambil keputusan sendiri tanpa ikut campur."},"points": {"A": 4,"B": 2,"C": 1,"D": 3},"key": "A"},{"number": 11,"text": "Kamu baru saja mengikuti audisi untuk kompetisi pidato sekolah yang sangat kamu impikan. Namun, setelah mendengar hasilnya, kamu tidak terpilih sebagai finalis. Juri memberikan kritik yang cukup tajam tentang cara penyampaianmu yang dianggap kurang meyakinkan. Kamu merasa kecewa karena sudah berlatih keras dan berharap bisa lolos. Bagaimana cara terbaik untuk menghadapi situasi ini?","options": {"A": "Menghindari berbicara di depan umum lagi karena merasa tidak cukup baik, dan mulai meragukan kemampuanmu dalam berbicara di hadapan banyak orang.","B": "Menerima kritik tersebut dengan sikap terbuka, menganalisis kelemahanmu, dan berlatih lebih keras agar bisa tampil lebih baik jika ada kesempatan di masa depan.","C": "Memprotes hasil audisi kepada panitia, meyakinkan bahwa kamu lebih layak dibandingkan beberapa peserta lain yang lolos, karena kamu merasa telah memberikan yang terbaik.","D": "Merasa kecewa tetapi mencoba mengalihkan perhatian ke hal lain, tanpa benar-benar mengevaluasi kritik yang diberikan atau mencoba memperbaiki kelemahanmu."},"points": {"A": 1,"B": 4,"C": 2,"D": 3},"key": "B"},{"number": 12,"text": "Kamu memiliki minat yang besar dalam bidang seni dan ingin mengambil jurusan desain grafis setelah lulus. Namun, orang tuamu berkeras agar kamu memilih jurusan kedokteran karena mereka percaya itu lebih menjamin masa depan. Mereka bahkan sudah menyiapkan kursus tambahan untuk membantumu masuk fakultas kedokteran. Kamu menyadari bahwa menolak keinginan mereka bisa menimbulkan konflik keluarga, tetapi memilih kedokteran juga berarti mengorbankan impianmu. Apa yang akan kamu lakukan?","options": {"A": "Mengikuti keinginan orang tua dan memilih kedokteran, meskipun kamu tidak menyukainya, karena kamu percaya mereka menginginkan yang terbaik untukmu.","B": "Berusaha berdiskusi dengan orang tua, menjelaskan alasanmu dengan bukti bahwa desain grafis juga memiliki prospek karier yang baik.","C": "Mengambil jurusan kedokteran tetapi tetap mengejar minat desain grafis sebagai hobi atau usaha sampingan.","D": "Tetap memilih desain grafis tanpa mendiskusikan lebih lanjut dengan orang tua karena ini adalah hidupmu sendiri."},"points": {"A": 3,"B": 4,"C": 2,"D": 1},"key": "B"},{"number": 13,"text": "Kamu sedang mengikuti ujian yang sangat menentukan peringkat akhir semester. Di tengah ujian, teman dekatmu, yang biasanya berprestasi, tampak panik dan berbisik meminta bantuan. Dia mengatakan bahwa semalam dia tidak bisa belajar karena harus mengurus adiknya yang sakit, dan jika dia gagal, itu akan menghancurkan nilai rata-ratanya. Pengawas sedang fokus ke sisi lain ruangan, jadi tidak ada yang akan tahu jika kamu membantunya. Apa yang akan kamu lakukan?","options": {"A": "Menolak permintaannya dengan sopan dan tetap fokus pada ujianmu, meskipun itu mungkin membuatnya kecewa.","B": "Memberikan sedikit petunjuk secara samar agar dia bisa menjawab sendiri tanpa langsung memberinya jawaban.","C": "Menulis beberapa jawaban di secarik kertas dan menyerahkannya secara diam-diam agar dia bisa mengejar ketertinggalannya.","D": "Mengabaikan permintaannya dan berpura-pura tidak mendengar, berharap dia mengerti bahwa kamu tidak ingin terlibat."},"points": {"A": 4,"B": 2,"C": 1,"D": 3},"key": "A"},{"number": 14,"text": "Saat dalam perjalanan ke sekolah, kamu melihat seorang pria tua yang kesulitan menyeberang jalan sambil membawa kantong belanjaan yang berat. Jalanan cukup ramai, dan kamu hanya memiliki beberapa menit sebelum bel masuk berbunyi. Jika kamu berhenti untuk membantu, kemungkinan besar kamu akan terlambat ke sekolah, dan ada kemungkinan guru akan memberi sanksi. Apa yang akan kamu lakukan?","options": {"A": "Langsung menyeberang tanpa berhenti, tetapi berharap ada orang lain yang akan membantunya.","B": "Menawarkan bantuan dengan cepat dan membantunya menyeberang, meskipun kamu mungkin terlambat sedikit ke sekolah.","C": "Membantu pria tua tersebut menyeberang dengan hati-hati dan membawakan barangnya sampai ke tempat yang lebih aman, meskipun kamu tahu kamu akan terlambat.","D": "Ragu-ragu sebentar, lalu tetap berjalan menuju sekolah karena khawatir akan konsekuensi keterlambatanmu."},"points": {"A": 1,"B": 3,"C": 4,"D": 2},"key": "C"},{"number": 15,"text": "Kamu sedang menghadiri acara perayaan ulang tahun teman sekelas di sebuah tempat nongkrong. Beberapa temanmu mulai menantang semua orang untuk melakukan tantangan yang menurutmu cukup berisiko dan tidak sesuai dengan nilai atau batasan pribadimu. Saat kamu menolak, mereka mulai mengejekmu dengan candaan seperti, “Ah, pengecut banget sih,” atau “Santai aja, ini cuma buat seru-seruan.” Bagaimana kamu merespons?","options": {"A": "Tetap menolak dengan tenang dan sedikit bercanda untuk menghindari suasana canggung, tetapi dalam hati merasa sedikit terganggu dengan ejekan mereka.","B": "Menolak dengan tegas tanpa menjelaskan panjang lebar, tetapi mulai merasa ragu apakah kamu terlalu kaku dalam mengambil keputusan.","C": "Mencoba menjelaskan alasanmu dengan baik, tetapi tetap merasa sedikit tidak nyaman jika mereka terus menekan.","D": "Merasa tidak ingin berkonflik, akhirnya setuju untuk ikut dengan harapan bahwa setelah itu mereka tidak akan menganggapmu berbeda."},"points": {"A": 4,"B": 2,"C": 3,"D": 1},"key": "A"},{"number": 16,"text": "Kamu sedang mengerjakan ujian penting yang menentukan nilai akhir di sekolah. Namun, tiba-tiba ada kebisingan dari luar kelas—seorang siswa berbicara dengan suara keras, dan suara kendaraan dari luar juga cukup mengganggu. Kamu merasa mulai kehilangan konsentrasi dan waktu terus berjalan. Apa yang akan kamu lakukan?","options": {"A": "Berusaha mengabaikan suara tersebut dan tetap fokus pada soal, meskipun merasa sedikit terganggu.","B": "Mengangkat tangan dan meminta pengawas ujian untuk menegur sumber kebisingan agar kamu bisa kembali fokus.","C": "Merasa frustrasi dan panik karena tidak bisa berkonsentrasi, sehingga berdampak pada hasil ujian.","D": "Berhenti sejenak, menarik napas dalam-dalam untuk menenangkan diri, lalu melanjutkan ujian dengan strategi mengerjakan soal yang lebih mudah terlebih dahulu agar tetap bisa mengoptimalkan waktu."},"points": {"A": 2,"B": 3,"C": 1,"D": 4},"key": "D"},{"number": 17,"text": "Kamu ditunjuk sebagai ketua kelompok dalam proyek sains yang memiliki pengaruh besar terhadap nilai akhir. Awalnya, semua anggota setuju dengan pembagian tugas, tetapi setelah satu minggu, kamu menyadari bahwa Budi, salah satu anggota, belum menyelesaikan tugasnya. Ketika kamu menanyakannya, dia mengatakan bahwa dia sibuk dengan urusan keluarga, tetapi anggota lain merasa dia hanya malas. Mereka mulai kehilangan motivasi dan menyalahkan Budi, yang tampak semakin menjauh dari kelompok. Apa yang akan kamu lakukan?","options": {"A": "Mengadakan pertemuan kelompok untuk membahas masalah ini secara terbuka dan mencari solusi agar semua tetap bisa berkontribusi tanpa merasa dirugikan.","B": "Berbicara secara pribadi dengan Budi untuk memahami situasinya lebih dalam, kemudian mencari cara agar tugasnya bisa diselesaikan dengan bantuan kelompok jika diperlukan.","C": "Menegur Budi di depan kelompok agar dia menyadari dampak tindakannya dan memberikan batas waktu terakhir untuk menyelesaikan tugasnya.","D": "Mengalihkan tugas Budi ke anggota lain secara diam-diam untuk memastikan proyek selesai tepat waktu, tanpa menimbulkan konflik lebih lanjut."},"points": {"A": 3,"B": 4,"C": 1,"D": 2},"key": "B"},{"number": 18,"text": "Sebagai bendahara organisasi siswa, kamu bertanggung jawab atas pencatatan keuangan. Saat melakukan audit rutin, kamu menemukan bahwa sejumlah dana telah digunakan tanpa dokumentasi yang jelas. Setelah mencari tahu lebih lanjut, kamu mendapati bahwa ketua panitia suatu acara telah mengambil uang tersebut tanpa persetujuan resmi, dengan alasan mendesak untuk operasional acara. Saat kamu menanyakannya, ia terlihat canggung dan mencoba membela diri dengan mengatakan bahwa uang itu digunakan demi kepentingan organisasi. Ia berjanji akan menggantinya secepatnya, tetapi tidak memberikan bukti atau kejelasan kapan uang itu akan dikembalikan. Jika masalah ini diketahui oleh guru pembina, kemungkinan besar organisasi akan mendapatkan sanksi yang dapat merugikan semua anggota. Apa langkah yang akan kamu ambil?","options": {"A": "Menegaskan kepada ketua panitia bahwa pencatatan keuangan harus jelas dan menuntutnya untuk segera mengembalikan uang tersebut dalam batas waktu tertentu.","B": "Melaporkan kejadian ini kepada guru pembina agar ditangani secara formal, meskipun berisiko menyebabkan masalah bagi organisasi.","C": "Mengabaikannya karena percaya bahwa uang itu benar-benar digunakan untuk acara, dan mencatatnya sebagai pengeluaran tidak terduga.","D": "Mendiskusikan masalah ini dengan anggota lain dalam organisasi untuk mencari solusi bersama sebelum mengambil tindakan lebih lanjut."},"points": {"A": 4,"B": 3,"C": 1,"D": 2},"key": "A"},{"number": 19,"text": "Dalam perjalanan pulang menggunakan transportasi umum yang padat, seseorang yang terburu-buru tidak sengaja mendorongmu cukup keras hingga barang-barangmu jatuh berserakan. Orang tersebut bahkan tidak menoleh atau meminta maaf. Kamu merasa kesal dan malu karena orang-orang di sekitarmu memperhatikan insiden tersebut. Apa yang akan kamu lakukan?","options": {"A": "Berteriak marah kepada orang tersebut agar dia sadar bahwa tindakannya tidak sopan.","B": "Menatap tajam ke arah orang tersebut dengan harapan dia merasa bersalah, tetapi tidak mengatakan apa pun.","C": "Mengambil barang-barangmu dengan tenang, berusaha tidak terlalu memikirkan kejadian ini, dan melanjutkan perjalanan tanpa mempermasalahkannya lebih jauh.","D": "Mengejar orang tersebut dan menegurnya dengan sopan agar dia lebih berhati-hati ke depannya."},"points": {"A": 1,"B": 2,"C": 3,"D": 4},"key": "D"},{"number": 20,"text": "Di sekolahmu, ada kelompok siswa yang sangat berpengaruh dan populer. Mereka mengundangmu untuk bergabung karena mereka melihat potensimu dalam kegiatan sosial. Namun, kamu tahu bahwa kelompok ini sering mengejek dan mempermalukan siswa lain yang mereka anggap berbeda. Salah satu anggota kelompok mengatakan bahwa jika kamu bergabung, kamu tidak perlu ikut mengejek, cukup diam saja. Namun, jika kamu menolak, kamu berisiko menjadi target berikutnya. Apa yang akan kamu lakukan?","options": {"A": "Menolak bergabung dan menjaga jarak dari kelompok tersebut, meskipun itu berarti kamu bisa menjadi target berikutnya.","B": "Menerima tawaran mereka tetapi tetap menjaga batasan dengan tidak ikut dalam perilaku negatif mereka.","C": "Bergabung dengan mereka untuk mendapatkan perlindungan dan manfaat sosial, tetapi diam-diam berusaha mengurangi perilaku buruk mereka dari dalam.","D": "Menerima tawaran mereka dengan harapan bisa mengubah dinamika kelompok menjadi lebih positif, tetapi tetap mengikuti beberapa aturan mereka agar tetap diterima."},"points": {"A": 4,"B": 2,"C": 1,"D": 3},"key": "A"},{"number": 21,"text": "Kamu terpilih untuk mewakili sekolah dalam lomba pidato tingkat provinsi. Setelah latihan berbulan-bulan, akhirnya kamu naik ke panggung. Namun, di tengah pidato, mikrofon tiba-tiba mati, dan seluruh ruangan menjadi hening. Semua mata tertuju padamu, dan panitia tampak kesulitan memperbaiki mikrofon dengan cepat. Apa yang akan kamu lakukan dalam situasi ini?","options": {"A": "Tetap tenang dan melanjutkan pidato dengan suara lantang tanpa mikrofon agar tetap menunjukkan bahwa kamu siap menghadapi tantangan apa pun.","B": "Panik dan berhenti berbicara, lalu menunggu panitia memperbaiki mikrofon sebelum melanjutkan pidato.","C": "Memanfaatkan kesempatan ini untuk menarik perhatian juri dan audiens dengan humor ringan sebelum melanjutkan pidato dengan improvisasi.","D": "Merasa tertekan dan memutuskan untuk berhenti berbicara, lalu turun dari panggung karena takut merusak kesan penampilanmu."},"points": {"A": 4,"B": 2,"C": 3,"D": 1},"key": "A"},{"number": 22,"text": "Sekelompok teman dekatmu mengajakmu untuk membolos kelas di jam terakhir untuk pergi ke kafe yang sedang populer di kota. Mereka mengatakan bahwa tidak akan ada materi penting yang diajarkan, dan mereka juga mengejekmu jika kamu menolak, mengatakan bahwa kamu terlalu serius dan kurang menikmati masa remaja. Padahal, kamu tahu bahwa pelajaran di jam terakhir adalah mata pelajaran yang sulit dan kamu butuh pemahaman lebih. Bagaimana kamu menyikapi situasi ini?","options": {"A": "Menerima ajakan mereka karena khawatir akan dianggap aneh atau dikucilkan jika menolak, meskipun dalam hati merasa bersalah karena melewatkan pelajaran.","B": "Menolak dengan sopan, menjelaskan bahwa kamu ingin tetap mengikuti pelajaran, tetapi tidak mempersoalkan keputusan mereka yang tetap ingin membolos.","C": "Mengusulkan kompromi dengan menawarkan untuk bertemu di kafe setelah sekolah selesai, sehingga kamu tetap bisa mengikuti pelajaran tanpa membuat mereka kecewa.","D": "Berpura-pura ikut membolos tetapi diam-diam kembali ke kelas saat mereka sudah pergi, agar tidak mendapat tekanan dari mereka tetapi tetap bisa belajar."},"points": {"A": 1,"B": 3,"C": 4,"D": 2},"key": "C"},{"number": 23,"text": "Di tengah pelajaran, guru membahas hasil tugas yang sudah dikumpulkan dan secara terbuka memberikan kritik terhadap tugasmu di depan kelas. Guru mengatakan bahwa tugasmu kurang sesuai dengan instruksi dan perlu banyak perbaikan, padahal kamu merasa sudah mengerjakannya dengan baik. Beberapa teman mulai berbisik-bisik dan ada yang tersenyum mendengar kritik tersebut. Kamu merasa malu dan sedikit tersinggung. Bagaimana reaksimu?","options": {"A": "Langsung membela diri dan berdebat dengan guru karena merasa tugasmu sudah cukup baik dan kritik tersebut tidak adil.","B": "Merasa sangat kecewa dan kehilangan motivasi untuk mengerjakan tugas dengan sungguh-sungguh di lain waktu.","C": "Berusaha menenangkan diri, menerima kritik sebagai masukan, dan setelah kelas berakhir, meminta klarifikasi kepada guru untuk memahami bagian mana yang bisa diperbaiki.","D": "Mengabaikan kritik tersebut dan meyakinkan diri bahwa guru mungkin hanya ingin memberi pelajaran kepada semua siswa, bukan hanya kepadamu."},"points": {"A": 1,"B": 2,"C": 4,"D": 3},"key": "C"},{"number": 24,"text": "Kamu menyadari bahwa seorang teman sekelasmu, Rina, sering kesulitan memahami materi Matematika. Dia sudah beberapa kali bertanya kepadamu, tetapi kamu sendiri juga sibuk mempersiapkan ujian. Suatu hari, Rina meminta bantuanmu lagi karena dia merasa putus asa dan khawatir nilainya akan turun drastis. Kamu tahu bahwa membantunya bisa memakan waktu yang cukup lama, dan kamu juga butuh waktu untuk belajar. Bagaimana kamu merespons situasi ini?","options": {"A": "Menjelaskan materi kepada Rina secara singkat, lalu menyarankan agar dia bertanya kepada guru jika masih belum paham.","B": "Menyusun jadwal belajar bersama yang sesuai dengan waktu luang kalian berdua, meskipun itu berarti kamu harus mengurangi waktu istirahatmu sedikit.","C": "Mengajarkan Rina secara mendalam meskipun mengorbankan sebagian besar waktu belajarmu sendiri, karena kamu tahu dia sangat membutuhkannya.","D": "Menolak dengan sopan dan mengatakan bahwa kamu juga kesulitan dengan materi tersebut, lalu menyarankan dia mencari bantuan lain."},"points": {"A": 2,"B": 4,"C": 3,"D": 1},"key": "B"},{"number": 25,"text": "Kamu sudah berlatih keras untuk mengikuti seleksi tim basket sekolah dan sangat yakin bisa lolos. Namun, ketika pengumuman hasil seleksi keluar, namamu tidak ada dalam daftar. Kamu merasa kecewa dan tidak percaya bahwa usahamu selama ini ternyata tidak cukup untuk membuatmu terpilih. Beberapa temanmu yang lolos mencoba menyemangatimu, tetapi rasa kecewa masih mendominasi pikiranmu. Apa yang akan kamu lakukan setelah mengalami kegagalan ini?","options": {"A": "Berhenti mencoba olahraga lain karena merasa tidak memiliki bakat dan takut mengalami kegagalan yang sama di masa depan.","B": "Menggunakan pengalaman ini sebagai pelajaran, lalu mencari tahu kekuranganmu dan berlatih lebih keras agar bisa mencoba lagi tahun depan.","C": "Menyalahkan pelatih dan sistem seleksi yang menurutmu tidak adil, lalu mengungkapkan kekecewaanmu di media sosial agar orang lain tahu.","D": "Menghindari teman-teman yang lolos seleksi karena merasa malu dan tidak ingin mereka melihat kekecewaanmu."},"points": {"A": 1,"B": 4,"C": 2,"D": 3},"key": "B"},{"number": 26,"text": "Kamu telah lolos seleksi sebagai salah satu perwakilan sekolah dalam lomba nasional yang sudah lama kamu persiapkan. Namun, jadwal perlombaan ternyata bertepatan dengan ujian praktik mata pelajaran yang menentukan nilai rapormu. Guru mata pelajaran tersebut sangat ketat dan tidak memberikan kesempatan ujian susulan kecuali ada alasan kuat. Jika kamu melewatkan lomba, kamu akan kehilangan kesempatan besar untuk mengharumkan nama sekolah dan mendapatkan pengalaman berharga. Namun, jika tidak mengikuti ujian praktik, nilaimu akan sangat terpengaruh, yang bisa berakibat pada peluangmu untuk masuk universitas yang kamu impikan. Apa yang akan kamu lakukan?","options": {"A": "Memilih untuk tetap mengikuti ujian praktik karena itu lebih penting untuk masa depan akademismu, meskipun harus mengorbankan lomba.","B": "Memilih mengikuti lomba dan mencari cara untuk bernegosiasi dengan guru setelahnya, meskipun ada kemungkinan nilaimu dikurangi.","C": "Mencoba berbicara dengan guru dan meminta solusi terbaik agar bisa menjalani kedua hal tersebut tanpa harus mengorbankan salah satunya.","D": "Mengundurkan diri dari lomba dan meminta teman menggantikanmu, meskipun ini akan mengecewakan tim yang sudah berlatih bersama."},"points": {"A": 2,"B": 3,"C": 4,"D": 1},"key": "C"},{"number": 27,"text": "Kamu baru saja menerima hasil ujian dan mendapatkan nilai yang jauh lebih rendah dari yang kamu perkirakan. Setelah memeriksa ulang jawabanmu dengan kunci jawaban, kamu merasa ada beberapa poin yang seharusnya mendapatkan nilai lebih. Saat bertanya kepada gurumu, beliau dengan singkat menjawab bahwa penilaiannya sudah benar dan tidak bersedia mendiskusikannya lebih lanjut. Kamu merasa kecewa dan merasa ketidakadilan dalam penilaian. Apa yang akan kamu lakukan?","options": {"A": "Tetap menerima nilai tersebut tanpa perlawanan, tetapi di dalam hati menyimpan rasa kecewa dan semakin tidak termotivasi dalam belajar di mata pelajaran itu.","B": "Mengeluh kepada teman-teman dan berusaha mengajak mereka untuk bersama-sama meminta kejelasan kepada guru, dengan harapan guru akan lebih terbuka jika banyak yang komplain.","C": "Berdiskusi kembali dengan guru dengan pendekatan yang lebih sopan dan logis, menunjukkan argumen serta bukti yang kuat agar guru lebih mempertimbangkan masukanmu.","D": "Melaporkan masalah ini langsung ke kepala sekolah atau wali kelas tanpa berbicara lagi dengan guru, karena merasa bahwa guru tersebut tidak bersikap adil dan tidak mau berdiskusi."},"points": {"A": 2,"B": 1,"C": 4,"D": 3},"key": "C"},{"number": 28,"text": "Suatu hari, guru mengumumkan ada lomba debat nasional dengan hadiah beasiswa bagi pemenang. Kamu tahu bahwa ini adalah kesempatan besar untuk membuktikan kemampuanmu, tetapi kamu juga sadar bahwa ada peserta lain dari sekolah lain yang jauh lebih berpengalaman. Meskipun beberapa temanmu menyarankan kamu untuk mencoba, kamu masih ragu karena takut kalah dan mempermalukan diri sendiri di depan banyak orang. Apa yang paling mungkin kamu lakukan?","options": {"A": "Mendaftar dan berlatih dengan giat untuk meningkatkan kemampuanmu, karena kesempatan seperti ini tidak datang dua kali.","B": "Memilih untuk tidak ikut karena merasa belum cukup siap, dan lebih nyaman menjadi penonton saja.","C": "Meminta pendapat banyak orang terlebih dahulu sebelum mengambil keputusan, karena kamu tidak ingin menyesal nantinya.","D": "Mengikuti lomba hanya untuk pengalaman tanpa benar-benar berusaha maksimal, karena kamu merasa tidak mungkin menang melawan peserta yang lebih hebat."},"points": {"A": 4,"B": 1,"C": 3,"D": 2},"key": "A"},{"number": 29,"text": "Kamu baru saja pindah ke sekolah baru dan belum memiliki teman. Saat jam istirahat, kamu melihat beberapa kelompok siswa yang sudah akrab satu sama lain. Salah satu kelompok tampaknya memiliki minat yang sama denganmu, tetapi mereka terlihat sangat dekat dan kamu khawatir akan dianggap mengganggu jika mencoba bergabung. Di sisi lain, kamu juga tidak ingin terus menyendiri dalam waktu lama. Apa langkah terbaik yang bisa kamu ambil?","options": {"A": "Menunggu ada orang yang mengajakmu bergabung dalam kelompok mereka, karena kamu tidak ingin terlihat memaksa atau mencampuri pergaulan mereka sebelum mereka merasa nyaman denganmu.","B": "Berusaha berkenalan dengan beberapa anggota kelompok yang terlihat ramah, mencari kesempatan untuk ikut dalam percakapan mereka dengan sopan dan tidak berlebihan.","C": "Memilih untuk makan sendirian di tempat yang lebih sepi sampai seseorang mendekatimu terlebih dahulu, karena kamu tidak ingin mengambil risiko ditolak saat mencoba berkenalan.","D": "Mencari kelompok lain yang tampaknya lebih kecil dan mungkin lebih terbuka untuk menerima anggota baru, meskipun minat mereka tidak sepenuhnya sama denganmu."},"points": {"A": 2,"B": 4,"C": 1,"D": 3},"key": "B"},{"number": 30,"text": "Di kelas diskusi, guru meminta setiap siswa untuk memberikan pendapat mengenai isu global yang sedang hangat. Topik yang dibahas adalah sesuatu yang kamu kuasai dengan baik karena sering membaca tentangnya. Namun, beberapa teman sekelas sudah menyampaikan pendapat yang berbeda dari pandanganmu. Kamu merasa argumen mereka kurang tepat, tetapi mereka tampak sangat yakin dan mendapatkan dukungan dari siswa lain. Selain itu, kamu khawatir dianggap terlalu dominan atau sok tahu jika menyanggah mereka. Apa yang akan kamu lakukan?","options": {"A": "Menunggu hingga ada siswa lain yang memiliki pendapat serupa denganmu sebelum berbicara agar tidak merasa sendirian dalam argumenmu.","B": "Tetap mengungkapkan pendapatmu dengan percaya diri, tetapi menyampaikannya secara logis dan sopan agar bisa diterima dengan baik.","C": "Memilih untuk diam karena merasa takut dikritik atau dianggap terlalu percaya diri, meskipun sebenarnya kamu yakin dengan pendapatmu.","D": "Mencoba mengalihkan pembicaraan ke topik lain yang lebih netral agar tidak perlu berdebat langsung dengan teman-temanmu."},"points": {"A": 2,"B": 4,"C": 1,"D": 3},"key": "B"},{"number": 31,"text": "Kamu mengikuti kompetisi tingkat sekolah yang sudah kamu persiapkan selama berbulan-bulan. Namun, ketika pengumuman pemenang, kamu tidak berhasil meraih juara, sementara temanmu yang menurutmu persiapannya lebih sedikit justru menang. Setelah kompetisi, beberapa teman mulai bercanda tentang kekalahanmu, bahkan ada yang mengolok-olok usahamu. Kamu merasa kecewa, tetapi juga tidak ingin merusak hubungan dengan teman-temanmu. Bagaimana kamu menyikapinya?","options": {"A": "Langsung membalas ejekan mereka dengan sinis, mengatakan bahwa keberuntunganlah yang membuat temanmu menang.","B": "Merasa sangat kecewa dan kehilangan semangat untuk berpartisipasi dalam kompetisi lainnya di masa depan.","C": "Berusaha mengendalikan emosi, menerima kekalahan sebagai bagian dari proses, dan mengevaluasi apa yang perlu diperbaiki untuk kesempatan berikutnya.","D": "Menjauh dari teman-teman yang mengejek, tetapi tetap melanjutkan usaha untuk meningkatkan kemampuan diri."},"points": {"A": 1,"B": 2,"C": 4,"D": 3},"key": "C"},{"number": 32,"text": "Kamu sedang mengikuti kegiatan organisasi sekolah yang cukup penting. Dalam rapat, salah satu anggota tim menyampaikan ide yang menurutmu kurang tepat dan berisiko membuat program jadi tidak berjalan efektif. Namun, anggota tersebut dikenal cukup sensitif terhadap kritik dan beberapa teman lain tampak setuju hanya karena tidak ingin menyinggung perasaannya. Jika kamu diam, keputusan kelompok bisa kurang optimal. Jika kamu menyanggah secara langsung, suasana rapat bisa menjadi canggung. Apa yang akan kamu lakukan?","options": {"A": "Menyampaikan pendapatmu dengan hati-hati dan sopan, lalu mengusulkan alternatif yang lebih realistis agar tujuan tim tetap tercapai.","B": "Memilih diam agar suasana rapat tetap aman, meskipun kamu tahu ide itu memiliki kelemahan.","C": "Menunggu rapat selesai lalu membicarakan masalah itu hanya dengan beberapa teman terdekat, tanpa menyampaikannya dalam forum.","D": "Menolak ide tersebut secara langsung dan tegas di depan semua anggota agar kelompok tidak mengambil keputusan yang salah."},"points": {"A": 4,"B": 2,"C": 3,"D": 1},"key": "A"}];
