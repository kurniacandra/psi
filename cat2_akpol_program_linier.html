":["https://github.com/kurniacandra/1/blob/main/soal_parts/part_003/J4TMQS269999.png?raw=true"],"E":["https://github.com/kurniacandra/1/blob/main/soal_parts/part_003/J5TMQS269999.png?raw=true"]},"answer":"C","points":1,"source":"CAT 2 AKPOL - PROGRAM LINIER"},{"number":18,"id":"TMQS270000","category":"PENALARAN_MATEMATIKA","categoryLabel":"Penalaran Matematika","type":"single","text":"Seorang pengusaha kue akan membuat dua jenis kue. Kue jenis A membutuhkan 20 gram tepung dan 10 gram mentega sedangkan kue jenis B membutuhkan 15 gram tepung terigu dan 10 gram mentega. Ketersediaan bahan yang dimilikinya adalah 5 kg tepung dan 4 kg mentega. Jika x menyatakan banyaknya roti jenis A dibuat dan y menyatakan banyaknya roti jenis B yang dapat dibuat, maka model matematika yang tepat adalah…","images":[],"options":{"A":"","B":"","C":"","D":"","E":""},"optionImages":{"A":["https://github.com/kurniacandra/1/blob/main/soal_parts/part_001/J1TMQS270000.png?raw=true"],"B":["https://github.com/kurniacandra/1/blob/main/soal_parts/part_001/J2TMQS270000.png?raw=true"],"C":["https://github.com/kurniacandra/1/blob/main/soal_parts/part_002/J3TMQS270000.png?raw=true"],"D":["https://github.com/kurniacandra/1/blob/main/soal_parts/part_003/J4TMQS270000.png?raw=true"],"E":["https://github.com/kurniacandra/1/blob/main/soal_parts/part_003/J5TMQS270000.png?raw=true"]},"answer":"D","points":1,"source":"CAT 2 AKPOL - PROGRAM LINIER"},{"number":19,"id":"TMQS270001","category":"PENALARAN_MATEMATIKA","categoryLabel":"Penalaran Matematika","type":"single","text":"Seorang lansia dianjurkan untuk mengonsumsi kalsium dan zat besi sedikitnya 60 gram dan 30 gram. Sebuah kapsul mengandung 5 gram kalsium dan 2 gram zat besi. Sedangkan, sebuah tablet mengandung 2 gram kalsium dan 2 gram zat besi. Jika harga sebuah kapsul Rp 1.000,00 dan harga sebuah tablet adalah Rp 800,00 maka biaya minimum yang harus dikeluarkan agar kebutuhan kalsium dan zat besi dapat terpenuhi adalah…","images":[],"options":{"A":"Rp12,000.00","B":"Rp14,000.00","C":"Rp18,000.00","D":"Rp24,000.00","E":"Rp36,000.00"},"optionImages":{},"answer":"B","points":1,"source":"CAT 2 AKPOL - PROGRAM LINIER"},{"number":20,"id":"TMQS270002","category":"PENALARAN_MATEMATIKA","categoryLabel":"Penalaran Matematika","type":"single","text":"","images":["https://github.com/kurniacandra/1/blob/main/soal_parts/part_004/QTMQS270002.png?raw=true"],"options":{"A":"Rp75,000.00","B":"Rp130,000.00","C":"Rp160,000.00","D":"Rp175,000.00","E":"Rp290,000.00"},"optionImages":{},"answer":"B","points":1,"source":"CAT 2 AKPOL - PROGRAM LINIER"},{"number":21,"id":"TMQS270003","category":"PENALARAN_MATEMATIKA","categoryLabel":"Penalaran Matematika","type":"single","text":"Ibu Frida membuka usaha kontrakan dengan menyewakan dua tipe kamar. Kamar tipe I disewakan Rp 400.000,00/bulan sedangkan kamar tipe II disewakan Rp 500.000,00/bulan. Diketahui bahwa biaya pembuatan untuk satu unit kamar tipe I adalah Rp 9.000.000,00 dan untuk satu unit kamar tipe II adalah Rp 12.000.000,00. Jika lahan untuk membangun kontrakan hanya cukup untuk pembuatan 10 kamar dan modal yang dimiliki oleh Ibu Frida sebesar Rp 108.000.000,00, maka dengan asumsi bahwa seluruh kamar terisi penuh, pendapatan maksimum yang dapat diperoleh setiap bulannya adalah…","images":[],"options":{"A":"4,200,000.00","B":"4,600,000.00","C":"4,800,000.00","D":"5,000,000.00","E":"5,200,000.00"},"optionImages":{},"answer":"B","points":1,"source":"CAT 2 AKPOL - PROGRAM LINIER"},{"number":22,"id":"TMQS270004","category":"PENALARAN_MATEMATIKA","categoryLabel":"Penalaran Matematika","type":"single","text":"Suatu butik memiliki 4 m kain satin dan 5 m kain prada. Dari bahan tersebut akan dibuat dua baju pesta. Baju pesta I memerlukan 2 m kain satin dan 1 m kain prada, sedangkan baju pesta II memerlukan 1 m kain satin dan 2 m kain prada. Jika harga jual baju pesta I adalah Rp500.000,00 dan harga jual baju pesta II adalah Rp400.000,00, hasil penjualan maksimum yang dapat diperoleh butik tersebut adalah …","images":[],"options":{"A":"Rp800,000.00","B":"Rp1,000,000.00","C":"Rp1,300,000.00","D":"Rp1,400,000.00","E":"Rp2,000,000.00"},"optionImages":{},"answer":"C","points":1,"source":"CAT 2 AKPOL - PROGRAM LINIER"},{"number":23,"id":"TMQS270005","category":"PENALARAN_MATEMATIKA","categoryLabel":"Penalaran Matematika","type":"single","text":"Dengan persedian kain polos 20 m dan kain bergaris 10 m, seorang penjahit akan membuat dua model pakaian jadi. Model I memerlukan 1 m kain polos dan 1,5 m kain bergaris dan model II memerlukan 2 m kain polos dan 0,5 m kain bergaris. Jumlah total pakaian jadi akan maksimum jika jumlah model I dan model II masing-masing sebanyak …","images":[],"options":{"A":"4 dan 8","B":"5 dan 7","C":"6 dan 4","D":"7 dan 5","E":"8 dan 6"},"optionImages":{},"answer":"A","points":1,"source":"CAT 2 AKPOL - PROGRAM LINIER"},{"number":24,"id":"TMQS270006","category":"PENALARAN_MATEMATIKA","categoryLabel":"Penalaran Matematika","type":"single","text":"Seorang penjaja buah-buahan menggunakan gerobak untuk menjual apel dan pisang. Harga beli apel Rp1.000,00/kg dan pisang Rp400,00/kg. Penjaja tersebut memiliki modal Rp250.000,00 dan gerobak hanya dapat memuat beban tidak lebih dari 400 kg. Jika keuntungan apel Rp250,00/kg dan pisang Rp125,00/kg, maka keuntungan maksimum yang dapat diperoleh adalah …","images":[],"options":{"A":"Rp65,000.00","B":"Rp65,500.00","C":"Rp66,000.00","D":"Rp67,500.00","E":"Rp68,750.00"},"optionImages":{},"answer":"E","points":1,"source":"CAT 2 AKPOL - PROGRAM LINIER"},{"number":25,"id":"TMQS270007","category":"PENALARAN_MATEMATIKA","categoryLabel":"Penalaran Matematika","type":"single","text":"","images":["https://github.com/kurniacandra/1/blob/main/soal_parts/part_004/QTMQS270007.png?raw=true"],"options":{"A":"140 unit tipe A dan 40 unit tipe B","B":"120 unit tipe A dan 60 unit tipe B","C":"100 unit tipe A dan 80 unit tipe B","D":"180 unit tipe A saja","E":"150 unit tipe B saja"},"optionImages":{},"answer":"B","points":1
