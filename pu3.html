gkat kriminalitas yang tinggi.","E":"Oleh karena itu, wilayah Z adalah wilayah yang mempunyai tingkat kriminalitas rendah."},"answer":"B","category":"Logika","explanation":"Patroli insidental berarti tidak rutin, sehingga berdasarkan premis peluang kriminalitas di wilayah tersebut menjadi lebih besar.","type":"single","categoryLabel":"Logika"},{"number":19,"text":"Persamaan makna: Asumsi....","options":{"A":"Tuduhan","B":"Perkiraan","C":"Simpulan","D":"Nilai","E":"Persamaan"},"answer":"B","category":"Bahasa Indonesia","explanation":"Asumsi bermakna anggapan atau perkiraan.","type":"single","categoryLabel":"Bahasa Indonesia"},{"number":20,"text":"Inkrah : hukum = artefak : ....","options":{"A":"Candi","B":"Arkeologi","C":"Sejarah","D":"Purba","E":"Kerajaan"},"answer":"B","category":"Analogi","explanation":"Inkrah adalah istilah dalam bidang hukum, sedangkan artefak berkaitan dengan bidang arkeologi.","type":"single","categoryLabel":"Analogi"},{"number":21,"text":"Ilmu yang mempelajari sel pada manusia disebut....","options":{"A":"Sitologi","B":"Mikologi","C":"Virologi","D":"Analogi","E":"Bakteriologi"},"answer":"A","category":"Biologi","explanation":"Sitologi adalah ilmu yang mempelajari sel.","type":"single","categoryLabel":"Biologi"},{"number":22,"text":"Kawasan yang memiliki ciri khas tertentu baik berada di daratan maupun perairan serta berfungsi untuk melestarikan keanekaragaman tumbuhan dan satwa disebut....","options":{"A":"Suaka alam","B":"Taman nasional","C":"Hutan lindung","D":"Hutan produksi","E":"Cagar budaya"},"answer":"A","category":"Lingkungan","explanation":"Kawasan suaka alam memiliki fungsi pokok untuk melestarikan keanekaragaman tumbuhan, satwa, dan ekosistem.","type":"single","categoryLabel":"Lingkungan"},{"number":23,"text":"Apa ibu kota Negara India?","options":{"A":"New Delhi","B":"Dushanbe","C":"Neurobi","D":"Baghdad","E":"Toronto"},"answer":"A","category":"Ibu Kota","explanation":"Ibu kota India adalah New Delhi.","type":"single","categoryLabel":"Ibu Kota"},{"number":24,"text":"Apa nama mata uang Negara India?","options":{"A":"Rupee","B":"Dinar","C":"Dirham","D":"Krone","E":"Dollar India"},"answer":"A","category":"Mata Uang","explanation":"Mata uang India adalah Rupee.","type":"single","categoryLabel":"Mata Uang"},{"number":25,"text":"FAO adalah organisasi internasional bentukan PBB yang mengurusi bidang pangan. Apa kepanjangan dari FAO?","options":{"A":"Food and Agriculture Organization","B":"Food and Agricultures Organizations","C":"Food and Agriculture Organization","D":"Food and Agricultures Organizations","E":"Food and Agricultures Organization"},"answer":"C","category":"Organisasi Internasional","explanation":"FAO adalah Food and Agriculture Organization.","type":"single","categoryLabel":"Organisasi Internasional"},{"number":26,"text":"Penemu dari teleskop adalah ....","options":{"A":"Galileo Galilei","B":"Nicholas Copernicus","C":"Alexander Fleming","D":"Wilbur dan Orville Wright","E":"Piri Reis"},"answer":"A","category":"Tokoh Penemu","explanation":"Dalam bentuk soal umum seperti ini, jawaban yang biasanya digunakan adalah Galileo Galilei.","type":"single","categoryLabel":"Tokoh Penemu"},{"number":27,"text":"Rumus unsur kimia dari air raksa adalah....","options":{"A":"Hg","B":"H2g","C":"H2O","D":"HO2","E":"GO2"},"answer":"A","category":"Kimia","explanation":"Air raksa atau merkuri memiliki lambang unsur Hg.","type":"single","categoryLabel":"Kimia"},{"number":28,"text":"Premis 1: Ketika ayah dan ibu Hermawan menikah, masing-masing telah mempunyai seorang anak.\nPremis 2: Sekarang Hermawan lahir persis setahun setelah perkawinan tersebut, dan memiliki 4 orang saudara.\nPernyataan yang benar berdasarkan premis di atas adalah....","options":{"A":"Hermawan memiliki 2 orang adik kandung","B":"Hermawan merupakan anak tertua dalam keluarga","C":"Hermawan tidak memiliki saudara tiri","D":"Hermawan memiliki 4 orang adik","E":"Hermawan merupakan anak tunggal dari perkawinan kedua"},"answer":"A","category":"Logika","explanation":"Saat menikah orang tuanya sudah memiliki dua anak, sedangkan jumlah saudara Hermawan empat. Maka dua saudara lain setelah Hermawan merupakan adik kandung.","type":"single","categoryLabel":"Logika"},{"number":29,"text":"Presiden Amerika Serikat yang mencetuskan pendirian League of Nations atau Liga Bangsa-Bangsa adalah....","options":{"A":"Woodrow Wilson","B":"Theodore Roosevelt","C":"William Taft","D":"Grover Cleveland","E":"Warren Harding"},"answer":"A","category":"Sejarah Dunia","explanation":"League of Nations digagas oleh Presiden Amerika Serikat Woodrow Wilson.","type":"single","categoryLabel":"Sejarah Dunia"},{"number":30,"text":"Salah satu dampak negatif dari globalisasi adalah memudarnya rasa cinta terhadap produk dalam negeri serta lunturnya nilai-nilai budaya bangsa. Tantangan Pancasila dalam menghadapi dampak globalisasi tersebut adalah ....","options":{"A":"Meningkatkan proteksionisme ekonomi untuk melindungi industri dalam negeri","B":"Mengurangi keragaman budaya untuk menciptakan identitas nasional yang lebih homogen","C":"Mengedepankan pendidikan karakter berbasis Pancasila sebagai penguatan nasionalisme dan nilai-nilai budaya","D":"Memfokuskan pembangunan infrastruktur yang merata pada wilayah perkotaan maupun pedesaan","E":"Mengabaikan dampak globalisasi dan hanya fokus pada kepentingan politik dalam negeri"},"answer":"C","category":"Pancasila","explanation":"Pendidikan karakter berbasis Pancasila dapat memperkuat nasionalisme dan nilai budaya bangsa.","type":"single","categoryLabel":"Pancasila"},{"number":31,"text":"Pancasila sebagai ideologi terbuka memiliki nilai praksis dalam perikehidupan bangsa. Hal ini menunjukkan bahwa Pancasila sebagai ideologi terbuka memiliki sifat....","options":{"A":"Fleksibel terhadap ideologi lain yang masuk dalam masyarakat","B":"Bersifat dogmatis dan tidak mengikuti perubahan zaman","C":"Statis dengan ideologi asli yang ada sejak Pancasila lahir","D":"Dinamis dengan perkembangan zaman serta aspirasi rakyat","E":"Relevan dengan perubahan masyarakat meski tidak sesuai dengan ideologi"},"answer":"D","category":"Pancasila","explanation":"Nilai praksis menunjukkan Pancasila dapat diterapkan secara dinamis sesuai perkembangan zaman dan aspirasi rakyat.","type":"single","categoryLabel":"Pancasila"},{"number":32,"text":"Aspek penting yang menjadi alasan Pancasila dijadikan sebagai ideologi terbuka bagi bangsa Indonesia karena ....","options":{"A":"Mengakomodasi pihak asing dalam pengambilan kebijakan nasional","B":"Mengedepankan supremasi militer dalam pengelolaan pemerintahan","C":"Memberikan dasar yang fleksibel untuk menghadapi dinamika sosial","D":"Merupakan hasil dari peniruan ideologi-ideologi yang ada di negara lain","E":"Pancasila hanya relevan untuk kelompok etnis dan agama tertentu"},"answer":"C","category":"Pancasila","explanation":"Pancasila sebagai ideologi terbuka bersifat fleksibel untuk menghadapi dinamika sosial bangsa.","type":"single","categoryLabel":"Pancasila"},{"number":33,"text":"Dalam konteks keberagaman bangsa Indonesia, bukti yang menunjukkan bahwa nilai-nilai Pancasila terbuka berakar pada budaya nasional masyarakat Indonesia adalah....","options":{"A":"Kesadaran masyarakat terhadap keanekaragaman bahasa daerah dan adat istiadat yang ada di Indonesia","B":"Kebiasaan masyarakat yang menjunjung tinggi semangat kebersamaan dan gotong royong","C":"Pengaruh nilai-nilai agama yang dianut oleh masyarakat dalam kehidupan sehari-hari","D":"Kepatuhan masyarakat terhadap hukum dan peraturan di Indonesia yang bersumber dari Pancasila","E":"Semangat nasionalisme yang tinggi di kalangan masyarakat Indonesia meski banyak perbedaan"},"answer":"B","category":"Pancasila","explanation":"Gotong royong dan kebersamaan merupakan nilai budaya bangsa yang menjadi akar Pancasila.","type":"single","categoryLabel":"Pancasila"},{"number":34,"text":"Pancasila sebagai paradigma pembangunan nasional adalah suatu proses yang berkesinambungan yang melingkupi segala aspek kehidupan berbangsa, bermasyarakat, dan bernegara. Penerapan Pancasila dalam kondisi tersebut dapat mengalami hambatan ketika....","options":{"A":"Nilai-nilai Pancasila tidak sepenuhnya dipahami dan diinternalisasi oleh seluruh elemen masyarakat","B":"Pembangunan ekonomi tidak menyasar pada peningkatan kesejahteraan rakyat secara merata","C":"Terjadi polarisasi politik yang mengakibatkan konflik antar kelompok masyarakat","D":"Pendidikan karakter dan moral tidak menjadi prioritas dalam sistem pendidikan nasional","E":"Pemerintah tidak mampu menegakkan supremasi hukum dan menciptakan tata kelola yang baik"},"answer":"A","category":"Pancasila","explanation":"Penerapan Pancasila akan terhambat jika nilai-nilainya belum dipahami dan diinternalisasi oleh masyarakat.","type":"single","categoryLabel":"Pancasila"},{"number":35,"text":"Pemuda desa Suka Damai sering mengalami konflik karena adanya perbedaan agama dan kepercayaan. Untuk mengatasinya kepala desa, tokoh masyarakat, serta pemuda desa melakukan sebuah kegiatan bersama yang melibatkan warga dari berbagai latar belakang agama dan kepercayaan. Tujuan utama dari kegiatan tersebut adalah ....","options":{"A":"Meningkatkan partisipasi seluruh warga dalam pembangunan desa","B":"Mengurangi tingkat pengangguran pemuda di desa tersebut","C":"Membentuk generasi muda yang menghargai keberagaman","D":"Mengembangkan potensi ekonomi desa melalui sektor pariwisata","E":"Meningkatkan infrastruktur dan fasilitas umum desa oleh generasi muda"},"answer":"C","category":"Pancasila","explanation":"Kegiatan bersama lintas agama dan kepercayaan bertujuan menumbuhkan sikap saling menghargai keberagaman.","type":"single","categoryLabel":"Pancasila"},{"number":36,"text":"Pancasila sebagai dasar negara memiliki hubungan yang erat dengan Pembukaan UUD NRI Tahun 1945 sebagai konstitusi tertulis yang menjadi pondasi hukum di Indonesia. Secara praksis, hubungan antara keduanya adalah....","options":{"A":"Pancasila terwujud sebagai ideologi negara yang mencerminkan nilai-nilai yang ada dalam Pembukaan UUD NRI Tahun 1945.","B":"Pembukaan UUD NRI Tahun 1945 merupakan bagian dari proses sejarah yang menguatkan Pancasila sebagai dasar negara.","C":"Pembukaan UUD NRI Tahun 1945 menggambarkan komitmen bangsa Indonesia untuk mewujudkan cita-cita Pancasila.","D":"Pancasila merupakan dasar filosofis yang melandasi Pembukaan UUD NRI Tahun 1945.","E":"Pembukaan UUD NRI Tahun 1945 dan Pancasila merupakan dua elemen yang saling melengkapi dalam penyelenggaraan negara."},"answer":"D","category":"Pancasila","explanation":"Pancasila merupakan dasar filosofis yang melandasi Pembukaan UUD NRI Tahun 1945.","type":"single","categoryLabel":"Pancasila"},{"number":37,"text":"Dalam perkembangan zaman dan aspirasi masyarakat yang semakin dinamis, suatu ideologi yang ingin bertahan dan relevan harus memenuhi beberapa syarat. Syarat-syarat tersebut adalah ....","options":{"A":"Memiliki ciri konservatif dan kaku dalam menjaga nilai-nilai tradisional","B":"Menolak perubahan dan inovasi sebagai upaya mempertahankan keasliannya","C":"Fleksibel dan mampu beradaptasi dengan perubahan zaman dan tuntutan masyarakat","D":"Tidak mampu berubah dan berkembang sesuai dengan perkembangan zaman","E":"Menetapkan nilai-nilai yang bersifat absolut dan tidak dapat ditawar-tawar"},"answer":"C","category":"Pancasila","explanation":"Ideologi yang bertahan harus fleksibel dan mampu menyesuaikan diri dengan perubahan zaman.","type":"single","categoryLabel":"Pancasila"},{"number":38,"text":"Ideologi yang kokoh akan membentuk masyarakat yang kuat dan solid, serta mampu menghadapi berbagai tantangan. Oleh karena itu, Pancasila sebagai ideologi negara harus tetap dipegang teguh. Hal tersebut menunjukkan bahwa ideologi memiliki peran sebagai ....","options":{"A":"Penentu kebijakan umum","B":"Sumber tuntunan hidup","C":"Pola kehidupan masyarakat","D":"Jaminan kesejahteraan rakyat","E":"Sumber motivasi dan semangat"},"answer":"B","category":"Pancasila","explanation":"Ideologi berfungsi sebagai pedoman atau tuntunan hidup dalam kehidupan bermasyarakat, berbangsa, dan bernegara.","type":"single","categoryLabel":"Pancasila"},{"number":39,"text":"Sebagai konsumen yang baik di era global, warga negara Indonesia harus memiliki sikap yang bijak dalam memilih dan menggunakan barang impor. Sebagai seorang konsumen yang bijak, sikap yang seharusnya dikembangkan warga negara Indonesia terhadap barang impor adalah ....","options":{"A":"Mengutamakan produk lokal untuk mendukung pertumbuhan ekonomi dalam negeri","B":"Menolak barang impor dengan alasan memprioritaskan ketersediaan lapangan kerja","C":"Menerima semua barang impor tanpa mempertimbangkan asal negara dan kualitasnya","D":"Mengurangi penggunaan barang impor sebagai bentuk nasionalisme ekonomi","E":"Memilih barang impor yang memiliki kualitas baik dan harga yang terjangkau, sejalan dengan kebutuhan dan kemampuan ekonomi"},"answer":"A","category":"Ekonomi","explanation":"Sikap bijak yang sesuai semangat nasionalisme ekonomi adalah mengutamakan produk lokal untuk mendukung perekonomian dalam negeri.","type":"single","categoryLabel":"Ekonomi"},{"number":40,"text":"Dalam menghadapi era globalisasi, tantangan terbesar bagi bangsa Indonesia adalah memastikan kesejahteraan rakyat dan keberlanjutan lingkungan hidup. Penerapan nilai-nilai Pancasila yang sesuai dengan kebijakan tersebut adalah ....","options":{"A":"Mendorong eksploitasi sumber daya alam tanpa batasan demi meningkatkan pertumbuhan ekonomi","B":"Mengabaikan keberagaman budaya lokal demi menarik investasi asing agar lebih maju","C":"Melarang penggunaan teknologi informasi dan komunikasi demi melindungi identitas budaya bangsa","D":"Menerapkan kebijakan pembangunan berkelanjutan yang mengintegrasikan pertumbuhan ekonomi, keadilan sosial, dan pelestarian lingkungan","E":"Membatasi akses pendidikan dan peluang kerja bagi kelompok-kelompok tertentu demi mengurangi pengaruh budaya asing"},"answer":"D","category":"Pancasila","explanation":"Pembangunan berkelanjutan menggabungkan ekonomi, keadilan sosial, dan pelestarian lingkungan.","type":"single","categoryLabel":"Pancasila"},{"number":41,"text":"Memiliki warna abu-abu, putih, kuning, fragmen pembentuk batuan terdiri dari material membundar berukuran 2->256 mm. Batuan memiliki ciri tersebut adalah batuan ....","options":{"A":"Claystone","B":"Shale","C":"Sandstone","D":"Conglomerate","E":"Breksi"},"answer":"D","category":"Geologi","explanation":"Konglomerat tersusun dari fragmen batuan membundar berukuran besar.","type":"single","categoryLabel":"Geologi"},{"number":42,"text":"Santalum album merupakan nama latin untuk flora....","options":{"A":"Sedap malam","B":"Sirih","C":"Lontar","D":"Cendana","E":"Matoa"},"answer":"D","category":"Biologi","explanation":"Santalum album adalah nama ilmiah cendana.","type":"single","categoryLabel":"Biologi"},{"number":43,"text":"Adaptasi apa yang memungkinkan ikan hiu untuk mendeteksi mangsa yang tersembunyi di pasir laut....","options":{"A":"Sirip panjang untuk meluncur secara efisien","B":"Memiliki rahang yang sangat kuat","C":"Kulit yang kasar untuk perlindungan","D":"Kemampuan untuk mendeteksi medan listrik yang dihasilkan oleh mangsa (elektroreseptor)","E":"Kelenjar garam untuk mengatur keseimbangan elektrolit"},"answer":"D","category":"Biologi","explanation":"Hiu memiliki elektroreseptor yang dapat mendeteksi medan listrik dari mangsa.","type":"single","categoryLabel":"Biologi"},{"number":44,"text":"Gaya listrik antara dua benda bermuatan, berbanding lurus dengan perkalian jumlah muatan pada benda dan berbanding terbalik dengan kuadrat jarak pisah antara kedua benda. Pernyataan tersebut dikenal dengan hukum....","options":{"A":"Dulong Petit","B":"Kirchhoff","C":"Galilei","D":"Coulomb","E":"Bernaouilli"},"answer":"D","category":"Fisika","explanation":"Hubungan gaya listrik dua muatan dijelaskan oleh Hukum Coulomb.","type":"single","categoryLabel":"Fisika"},{"number":45,"text":"Indonesia merupakan salah satu negara yang memiliki wilayah laut sangat luas. Laut tersebut memiliki morfologi yang salah satunya dapat dikategorikan berdasarkan bentuknya. Morfologi laut yang memiliki ciri kumpulan dataran tinggi yang ada di laut dan terdiri dari dua jenis yakni rise dan ridge disebut dengan ....","options":{"A":"Palung laut","B":"Lubuk laut","C":"Ambang laut","D":"Punggung laut","E":"Paparan benua"},"answer":"D","category":"Geografi","explanation":"Rise dan ridge termasuk bentuk punggung laut.","type":"single","categoryLabel":"Geografi"},{"number":46,"text":"Pengendara mobil memiliki resiko besar ketika terjadi kecelakaan lalu lintas. Solusi yang tepat untuk mengatasi hal yang terkait dengan konsep hukum I Newton adalah....","options":{"A":"Penggunaan suspensi daun","B":"Menggunakan rem cakram pada roda","C":"Memperbesar down force mobil","D":"Penggunaan sabuk pengaman","E":"Pemanfaatan teknologi ABS pada sistem pengereman"},"answer":"D","category":"Fisika","explanation":"Sabuk pengaman mengurangi risiko akibat inersia tubuh saat kendaraan berhenti mendadak.","type":"single","categoryLabel":"Fisika"},{"number":47,"text":"Untuk membuat sebuah vas bunga dengan bahan dasar tanah liat, dapat menggunakan teknik berikut ini, kecuali ....","options":{"A":"Membentuk","B":"Putar","C":"Membutsir","D":"Mencetak","E":"Memilin"},"answer":"C","category":"Seni Budaya","explanation":"Teknik utama pembuatan vas tanah liat meliputi putar, cetak, pilin, dan pembentukan. Membutsir lebih berkaitan dengan teknik pahat/ukir atau penyelesaian bentuk.","type":"single","categoryLabel":"Seni Budaya"},{"number":48,"text":"Musik dangdut adalah jenis musik yang tidak termasuk ke dalam jenis musik tradisional nusantara karena....","options":{"A":"Dipengaruhi oleh jenis musik dari Eropa","B":"Musik tersebut berasal dari India","C":"Tidak mencerminkan budaya asli bangsa Indonesia","D":"Aslinya musik tersebut adalah musik Melayu","E":"Menggunakan alat-alat musik modern"},"answer":"B","category":"Seni Budaya","explanation":"Dangdut banyak dipengaruhi unsur musik India sehingga tidak digolongkan sebagai musik tradisional murni Nusantara dalam soal ini.","type":"single","categoryLabel":"Seni Budaya"},{"number":49,"text":"Benua kuning adalah sebutan bagi benua....","options":{"A":"Afrika","B":"Amerika","C":"Antartika","D":"Asia","E":"Eropa"},"answer":"D","category":"Geografi","explanation":"Benua kuning adalah sebutan untuk Asia.","type":"single","categoryLabel":"Geografi"},{"number":50,"text":"Kawasan hutan dengan ciri khas tertentu, yang mempunyai fungsi pokok pengawetan keanekaragaman tumbuhan dan satwa serta ekosistemnya disebut dengan....","options":{"A":"Hutan lindung","B":"Kawasan lindung","C":"Kawasan konservasi","D":"Hutan konservasi","E":"Kawasan suaka alam"},"answer":"D","category":"Lingkungan","explanation":"Definisi tersebut adalah hutan konservasi.","type":"single","categoryLabel":"Lingkungan"}];
