window.__SOAL_TEMPLATE_CONFIG = {"title":"Paket Kepri 3 - JAGOPSI","examType":"KEPRI","examName":"Kepribadian Paket 3","examFile":"kepri3.html","packageCode":"KEPRI_3","sectionLabel":"Kepribadian","introTitle":"Template Kepribadian","introText":"Soal kepribadian ditampilkan dengan format seragam seperti soal.html, khusus satu bagian kepribadian.","durationMinutes":35,"scoringMode":"points","extraPaths":["hasil_kepri"],"sessionSize":74,"randomBank":false,"requireLogin":true,"requireVIP":true,"vipMessage":"Kepribadian Paket 3 hanya untuk akun VIP.","storageKey":"kepri3_fixed_session_v2","backUrl":"kepribadian_list.html"};
window.__SOAL_TEMPLATE_QUESTIONS = [{"number":1,"text":"Dua bulan lagi akan dilaksanakan UAS bersamaan dengan dibukanya penerimaan Polri yang merupakan profesi impian Anda. Jadwal penerimaan Polri di luar prediksi Anda karena sebelumnya penerimaan akan dibuka setelah UAS. Sementara itu persiapan menghadapi UAS masih belum maksimal. Apa yang akan Anda lakukan?","options":{"A":"Meminta pendapat orang tua untuk menentukan pilihan atas kebingungan yang dialami.","B":"Belajar dan latihan lebih giat agar semuanya dapat terlaksana sesuai dengan keinginan.","C":"Membuat jadwal belajar dan latihan serta menetapkan target agar keduanya tercapai.","D":"Mempersiapkan diri untuk mendaftar Polri tahun depan agar hasil lebih maksimal."},"points":{"A":2,"B":4,"C":3,"D":1},"key":"B"},{"number":2,"text":"Saat mengendarai motor menuju sekolah, Anda melihat teman sekelas mendorong sepeda motor yang bannya kempes di lokasi yang berjarak dua kilometer dari sekolah. Anda sedang terburu-buru karena akan ada ujian Matematika pada jam pertama yang akan dimulai 15 menit lagi. Apa yang akan Anda lakukan?","options":{"A":"Membantunya karena selama ini ia baik kepada Anda.","B":"Berhenti dan memberikan uang untuk ke bengkel.","C":"Mengantar ke bengkel dan mengajak berangkat bersama.","D":"Mempercepat laju kendaraan agar sampai tepat waktu."},"points":{"A":2,"B":3,"C":4,"D":1},"key":"C"},{"number":3,"text":"Anda sudah memiliki rencana untuk pergi liburan ke pantai bersama keluarga pada hari Minggu. Tiba-tiba wali kelas menelepon Anda untuk pergi ke sekolah. Wali kelas meminta Anda berlatih menjadi petugas upacara untuk menggantikan teman satu kelas yang sedang opname. Padahal Anda dan keluarga sudah merencanakan liburan dari jauh hari. Apa yang akan Anda lakukan?","options":{"A":"Mencoba pergi ke sekolah dengan konsekuensi harus merelakan liburan bersama keluarga.","B":"Tetap pergi ke sekolah karena berwisata dengan keluarga bisa dilakukan di lain waktu.","C":"Berusaha pergi ke sekolah karena menjadi petugas upacara hal yang biasa dilakukan.","D":"Memilih pergi ke sekolah karena wali kelas tersebut adalah guru favorit di sekolah."},"points":{"A":3,"B":4,"C":2,"D":1},"key":"B"},{"number":4,"text":"Anda adalah ketua ekstrakurikuler paduan suara di sekolah dan sering memenangkan perlombaan tingkat kota. Anda diminta untuk menjadi ketua ekstrakurikuler seni drama yang selama ini belum pernah meraih prestasi. Pihak sekolah meminta untuk membuat ekstrakurikuler seni drama berprestasi sama seperti ekstrakurikuler paduan suara. Apa yang akan Anda lakukan?","options":{"A":"Menerapkan beberapa sistem di ekstrakurikuler paduan suara yang sesuai pada ekstrakurikuler seni drama.","B":"Melakukan beberapa perbaikan dari sistem yang sudah ada untuk meningkatkan kualitas ekstrakurikuler seni drama.","C":"Membutuhkan waktu untuk mempelajari bagaimana sistem yang akan diterapkan di ekstrakurikuler seni drama.","D":"Sepenuhnya memberlakukan sistem seperti di ekstrakurikuler paduan suara pada ekstrakurikuler seni drama."},"points":{"A":3,"B":4,"C":2,"D":1},"key":"B"},{"number":5,"text":"Teman Anda dirawat di rumah sakit, namun karena keluarganya jauh sehingga tidak ada yang menjaganya. Di sisi lain Anda ingin menjaga teman, namun sebagai kapten Anda harus memimpin dan berlatih untuk turnamen basket tingkat provinsi. Apa yang akan Anda lakukan?","options":{"A":"Menjaga teman yang sakit dan mengganti jadwal latihan tim basket di hari berikutnya.","B":"Menjaga teman yang sakit karena suatu saat ia akan melakukan hal yang sama kepada Anda.","C":"Meminta teman lain menggantikan Anda untuk menjaga teman di rumah sakit karena harus latihan.","D":"Meninggalkan latihan karena diminta menjaga di rumah sakit oleh orang tua teman."},"points":{"A":4,"B":2,"C":3,"D":1},"key":"A"},{"number":6,"text":"Anda dan teman-teman satu kelompok sepakat untuk berwisata ke suatu tempat. Ada salah satu teman menyampaikan keberatan dengan alasan biaya. Demi kebersamaan, Anda dan teman-teman sepakat untuk menanggung biayanya. Saat persiapan sudah matang dan tinggal dua hari lagi keberangkatan, teman Anda mengatakan bahwa ia tidak bisa ikut pergi dengan alasan yang tidak jelas. Apa yang akan Anda lakukan?","options":{"A":"Memahami alasan teman dan tetap melanjutkan wisata sesuai rencana awal.","B":"Berusaha memahami perasaan teman karena kebetulan ia pernah menolong Anda.","C":"Menegur teman tersebut karena ia telah menyia-nyiakan pengorbanan teman.","D":"Memaklumi karena alasan biaya seharusnya menjadi petunjuk ketidakhadirannya."},"points":{"A":4,"B":2,"C":1,"D":3},"key":"A"},{"number":7,"text":"Saat perjalanan menuju sekolah motor Anda mengalami pecah ban. Padahal Anda membawa bahan yang dibutuhkan untuk presentasi tugas kelompok di jam pertama. Anda masih harus menempuh jarak 3 km untuk menuju sekolah, sementara jam pelajaran pertama akan dimulai 15 menit lagi. Apa yang akan Anda lakukan?","options":{"A":"Memeriksa dan mencari tahu penyebab dari ban motor yang pecah.","B":"Menelepon keluarga untuk menyampaikan kendala yang terjadi.","C":"Berusaha mendorong motor sambil mencari tukang tambal ban.","D":"Menelepon teman kelompok untuk mengambil bahan presentasi."},"points":{"A":1,"B":2,"C":3,"D":4},"key":"D"},{"number":8,"text":"Anda dan teman sudah merencanakan untuk makan di salah satu kafe yang viral di kota Anda. Rencana tersebut sudah dibuat dari jauh hari dan Anda sudah meluangkan waktu di hari itu. Anda sudah tiba di kafe, namun teman tidak dapat dihubungi. Ternyata teman memberi kabar bahwa ia ketiduran, padahal Anda sudah menunggu lama di kafe tersebut. Apa yang akan Anda lakukan?","options":{"A":"Menyampaikan kekesalan karena waktu terbuang untuk menunggu.","B":"Bersikap tenang karena rencana yang sudah disusun tidak semua bisa terwujud.","C":"Menenangkan diri dengan menikmati makanan dan minuman di kafe tersebut.","D":"Mencoba menerima hal tersebut asalkan teman meminta maaf."},"points":{"A":1,"B":4,"C":3,"D":2},"key":"B"},{"number":9,"text":"Anda baru pertama kali mengikuti seleksi anggota Polri dan berasal dari luar kota. Selama ini Anda sering kesulitan menjangkau lokasi tes, harus berangkat pagi, menunggu pelaksanaan tes yang lama, dan pulang larut malam. Anda sudah berusaha keras namun nilai seleksi yang Anda peroleh kurang memuaskan. Apa yang akan Anda lakukan?","options":{"A":"Mempersiapkan diri pada tahapan seleksi berikutnya untuk meningkatkan bobot nilai secara keseluruhan.","B":"Menyelesaikan hingga seleksi tahap akhir karena menurut orang tua menjadi anggota Polri merupakan hal yang baik.","C":"Memilih untuk berhenti melanjutkan tahapan seleksi berikutnya sembari mencari alternatif pekerjaan lain.","D":"Bertahan sampai akhir seleksi karena hal ini merupakan tantangan untuk menjadi anggota Polri."},"points":{"A":3,"B":2,"C":1,"D":4},"key":"D"},{"number":10,"text":"Anda ditunjuk oleh wali kelas sebagai penanggung jawab acara makan bersama dengan teman-teman kelas. Saat diskusi, beberapa teman mengusulkan untuk makan bersama di restoran yang sebelumnya karena rasanya sudah terjamin enak. Teman yang lain mengusulkan restoran terbaru karena mendapat promo tetapi belum mengetahui bagaimana rasanya. Apa yang akan Anda lakukan?","options":{"A":"Mencari restoran lain yang jaraknya lebih dekat dari sekolah.","B":"Membandingkan kedua restoran tersebut dari segi kualitas dan harga.","C":"Memilih restoran dengan pemilihan suara terbanyak dari teman-teman.","D":"Memilih makan bersama di restoran sebelumnya karena sudah pasti enak."},"points":{"A":1,"B":3,"C":4,"D":2},"key":"C"},{"number":11,"text":"Anda adalah kakak laki-laki yang memiliki adik berusia 5 tahun dengan jarak 12 tahun. Beberapa saat sebelum berangkat sekolah, adik Anda mengalami demam hingga terbaring lemas di ruang tamu. Ayah Anda sudah pergi ke kantor untuk memimpin rapat penting dan ibu Anda sudah berangkat lebih pagi untuk berdagang di pasar. Dengan kondisi tersebut, apa yang akan Anda lakukan?","options":{"A":"Menelepon ibu untuk pulang menjaga adik karena Anda harus berangkat sekolah.","B":"Bersedia menjaga adik agar nantinya ayah dan ibu memberikan pujian.","C":"Menjaga adik karena khawatir dengan kondisi yang dialaminya.","D":"Meminta izin kepada wali kelas untuk menjaga adik yang sakit."},"points":{"A":2,"B":1,"C":3,"D":4},"key":"D"},{"number":12,"text":"Anda adalah kapten tim voli sekolah. Berdasarkan beberapa pertandingan terakhir, pelatih menilai Anda kurang memberikan semangat kepada anggota tim karena Anda terlalu fokus pada permainan sendiri. Padahal turnamen antar sekolah akan segera dilaksanakan. Apa yang akan Anda lakukan?","options":{"A":"Masukan dari pelatih menunjukkan saya harus mengevaluasi diri dalam berlatih voli.","B":"Mengevaluasi diri dan meminta masukan dari pelatih tentang hal yang sebaiknya dilakukan.","C":"Mengutamakan pada kemampuan fisik agar tidak mudah terganggu komentar orang lain.","D":"Pelatih cenderung mendengarkan orang lain tanpa mendengarkan dari sisi Anda."},"points":{"A":3,"B":4,"C":2,"D":1},"key":"B"},{"number":13,"text":"Anda adalah seorang ketua OSIS. Suatu hari Anda dimarahi guru yang terkenal galak tanpa tahu penyebabnya sehingga Anda merasa kesal. Padahal sebentar lagi Anda harus memimpin rapat tentang kekurangan dana untuk suatu acara. Apa yang akan Anda lakukan?","options":{"A":"Mengendalikan emosi yang dirasakan dan memimpin rapat sesuai jadwal.","B":"Memimpin rapat sesuai rencana karena dimarahi guru adalah hal yang biasa.","C":"Menunda rapat hingga siap memimpin rapat dengan kondisi yang tenang.","D":"Membatalkan rapat karena perlu waktu untuk menenangkan pikiran dan perasaan."},"points":{"A":4,"B":3,"C":2,"D":1},"key":"A"},{"number":14,"text":"Anda dan teman Anda akan mengikuti ujian masuk perguruan tinggi. Saat ujian hampir dimulai, tiba-tiba teman Anda kehilangan pensil 2B satu-satunya yang ia miliki. Padahal LJK harus diisi menggunakan pensil 2B. Teman Anda meminjam satu pensil kepada Anda namun Anda hanya membawa dua pensil dan sebuah rautan. Apa yang akan Anda lakukan?","options":{"A":"Menyarankan meminjam kepada orang lain.","B":"Mematahkan pensil kemudian memberikannya.","C":"Meminjamkan satu pensil 2B kepadanya.","D":"Meminjamkan jika ia mau berbagi jawaban."},"points":{"A":3,"B":2,"C":4,"D":1},"key":"C"},{"number":15,"text":"Anda murid kelas XII semester I. Anda dan teman-teman mengeluh tentang guru Matematika yang tidak menyenangkan dalam mengajar karena tidak komunikatif serta penjelasannya membingungkan. Hal itu menyebabkan Anda dan teman-teman merasa kesulitan memahami pelajaran, padahal dua minggu lagi akan ujian. Apa yang akan Anda lakukan?","options":{"A":"Tidak mempermasalahkan hal tersebut karena semua murid merasakan hal yang sama.","B":"Menentukan jadwal belajar tambahan bersama teman-teman untuk persiapan ujian.","C":"Mendiskusikan bersama teman-teman terkait kendala yang sedang dihadapi.","D":"Menceritakan keadaan kelas kepada guru lain dan meminta saran serta masukan."},"points":{"A":1,"B":4,"C":2,"D":3},"key":"B"},{"number":16,"text":"Anda bertugas sebagai panitia pembuatan buku tahunan. Dalam rapat persiapan, Anda mengajukan beberapa nama vendor yang mampu menyelesaikan buku tahunan sesuai jadwal. Semua vendor yang Anda ajukan mendapat catatan negatif dari peserta rapat sementara pilihan vendor yang Anda miliki sudah habis. Apa yang akan Anda lakukan?","options":{"A":"Berdiskusi dengan guru dan alumni terkait vendor lain yang pernah digunakan.","B":"Mencari vendor lain dengan mencari tahu ulasan vendor yang akan digunakan.","C":"Berusaha meyakinkan peserta rapat untuk meninjau kembali semua vendor yang diajukan.","D":"Menyerahkan keputusan kepada peserta rapat untuk mencari vendor lain."},"points":{"A":4,"B":3,"C":2,"D":1},"key":"A"},{"number":17,"text":"Pada akhir semester, sekolah mengadakan pentas seni. Kelas Anda akan menampilkan seni musik. Anda diminta oleh wali kelas untuk menampilkan kemampuan Anda bermain biola karena wali kelas tahu Anda mengikuti les biola. Anda merasa belum mahir bermain biola, namun pelaksanaan pentas sudah dekat. Apa yang akan Anda lakukan?","options":{"A":"Bertanya pada guru les tentang keyakinan diri dalam menampilkan seni musik biola.","B":"Meminta wali kelas untuk menunjuk teman lain daripada Anda tampil kurang maksimal.","C":"Menerima menjadi perwakilan kelas untuk menampilkan seni musik biola.","D":"Menantang diri Anda mengikuti pentas seni dengan kemampuan yang dimiliki."},"points":{"A":2,"B":1,"C":3,"D":4},"key":"D"},{"number":18,"text":"Anda diminta membuat karya seni miniatur bangunan pada pelajaran seni rupa. Waktu yang diberikan satu minggu dan dikerjakan secara berkelompok. Selain itu ada tugas individu mata pelajaran lain yang juga harus diselesaikan. Teman kelompok tidak ada yang mau ikut serta mengerjakan tugas tersebut. Apa yang akan Anda lakukan?","options":{"A":"Mencoba tenang menyikapi kondisi tersebut dan mengajak kelompok untuk menyelesaikan tugas.","B":"Memperingati teman-teman untuk menyelesaikan tugas karena itu adalah tanggung jawab kelompok.","C":"Berusaha tenang dan menyampaikan kepada kelompok bahwa tugas tersebut juga memiliki nilai.","D":"Bersikap tenang dan berdiskusi dengan kelompok jika dikerjakan bersama pasti akan selesai."},"points":{"A":3,"B":1,"C":2,"D":4},"key":"D"},{"number":19,"text":"Sebagai bendahara OSIS, Anda ditugaskan membuat kaos angkatan. Ketua OSIS menyarankan agar Anda bekerja sama dengan konveksi yang digunakan tahun lalu karena kualitasnya terjamin. Pihak konveksi menyampaikan ada kenaikan harga sehingga dana yang terkumpul tidak mencukupi. Apa yang akan Anda lakukan?","options":{"A":"Menyerahkan proses pembuatan kaos angkatan kepada ketua OSIS.","B":"Mengikuti saran yang telah diberikan oleh ketua OSIS.","C":"Mencari alternatif konveksi lain sesuai dengan dana yang terkumpul.","D":"Mencari konveksi dengan membandingkan kualitas dan biaya pengerjaan."},"points":{"A":1,"B":2,"C":4,"D":3},"key":"C"},{"number":20,"text":"Pada saat HUT RI, sekolah Anda mengadakan upacara di lapangan sekolah. Anda terpilih untuk menjadi pengibar bendera beserta dua orang teman lainnya. Namun Anda belum pernah bertugas menjadi pengibar bendera. Anda merasa kemampuan baris-berbaris yang dimiliki kurang sempurna, sedangkan kedua teman Anda adalah anggota paskibraka. Apa yang akan Anda lakukan?","options":{"A":"Menyayangkan nama Anda terpilih karena belum berpengalaman menjadi petugas upacara.","B":"Mempersiapkan diri dan menjadwalkan latihan dengan kedua teman agar kemampuan baris-berbaris menjadi sempurna.","C":"Berlatih lebih sering agar dapat tampil optimal saat upacara karena ini kesempatan langka agar dapat meningkatkan kemampuan.","D":"Bersedia menjadi petugas dengan syarat kedua teman lain melatih gerakan baris-berbaris agar dapat tampil sempurna."},"points":{"A":1,"B":3,"C":4,"D":2},"key":"C"},{"number":21,"text":"Anda merupakan siswa SMA semi militer yang baru saja masuk. Anda mengetahui bahwa di sekolah barunya ini terdapat tes jasmani seperti lari, chin up, shuttle run, dimana hal itu tidak pernah Anda lakukan sebelumnya. Tes tersebut menjadi penilaian wajib setiap tiga bulan sekali. Apa yang akan Anda lakukan?","options":{"A":"Menyampaikan kendala yang dialami kepada orang tua saat bersekolah di SMA semi militer.","B":"Berusaha melakukan tes jasmani karena orang tua selalu mendukung kegiatan positif di sekolah.","C":"Berlatih dan menyadari manfaat dari tes jasmani selain untuk penilaian juga bermanfaat untuk kesehatan tubuh.","D":"Mencoba melakukan dengan optimal sesuai kemampuan untuk mencapai target penilaian."},"points":{"A":1,"B":2,"C":4,"D":3},"key":"C"},{"number":22,"text":"Anda ditunjuk oleh wali kelas untuk mewakili sekolah dalam kompetisi debat. Menurut wali kelas, Anda termasuk siswa yang aktif, kritis dan memiliki kemampuan komunikasi yang baik. Namun Anda tidak pernah memiliki pengalaman mengikuti kompetisi sebelumnya. Wali kelas menaruh harapan kepada Anda karena ini adalah kompetisi bergengsi. Apa yang akan Anda lakukan?","options":{"A":"Melakukan persiapan dengan bertanya kepada teman yang pernah mengikuti kompetisi debat.","B":"Memotivasi diri serta meminta umpan balik dari wali kelas dan teman agar dapat berlatih dengan maksimal.","C":"Menerima tawaran tersebut jika diberikan pendampingan selama persiapan latihan kompetisi debat.","D":"Menyampaikan kekhawatiran kepada wali kelas karena merasa belum berpengalaman."},"points":{"A":3,"B":4,"C":2,"D":1},"key":"B"},{"number":23,"text":"Anda sebagai ketua seksi acara dalam pentas seni sekolah. Akan tetapi 20 menit sebelum acara stand up comedy, tiba-tiba komika yang akan mengisi membatalkan penampilan karena jatuh sakit. Padahal sebelum acara dimulai Anda sudah memastikan dan melaporkan kepada ketua pelaksana bahwa semua pengisi acara telah siap. Apa yang akan Anda lakukan?","options":{"A":"Menunggu arahan tentang tindakan yang harus dilakukan dari ketua pelaksana.","B":"Menanyakan teman-teman tentang komika yang dapat segera menggantikan.","C":"Menghapus stand up comedy dari susunan acara dan melanjutkan ke acara selanjutnya.","D":"Menyarankan ketua pelaksana untuk meminta maaf pada penonton."},"points":{"A":1,"B":4,"C":3,"D":2},"key":"B"},{"number":24,"text":"Anda merupakan anak dari seorang petani. Anda diwajibkan membantu pekerjaan orang tua setiap pulang sekolah. Saat ini Anda membutuhkan barang-barang baru untuk sekolah dan berinisiatif menjadi juru parkir untuk menambah uang. Saat ini memasuki musim panen sehingga Anda akan sibuk membantu orang tua. Apa yang akan Anda lakukan?","options":{"A":"Bercerita kepada orang tua dan mengatakan Anda perlu beli perlengkapan sekolah.","B":"Mengusahakan untuk tetap membantu orang tua agar keuntungan panen membantu membeli kebutuhan.","C":"Membantu orang tua dengan maksimal, setelah selesai langsung bergegas menjadi juru parkir.","D":"Menjadi juru parkir untuk memenuhi kebutuhan barang baru untuk sekolah."},"points":{"A":2,"B":3,"C":4,"D":1},"key":"C"},{"number":25,"text":"Anda dan sahabat sudah lama berteman sejak duduk di sekolah dasar dan sedang mengikuti seleksi beasiswa untuk melanjutkan pendidikan ke universitas. Anda merasa senang ketika sahabat mengikuti seleksi ini karena Anda mendukung sahabat untuk mencapai cita-citanya. Namun ternyata sahabat menganggap Anda sebagai saingan yang menyulitkannya karena kemampuan Anda jauh lebih pintar. Apa yang akan Anda lakukan?","options":{"A":"Mengalihkan emosi yang dirasakan dengan belajar lebih baik untuk persiapan seleksi.","B":"Tetap fokus mengikuti seleksi beasiswa agar dapat lulus sesuai harapan Anda.","C":"Mencoba bersaing sehat dan merasa kecewa dengan sahabat mengapa ia begitu.","D":"Merasa sedih dan kecewa karena itu adalah emosi yang wajar dalam situasi tersebut."},"points":{"A":2,"B":4,"C":3,"D":1},"key":"B"},{"number":26,"text":"Anda ditunjuk sebagai perwakilan sekolah untuk mengikuti Jambore Nasional di Jatinangor selama 5 hari. Pada pelaksanaannya, seluruh peserta Jambore dibagi menjadi beberapa regu yang anggotanya berasal dari berbagai sekolah dan daerah yang berbeda. Sedangkan Anda baru pertama kali berinteraksi dengan orang dari berbagai daerah. Apa yang akan Anda lakukan?","options":{"A":"Mempelajari bahasa sapaan dari berbagai daerah agar dapat berkomunikasi dengan teman satu regu.","B":"Melibatkan diri dengan membangun komunikasi untuk mempelajari ragam budaya dari teman satu regu.","C":"Mencari tahu peserta Jambore berasal dari daerah mana saja agar bisa menyesuaikan saat berkomunikasi.","D":"Meminta pendampingan dari guru untuk menemani selama kegiatan Jambore berlangsung."},"points":{"A":3,"B":4,"C":2,"D":1},"key":"B"},{"number":27,"text":"Sebagai ketua seksi perlengkapan HUT Sekolah, Anda bertanggung jawab terhadap sound system yang akan digunakan pada puncak acara. Pada saat gladi, salah satu sound system tidak berfungsi. Sementara itu dana perlengkapan hampir habis. Apa yang akan Anda lakukan?","options":{"A":"Mencari sound system pengganti dengan sisa dana yang tersedia.","B":"Berusaha mencari orang untuk memperbaiki sound system yang rusak.","C":"Menunggu saran tindakan yang harus dilakukan dari ketua panitia.","D":"Menggunakan sound system seadanya karena dana perlengkapan hampir habis."},"points":{"A":4,"B":3,"C":2,"D":1},"key":"A"},{"number":28,"text":"Anda adalah murid kelas XII di SMA Negeri. Anda terbilang menonjol dalam pelajaran Bahasa Inggris di kelas Anda. Anda ditunjuk sebagai perwakilan sekolah untuk mengikuti lomba Bahasa Inggris tingkat kabupaten. Anda belum pernah mengikuti perlombaan Bahasa Inggris sebelumnya padahal perlombaan akan dilaksanakan sepuluh hari lagi. Apa yang akan Anda lakukan?","options":{"A":"Memberikan kesempatan pada teman lain yang pernah mengikuti perlombaan Bahasa Inggris.","B":"Menerima untuk menjadi perwakilan sekolah untuk mengikuti perlombaan dan berusaha semaksimal mungkin.","C":"Meminta guru Bahasa Inggris menemani proses latihan dan mencari informasi pada yang pernah mengikuti perlombaan.","D":"Menerima untuk menjadi perwakilan sekolah asalkan guru Bahasa Inggris membantu latihan."},"points":{"A":1,"B":4,"C":3,"D":2},"key":"B"},{"number":29,"text":"Wali kelas menunjuk Anda sebagai pengganti salah satu anggota tim cerdas cermat yang akan mewakili sekolah di tingkat kabupaten dalam dua minggu lagi. Selama ini Anda belum pernah mengikuti cerdas cermat. Anda juga merasa kemampuan Anda jauh di bawah kemampuan peserta yang Anda gantikan. Apa yang akan Anda lakukan?","options":{"A":"Bersedia menjadi anggota pengganti dengan syarat pihak sekolah memberikan bimbingan materi secara terus-menerus.","B":"Menerima permintaan tersebut dan berusaha mengikuti cerdas cermat sesuai dengan kemampuan yang dimiliki.","C":"Mempersiapkan diri secara optimal sebelum perlombaan dimulai bersama anggota tim cerdas cermat.","D":"Bernegosiasi dengan wali kelas untuk mencari pengganti lain karena khawatir akan mempengaruhi performa tim cerdas cermat."},"points":{"A":2,"B":3,"C":4,"D":1},"key":"C"},{"number":30,"text":"Penerimaan anggota Polri telah dibuka. Anda berkeinginan mendaftar dan sudah mempersiapkan diri beberapa bulan sebelumnya. Anda sudah membuat jadwal latihan dan belajar untuk persiapan tes. Namun saat ini Anda sakit dan kondisi Anda membutuhkan istirahat total. Apa yang akan Anda lakukan?","options":{"A":"Tetap mengikuti jadwal latihan dan belajar yang telah ditentukan dalam kondisi sakit.","B":"Mengatur ulang jadwal latihan dengan mengurangi durasi dalam kondisi sakit.","C":"Melakukan pemulihan terlebih dahulu setelahnya fokus latihan dengan optimal.","D":"Mengikuti jadwal latihan dan belajar semampunya di tengah proses pemulihan."},"points":{"A":1,"B":2,"C":4,"D":3},"key":"C"},{"number":31,"text":"Anda tergabung dalam tim dengan ketua baru yang dikenal pintar dan ambisius. Namun, saat rapat ia sering kali terlalu mengatur dan kurang menghargai pendapat anggota lain. Hal ini membuat suasana rapat menjadi tidak nyaman dan beberapa teman mulai berbisik-bisik di belakang. Dalam situasi ini, apa yang akan Anda lakukan?","options":{"A":"Menyampaikan pendapat hanya kepada beberapa teman yang dianggap aman ketika rapat.","B":"Menjaga diri dengan tetap diam dan tidak terlibat saat suasana rapat terasa kurang nyaman.","C":"Menenangkan suasana rapat sambil menyampaikan pendapat sehingga teman lain terdorong aktif.","D":"Mencairkan suasana rapat agar tidak menegangkan dan tetap nyaman untuk semua anggota tim."},"points":{"A":2,"B":1,"C":4,"D":3},"key":"C"},{"number":32,"text":"Baru seminggu pindah ke sekolah baru, Anda mendapat teguran dari guru karena beberapa kali memberikan pendapat sebelum ditunjuk. Teguran ini membuat Anda merasa bingung karena di sekolah lama para siswa boleh memberikan pendapat kapan saja. Apa yang akan Anda lakukan?","options":{"A":"Memahami dan mengikuti budaya di sekolah baru, sehingga Anda hanya memberikan pendapat setelah ditunjuk oleh guru.","B":"Meminta maaf dan bertanya kepada guru dan teman tentang kebiasaan di sekolah baru agar bisa menyesuaikan diri.","C":"Meminta maaf dan menjelaskan kepada guru bahwa Anda terbawa kebiasaan di sekolah lama tanpa bermaksud tidak sopan.","D":"Tetap mengikuti kebiasaan di sekolah lama meskipun frekuensinya dikurangi karena pendapat harus langsung disampaikan."},"points":{"A":2,"B":4,"C":3,"D":1},"key":"B"},{"number":33,"text":"Anda merupakan seorang anggota dari ekstrakurikuler olahraga yang baru saja mengikuti lomba antar sekolah. Di pertandingan tersebut, tim Anda gagal di babak kualifikasi yang menyebabkan anggota tim kecewa dan menyalahkan strategi kapten dan pelatih. Beberapa anggota memutuskan keluar dari tim. Apa yang akan Anda lakukan?","options":{"A":"Memutuskan mengikuti anggota lain untuk keluar dari tim dan bergabung dengan ekstrakurikuler lain yang dirasa lebih unggul.","B":"Bertahan dalam tim dan menyemangati kapten untuk tetap melanjutkan latihan karena ekstrakurikuler ini populer di sekolah.","C":"Bertahan dalam tim sementara waktu sambil memperhatikan situasi dan mempertimbangkan untuk ikut mundur dari tim.","D":"Bertahan dalam tim dan mengajak kapten untuk meninjau kegagalan pada permainan sebelumnya meskipun menyita banyak waktu."},"points":{"A":1,"B":3,"C":2,"D":4},"key":"D"},{"number":34,"text":"Anda tergabung dalam tim lomba debat Bahasa Indonesia dan biasanya berperan sebagai pembicara pertama. Namun, pada semifinal perlombaan, seorang rekan merasa kurang memahami topik debat. Akhirnya, tim sepakat mengubah formasi, menempatkan Anda sebagai pembicara ketiga. Dalam situasi ini, apa yang akan Anda lakukan?","options":{"A":"Menerima keputusan perubahan formasi karena menyukai tantangan dan merasa yakin dengan kemampuan diri dan tim.","B":"Melakukan yang terbaik sebagai pembicara ketiga demi kelancaran jalannya lomba debat walaupun belum ada pengalaman sebelumnya.","C":"Mengusulkan peninjauan kembali keputusan tim karena Anda belum memiliki pengalaman menjadi pembicara ketiga dalam debat.","D":"Meminta dukungan dan masukan dari rekan agar bisa beradaptasi ke formasi tim debat yang baru sebagai pembicara ketiga."},"points":{"A":4,"B":3,"C":1,"D":2},"key":"A"},{"number":35,"text":"Anda bertugas sebagai pengibar bendera dalam latihan upacara. Setelah latihan selesai, pelatih memuji sikap Anda sudah tegap dan tenang, dan langkah kaki sudah seirama. Namun, ia menilai lipatan bendera masih tampak berantakan, dan gerakan menarik tali sempat terlambat mengikuti lagu. Apa yang akan Anda lakukan?","options":{"A":"Menerima komentar pelatih dan berniat memperhatikan lipatan bendera serta gerakan tali pada latihan berikutnya.","B":"Memperbaiki lipatan bendera dan gerakan segera setelah mendapat masukan, lalu meminta arahan tambahan.","C":"Merasa kritik soal lipatan dan tarikan tali bukan prioritas saat ini karena gerakan utama sudah sesuai harapan.","D":"Merasa lebih percaya diri karena pelatih menilai langkah sudah seirama, meskipun ada masukan kecil lain."},"points":{"A":3,"B":4,"C":1,"D":2},"key":"B"},{"number":36,"text":"Anda mengikuti program pertukaran pelajar selama satu bulan di sekolah mitra luar negeri. Teman-teman baru Anda memiliki cara belajar, kebiasaan, serta norma budaya yang berbeda dari yang biasa Anda jalani di Indonesia. Saat mengerjakan proyek kelompok, muncul perbedaan cara kerja. Apa yang akan Anda lakukan?","options":{"A":"Mendengarkan masukan teman anggota lain, sambil berusaha menyesuaikan cara kerja mereka dengan cara kerja pribadi agar sejalan.","B":"Memilih lebih banyak diam di dalam kelompok karena merasa metode yang Anda miliki lebih baik dari yang seharusnya digunakan semua anggota.","C":"Berusaha memahami perbedaan budaya dan menyatukan cara kerja agar bisa bekerja sama dalam menyelesaikan proyek kelompok.","D":"Berusaha mengerjakan bagian tugas Anda sendiri dan hanya berinteraksi dengan beberapa teman anggota yang sepemikiran dengan Anda."},"points":{"A":3,"B":1,"C":4,"D":2},"key":"C"},{"number":37,"text":"Anda harus mengirim poster acara lomba ke email panitia sebelum pukul enam sore. Ternyata, ukuran dokumen Anda melebihi yang diperbolehkan email sekolah. Anda menggunakan komputer di laboratorium sekolah, tetapi karena harus digunakan bergiliran membuat waktu pakai Anda terbatas. Pada situasi tersebut, apa yang akan Anda lakukan?","options":{"A":"Meminta perpanjangan waktu satu jam kepada panitia sambil menyiapkan versi terkompresi agar tetap terkirim hari itu juga.","B":"Segera membagi dokumen menjadi beberapa lampiran, lalu mengirimkannya sebelum tenggat dan konfirmasi ke panitia.","C":"Menunggu sampai Anda bisa mendapatkan giliran dan mengirimkan dokumen sebisanya di hari itu tanpa memperhatikan tenggat waktu.","D":"Mencoba mengirimkan dokumen melalui cara lain selain email dan mengirim penjelasan ke panitia agar bisa menerimanya."},"points":{"A":2,"B":3,"C":1,"D":4},"key":"D"},{"number":38,"text":"Sebagai ketua panitia lomba olahraga antarkelas, Anda memutuskan menggunakan lapangan belakang sekolah untuk pertandingan final karena sudah biasa digunakan. Ternyata beberapa masalah muncul saat pertandingan: penonton sulit menyaksikan pertandingan dan lapangan licin. Setelah lomba selesai, Anda diminta melakukan evaluasi. Apa yang akan Anda lakukan?","options":{"A":"Menyelidiki kembali kendala secara menyeluruh dan memberikan saran perbaikan untuk digunakan pada acara selanjutnya.","B":"Menyadari adanya kendala dalam kegiatan dan fokus melakukan perbaikan pada masalah yang lebih banyak dikeluhkan.","C":"Menelusuri kembali kendala yang terjadi dengan meminta penjelasan pada orang yang bertugas mengurus lapangan.","D":"Merasa masalah yang terjadi bukan isu penting karena selama ini penggunaan lapangan tersebut tidak pernah menimbulkan masalah."},"points":{"A":4,"B":3,"C":2,"D":1},"key":"A"},{"number":39,"text":"Ketika mengerjakan tugas kelompok yang harus dikumpulkan besok, seorang teman Anda permisi untuk mengangkat telepon. Ketika kembali, wajahnya pucat dan ia segera membereskan barang untuk pulang. Bagian tugasnya ternyata masih kosong dan belum dikerjakan ketika ia bergegas pulang. Apa yang akan Anda lakukan?","options":{"A":"Menanyakan keadaannya sebelum pergi, lalu memberikan sedikit saran dan mengingatkan untuk tetap menyusulkan tugasnya.","B":"Membiarkannya pulang dan menunggu teman tersebut menceritakan masalahnya sembari menyelesaikan tugas.","C":"Membiarkannya pulang, lalu mengirim pesan pribadi untuk menanyakan keadaan dan kemampuannya mengerjakan tugas.","D":"Melanjutkan bagian tugas yang masih kosong bersama sisa teman kelompok yang lain langsung agar tugas bisa segera diselesaikan."},"points":{"A":4,"B":1,"C":2,"D":3},"key":"A"},{"number":40,"text":"Anda tergabung dalam ekstrakurikuler paskibra yang mana saat ini sedang berada dalam masa sulit. Setelah kalah berturut-turut, beberapa teman ingin keluar dari tim karena merasa usahanya sia-sia. Saat itu, Anda juga ditawari untuk ikut ekstrakurikuler lain yang baru saja dibentuk. Pada situasi tersebut, apa yang akan Anda lakukan?","options":{"A":"Memilih bertahan untuk saat ini, tetapi terbuka untuk pindah bila ekskul lain terlihat lebih menjanjikan.","B":"Tetap bertahan di paskibra meskipun perkembangan diri mungkin terhambat karena yakin tim bisa bangkit bersama.","C":"Merasa kurang termotivasi untuk bertahan di paskibra karena merasa tidak ada perkembangan berarti.","D":"Bertahan di paskibra karena bisa membuka peluang ikut kompetisi yang lebih besar atau mendapat beasiswa."},"points":{"A":2,"B":4,"C":1,"D":3},"key":"B"},{"number":41,"text":"Untuk mempersiapkan diri masuk sekolah kedinasan, Anda berusaha menambah massa otot melalui rutinitas latihan fisik. Namun, progres tidak sesuai harapan sehingga Anda mencoba metode diet lemak. Sayangnya, hal ini membuat energi menurun dan Anda sering mengantuk di kelas. Apa yang akan Anda lakukan?","options":{"A":"Menghentikan latihan fisik untuk sementara waktu, meskipun sadar hal itu membuat persiapan fisik kurang optimal.","B":"Tetap melanjutkan metode diet tersebut karena menurut Anda bentuk tubuh adalah prioritas utama demi lolos seleksi.","C":"Berkonsultasi dengan ahlinya untuk membuat rencana latihan dan menu makanan yang sesuai dengan target pribadi.","D":"Menjalankan program latihan fisik dan pola makan yang seimbang menyesuaikan dengan kemampuan pribadi."},"points":{"A":2,"B":1,"C":4,"D":3},"key":"C"},{"number":42,"text":"Sebagai anggota termuda tim publikasi pentas seni sekolah, Anda mendapatkan tugas untuk membuat poster untuk keperluan publikasi acara. Desain Anda dipuji karena unik, tetapi dikritik oleh kakak kelas karena biaya cetaknya terlalu mahal. Apa yang akan Anda lakukan?","options":{"A":"Tetap mempertahankan desain karena keunikannya bisa menarik perhatian publik sesuai dengan tujuan publikasi.","B":"Menerima masukan mengenai biaya cetak, lalu menjadikannya pertimbangan untuk desain poster pada kegiatan berikutnya.","C":"Merasa senang karena desain poster dipuji unik sehingga menjadi semakin percaya diri, meskipun ada kritik soal biaya.","D":"Menanyakan pendapat anggota tim publikasi lainnya dan segera memperbaiki sesuai dengan masukan yang diperoleh."},"points":{"A":2,"B":3,"C":1,"D":4},"key":"D"},{"number":43,"text":"Suatu sore, Anda melihat tetangga lansia kewalahan membawa banyak barang belanjaan sambil berjalan pelan dengan wajah lelah. Saat itu, Anda sedang bersiap pergi ke rumah teman untuk kerja kelompok dan teman-teman sudah menunggu. Apa yang akan Anda lakukan?","options":{"A":"Bergegas pergi ke rumah teman karena tidak mau membuat teman-teman menunggu lebih lama.","B":"Membantu tetangga tersebut ketika beliau meminta secara langsung dan masih ada cukup waktu.","C":"Membantu tetangga membawakan barang bawaannya sampai ke dalam rumahnya dengan aman.","D":"Membantu membawakan beberapa barangnya sampai di depan pagar, lalu melanjutkan perjalanan."},"points":{"A":1,"B":2,"C":4,"D":3},"key":"C"},{"number":44,"text":"Teman Anda datang ke sekolah dengan tubuh penuh luka dan mengaku dianiaya orang tuanya. Sebagai ketua kelas, Anda melaporkan masalah tersebut ke wali kelas. Namun, wali kelas mengatakan bahwa upaya diskusi dengan orang tua teman Anda selalu gagal dilakukan. Apa yang akan Anda lakukan?","options":{"A":"Mengatakan kepada teman Anda bahwa Anda akan membantunya, sesuai dengan kemampuan Anda sebagai ketua kelas dan sebagai teman.","B":"Berhenti membantu dengan pemikiran bahwa wali kelas telah berupaya berdiskusi dengan orang tuanya dan tidak ada upaya lain yang bisa dilakukan.","C":"Menunjukkan dukungan kepada teman Anda dengan mendengarkan ceritanya apabila ia datang dan meminta bantuan Anda secara langsung.","D":"Menghibur teman Anda dan menemaninya meminta bantuan lebih lanjut ke guru BK atau kepala sekolah yang memiliki wewenang lebih besar."},"points":{"A":3,"B":1,"C":2,"D":4},"key":"D"},{"number":45,"text":"Dalam rapat bakti sosial kompleks rumah Anda, ada seorang bapak yang dominan. Keputusan-keputusan yang diambil dalam rapat selalu tidak dia setujui, padahal waktu pelaksanaan acara semakin dekat. Peminjaman tenda harus segera dilakukan, tetapi bapak tersebut tidak setuju. Apa yang Anda lakukan?","options":{"A":"Menjelaskan kondisi pada bapak tersebut dengan sabar setelah berulang kali diingatkan oleh orang lain.","B":"Menyanggah pendapat bapak tersebut dengan suara keras agar dia sadar bahwa ia menghambat pelaksanaan acara.","C":"Menenangkan bapak tersebut dengan mendengarkannya, lalu memutuskan untuk mengikuti suara mayoritas.","D":"Mencoba tetap tenang dalam menanggapi bapak tersebut karena bapak tersebut sudah sering berperilaku demikian."},"points":{"A":3,"B":1,"C":4,"D":2},"key":"C"},{"number":46,"text":"Dalam rangka memperingati Hari Kemerdekaan, sekolah mengadakan lomba menghias kelas. Kelas lain terlihat kompak dan segera bekerja menghias kelas. Namun, kelas Anda masih terlihat santai. Padahal, penilaian akan dilakukan dalam dua hari. Apa yang akan Anda lakukan?","options":{"A":"Mengajak ketua kelas dan teman untuk membuat konsep dekorasi, lalu mulai mengerjakan konsep tersebut.","B":"Menunggu ketua kelas memulai dekorasi karena merasa menginisiasi tugas bukan merupakan peran Anda.","C":"Mengambil inisiatif mengerjakan dekorasi yang sesuai dengan kemampuan Anda dalam waktu yang terbatas.","D":"Mulai mengerjakan bagian dekorasi yang paling mudah untuk menunjukkan keterlibatan dalam kegiatan ini."},"points":{"A":4,"B":1,"C":3,"D":2},"key":"A"},{"number":47,"text":"Anda sedang mengikuti kegiatan tinggal bersama penduduk di desa. Besok malam ada acara 'selametan' di rumah kepala desa, dan kebiasaannya, semua laki-laki mengenakan sarung, peci, sedangkan perempuan memakai kerudung. Anda tidak biasa mengenakan atribut tersebut karena berasal dari luar kota. Apa yang Anda lakukan?","options":{"A":"Terus terang mengatakan Anda tidak biasa mengenakan pakaian tersebut dan bersedia jika ada yang meminjamkan.","B":"Mencari alasan untuk tidak datang ke acara tersebut karena merasa aneh dengan kebiasaan setempat yang ada.","C":"Datang ke acara 'selametan' dengan pakaian yang biasa dikenakan sehari-hari karena merasa Anda hanya tamu.","D":"Segera mencari pinjaman atribut dari penduduk setempat serta mengenakannya setiap diminta hadir di acara tersebut."},"points":{"A":3,"B":1,"C":2,"D":4},"key":"D"},{"number":48,"text":"Anda ketua tim lomba debat sekolah di tingkat provinsi. Pada babak pertama, tim Anda kalah telak sehingga motivasi anggota mulai menurun. Masih ada babak berikutnya yang bisa menentukan hasil akhir. Semua anggota menunggu arahan Anda untuk menyiapkan babak berikutnya. Apa yang akan Anda lakukan?","options":{"A":"Mengikuti babak selanjutnya jika guru pembina bersedia membantu mengumpulkan informasi sesuai topik debat.","B":"Memberikan semangat pada tim untuk menyelesaikan lomba sesuai dengan persiapan yang telah dilakukan.","C":"Melanjutkan strategi yang digunakan sebelumnya karena merasa poin tertinggal terlalu jauh dengan tim lain.","D":"Meminta tim lawan untuk memberikan kritik konstruktif dan menyusun strategi baru untuk babak selanjutnya."},"points":{"A":2,"B":4,"C":1,"D":3},"key":"B"},{"number":49,"text":"Dalam latihan debat, beberapa anggota tim mulai saling menyalahkan saat strategi gagal, membuat suasana tegang. Anda merasa frustrasi karena tim tidak fokus, namun tetap harus melanjutkan persiapan agar sesi debat berikutnya bisa berjalan sesuai rencana. Dalam situasi ini, apa yang akan Anda lakukan?","options":{"A":"Mengekspresikan frustrasi dan ikut menyalahkan anggota lain yang menyebabkan terjadinya kegagalan sehingga latihan terganggu.","B":"Menerima kritik anggota lain dengan terbuka, tetap fokus, dan memimpin diskusi untuk menentukan penyesuaian yang harus segera dilakukan.","C":"Menahan rasa kecewa dan tetap berusaha menyelesaikan latihan karena merasa sudah merusak suasana dan semangat latihan.","D":"Menerima kritik anggota lain dan mengingatkan tim untuk tetap fokus, agar penyesuaian dapat dilakukan untuk latihan berikutnya."},"points":{"A":1,"B":4,"C":2,"D":3},"key":"B"},{"number":50,"text":"Anda bergabung sebagai pemain cadangan di sebuah klub voli. Dalam waktu dekat akan digelar pertandingan persahabatan antarklub. Namun, pemain setter inti mengalami cedera saat latihan, sehingga pelatih meminta Anda menggantikannya. Ini menjadi kesempatan pertama tampil bersama tim inti. Dalam situasi ini, apa yang akan Anda lakukan?","options":{"A":"Memberitahu pelatih bahwa Anda bersedia apabila ada bimbingan secara langsung dengan menambah waktu latihan khusus.","B":"Menerima permintaan pelatih apabila ia menempatkan Anda hanya pada paruh kedua agar bisa membiasakan diri terlebih dahulu.","C":"Meminta pelatih untuk memilih pemain lain menjadi setter karena Anda merasa keterampilan Anda tidak sebaik teman Anda yang cedera.","D":"Menerima permintaan pelatih karena merasa yakin ini bisa menjadi kesempatan untuk meningkatkan keterampilan bermain Anda."},"points":{"A":3,"B":2,"C":1,"D":4},"key":"D"},{"number":51,"text":"Sekolah Anda sedang mengadakan acara class meeting yang berupa lomba basket antar kelas. Dalam lomba ini, wali kelas mempercayai Anda untuk menjadi kapten tim. Namun, beberapa teman meragukan kemampuan Anda karena terdapat siswa lain yang lebih mahir dibandingkan Anda. Dalam situasi tersebut, apa yang akan Anda lakukan?","options":{"A":"Berusaha keras untuk mengarahkan tim sesuai dengan kemampuan yang Anda miliki agar tim dapat bermain dengan baik.","B":"Membiarkan teman Anda yang mahir basket untuk mengambil alih karena kemampuan dia lebih baik dibandingkan Anda.","C":"Berusaha dan yakin bahwa Anda dapat membawa kemenangan bagi tim dengan strategi yang Anda susun dengan detail.","D":"Berusaha memberikan arahan strategi bagi tim karena masih ada beberapa teman yang mempercayai kemampuan Anda."},"points":{"A":4,"B":1,"C":2,"D":3},"key":"A"},{"number":52,"text":"Adik Anda yang berusia sepuluh tahun sedang demam tinggi di rumah. Orang tua Anda harus keluar sebentar untuk membeli obat ke apotek sehingga meminta Anda untuk menemani adik di rumah. Sementara itu, Anda sebenarnya berencana pergi ke rumah teman untuk belajar kelompok. Apa yang akan Anda lakukan?","options":{"A":"Bersedia menemani adik Anda di rumah agar bisa mengusulkan belajar kelompok secara daring (online).","B":"Menyampaikan kepada orang tua bahwa belum bisa menemani adik karena sudah ditunggu teman satu kelompok.","C":"Menjaga adik sampai orang tua kembali, setelah mengabari teman sekelompok bahwa akan datang terlambat.","D":"Menemani adik sebentar sebelum berangkat belajar kelompok, meskipun kondisi adik belum sepenuhnya membaik."},"points":{"A":3,"B":1,"C":4,"D":2},"key":"C"},{"number":53,"text":"Anda dipilih mewakili sekolah dalam lomba pidato antarsekolah di tingkat provinsi yang akan berlangsung tiga hari lagi. Topik yang akan dilombakan sebenarnya sudah pernah Anda bawakan sebelumnya di acara lain, tetapi ini pertama kalinya Anda mengikuti perlombaan di tingkat provinsi. Apa yang akan Anda lakukan?","options":{"A":"Bersedia tampil, namun memilih menggunakan kembali naskah lama yang pernah dipakai agar lebih percaya diri.","B":"Bersedia ikut jika mendapat dukungan penuh dari guru dan teman, termasuk bantuan dalam menyiapkan naskah pidato.","C":"Meminta waktu untuk memutuskan karena merasa belum siap dan takut mengecewakan sekolah dan teman-teman.","D":"Merasa tertantang dan segera menyusun jadwal latihan, serta menyusun naskah baru bersama guru dan teman-teman."},"points":{"A":2,"B":3,"C":1,"D":4},"key":"D"},{"number":54,"text":"Setelah satu tahun mengikuti keanggotaan OSIS, Anda dipercaya menjadi bendahara yang memegang dana kas organisasi. Sahabat dekat Anda meminta izin untuk meminjam sebagian dana tersebut untuk keperluan pribadi yang mendesak, dengan janji akan mengembalikannya bulan depan. Dalam situasi ini, apa yang akan Anda lakukan?","options":{"A":"Mempertimbangkan permintaan sahabat dan urgensinya sambil tetap memprioritaskan dana kas sesuai kepentingan organisasi.","B":"Mendiskusikan permintaan sahabat dengan ketua OSIS agar keputusan penggunaan dana bukan hanya menjadi tanggung jawab Anda.","C":"Tidak meminjamkan dana kas karena amanah organisasi dan menawarkan bantuan untuk menemukan opsi lain bagi kebutuhan sahabat.","D":"Memberikan pinjaman secara langsung karena dana belum digunakan dan percaya sahabat akan mengembalikannya sesuai janji."},"points":{"A":2,"B":3,"C":4,"D":1},"key":"C"},{"number":55,"text":"Anda baru bergabung dalam kegiatan remaja di lingkungan sekitar yang beranggotakan tetangga sebaya yang berasal dari berbagai daerah. Saat berkumpul, sebagian orang terbiasa ceplas-ceplos dan bercanda spontan, berbeda dengan Anda yang biasanya lebih tenang. Pada situasi tersebut, apa yang akan Anda lakukan?","options":{"A":"Mencoba ikut bercanda dengan beberapa orang yang memiliki pembawaan diri serupa.","B":"Memilih untuk menjaga jarak agar tidak memunculkan kesalahpahaman jika berinteraksi.","C":"Ikut dalam obrolan santai bersama anggota lain dan menyesuaikan diri dengan gaya mereka.","D":"Sesekali ikut tertawa, tapi lebih banyak mendengarkan sampai terbiasa dengan gaya mereka."},"points":{"A":2,"B":1,"C":4,"D":3},"key":"C"},{"number":56,"text":"Anda sudah menjalankan kepengurusan OSIS selama 6 bulan. Suatu hari, Anda tidak sengaja mendengar sekelompok siswa mengeluhkan kinerja pengurus OSIS yang dirasa kurang menampung aspirasi. Mereka terutama mengeluhkan kinerja ketua OSIS, yang merupakan sahabat Anda. Apa yang akan Anda lakukan?","options":{"A":"Mengabaikan keluhan yang didengar karena khawatir akan membuat sesama pengurus OSIS menjadi tidak semangat.","B":"Menceritakan keluhan yang didengar dalam forum pengurus inti untuk dievaluasi dahulu oleh pengurus OSIS.","C":"Menceritakan keluhan yang Anda dengar kepada ketua OSIS secara empat mata agar bisa membuat rencana cepat bersama.","D":"Mendiskusikan keluhan yang didengar dalam forum rapat mingguan untuk menemukan solusi terbaik bersama."},"points":{"A":1,"B":2,"C":3,"D":4},"key":"D"},{"number":57,"text":"Setelah mengumpulkan laporan praktikum, guru memberikan masukan dan meminta Anda untuk melakukan revisi. Namun, Anda melihat bahwa file yang diberikan ternyata berantakan dan butuh waktu untuk memperbaikinya. Padahal, tugas harus dikumpulkan kembali besok siang. Apa yang akan Anda lakukan?","options":{"A":"Berusaha merapikan laporan sebisa mungkin sesuai kemampuan yang ada saat itu.","B":"Merapikan laporan dengan menggunakan aplikasi agar revisi bisa lebih cepat dan rapi.","C":"Merasa kewalahan dengan hal yang harus diperbaiki sehingga tidak melakukan revisi.","D":"Mengerjakan revisi laporan dengan bantuan teman karena merasa tidak sanggup sendirian."},"points":{"A":2,"B":4,"C":1,"D":3},"key":"B"},{"number":58,"text":"Saat latihan pramuka, instruktur meminta kelompok Anda terus mengulang latihan baris-berbaris karena selalu ada kesalahan kecil dalam formasi. Latihan berlangsung lama di bawah kondisi melelahkan. Beberapa teman mulai putus asa dan mengeluh ingin berhenti karena merasa tidak sanggup memperbaiki gerakan. Apa yang akan Anda lakukan?","options":{"A":"Mengikuti latihan semampunya, sambil berusaha memperbaiki gerakan diri sendiri sampai sempurna dan tidak bisa disalahkan.","B":"Memutuskan berhenti sejenak karena tenaga sudah terkuras dan merasa hasilnya tidak banyak berubah jika kelelahan.","C":"Tetap bertahan latihan sambil meminta kelompok untuk saling memperhatikan dan mengoreksi formasi satu sama lain.","D":"Tetap bertahan dengan bantuan arahan dan dorongan dari instruktur atau teman agar bisa melanjutkan latihan."},"points":{"A":2,"B":1,"C":4,"D":3},"key":"C"},{"number":59,"text":"Anda mengikuti kegiatan pramuka tingkat kota dan ditempatkan dalam regu berisi siswa dari sekolah lain yang belum dikenal. Mereka memiliki cara kerja berbeda, dengan sebagian bertindak cepat tanpa diskusi dan sebagian sangat teliti. Saat membangun tenda, perbedaan ini membuat kelompok bingung. Apa yang akan Anda lakukan?","options":{"A":"Fokus mengerjakan tugas yang bisa dikerjakan sendiri tanpa terlalu terlibat dalam kelompok, karena bisa memperumit keadaan.","B":"Mencoba mengakrabkan diri dengan anggota regu dan lebih aktif saat mengerjakan bagian yang sudah dikuasai.","C":"Mengerjakan bagian tenda yang lebih sederhana sebisanya, sambil perlahan beradaptasi dengan pola kerja teman sekelompok.","D":"Segera memahami perbedaan pola kerja, lalu membantu regu menemukan cara bersama agar tenda bisa segera dibangun."},"points":{"A":1,"B":3,"C":2,"D":4},"key":"D"},{"number":60,"text":"Kamu telah menghabiskan banyak waktu belajar untuk ujian akhir semester. Kamu merasa sudah memahami materi dengan baik dan yakin bisa mendapatkan nilai tinggi. Namun, saat hasil ujian diumumkan, nilaimu ternyata lebih rendah dari yang kamu harapkan. Beberapa teman dengan usaha yang menurutmu lebih sedikit justru mendapatkan nilai lebih tinggi. Kamu merasa kecewa dan mulai meragukan kemampuanmu. Apa yang paling mungkin kamu lakukan?","options":{"A":"Merasa sangat kecewa dan kehilangan kepercayaan diri, tetapi berusaha untuk tetap belajar dengan harapan nilai berikutnya lebih baik.","B":"Mengabaikan perasaan kecewa dan mencoba meyakinkan diri bahwa nilai bukan segalanya, meskipun sebenarnya masih merasa terganggu.","C":"Menganalisis kesalahan yang mungkin terjadi, membandingkan dengan teman yang mendapatkan nilai lebih tinggi, dan mencari strategi baru untuk meningkatkan performa.","D":"Menganggap hasil ini sebagai kegagalan besar, merasa tertekan, dan mulai berpikir bahwa mungkin kamu memang tidak cukup pintar dalam pelajaran ini."},"points":{"A":3,"B":2,"C":4,"D":1},"key":"C"},{"number":61,"text":"Suatu hari, sahabat dekatmu tiba-tiba bersikap dingin dan menghindar darimu. Setelah beberapa hari, akhirnya dia mengatakan bahwa dia merasa kecewa karena mendengar bahwa kamu pernah berbicara hal buruk tentangnya di belakangnya. Kamu sebenarnya tidak merasa pernah mengatakan hal seperti itu, tetapi dia tampaknya sangat yakin dan tidak mau langsung percaya dengan penjelasanmu. Bagaimana kamu menangani situasi ini?","options":{"A":"Langsung berusaha menjelaskan dan membuktikan bahwa kamu tidak melakukan itu, meskipun sahabatmu masih terlihat marah dan kurang percaya.","B":"Merasa frustrasi dan sedikit kecewa dengan sikapnya, tetapi memutuskan untuk memberinya waktu agar dia bisa menenangkan diri sebelum mencoba berbicara lagi.","C":"Mencoba memahami kenapa dia bisa berpikir seperti itu, mencari tahu dari mana informasi tersebut berasal, dan mencari cara untuk memperbaiki kesalahpahaman.","D":"Merasa sangat terganggu dengan tuduhan ini, berpikir bahwa jika dia bisa langsung percaya pada rumor tanpa mendengarkanmu, mungkin dia bukan sahabat yang baik."},"points":{"A":2,"B":3,"C":4,"D":1},"key":"C"},{"number":62,"text":"Kamu sedang menghadiri acara perayaan ulang tahun teman sekelas di sebuah tempat nongkrong. Beberapa temanmu mulai menantang semua orang untuk melakukan tantangan yang menurutmu cukup berisiko dan tidak sesuai dengan nilai atau batasan pribadimu. Saat kamu menolak, mereka mulai mengejekmu dengan candaan seperti, “Ah, pengecut banget sih,” atau “Santai aja, ini cuma buat seru-seruan.” Bagaimana kamu merespons?","options":{"A":"Tetap menolak dengan tenang dan sedikit bercanda untuk menghindari suasana canggung, tetapi dalam hati merasa sedikit terganggu dengan ejekan mereka.","B":"Menolak dengan tegas tanpa menjelaskan panjang lebar, tetapi mulai merasa ragu apakah kamu terlalu kaku dalam mengambil keputusan.","C":"Mencoba menjelaskan alasanmu dengan baik, tetapi tetap merasa sedikit tidak nyaman jika mereka terus menekan.","D":"Merasa tidak ingin berkonflik, akhirnya setuju untuk ikut dengan harapan bahwa setelah itu mereka tidak akan menganggapmu berbeda."},"points":{"A":4,"B":2,"C":3,"D":1},"key":"A"},{"number":63,"text":"Kamu menyadari bahwa seorang teman sekelasmu, Rina, sering kesulitan memahami materi Matematika. Dia sudah beberapa kali bertanya kepadamu, tetapi kamu sendiri juga sibuk mempersiapkan ujian. Suatu hari, Rina meminta bantuanmu lagi karena dia merasa putus asa dan khawatir nilainya akan turun drastis. Kamu tahu bahwa membantunya bisa memakan waktu belajarmu sendiri. Apa yang paling mungkin kamu lakukan?","options":{"A":"Menjelaskan materi kepada Rina secara singkat, lalu menyarankan agar dia bertanya kepada guru jika masih belum paham.","B":"Menyusun jadwal belajar bersama yang sesuai dengan waktu luang kalian berdua, meskipun itu berarti kamu harus mengatur ulang waktumu.","C":"Mengajarkan Rina secara mendalam meskipun mengorbankan sebagian besar waktu belajarmu sendiri, karena kamu tahu ia membutuhkan bantuan.","D":"Menolak dengan sopan dan mengatakan bahwa kamu juga kesulitan dengan materi tersebut, lalu menyarankan dia mencari bantuan lain."},"points":{"A":3,"B":2,"C":4,"D":1},"key":"C"},{"number":64,"text":"Saat dalam perjalanan ke sekolah, kamu melihat seorang pria tua yang kesulitan menyeberang jalan sambil membawa kantong belanjaan yang berat. Jalanan cukup ramai, dan kamu hanya memiliki beberapa menit sebelum bel masuk berbunyi. Jika kamu berhenti untuk membantu, kemungkinan besar kamu akan terlambat ke sekolah, dan ada kemungkinan guru akan memberi sanksi. Apa yang akan kamu lakukan?","options":{"A":"Langsung menyeberang tanpa berhenti, tetapi berharap ada orang lain yang akan membantunya.","B":"Menawarkan bantuan dengan cepat dan membantunya menyeberang, meskipun kamu mungkin terlambat sedikit ke sekolah.","C":"Membantu pria tua tersebut menyeberang dengan hati-hati dan membawakan barangnya sampai ke tempat yang lebih aman, meskipun kamu tahu kamu akan terlambat.","D":"Ragu-ragu sebentar, lalu tetap berjalan menuju sekolah karena khawatir akan konsekuensi keterlambatanmu."},"points":{"A":1,"B":3,"C":4,"D":2},"key":"C"},{"number":65,"text":"Dua teman dekatmu, Andi dan Budi, bertengkar hebat karena kesalahpahaman tentang tugas kelompok. Andi merasa bahwa Budi tidak mengerjakan bagian tugasnya dengan baik, sementara Budi merasa bahwa Andi terlalu menuntut dan tidak menghargai usahanya. Mereka berdua meminta pendapatmu dan berharap kamu berpihak kepada salah satu dari mereka. Bagaimana kamu menangani situasi ini?","options":{"A":"Berusaha menengahi dengan mendengarkan kedua belah pihak dan mencoba membantu mereka menemukan solusi yang adil.","B":"Menyampaikan pendapatmu dengan jujur, tetapi tetap berusaha menjaga hubungan baik dengan keduanya.","C":"Menghindari konflik dengan tidak memihak dan membiarkan mereka menyelesaikan masalahnya sendiri.","D":"Memilih untuk mendukung salah satu pihak yang menurutmu lebih benar agar masalah cepat selesai, meskipun itu berarti bisa merusak hubunganmu dengan teman yang lain."},"points":{"A":4,"B":3,"C":2,"D":1},"key":"A"},{"number":66,"text":"Kamu ditunjuk sebagai ketua kelompok dalam proyek sains yang memiliki pengaruh besar terhadap nilai akhir. Awalnya, semua anggota setuju dengan pembagian tugas, tetapi setelah satu minggu, kamu menyadari bahwa Budi, salah satu anggota, belum menyelesaikan tugasnya. Ketika kamu menanyakannya, dia mengatakan bahwa dia sibuk dengan urusan keluarga, tetapi anggota lain merasa dia hanya malas. Mereka mulai kehilangan motivasi dan menyalahkan Budi, yang tampak semakin menjauh dari kelompok. Apa yang akan kamu lakukan?","options":{"A":"Mengadakan pertemuan kelompok untuk membahas masalah ini secara terbuka dan mencari solusi agar semua tetap bisa berkontribusi tanpa merasa dirugikan.","B":"Berbicara secara pribadi dengan Budi untuk memahami situasinya lebih dalam, kemudian mencari cara agar tugasnya bisa diselesaikan dengan bantuan kelompok jika diperlukan.","C":"Menegur Budi di depan kelompok agar dia menyadari dampak tindakannya dan memberikan batas waktu terakhir untuk menyelesaikan tugasnya.","D":"Mengalihkan tugas Budi ke anggota lain secara diam-diam untuk memastikan proyek selesai tepat waktu, tanpa menimbulkan konflik lebih lanjut."},"points":{"A":4,"B":3,"C":1,"D":2},"key":"A"},{"number":67,"text":"Kamu sedang mengikuti ujian yang sangat menentukan peringkat akhir semester. Di tengah ujian, teman dekatmu yang biasanya berprestasi tampak panik dan berbisik meminta bantuan. Dia mengatakan bahwa semalam dia tidak bisa belajar karena harus mengurus adiknya yang sakit, dan jika dia gagal, itu akan menghancurkan nilai rata-ratanya. Pengawas sedang fokus ke sisi lain ruangan, jadi tidak ada yang akan tahu jika kamu membantunya. Apa yang akan kamu lakukan?","options":{"A":"Menolak permintaannya dengan sopan dan tetap fokus pada ujianmu, meskipun itu mungkin membuatnya kecewa.","B":"Memberikan sedikit petunjuk secara samar agar dia bisa menjawab sendiri tanpa langsung memberinya jawaban.","C":"Menulis beberapa jawaban di secarik kertas dan menyerahkannya secara diam-diam agar dia bisa mengejar ketinggalannya.","D":"Mengabaikan permintaannya dan berpura-pura tidak mendengar, berharap dia mengerti bahwa kamu tidak ingin terlibat."},"points":{"A":4,"B":2,"C":1,"D":3},"key":"A"},{"number":68,"text":"Di sekolahmu, ada kelompok siswa yang sangat berpengaruh dan populer. Mereka mengundangmu untuk bergabung karena mereka melihat potensimu dalam kegiatan sosial. Namun, kamu tahu bahwa kelompok ini sering mengejek dan mempermalukan siswa lain yang mereka anggap berbeda. Salah satu anggota kelompok mengatakan bahwa jika kamu bergabung, kamu tidak perlu ikut mengejek, cukup diam saja. Namun, jika kamu menolak, kamu berisiko menjadi target berikutnya. Apa yang akan kamu lakukan?","options":{"A":"Menolak bergabung dan menjaga jarak dari kelompok tersebut, meskipun itu berarti kamu bisa menjadi target berikutnya.","B":"Menerima tawaran mereka tetapi tetap menjaga batasan dengan tidak ikut dalam perilaku negatif mereka.","C":"Bergabung dengan mereka untuk mendapatkan perlindungan dan manfaat sosial, tetapi diam-diam berusaha mengurangi perilaku buruk mereka dari dalam.","D":"Menerima tawaran mereka dengan harapan bisa mengubah dinamika kelompok menjadi lebih positif, tetapi tetap mengikuti beberapa aturan mereka agar tetap diterima."},"points":{"A":4,"B":2,"C":3,"D":1},"key":"A"},{"number":69,"text":"Kamu memiliki minat yang besar dalam bidang seni dan ingin mengambil jurusan desain grafis setelah lulus. Namun, orang tuamu berkeras agar kamu memilih jurusan kedokteran karena mereka percaya itu lebih menjamin masa depan. Mereka bahkan sudah menyiapkan kursus tambahan untuk membantumu masuk fakultas kedokteran. Kamu menyadari bahwa menolak keinginan mereka bisa menimbulkan konflik keluarga, tetapi memilih kedokteran juga berarti mengorbankan impianmu. Apa yang akan kamu lakukan?","options":{"A":"Mengikuti keinginan orang tua dan memilih kedokteran, meskipun kamu tidak menyukainya, karena kamu percaya mereka menginginkan yang terbaik untukmu.","B":"Berusaha berdiskusi dengan orang tua, menjelaskan alasanmu dengan bukti bahwa desain grafis juga memiliki prospek karier yang baik.","C":"Mengambil jurusan kedokteran tetapi tetap mengejar minat desain grafis sebagai hobi atau usaha sampingan.","D":"Tetap memilih desain grafis tanpa mendiskusikan lebih lanjut dengan orang tua karena ini adalah hidupmu sendiri."},"points":{"A":2,"B":4,"C":3,"D":1},"key":"B"},{"number":70,"text":"Dalam sebuah kompetisi menulis esai tingkat nasional, pemenangnya akan mendapatkan beasiswa ke universitas impianmu. Kamu telah menulis esai yang menurutmu sudah cukup baik, tetapi seorang teman yang lebih berpengalaman di bidang penulisan menawarkan untuk membantumu merevisi dan menyempurnakannya. Namun, ia memberikan banyak masukan yang cukup mengubah gaya dan pendekatan tulisanmu, sehingga esai tersebut akan jauh berbeda dari versi aslimu. Bagaimana kamu menyikapi situasi ini?","options":{"A":"Menerima semua revisi dan saran teman karena dia lebih berpengalaman, dan ini akan meningkatkan peluangmu untuk menang.","B":"Menolak revisi yang mengubah gaya tulisanmu secara drastis, karena kamu ingin mempertahankan orisinalitas meskipun berisiko kalah dalam kompetisi.","C":"Memilih hanya beberapa revisi yang benar-benar memperbaiki kualitas tulisan tanpa menghilangkan ciri khasmu sendiri.","D":"Menggunakan revisi temanmu sebagai referensi, tetapi tetap menulis ulang dengan caramu sendiri agar tetap orisinal dan sesuai dengan visi yang kamu inginkan."},"points":{"A":1,"B":2,"C":3,"D":4},"key":"D"},{"number":71,"text":"Kamu adalah salah satu siswa terbaik di kelas dan sedang mempersiapkan diri untuk mengikuti seleksi Olimpiade Matematika tingkat nasional. Kamu sudah berlatih keras selama berbulan-bulan, tetapi beberapa hari sebelum seleksi, seorang guru menawarkan kesempatan untuk mengikuti proyek riset bersama dosen universitas ternama. Proyek ini akan sangat berguna untuk pengembangan ilmiah dan portofoliomu di masa depan, tetapi waktunya akan berbenturan dengan latihan intensif Olimpiade. Apa yang akan kamu lakukan?","options":{"A":"Menerima tawaran proyek riset karena ini kesempatan langka yang dapat memberikan dampak besar bagi masa depan akademikmu, meskipun harus mengurangi fokus pada seleksi Olimpiade.","B":"Tetap fokus pada Olimpiade karena ini adalah target utama yang telah kamu persiapkan selama berbulan-bulan, meskipun harus melewatkan kesempatan proyek riset.","C":"Berusaha mengatur waktu untuk menjalani keduanya dengan menyesuaikan jadwal latihan dan proyek riset, meskipun ini akan membuat jadwalmu lebih padat dan melelahkan.","D":"Berdiskusi dengan guru dan mentor untuk mempertimbangkan konsekuensi jangka panjang dan kedua pilihan sebelum mengambil keputusan."},"points":{"A":1,"B":2,"C":4,"D":3},"key":"C"},{"number":72,"text":"Kamu telah lama berencana untuk mengikuti kursus tambahan di luar sekolah untuk meningkatkan keterampilanmu dalam bidang yang kamu minati. Namun, mendadak orang tuamu meminta bantuanmu untuk menjaga adik selama beberapa minggu ke depan karena mereka memiliki pekerjaan yang sangat sibuk. Kamu menyadari bahwa jika menerima permintaan ini, kamu harus menunda kursus yang sudah kamu nantikan sejak lama. Bagaimana kamu akan menangani situasi ini?","options":{"A":"Dengan tegas menolak permintaan orang tua dan tetap menjalani kursus karena kamu merasa pendidikanmu adalah prioritas utama yang tidak bisa dikorbankan.","B":"Menerima permintaan orang tua tanpa mencari alternatif, meskipun di dalam hati merasa kecewa karena harus menunda kesempatan yang telah lama kamu nantikan.","C":"Berdiskusi dengan orang tua untuk mencari solusi alternatif, seperti menjadwal ulang kursus atau mencari cara agar tanggung jawab ini bisa dibagi dengan anggota keluarga lain.","D":"Mengabaikan permintaan orang tua dan tetap pergi ke kursus tanpa memberi tahu mereka, karena merasa bahwa mereka tidak mempertimbangkan kepentinganmu dengan adil."},"points":{"A":2,"B":3,"C":4,"D":1},"key":"C"},{"number":73,"text":"Kamu baru saja mengikuti audisi untuk kompetisi pidato sekolah yang sangat kamu impikan. Namun, setelah mendengar hasilnya, kamu tidak terpilih sebagai finalis. Juri memberikan kritik yang cukup tajam tentang cara penyampaianmu yang dianggap kurang meyakinkan. Kamu merasa kecewa karena sudah berlatih keras dan berharap bisa lolos. Bagaimana cara terbaik untuk menghadapi situasi ini?","options":{"A":"Menghindari berbicara di depan umum lagi karena merasa tidak cukup baik, dan mulai meragukan kemampuanmu dalam berbicara di hadapan banyak orang.","B":"Menerima kritik tersebut dengan sikap terbuka, menganalisis kelemahanmu, dan berlatih lebih keras agar bisa tampil lebih baik jika ada kesempatan di masa depan.","C":"Memprotes hasil audisi kepada panitia, meyakinkan bahwa kamu lebih layak dibandingkan beberapa peserta lain yang lolos, karena kamu merasa telah memberikan yang terbaik.","D":"Merasa kecewa tetapi mencoba mengalihkan perhatian ke hal lain, tanpa benar-benar mengevaluasi kritik yang diberikan atau mencoba memperbaiki kelemahanmu."},"points":{"A":2,"B":4,"C":1,"D":3},"key":"B"},{"number":74,"text":"Kamu baru saja pindah ke sekolah baru dan belum memiliki teman. Saat jam istirahat, kamu melihat beberapa kelompok siswa yang sudah akrab satu sama lain. Salah satu kelompok tampaknya memiliki minat yang sama denganmu, tetapi mereka terlihat sangat dekat dan kamu khawatir akan dianggap mengganggu jika mencoba bergabung. Di sisi lain, kamu juga tidak ingin terus menyendiri dalam waktu lama. Apa langkah terbaik yang bisa kamu ambil?","options":{"A":"Menunggu ada orang yang mengajakmu bergabung dalam kelompok mereka, karena kamu tidak ingin terlihat memaksa atau mencampuri pergaulan mereka sebelum mereka merasa nyaman denganmu.","B":"Berusaha berkenalan dengan beberapa anggota kelompok yang terlihat ramah, mencari kesempatan untuk ikut dalam percakapan mereka dengan sopan dan tidak berlebihan.","C":"Memilih untuk makan sendirian di tempat yang lebih sepi sampai seseorang mendekatimu terlebih dahulu, karena kamu tidak ingin mengambil risiko ditolak saat mencoba berkenalan.","D":"Mencari kelompok lain yang tampaknya lebih kecil dan mungkin lebih terbuka untuk menerima anggota baru, meskipun minat mereka tidak sepenuhnya sama denganmu."},"points":{"A":2,"B":4,"C":1,"D":3},"key":"B"}];
