window.__SOAL_TEMPLATE_CONFIG = {"title":"Paket Kepri 1 - JAGOPSI","examType":"KEPRI","examName":"Kepribadian Paket 1","examFile":"kepri.html","packageCode":"KEPRI_1","sectionLabel":"Kepribadian","introTitle":"Template Kepribadian","introText":"Soal kepribadian ditampilkan dengan format seragam seperti soal.html, khusus satu bagian kepribadian.","durationMinutes":35,"scoringMode":"points","extraPaths":["hasil_kepri"],"sessionSize":48,"randomBank":false,"requireLogin":true,"requireVIP":true,"vipMessage":"Kepribadian Paket 1 hanya untuk akun VIP.","storageKey":"kepri_fixed_session_v2","backUrl":"kepribadian_list.html"};
window.__SOAL_TEMPLATE_QUESTIONS = [{"number": 1, "text": "Suatu hari, Anda ditunjuk untuk menjadi pemimpin dalam kegiatan organisasi sekolah. Saat acara berlangsung, terjadi kekacauan kecil karena salah satu bagian dari rencana tidak berjalan sebagaimana mestinya. Beberapa panitia lain terlihat kecewa dan mulai menyalahkan Anda. Apa yang akan Anda lakukan?", "options": {"A": "Berusaha tenang dan mencari solusi tanpa terbawa emosi", "B": "Menerima kritik dari panitia lain dan menyampaikan permintaan maaf atas kekacauan tersebut", "C": "Menarik diri dari kepanitiaan karena merasa tidak mampu memimpin dengan baik", "D": "Menyalahkan anggota lain yang tidak menjalankan tugasnya sesuai rencana"}, "key": "A", "points": {"A": 4, "B": 3, "D": 2, "C": 1}}, {"number": 2, "text": "Anda sedang mempersiapkan lomba pidato tingkat provinsi. Saat hari pelaksanaan, perlengkapan presentasi Anda tertinggal di rumah, dan waktu tidak memungkinkan untuk mengambilnya. Anda merasa panik dan kecewa karena sudah berlatih keras. Apa yang akan Anda lakukan?", "options": {"A": "Menghubungi panitia untuk menjelaskan situasi dan meminta solusi terbaik yang mungkin tersedia.", "B": "Mencoba fokus pada kekuatan utama, yaitu kemampuan berbicara, agar tetap bisa tampil maksimal.", "C": "Mengambil waktu sejenak untuk mengatur napas dan berpikir jernih sebelum tampil.", "D": "Menenangkan diri dan mencari alternatif cara menyampaikan materi tanpa alat bantu."}, "key": "D", "points": {"D": 4, "B": 3, "A": 2, "C": 1}}, {"number": 3, "text": "Anda sedang mengikuti ujian praktik komputer. Saat mengerjakan, komputer Anda tiba-tiba men galami gangguan teknis dan membuat pekerjaan Anda hilang. Waktu ujian terus berjalan, semen tara peserta lain tetap melanjutkan ujian. Apa yang akan Anda lakukan?", "options": {"A": "Berusaha tetap tenang sambil mencoba memulai kembali dari awal sebisa mungkin.", "B": "Fokus mengatur kembali strategi pengerjaan agar sisa waktu bisa dimanfaatkan sebaik mungkin.", "C": "Menenangkan diri dan segera melaporkan masalah tersebut kepada pengawas ujian.", "D": "Meyakinkan diri bahwa kejadian ini bisa menjadi pengalaman untuk tetap tenang dalam tekanan."}, "key": "C", "points": {"C": 4, "A": 3, "B": 2, "D": 1}}, {"number": 4, "text": "Ketika Anda sedang dalam antrean panjang di kantor pelayanan publik untuk mengurus dokumen penting. Tiba-tiba sistem antrian mengalami gangguan, dan proses pelayanan dihentikan semen tara. Waktu sudah cukup mepet dengan jadwal kegiatan lain di hari itu. Apa yang akan Anda lakukan?", "options": {"A": "Bersabar menanti informasi resmi sambil menenangkan diri.", "B": "Menggunakan waktu menunggu untuk merapikan dokumen atau membaca ulang persyaratan yang dibutuhkan.", "C": "Mencari tahu situasi kepada petugas dengan sopan agar bisa mempertimbangkan langkah selanjutnya.", "D": "Berpikir positif bahwa ini adalah hal teknis yang bisa terjadi kapan saja, sambil mengatur ulang jadwal hari itu."}, "key": "A", "points": {"A": 4, "C": 3, "D": 2, "B": 1}}, {"number": 5, "text": "Nina telah mengikuti seleksi pertukaran pelajar ke luar negeri dan sudah melalui berbagai taha pan. Namun, saat pengumuman akhir, namanya tidak lolos. Padahal ia sudah berharap besar dan banyak orang tahu ia mengikuti seleksi tersebut. Apa yang akan Nina lakukan?", "options": {"A": "Mencari tahu bagian mana yang bisa diperbaiki agar bisa mencoba lagi di masa depan.", "B": "Berbagi cerita kepada orang terdekat agar bisa lebih lega dan tidak memendam perasaan.", "C": "Menerima hasil dengan lapang dada dan menjadikannya pelajaran berharga untuk ke depan.", "D": "Mengalihkan pikiran dengan melakukan kegiatan yang disukai untuk menjaga suasana hati."}, "key": "C", "points": {"C": 4, "A": 3, "B": 2, "D": 1}}, {"number": 6, "text": "Saat sedang belajar di rumah, orang tua Anda tiba-tiba memarahi adik karena membuat rumah berantakan. Suasana rumah menjadi tegang dan tidak nyaman. Anda merasa terganggu, tetapi juga tidak ingin memperkeruh keadaan. Apa yang akan Anda lakukan?", "options": {"A": "Menenangkan adik dan mengajaknya ke kamar agar situasi menjadi lebih tenang.", "B": "Mengambil waktu sejenak untuk fokus pada pelajaran sambil membiarkan suasana reda.", "C": "Berusaha memahami bahwa orang tua sedang lelah dan memilih untuk tidak terpancing emosi.", "D": "Tetap tenang dan mencoba membantu merapikan rumah agar suasana membaik."}, "key": "D", "points": {"D": 4, "A": 3, "B": 2, "C": 1}}, {"number": 7, "text": "Rani melihat salah satu sahabatnya mencontek saat ujian. Setelah ujian selesai, guru meminta seluruh siswa untuk bersikap jujur jika mengetahui ada kecurangan. Rani bingung antara menjaga persahabatan atau mengatakan kebenaran. Apa yang akan Rani lakukan?", "options": {"A": "Menyarankan sahabatnya untuk mengakui kesalahan agar bisa belajar dari pengalaman.", "B": "Berjanji pada diri sendiri untuk tidak meniru dan memberi contoh yang baik ke depannya.", "C": "Mendekati sahabatnya secara pribadi dan mengajaknya berdiskusi tentang pentingnya kejujuran.", "D": "Menjaga hubungan baik namun tetap mengingatkan sahabat agar tidak mengulangi perbuatannya."}, "key": "C", "points": {"C": 4, "A": 3, "D": 2, "B": 1}}, {"number": 8, "text": "Saat sedang dalam masa ujian dan banyak tugas yang harus diselesaikan, seorang teman dekat mengalami masalah keluarga dan meminta Anda untuk menemaninya berbicara karena ia merasa sangat tertekan. Anda sendiri juga sedang kelelahan dan butuh waktu untuk istirahat. Apa yang akan Anda lakukan?", "options": {"A": "Menyampaikan bahwa Anda sedang lelah, tapi tetap memberikan pesan dukungan dan semangat.", "B": "Mengusulkan agar ia berbicara dengan guru BK atau orang dewasa yang bisa dipercaya.", "C": "Mengajak teman bicara singkat melalui pesan atau telepon untuk tetap menunjukkan kepedulian.", "D": "Mendengarkan sebentar lalu menjadwalkan obrolan lanjutan di waktu yang lebih tenang."}, "key": "D", "points": {"D": 4, "A": 3, "C": 2, "B": 1}}, {"number": 9, "text": "Andi memperhatikan bahwa salah satu temannya, Bima, tampak kesulitan memahami materi Matematika yang baru saja dijelaskan guru. Sementara itu, Andi sendiri ingin segera pulang untuk beristirahat karena sudah lelah. Apa yang akan Andi lakukan?", "options": {"A": "Memberikan catatan pribadi yang telah dibuat agar bisa dibaca Bima di rumah.", "B": "Menyarankan Bima untuk bertanya langsung kepada guru dan mendukungnya agar tidak malu.", "C": "Menawarkan Bima belajar bersama sebentar sebelum pulang.", "D": "Menyemangati Bima dan menjanjikan untuk belajar bersama di lain kesempatan."}, "key": "C", "points": {"C": 4, "D": 3, "A": 2, "B": 1}}, {"number": 10, "text": "Saat berjalan menuju kantin, Anda menemukan dompet yang terjatuh di area sekolah. Di dalamnya terdapat identitas milik salah satu siswa yang tidak terlalu dekat dengan Anda. Apa yang akan Anda lakukan?", "options": {"A": "Menyerahkan dompet ke guru atau sekolah agar aman dikembalikan.", "B": "Mencari pemiliknya dan langsung mengembalikannya dengan sopan dan hati-hati.", "C": "Menanyakan ke teman terdekat apakah mengenal pemilik dompet lalu membantu mengembalikannya.", "D": "Menjaga dompet tersebut sementara waktu dan menunggu pengumuman dari sekolah."}, "key": "A", "points": {"A": 4, "B": 3, "C": 2, "D": 1}}, {"number": 11, "text": "Anda mengikuti lomba debat tingkat sekolah. Dalam satu sesi, tim lawan menyampaikan argumen yang bertentangan dengan pandangan pribadi Anda dalam kehidupan sehari-hari. Meskipun me rasa kurang nyaman secara pribadi, Anda harus tetap bersikap profesional dan fokus pada jalannya debat. Apa yang akan Anda lakukan?", "options": {"A": "Menghargai sudut pandang lawan dan tetap menyampaikan tanggapan secara objektif.", "B": "Mengatur nada bicara dan bahasa tubuh agar tetap tenang meskipun tidak sependapat.", "C": "Meyakinkan diri bahwa debat adalah latihan berpikir kritis, bukan untuk menyerang secara pribadi.", "D": "Mengendalikan emosi dan fokus menyusun argumen logis tanpa terbawa perasaan pribadi."}, "key": "D", "points": {"D": 4, "A": 3, "B": 2, "C": 1}}, {"number": 12, "text": "Anda baru pindah ke sekolah dengan sistem pembelajaran bilingual, sementara di sekolah sebelumnya seluruh pelajaran menggunakan bahasa Indonesia. Di awal pembelajaran, Anda kesulitan memahami materi karena guru menggunakan bahasa Inggris. Apa yang akan Anda lakukan?", "options": {"A": "Berusaha memahami semampunya dengan harapan nanti bisa mengikuti dengan sendirinya.", "B": "Belajar mandiri memahami istilah Inggris dan bertanya saat tidak paham.", "C": "Mencatat semua hal yang tidak dipahami dan mendiskusikannya setelah pelajaran selesai.", "D": "Meminta pindah ke kelas reguler yang tidak menggunakan bahasa Inggris sama sekali."}, "key": "B", "points": {"B": 4, "A": 3, "C": 2, "D": 1}}, {"number": 13, "text": "Anda merupakan anggota OSIS bidang humas yang baru. Saat bergabung, Anda menyadari bahwa anggota sebelumnya sangat aktif di media sosial dan memiliki banyak strategi komunikasi yang belum Anda kuasai. Sementara itu, Anda diminta segera menjalankan agenda publikasi sekolah. Apa yang akan Anda lakukan?", "options": {"A": "Menjalankan tugas sesuai pemahaman sendiri agar tidak terlalu bergantung pada orang lain.", "B": "Mempelajari jejak digital humas dan meminta masukan anggota lama untuk melanjutkan dengan baik.", "C": "Menyarankan penundaan program publikasi sampai Anda merasa lebih siap.", "D": "Melibatkan anggota lain untuk mengambil alih tugas Anda karena belum menguasai bidang tersebut."}, "key": "B", "points": {"B": 4, "A": 3, "C": 2, "D": 1}}, {"number": 14, "text": "Anda tergabung dalam panitia acara sekolah tahunan. Divisi tempat Anda bertugas mengalami pergantian ketua karena yang lama pindah sekolah. Ketua baru memiliki gaya kerja yang berbeda dan menetapkan sistem baru yang belum pernah Anda gunakan sebelumnya. Apa yang akan Anda lakukan?", "options": {"A": "Membandingkan cara kerja lama dan baru untuk menunjukkan bahwa cara lama lebih efektif.", "B": "Mengamati pola kerja baru, menyesuaikan diri, dan memberi masukan bila perlu.", "C": "Mengikuti arahan baru dengan pasif, meskipun Anda tidak memahami sistem tersebut.", "D": "Menolak sistem baru karena Anda merasa tidak diajak diskusi sejak awal perubahan terjadi."}, "key": "B", "points": {"B": 4, "C": 3, "A": 2, "D": 1}}, {"number": 15, "text": "Anda baru saja dipindahkan ke kelas unggulan yang metode belajarnya sangat berbeda dengan kelas sebelumnya. Di kelas lama, Anda terbiasa dengan pendekatan diskusi dan presentasi, sementara di kelas baru lebih menekankan latihan soal mandiri dan evaluasi rutin. Di minggu pertama, Anda merasa cukup tertekan dan belum bisa mengikuti ritme belajar seperti teman-teman lain. Apa yang akan Anda lakukan?", "options": {"A": "Meminta kepada guru agar diberikan perlakuan khusus karena belum terbiasa dengan metode baru.", "B": "Mengeluh kepada orang tua agar mereka mengajukan permintaan pindah kelas kembali.", "C": "Menyesuaikan diri secara bertahap dengan memahami pola belajar dan bertanya pada teman.", "D": "Mengikuti pelajaran seperti biasa tanpa berusaha menyesuaikan diri dan menunggu waktu bisa menyesuaikan."}, "key": "C", "points": {"C": 4, "D": 3, "A": 2, "B": 1}}, {"number": 16, "text": "Anda diterima sebagai peserta pertukaran pelajar di sekolah mitra di luar pulau. Budaya sekolah di sana sangat berbeda, termasuk cara berpakaian, waktu belajar, dan kebiasaan makan bersama. Anda merasa sedikit canggung pada minggu pertama. Apa yang akan Anda lakukan?", "options": {"A": "Menjaga jarak sementara waktu hingga Anda benar-benar merasa nyaman.", "B": "Meminta kepada panitia untuk dipindahkan ke sekolah lain yang lebih sesuai dengan kebiasaan Anda.", "C": "Terbuka, ikut kegiatan, belajar dari teman baru, dan menghargai perbedaan.", "D": "Menyampaikan kesulitan adaptasi Anda kepada wali asrama sambil mencari saran dan dukungan."}, "key": "C", "points": {"C": 4, "A": 3, "B": 2, "D": 1}}, {"number": 17, "text": "Anda adalah satu-satunya siswa dari sekolah yang lolos seleksi tahap awal lomba pidato Bahasa Indonesia tingkat kabupaten. Namun, saat melihat daftar peserta dari sekolah lain, Anda merasa minder karena banyak dari mereka sudah sering tampil di tingkat provinsi. Padahal guru pembina sudah sangat yakin dengan kemampuan Anda. Apa yang akan Anda lakukan?", "options": {"A": "Mencari referensi penampilan peserta sebelumnya agar bisa menyiapkan strategi terbaik untuk tampil maksimal.", "B": "Mengikuti lomba dengan fokus pada pengalaman baru dan menjadikannya ajang pembelajaran.", "C": "Meyakinkan diri bahwa setiap peserta punya peluang yang sama dan tampil dengan semangat terbaik.", "D": "Berlatih lebih intens dan meminta masukan dari guru serta teman agar tampil lebih percaya diri."}, "key": "D", "points": {"D": 4, "A": 3, "B": 2, "C": 1}}, {"number": 18, "text": "Anda adalah anggota paskibra yang cukup menonjol secara teknis. Ketika pelatih tidak hadir saat latihan, teman-teman meminta Anda memimpin sesi latihan. Namun, Anda belum pernah memimpin sebelumnya. Apa yang akan Anda lakukan?", "options": {"A": "Berdiskusi dengan teman-teman terlebih dahulu untuk menyepakati agenda latihan agar berjalan lancar.", "B": "Mencoba memimpin latihan dengan semangat belajar sambil terbuka terhadap masukan dari rekan-rekan.", "C": "Menyusun catatan panduan latihan dari sesi sebelumnya sebagai referensi saat memimpin.", "D": "Menghubungi pelatih untuk meminta arahan singkat sebelum memulai sesi latihan."}, "key": "B", "points": {"B": 4, "D": 3, "A": 2, "C": 1}}, {"number": 19, "text": "Anda sedang mengikuti seleksi calon ketua tim riset sekolah untuk mewakili daerah dalam kom petisi nasional. Dua kandidat lain memiliki latar belakang akademik yang sangat kuat dan pernah menjadi pemenang di tingkat provinsi. Anda sendiri baru pertama kali ikut seleksi ini, namun mem iliki ide riset yang sangat orisinal dan mendapat apresiasi dari guru. Ketika mendekati tahap akhir seleksi, Anda mulai meragukan peluang Anda. Apa yang akan Anda lakukan?", "options": {"A": "Mengikuti proses seleksi dengan fokus pada proses dan menjadikan ini sebagai ajang uji diri untuk pengalaman berikutnya.", "B": "Mendiskusikan kekhawatiran Anda dengan guru pembimbing untuk mendapatkan pandangan dan dorongan mental.", "C": "Mempersiapkan diri sebaik mungkin dengan memperkuat penyampaian ide agar lebih meyakinkan di hadapan juri.", "D": "Melanjutkan seleksi dengan tekad memberikan yang terbaik, sembari siap menerima hasil apa pun secara terbuka."}, "key": "C", "points": {"C": 4, "A": 3, "D": 2, "B": 1}}, {"number": 20, "text": "Anda dipercaya oleh kepala sekolah untuk menjadi perwakilan dalam forum siswa se-Asia Tenggara yang akan dilaksanakan secara daring dalam bahasa Inggris. Meskipun kemampuan Anda sudah cukup baik, Anda belum pernah berbicara di forum internasional. Sementara itu, beberapa teman Anda lebih fasih berbahasa Inggris, tapi belum tentu siap mental. Apa yang akan Anda lakukan?", "options": {"A": "Menerima tantangan dengan serius dan mencari pelatih untuk meningkatkan kemampuan bicara.", "B": "Membangun kerja sama dengan teman-teman yang fasih agar bisa saling mendukung dalam persiapan presentasi.", "C": "Mencari tahu seluk-beluk forum agar dapat menyesuaikan diri dan tampil percaya diri saat waktunya tiba.", "D": "Menyampaikan kepada kepala sekolah bahwa Anda siap, tetapi terbuka jika ada yang lebih cocok untuk berkolaborasi."}, "key": "A", "points": {"A": 4, "D": 3, "B": 2, "C": 1}}, {"number": 21, "text": "Anda adalah kandidat dalam seleksi pengurus OSIS. Dalam debat terbuka, seorang peserta lain secara tidak langsung menyindir pengalaman Anda yang minim dalam organisasi. Padahal Anda punya gagasan inovatif yang telah disusun dengan matang. Suasana forum menjadi hening dan audiens memperhatikan reaksi Anda. Apa yang akan Anda lakukan?", "options": {"A": "Mengajak peserta lain berdialog setelah forum agar tidak terjadi salah paham dan menjaga keharmonisan.", "B": "Tetap menyampaikan gagasan Anda dengan penuh keyakinan tanpa menghiraukan komentar negatif.", "C": "Mengakui pengalaman Anda terbatas, namun menegaskan kesiapan Anda untuk terus belajar dan berkembang.", "D": "Menanggapi secara tenang dan mengalihkan fokus kepada program kerja dan visi yang ingin Anda wujudkan."}, "key": "D", "points": {"D": 4, "C": 3, "B": 2, "A": 1}}, {"number": 22, "text": "Anda lolos audisi sebagai pemeran utama dalam pementasan drama sekolah. Beberapa teman Anda meragukan keputusan panitia karena Anda dikenal pendiam dan belum pernah tampil di panggung besar. Hal ini membuat Anda mulai mempertanyakan kemampuan sendiri, meskipun Anda sudah berlatih keras. Apa yang akan Anda lakukan?", "options": {"A": "Menjadikan keraguan itu sebagai motivasi untuk membuktikan kelayakan dan tampil maksimal.", "B": "Mengomunikasikan perasaan Anda kepada pembina teater agar mendapat bimbingan emosional dan teknis.", "C": "Melanjutkan latihan dengan lebih fokus dan menjadikan pengalaman ini sebagai ajang tumbuh secara pribadi.", "D": "Memperkuat pemahaman terhadap naskah dan peran agar bisa tampil lebih meyakinkan di atas panggung."}, "key": "A", "points": {"A": 4, "C": 3, "D": 2, "B": 1}}, {"number": 23, "text": "Anda sedang menjalani program pelatihan intensif untuk seleksi Paskibraka tingkat nasional. Di saat bersamaan, Anda juga baru diterima sebagai peserta lomba karya tulis ilmiah tingkat provinsi yang juga merupakan bidang yang sangat Anda minati. Keduanya menuntut komitmen tinggi dan waktunya beririsan. Apa yang akan Anda lakukan?", "options": {"A": "Menimbang dampak jangka panjang dari masing-masing kegiatan sebelum memilih.", "B": "Membuat jadwal rinci dan berdiskusi dengan pembina agar bisa mengikuti keduanya", "C": "Memilih salah satu yang paling sesuai minat dan tetap memberi dukungan pada tim lain.", "D": "Menjalani keduanya semampunya, lalu memilih jika beban mulai memberatkan."}, "key": "B", "points": {"B": 4, "C": 3, "A": 2, "D": 1}}, {"number": 24, "text": "Anda menerima undangan mengikuti seleksi beasiswa pelajar berprestasi ke luar negeri. Di waktu yang sama, Anda juga sudah terikat dengan komitmen mengikuti pelatihan seni tradisional mewakili sekolah di tingkat nasional. Kedua program ini tidak bisa dijalani bersamaan. Apa yang akan Anda lakukan?", "options": {"A": "Menjalani proses seleksi beasiswa sambil menjaga komunikasi dengan tim seni.", "B": "Menginformasikan kondisi ke pelatih agar bisa dipertimbangkan pengganti.", "C": "Berdiskusi dengan guru dan orang tua untuk menentukan langkah terbaik.", "D": "Fokus pada satu pilihan yang paling sesuai dengan kekuatan dan rencana Anda."}, "key": "C", "points": {"C": 4, "A": 3, "D": 2, "B": 1}}, {"number": 25, "text": "Anda seorang siswa aktif di bidang olahraga dan akademik. Suatu hari, Anda mendapatkan dua tawaran sekaligus: menjadi delegasi pelajar pada konferensi pendidikan nasional dan mewakili provinsi dalam kejuaraan atletik. Keduanya penting dan bersifat eksklusif. Apa yang akan Anda lakukan?", "options": {"A": "Menganalisis potensi manfaat jangka panjang dari masing-masing kegiatan.", "B": "Menghubungi panitia untuk mengecek fleksibilitas jadwal keduanya.", "C": "Memilih sesuai nilai dan tujuan pribadi yang paling Anda yakini.", "D": "Berkonsultasi dengan pembina dan pelatih untuk menentukan pilihan terbaik."}, "key": "A", "points": {"A": 4, "B": 3, "C": 2, "D": 1}}, {"number": 26, "text": "Anda adalah siswa dengan nilai akademik tertinggi di kelas dan terpilih untuk mengikuti seleksi Olimpiade Sains Nasional. Namun, di saat yang sama Anda juga sedang mempersiapkan seleksi masuk perguruan tinggi negeri yang sangat Anda impikan. Kedua agenda tersebut menuntut waktu dan konsentrasi tinggi. Apa yang akan Anda lakukan?", "options": {"A": "Mendiskusikan situasi Anda dengan guru dan orang tua untuk mencari solusi terbaik sesuai kapasitas Anda.", "B": "Membuat skala prioritas dan menyusun jadwal yang terstruktur agar dapat mempersiapkan keduanya dengan efektif.", "C": "Mengambil tantangan ini sebagai bentuk latihan manajemen diri agar terbiasa dengan tekanan prestasi yang tinggi.", "D": "Fokus pada satu tujuan utama terlebih dahulu agar hasilnya maksimal, sambil tetap."}, "key": "B", "points": {"B": 4, "D": 3, "A": 2, "C": 1}}, {"number": 27, "text": "Anda memiliki mimpi untuk mengikuti program pertukaran pelajar ke luar negeri. Namun, untuk lolos seleksi Anda harus menyusun esai pribadi dan menjalani wawancara dalam bahasa Inggris. Saat ini kemampuan menulis dan berbicara Anda belum maksimal, sementara pendaftaran tinggal dua minggu lagi. Apa yang akan Anda lakukan?", "options": {"A": "Menjadwalkan latihan intensif harian dan meminta bimbingan khusus dari guru Inggris.", "B": "Mencari referensi dari peserta sebelumnya dan belajar mandiri agar dapat mengukur kesiapan secara objektif.", "C": "Mengikuti pelatihan daring yang bisa membantu meningkatkan keterampilan dalam waktu singkat.", "D": "Mencari partner belajar yang sudah lebih mahir untuk saling mendukung selama masa persiapan."}, "key": "A", "points": {"A": 4, "B": 3, "C": 2, "D": 1}}, {"number": 28, "text": "Anda sedang menjadi ketua lomba video pendek tingkat sekolah. Salah satu peserta mengunggah konten yang melanggar ketentuan lomba, tetapi berasal dari kelas guru pembina Anda. Beberapa panitia merasa ragu menegur karena khawatir menyinggung. Apa yang akan Anda lakukan?", "options": {"A": "Membahasnya dalam rapat panitia dan menegakkan aturan sesuai kesepakatan.", "B": "Mendekati guru pembina secara sopan dan menjelaskan aturan lomba dengan jelas.", "C": "Menyarankan panitia untuk membuat surat pemberitahuan resmi kepada peserta terkait.", "D": "Memastikan semua peserta memahami aturan dan mengevaluasi proses seleksi ulang."}, "key": "A", "points": {"A": 4, "D": 3, "B": 2, "C": 1}}, {"number": 29, "text": "Anda menjabat sebagai wakil ketua kelas saat kelas ditugaskan mengikuti lomba kebersihan tingkat sekolah. Ketua kelas sedang sakit, dan guru wali kelas menugaskan Anda mengambil alih kepemimpinan. Di saat bersamaan, Anda juga harus menyiapkan diri menghadapi ujian seleksi perguruan tinggi. Apa yang akan Anda lakukan?", "options": {"A": "Melibatkan anggota kelas dalam perencanaan agar pekerjaan terbagi secara adil.", "B": "Membagi tugas ke teman agar persiapan lomba tetap berjalan meski Anda tak selalu hadir.", "C": "Mengatur jadwal belajar dan koordinasi lomba agar bisa menjalankan keduanya.", "D": "Mencari dukungan dari guru atau OSIS untuk membantu mengatur teknis perlombaan."}, "key": "B", "points": {"B": 4, "C": 3, "D": 2, "A": 1}}, {"number": 30, "text": "Anda dipercaya sebagai ketua tim dekorasi untuk pentas seni sekolah yang akan berlangsung dua minggu lagi. Namun, ruangan yang akan digunakan sedang dalam proses renovasi dan diperkirakan selesai mendekati hari H. Jika tidak segera membuat properti, hasil dekorasi bisa tidak maksimal. Apa yang akan Anda lakukan?", "options": {"A": "Mendiskusikan situasi dengan panitia inti dan mencari ruangan alternatif untuk mulai bekerja lebih cepat", "B": "Menunggu proses renovasi selesai sambil membuat rencana cadangan dekorasi yang lebih sederhana", "C": "Menghubungi guru pembina agar bisa ikut membantu menyampaikan masalah ke pihak sekolah", "D": "Menyesuaikan desain dengan waktu yang ada dan mulai buat properti sejak awal"}, "key": "D", "points": {"D": 4, "C": 3, "A": 2, "B": 1}}, {"number": 31, "text": "Anda adalah wakil ketua panitia dalam lomba kebersihan antarkelas. Sehari sebelum penilaian, kelas Anda mengalami kendala karena alat kebersihan utama rusak. Ketua panitia tidak bisa dihubungi karena sedang sakit. Sementara waktu sangat terbatas. Apa yang akan Anda lakukan?", "options": {"A": "Segera cari alat pengganti dan koordinasi dengan teman agar tetap ikut lomba", "B": "Menghubungi guru pembina untuk meminta bantuan dan solusi darurat atas kendala yang ada", "C": "Membuat kesepakatan dengan panitia agar penilaian kelas Anda dijadwalkan di waktu terakhir", "D": "Menunggu instruksi dari ketua panitia sambil mencoba memperbaiki alat yang rusak"}, "key": "A", "points": {"A": 4, "B": 3, "D": 2, "C": 1}}, {"number": 32, "text": "Anda adalah pengurus koperasi siswa. Sekolah memberi kepercayaan kepada koperasi untuk membuka stan pada acara pameran pendidikan. Namun, teman yang ditugaskan memesan barang dagangan terlambat melakukan pemesanan, sehingga tidak semua barang akan datang tepat waktu. Apa yang akan Anda lakukan?", "options": {"A": "Segera mencari alternatif pemasok lokal yang bisa menyediakan barang dalam waktu singkat", "B": "Membagi tugas dengan pengurus lain untuk mempercepat proses pemesanan barang tambahan", "C": "Melaporkan kondisi tersebut ke guru pembina koperasi dan menunggu arahan selanjutnya", "D": "Menyesuaikan daftar barang dengan stok, lalu menyusun ulang strategi penjualan"}, "key": "D", "points": {"D": 4, "A": 3, "C": 2, "B": 1}}, {"number": 33, "text": "Sebagai anggota lama dalam tim paduan suara sekolah yang telah mengikuti berbagai kompetisi bergengsi, kepercayaan pelatih terhadap kemampuan sudah tidak diragukan. Namun tahun ini, kesempatan tampil pada acara besar diberikan kepada anggota baru agar mereka memperoleh pengalaman. Meskipun tidak dilibatkan sebagai penyanyi utama, pelatih tetap meminta bantuan dalam proses latihan. Sikap apa yang paling tepat diambil?", "options": {"A": "Tetap hadir dalam latihan dan memberi saran bila diminta oleh anggota baru atau pelatih", "B": "Melatih anggota baru secara teknis agar hasil penampilan tetap sesuai harapan", "C": "Mendukung latihan sambil membantu anggota baru agar siap tampil maksimal", "D": "Mengikuti latihan seperti biasa meski tidak tampil agar tetap merasa terlibat"}, "key": "C", "points": {"C": 4, "A": 3, "B": 2, "D": 1}}, {"number": 34, "text": "Peran penting dalam redaksi majalah sekolah sedang diuji ketika edisi spesial akhir tahun harus disiapkan di tengah padatnya jadwal ujian akhir dan persiapan seleksi beasiswa. Semua proses redaksi membutuhkan kehadiran dan kontribusi, namun tanggung jawab akademik juga tak bisa ditunda. Langkah apa yang sebaiknya diambil?", "options": {"A": "Mengatur waktu belajar dan produksi agar keduanya tetap berjalan optimal", "B": "Menawarkan peran yang bisa Anda pegang meski dengan waktu terbatas", "C": "Mengalihkan sebagian tugas ke anggota lain, tapi tetap memantau progresnya", "D": "Fokus pada ujian akhir dan memberi izin pada tim untuk berjalan tanpa Anda"}, "key": "A", "points": {"A": 4, "C": 3, "D": 2, "B": 1}}, {"number": 35, "text": "Tugas piket kebersihan kelas tiba di hari yang sama dengan jadwal latihan penting untuk kompetisi olahraga. Dua teman yang seharusnya piket bersama tidak hadir, dan guru sudah memberikan teguran karena kelas belum dibersihkan. Waktu terbatas dan keputusan harus segera dibuat. Apa yang akan dilakukan?", "options": {"A": "Memberi tahu guru dan minta izin untuk menyusul piket setelah latihan selesai", "B": "Membersihkan kelas seefisien mungkin sebelum pergi agar kewajiban tetap terlaksana", "C": "Menghubungi teman piket untuk meminta bantuan membersihkan kelas segera", "D": "Pergi latihan terlebih dahulu dan kembali setelah selesai untuk membersihkan"}, "key": "B", "points": {"B": 4, "C": 3, "A": 2, "D": 1}}, {"number": 36, "text": "Pelatihan intensif pramuka penegak telah dijadwalkan lama dan merupakan bagian dari tahapan penting menuju pelantikan. Namun, di hari yang sama, sahabat dekat mengundang secara khusus ke acara ulang tahun yang tak bisa diundur. Dua kegiatan berlangsung bersamaan dan hanya satu yang bisa dihadiri. Pilihan seperti apa yang mencerminkan sikap bertanggung jawab?", "options": {"A": "Menjelaskan kepada sahabat bahwa Anda akan datang jika kegiatan pramuka selesai lebih awal", "B": "Menghadiri ulang tahun terlebih dahulu lalu menyusul ke pelatihan jika masih memungkinkan", "C": "Menghadiri ulang tahun dan absen dari pelatihan karena momen dengan sahabat tidak bisa diulang", "D": "Memilih ikut pramuka karena itu bagian dari tanggung jawab dan proses yang sudah dijalani"}, "key": "D", "points": {"D": 4, "A": 3, "B": 2, "C": 1}}, {"number": 37, "text": "Sebagai perwakilan siswa dalam forum musyawarah sekolah, Rio telah dipercaya menyuarakan aspirasi teman-temannya terkait pengadaan ruang diskusi terbuka. Namun, menjelang penyampaian usulan, kepala sekolah memberi sinyal bahwa ide tersebut kurang tepat karena keterbatasan lahan. Di sisi lain, teman-teman sudah menaruh harapan besar agar usulan itu disampaikan utuh. Apa yang sebaiknya Rio lakukan?", "options": {"A": "Menyuarakan aspirasi siswa sesuai rencana lalu menerima keputusan sekolah apapun hasilnya", "B": "Menunda penyampaian usulan sambil mengajak diskusi lanjutan dengan siswa dan guru pembina", "C": "Menyampaikan usulan sambil menghormati pandangan sekolah dan menawarkan ruang alternatif", "D": "Menyesuaikan isi usulan agar lebih disukai pihak sekolah meski ada bagian yang dikurangi"}, "key": "C", "points": {"C": 4, "A": 3, "D": 2, "B": 1}}, {"number": 38, "text": "Keikutsertaan dalam tim pengabdian masyarakat membuat Nita sering meninggalkan waktu istira hat dan kegiatan pribadi. Kini, ia mendapat tawaran magang bergengsi dari sebuah lembaga na sional, tetapi periode magang bersamaan dengan masa puncak kegiatan sosial timnya. Bila ia mun dur, tim akan kekurangan tenaga kunci. Apa pilihan yang menunjukkan dedikasi tanpa menga baikan kesempatan pribadi?", "options": {"A": "Mendiskusikan penyesuaian jadwal magang agar tetap bisa mendampingi tim di saat penting", "B": "Mengambil tawaran magang dan berjanji membantu tim dari jarak jauh bila memungkinkan", "C": "Menyerahkan tanggung jawab kepada anggota lain dengan tetap memberi arahan strategis", "D": "Memilih kesempatan magang karena bisa jadi batu loncatan untuk kontribusi lebih besar di masa depan"}, "key": "A", "points": {"A": 4, "B": 3, "C": 2, "D": 1}}, {"number": 39, "text": "Selama menjadi ketua tim lomba karya inovasi lingkungan, Dani dikenal aktif dan berdedikasi. Namun, beberapa anggota tim merasa tidak dilibatkan secara adil dan mulai menunjukkan sikap pasif. Lomba tinggal dua minggu lagi, dan jika tidak segera dibenahi, kualitas hasil kerja bisa menurun. Apa tindakan paling bijak bagi Dani?", "options": {"A": "Mengajak anggota yang kurang aktif berdiskusi pribadi untuk mencari tahu hambatan mereka", "B": "Menginisiasi pertemuan untuk evaluasi peran dan penyesuaian strategi bersama", "C": "Tetap menjalankan strategi awal dan fokus menyelesaikan bagiannya sebaik mungkin", "D": "Meminta guru pembimbing untuk turun tangan agar tim kembali solid"}, "key": "B", "points": {"B": 4, "C": 3, "A": 2, "D": 1}}, {"number": 40, "text": "Seorang siswa terlibat dalam organisasi sosial yang rutin membantu anak-anak kurang mampu belajar membaca. Suatu hari, jadwal kegiatan tersebut berbenturan dengan pemusatan latihan olimpiade yang juga penting untuk prestasi pribadi dan masa depan akademiknya. Kedua kegiatan sangat bernilai dan tidak mudah digantikan oleh orang lain. Langkah apa yang mencerminkan kesetiaan dan rasa tanggung jawab yang seimbang", "options": {"A": "Menyampaikan kondisi kepada tim sosial dan berharap mereka memahami jika harus absen sementara", "B": "Fokus pada olimpiade dan menawarkan peran teknis atau dukungan jarak jauh untuk kegiatan sosial", "C": "Memilih ikut olimpiade dan menghentikan sementara kegiatan sosial hingga selesai kompetisi", "D": "Menyusun jadwal ulang dengan kedua pihak agar dua tanggung jawab tetap bisa dijalankan bergantian"}, "key": "D", "points": {"D": 4, "A": 3, "B": 2, "C": 1}}, {"number": 41, "text": "Tim film pendek sekolah akan mengikuti festival nasional. Raka sebagai sutradara merasa kesulitan karena editor dan penulis naskah sering berbeda pendapat dan saling menyalahkan ketika proses revisi terhambat. Jika tidak segera diatasi, waktu produksi bisa habis sebelum tenggat. Apa yang sebaiknya Raka lakukan?", "options": {"A": "Meminta keduanya menunda perdebatan hingga film selesai demi efisiensi waktu", "B": "Mengambil keputusan sendiri sebagai sutradara untuk menengahi arah revisi", "C": "Mengajak tim berdiskusi terbuka untuk mencari titik temu dan menetapkan alur kerja bersama", "D": "Memisahkan tugas mereka agar tidak saling bersinggungan langsung dalam proses produksi"}, "key": "C", "points": {"C": 4, "B": 3, "D": 2, "A": 1}}, {"number": 42, "text": "Kelompok debat sekolah akan tampil dalam kompetisi provinsi. Tim terdiri dari siswa kelas XI dan XII yang berbeda gaya berbicara dan cara mempersiapkan materi. Suasana latihan mulai tegang karena perbedaan ini memicu kesalahpahaman. Sebagai moderator tim, langkah apa yang paling efektif dilakukan?", "options": {"A": "Menyusun latihan rotasi agar semua anggota saling mengenal kekuatan masing-masing", "B": "Menjelaskan perbedaan pendekatan antaranggota lalu menyatukan melalui kesepakatan gaya debat", "C": "Memberikan ruang latihan terpisah bagi anggota yang sulit beradaptasi dengan gaya lain", "D": "Mengusulkan penggantian anggota agar tim lebih mudah disatukan"}, "key": "A", "points": {"A": 4, "B": 3, "C": 2, "D": 1}}, {"number": 43, "text": "Komunitas lingkungan sekolah akan mengadakan kegiatan bersih-bersih sungai. Fadli ditunjuk sebagai koordinator. Namun saat hari pelaksanaan, setengah dari anggota yang sebelumnya menyatakan siap, tidak hadir tanpa konfirmasi. Sementara pihak sekolah dan warga sudah hadir. Apa yang sebaiknya dilakukan Fadli?", "options": {"A": "Menyampaikan kondisi kepada warga dan meminta waktu tambahan untuk pelaksanaan", "B": "Meminta guru pembina turun tangan membantu menyelesaikan kekurangan personel", "C": "Menunda kegiatan sampai jumlah anggota mencukupi untuk kerja optimal", "D": "Mengajak yang hadir bekerja maksimal sambil berkoordinasi dengan yang absen"}, "key": "D", "points": {"D": 4, "B": 3, "A": 2, "C": 1}}, {"number": 44, "text": "Dalam tim pentas seni akhir tahun, Amara bertanggung jawab atas properti. Seminggu sebelum acara, beberapa properti rusak karena penyimpanan yang tidak hati-hati oleh tim dekorasi. Acara tidak bisa ditunda, dan anggaran tidak cukup untuk mengganti semuanya. Apa langkah terbaik dari Amara?", "options": {"A": "Melapor ke panitia inti dan menunggu keputusan pengadaan ulang properti", "B": "Meminta bantuan guru pembina untuk mencari dukungan sponsor mendadak", "C": "Mengajak tim dekorasi memperbaiki properti bersama dan mencari bahan alternatif", "D": "Mengurangi penggunaan properti agar tetap bisa tampil meskipun seadanya"}, "key": "C", "points": {"C": 4, "D": 3, "A": 2, "B": 1}}, {"number": 45, "text": "Sebagai koordinator lomba antar kelas, Anda ditugaskan mempersiapkan lomba drama yang harus ditampilkan dalam waktu dua minggu. Namun saat latihan perdana, beberapa anggota tampak tidak antusias dan enggan terlibat dalam proses kreatif. Padahal tema lomba sudah ditentukan dan waktu sangat terbatas. Apa yang akan Anda lakukan?", "options": {"A": "Mengajak anggota berdiskusi ulang agar semua merasa memiliki peran dan tanggung jawab bersama", "B": "Mendorong anggota yang aktif untuk tetap lanjut latihan, sambil menunggu perubahan sikap dari anggota lainnya", "C": "Menyampaikan kepada guru pembimbing agar diberikan motivasi langsung kepada anggota yang tidak aktif", "D": "Mengalihkan peran utama kepada yang lebih aktif agar latihan tetap berjalan meski sebagian tidak terlibat"}, "key": "A", "points": {"A": 4, "B": 3, "D": 2, "C": 1}}, {"number": 46, "text": "Panitia pentas seni sekolah sedang menyusun jadwal tampil untuk setiap kelas. Sebagai ketua panitia, Anda menerima keluhan dari dua kelas yang merasa tidak puas karena mendapat urutan tampil di awal, padahal mereka merasa kurang siap. Jika diubah, kelas lain bisa merasa tidak adil. Apa yang akan Anda lakukan?", "options": {"A": "Meminta waktu tambahan untuk mengatur ulang jadwal dan menyesuaikan kembali dengan kesiapan peserta", "B": "Mengundang perwakilan kelas untuk mencari jalan tengah dan membuat jadwal berdasarkan hasil musyawarah", "C": "Menjaga jadwal yang sudah dibuat dengan harapan semua pihak menerima secara profesional", "D": "Menukar urutan secara diam-diam agar tidak menimbulkan konflik terbuka"}, "key": "B", "points": {"B": 4, "A": 3, "D": 2, "C": 1}}, {"number": 47, "text": "Sebagai bagian dari divisi dokumentasi dalam kegiatan OSIS, Anda bertugas mengumpulkan foto-foto kegiatan. Salah satu teman tidak menyerahkan hasil dokumentasinya tepat waktu, dan tenggat laporan hampir habis. Padahal data tersebut penting untuk laporan ke kepala sekolah. Apa yang Anda lakukan?", "options": {"A": "Segera menyusun laporan dengan data yang tersedia sambil menunggu dokumen sisanya", "B": "Menghubungi teman tersebut dan menawarkan bantuan jika ada kendala dalam pengumpulan dokumen", "C": "Memberi tahu ketua panitia mengenai keterlambatan data dan meminta arahan selanjutnya", "D": "Menyampaikan bahwa Anda tidak bisa menyelesaikan tugas karena kurangnya kerja sama anggota"}, "key": "B", "points": {"B": 4, "A": 3, "D": 2, "C": 1}}, {"number": 48, "text": "Dalam kegiatan bakti sosial, Anda bertanggung jawab pada divisi konsumsi. H-1 sebelum acara, Anda diberi tahu bahwa vendor makanan mengalami kendala dan mungkin tidak dapat memenuhi jumlah pesanan sesuai kesepakatan. Sementara waktu sangat terbatas untuk mencari vendor pengganti. Apa langkah Anda?", "options": {"A": "Menghubungi vendor utama untuk menegosiasikan solusi cepat, seperti pengurangan menu tanpa mengurangi jumlah", "B": "Menyampaikan kondisi ini kepada ketua pelaksana dan menunggu keputusan dari panitia inti", "C": "Menyerahkan tanggung jawab pada orang lain karena merasa sudah bekerja sesuai perjanjian", "D": "Segera mencari vendor cadangan dan mendiskusikan opsi terbaik dengan panitia lainnya"}, "key": "D", "points": {"D": 4, "A": 3, "B": 2, "C": 1}}];
