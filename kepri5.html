window.__SOAL_TEMPLATE_QUESTIONS = [{"number": 1, "text": "Anda mengikuti kegiatan ekstrakurikuler band di sekolah. Suatu ketika, pihak sekolah meminta anggota ekstrakurikuler band membantu acara pentas seni sekolah. Sebagai pemain gitar, Anda diminta untuk belajar memainkan bass untuk menggantikan pemain bass yang tiba-tiba sakit dan dirawat di rumah sakit. Apa yang akan Anda lakukan?", "options": {"A": "Menolak memainkan bass karena khawatir tidak bisa menguasainya dalam waktu dekat.", "B": "Belajar memainkan bass dengan yakin karena mirip dengan gitar yang biasa dimainkan.", "C": "Berlatih bass dengan optimis sebagai kesempatan untuk menguasai keterampilan baru.", "D": "Mau mencoba memainkan bass, asalkan ada teman lain yang ikut belajar memainkan bass."}, "points": {"A": 1, "B": 3, "C": 4, "D": 2}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 2, "text": "Dalam kerja kelompok membuat video animasi, Anda mendapat bagian menulis naskah. Beberapa teman memberikan ide tambahan yang berbeda dari konsep awal Anda. Ide tersebut menarik, tapi membuat naskah Anda harus direvisi cukup banyak padahal tenggat waktunya tinggal sebentar lagi. Apa yang akan Anda lakukan?", "options": {"A": "Fokus menyelesaikan naskah sesuai rancangan yang ditetapkan di awal karena tenggat waktunya sudah sangat dekat.", "B": "Menerima ide yang paling mudah diterapkan dan meminta teman yang bisa diandalkan untuk membantu merevisinya.", "C": "Mengajak semua anggota untuk berpendapat soal ide yang ada dan berbagi tugas untuk memperbaikinya bersama.", "D": "Merevisi naskah agar bisa memasukkan semua ide agar isi cerita lebih lengkap dan menarik, meski waktunya terbatas."}, "points": {"A": 2, "B": 3, "C": 4, "D": 1}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 3, "text": "Anda memiliki tugas kelompok yang harus dikumpulkan Senin minggu depan. Kelompok Anda kemudian mengadakan kerja kelompok di rumah Anda pada hari Minggu. Namun, salah satu anggota kelompok datang ke rumah Anda dalam keadaan terluka karena kecelakaan dalam perjalanan. Apa yang akan Anda lakukan?", "options": {"A": "Mengucapkan rasa syukur karena teman Anda selamat dari kecelakaan yang menimpanya.", "B": "Mendengarkan cerita teman ketika ia mulai menceritakan kecelakaan yang dialami.", "C": "Menanyakan keadaan teman Anda dan menawarkan bantuan yang dapat diberikan.", "D": "Menanyakan keadaan dan memberikan waktu merawat lukanya sebelum mengerjakan tugas."}, "points": {"A": 1, "B": 2, "C": 3, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 4, "text": "Sebagai pengurus OSIS yang mengelola akun Instagram resmi, Anda membuat unggahan pengumuman acara kompetisi antarkelas. Setelah terunggah, banyak yang berkomentar bahwa acaranya membosankan dan tidak menarik, padahal acara ini merupakan program unggulan yang direncanakan dengan penuh semangat oleh pengurus. Apa yang akan Anda lakukan?", "options": {"A": "Menunjukkan komentar kepada seluruh pengurus OSIS di rapat selanjutnya agar bisa menjadi persiapan dalam menyelenggarakan acara.", "B": "Melaporkan temuan komentar negatif kepada seluruh pengurus OSIS secara segera untuk dapat mendiskusikan cara menyikapinya.", "C": "Menunjukkan komentar negatif yang muncul hanya kepada ketua dan wakil OSIS untuk meminta persetujuan penghapusan komentar.", "D": "Menghapus semua komentar negatif tanpa memberitahu anggota OSIS lain agar masalah tidak semakin besar dan acara bisa dilakukan."}, "points": {"A": 3, "B": 4, "C": 2, "D": 1}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 5, "text": "Anda membuat kelompok tugas bersama teman-teman terdekat. Saat hari pengumpulan, bagian yang dikerjakan salah satu teman belum selesai sesuai standar kesepakatan. Anggota lain kurang sabar karena teman tersebut berkeras hasilnya sudah cukup baik dan memaksa mengumpulkan karena waktu sudah mepet. Apa yang akan Anda lakukan?", "options": {"A": "Mengajak seluruh anggota menyisihkan waktu untuk merevisi sampai semua puas dengan standar yang disepakati.", "B": "Menilai ulang hasil teman tersebut bersama kelompok lalu mencari cara revisi yang tidak memberatkan semua anggota.", "C": "Menerima hasil teman meski kurang maksimal karena hasil kerja anggota lain dianggap cukup untuk menutup nilai kelompok.", "D": "Menyepakati pendapat mayoritas dan meminta teman tersebut untuk merevisi bagiannya sebelum tenggat waktu pengumpulan."}, "points": {"A": 2, "B": 4, "C": 1, "D": 3}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 6, "text": "Tim panitia upacara bendera di lingkungan RW Anda sudah berlatih dengan rencana bendera terpasang tanpa tiang paskibra. Dua hari menjelang acara, seorang anak mengusulkan adanya paskibra dan disetujui oleh RW. Panitia kini menimbulkan ketegangan sehingga tim terbagi menjadi dua kubu. Sebagai salah satu panitia, apa yang akan Anda lakukan?", "options": {"A": "Memilih mengikuti keputusan apapun yang dianggap terbaik oleh tim, agar acara berjalan baik.", "B": "Menenangkan situasi sambil menengahi perbedaan agar segera menyepakati pilihan bersama.", "C": "Berusaha mencairkan suasana agar tidak menegangkan dan panitia tetap fokus menyiapkan acara.", "D": "Menyampaikan pendapat kepada beberapa teman yang dirasa akan sependapat dengan Anda."}, "points": {"A": 2, "B": 4, "C": 3, "D": 1}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 7, "text": "Anda sedang mengikuti lomba teater antarsekolah. Sehari sebelum tampil, seorang teman masuk properti penting yang sudah susah payah dikerjakan bersama-sama. Bahkan, ia terlihat tidak terlalu merasa bersalah, padahal tanpa properti itu pementasan bisa berantakan. Sementara, Anda sudah sangat lelah dan butuh istirahat. Apa yang akan Anda lakukan?", "options": {"A": "Berusaha menahan emosi, tapi baru bersedia membantu jika ia menunjukkan kesediaan untuk bertanggung jawab.", "B": "Mengajak teman tersebut membicarakan opsi yang bisa dilakukan sambil berusaha tetap tenang menghadapi situasi.", "C": "Merasa kesal dan menggerutunya langsung, lalu segera pergi agar ia menyelesaikan sendiri masalah yang dibuat.", "D": "Mencoba menahan emosi dan memintanya berkoordinasi dengan pengurus properti yang lebih tahu jalan keluarnya."}, "points": {"A": 2, "B": 4, "C": 1, "D": 3}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 8, "text": "Sekolah mewajibkan seluruh siswa mengikuti upacara setiap Senin dengan atribut seragam lengkap. Saat bel upacara berbunyi, sahabat Anda panik karena topinya tertinggal di rumah, sedangkan siswa yang atributnya tidak lengkap akan dihukum berdiri di depan. Apa yang akan Anda lakukan?", "options": {"A": "Menemani sahabat mencari topi cadangan terlebih dahulu, tetapi tetap permisi ke lapangan jika sama sekali tidak menemukannya.", "B": "Menemaninya untuk mencari topi cadangan sebelum upacara dimulai dan menyarankan membeli baru di koperasi jika tidak ada.", "C": "Menyarankan alternatif tempat untuk mencari topi cadangan, lalu pergi lebih dahulu ke lapangan agar tidak terlambat.", "D": "Mengatakan kepada sahabat akan pergi ke lapangan terlebih dahulu karena atribut sendiri sudah lengkap."}, "points": {"A": 3, "B": 4, "C": 2, "D": 1}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 9, "text": "Anda ditunjuk oleh guru untuk menjadi ketua panitia perpisahan kelas 12. Banyak panitia tidak hadir dalam rapat penting karena merasa terbebani dengan waktu ujian praktik. Padahal, banyak hal yang harus dipersiapkan mengingat waktu kegiatan sebentar lagi. Apa yang akan Anda lakukan?", "options": {"A": "Memfokuskan diri pada persiapan acara yang sudah biasa dilakukan sebelumnya agar tetap ada kemajuan.", "B": "Tetap berusaha menyelesaikan persiapan acara sebisanya sambil meminta bantuan guru untuk mencari tenaga tambahan.", "C": "Melanjutkan rapat dengan panitia yang hadir dan membagi tugas kepada mereka sesuai dengan kemampuan setiap orang.", "D": "Membiarkan acara berlangsung ala kadarnya karena merasa sulit mengatur persiapan tanpa kehadiran panitia lain."}, "points": {"A": 2, "B": 3, "C": 4, "D": 1}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 10, "text": "Anda terpilih sebagai kandidat ajang pemilihan duta remaja tingkat kota. Kemenangan akan sangat membanggakan dan membawa nama baik sekolah. Di sisi lain, Anda akan sering meninggalkan pelajaran dan berpotensi tertinggal secara akademik jika lolos seleksi. Apa yang akan Anda lakukan dalam situasi ini?", "options": {"A": "Menerima kesempatan yang ada karena tidak datang dua kali, sementara akademik bisa diusahakan dengan cara lain.", "B": "Memutuskan mengikuti seleksi tersebut karena ini adalah ajang prestisius yang tidak semua orang bisa mendapatkannya.", "C": "Memutuskan untuk mengikuti ajang tersebut sambil mengatur waktu dan rencana belajar disertai diskusi dengan guru dan teman.", "D": "Memutuskan mengikuti ajang tersebut sambil membuat jadwal belajar pribadi agar risiko tertinggal pelajaran bisa diminimalisasi."}, "points": {"A": 2, "B": 1, "C": 4, "D": 3}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 11, "text": "Kegiatan study tour akan dilaksanakan dan Anda adalah panitia di seksi keamanan. Tiba-tiba teman di bagian dokumentasi batal ikut karena operasi usus buntu. Anda diminta membantu mendokumentasikan kegiatan karena dianggap bisa memotret, walaupun tidak ahli. Apa yang akan Anda lakukan?", "options": {"A": "Mencari orang untuk membantu di dokumentasi dan Anda tetap di seksi keamanan.", "B": "Berusaha membantu dua seksi karena bisa sekaligus melatih kemampuan memotret.", "C": "Melaksanakan tugas di seksi keamanan lalu berusaha membantu dokumentasi ketika lowong.", "D": "Mengatakan bahwa tugas Anda cukup berat di seksi keamanan sehingga sulit untuk membantu."}, "points": {"A": 3, "B": 2, "C": 4, "D": 1}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 12, "text": "Pada lomba 17-an di komplek perumahan, Anda bertugas sebagai panitia. Saat pengumuman pemenang, seorang peserta marah dan menuduh panitia tidak adil karena tetangganya yang sering berkonflik dengannya ditetapkan sebagai pemenang. Suasana menjadi tegang dan sulit terkendali. Apa yang akan Anda lakukan?", "options": {"A": "Segera mendekati peserta tersebut untuk menjelaskan aturan penilaian lomba dan meminta panitia lain untuk menenangkan situasi.", "B": "Memilih tenang dan tidak menanggapi amarah peserta, tapi membiarkan suasana tegang berlanjut sampai panitia lain yang menenangkan.", "C": "Membalas amarah peserta dan berkata bahwa penentuan pemenang sudah adil sesuai dengan aturan yang telah ditetapkan sebelumnya.", "D": "Memilih untuk tenang dan menemui peserta yang marah tersebut untuk menunjukkan hasil penilaian agar dapat dipahami peserta tersebut."}, "points": {"A": 4, "B": 2, "C": 1, "D": 3}, "key": "A", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 13, "text": "Anda adalah sekretaris panitia pentas seni sekolah yang akan dilaksanakan besok. Saat mengecek persiapan, Anda menemukan peralatan belum disiapkan, konsumsi belum dipastikan, dan pembawa acara belum konfirmasi kehadiran. Sementara itu, ketua panitia sulit dihubungi karena sedang mengikuti lomba di luar sekolah. Apa yang akan Anda lakukan?", "options": {"A": "Mengevaluasi kendala yang terjadi di setiap divisi dan menimbang risikonya pada pelaksanaan acara.", "B": "Menyadari masalah yang terjadi saat ini sambil menunggu arahan selanjutnya dari guru penanggung jawab.", "C": "Meyakini bahwa kendala yang terjadi merupakan hal yang wajar dan tidak akan menjadi hambatan acara.", "D": "Mencatat kendala yang muncul untuk kemudian menanyakan detailnya pada penanggung jawab."}, "points": {"A": 4, "B": 2, "C": 1, "D": 3}, "key": "A", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 14, "text": "Saat latihan pramuka, instruktur meminta kelompok Anda terus mengulang latihan baris-berbaris karena selalu ada kesalahan kecil dalam formasi. Latihan berlangsung lama di bawah kondisi melelahkan. Beberapa teman mulai putus asa dan mengeluh ingin berhenti karena merasa tidak sanggup memperbaiki gerakan. Apa yang akan Anda lakukan?", "options": {"A": "Mengikuti latihan semampunya, sambil berusaha memperbaiki gerakan diri sendiri sampai sempurna dan tidak bisa disalahkan.", "B": "Memutuskan berhenti sejenak karena tenaga sudah terkuras dan merasa hasilnya tidak banyak berubah jika kelelahan.", "C": "Tetap bertahan latihan sambil meminta kelompok untuk saling memperhatikan dan mengoreksi formasi satu sama lain.", "D": "Tetap bertahan dengan bantuan arahan dan dorongan dari instruktur atau teman agar bisa melanjutkan latihan."}, "points": {"A": 2, "B": 1, "C": 4, "D": 3}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 15, "text": "Anda mengikuti kegiatan pramuka tingkat kota dan ditempatkan dalam regu berisi siswa dari sekolah lain yang belum dikenal. Mereka memiliki cara kerja berbeda — sebagian bertindak cepat tanpa diskusi dan sebagian sangat teliti. Saat membangun tenda, perbedaan ini membuat kelompok lambat. Apa yang akan Anda lakukan?", "options": {"A": "Fokus mengerjakan tugas yang bisa dikerjakan sendiri tanpa terlalu terlibat dalam kelompok, karena bisa memperumit keadaan.", "B": "Mencoba mengakrabkan diri dengan anggota regu dan lebih aktif saat mengerjakan bagian yang sudah dikuasai.", "C": "Mengerjakan bagian tenda yang lebih sederhana sebisanya, sambil perlahan beradaptasi dengan pola kerja teman sekelompok.", "D": "Segera memahami perbedaan pola kerja, lalu membantu regu menemukan cara bersama agar tenda bisa segera dibangun."}, "points": {"A": 1, "B": 3, "C": 2, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 16, "text": "Anda tergabung dalam tim dengan ketua baru yang disiplin pintar dan ambisius. Namun, saat rapat ia seringkali terlalu mengatur dan kurang menghargai pendapat anggota lain. Hal ini membuat suasana rapat menjadi tidak nyaman dan beberapa teman mulai berbisik-bisik di belakang. Dalam situasi ini, apa yang akan Anda lakukan?", "options": {"A": "Menyampaikan pendapat hanya kepada beberapa teman yang dianggap aman ketika rapat.", "B": "Menjaga diri dengan tetap diam dan tidak terlibat saat suasana rapat terasa kurang nyaman.", "C": "Menenangkan suasana rapat sambil menyampaikan pendapat sehingga teman lain terdorong aktif.", "D": "Mencairkan suasana rapat agar tidak menegangkan dan tetap nyaman untuk semua anggota tim."}, "points": {"A": 1, "B": 2, "C": 4, "D": 3}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 17, "text": "Baru seminggu pindah ke sekolah baru, Anda mendapat teguran dari guru karena beberapa kali memberikan pendapat sebelum ditunjuk. Teguran ini membuat Anda merasa bingung karena di sekolah lama para siswa boleh memberikan pendapat kapan saja. Apa yang akan Anda lakukan?", "options": {"A": "Memahami dan mengikuti budaya di sekolah baru, sehingga Anda hanya memberikan pendapat hanya setelah ditunjuk oleh guru.", "B": "Meminta maaf dan bertanya kepada guru dan teman tentang kebiasaan di sekolah baru agar bisa menyesuaikan diri.", "C": "Meminta maaf dan menjelaskan kepada guru bahwa Anda terbawa kebiasaan di sekolah lama tanpa bermaksud tidak sopan.", "D": "Tetap mengikuti kebiasaan di sekolah lama meskipun frekuensinya dikurangi karena pendapat harus langsung disampaikan."}, "points": {"A": 3, "B": 4, "C": 2, "D": 1}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 18, "text": "Anda merupakan seorang anggota dari ekstrakurikuler olahraga yang baru saja mengikuti lomba antarsekolah. Di pertandingan tersebut tim Anda gagal di babak kualifikasi yang menyebabkan anggota mengalami kekecewaan dan mulai meragukan strategi kapten dalam pelatihan. Beberapa anggota memutuskan keluar dari tim. Apa yang akan Anda lakukan?", "options": {"A": "Memutuskan mengikuti anggota lain untuk keluar dari tim dan bergabung dengan ekstrakurikuler yang dirasa lebih unggul.", "B": "Bertahan dalam tim dan menyemangati kapten untuk tetap melanjutkan latihan karena ekstrakurikuler ini populer di sekolah.", "C": "Bertahan dalam tim sementara waktu sambil memperhatikan situasi dan mempertimbangkan untuk ikut mundur dari tim.", "D": "Bertahan dalam tim dan mengajak kapten untuk meninjau kegagalan pada permainan sebelumnya meskipun menyita banyak waktu."}, "points": {"A": 1, "B": 3, "C": 2, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 19, "text": "Anda tergabung dalam tim lomba debat Bahasa Indonesia dan biasanya berperan sebagai pembicara pertama. Namun, pada semifinal perlombaan, seorang rekan merasa kurang memahami topik debat. Akhirnya, tim sepakat mengubah formasi, menempatkan Anda sebagai pembicara ketiga dalam debat. Dalam situasi ini, apa yang akan Anda lakukan?", "options": {"A": "Menerima keputusan perubahan formasi karena menyukai tantangan dan merasa yakin dengan kemampuan diri dan tim.", "B": "Melakukan yang terbaik sebagai pembicara ketiga demi kelancaran jalannya lomba debat walaupun belum ada pengalaman sebelumnya.", "C": "Mengusulkan peninjauan kembali keputusan tim karena Anda belum memiliki pengalaman menjadi pembicara ketiga dalam debat.", "D": "Meminta dukungan dan masukan dari rekan agar bisa beradaptasi ke formasi tim debat yang baru sebagai pembicara ketiga."}, "points": {"A": 2, "B": 3, "C": 1, "D": 4}, "key": "D", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 20, "text": "Anda bertugas sebagai pengibar bendera dalam latihan upacara. Setelah latihan selesai, pelatih memuji sikap Anda sudah tegap dan tenang, dan langkah kaki sudah serirama mengikuti lagu. Namun, ia menilai lipatan bendera masih tampak berantakan, dan gerakan menarik tali sempat terlambat mengikuti lagu. Apa yang akan Anda lakukan?", "options": {"A": "Menerima komentar pelatih dan berniat memperbaiki lipatan bendera serta gerakan tali pada latihan berikutnya.", "B": "Memperbaiki lipatan bendera dan gerakan setelah mendapat masukan, lalu meminta arahan tambahan.", "C": "Merasa kritik soal lipatan dan tarikan tali bukan prioritas saat ini karena gerakan utama sudah sesuai harapan.", "D": "Merasa lebih percaya diri karena pelatih menilai langkah sudah serirama, meskipun ada masukan kecil lain."}, "points": {"A": 3, "B": 4, "C": 1, "D": 2}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 21, "text": "Anda mengikuti program pertukaran pelajar selama satu bulan di sekolah mitra luar negeri. Teman-teman baru Anda memiliki cara belajar, kebiasaan, serta norma budaya yang berbeda dari yang biasa Anda jalani di Indonesia. Saat mengerjakan proyek kelompok, muncul perbedaan cara kerja. Apa yang akan Anda lakukan?", "options": {"A": "Mendengarkan masukan teman anggota lain, sambil berusaha menyesuaikan cara kerja mereka dengan cara kerja pribadi agar sejalan.", "B": "Memilih lebih banyak diam di dalam kelompok karena merasa metode yang Anda miliki lebih baik dan seharusnya diikuti semua anggota.", "C": "Berusaha memahami perbedaan budaya dan menyatukan cara kerja agar bisa bekerja sama dengan baik dalam menyelesaikan proyek kelompok.", "D": "Berusaha mengerjakan bagian tugas Anda sendiri dan hanya berinteraksi dengan beberapa teman anggota yang sepemikiran dengan Anda."}, "points": {"A": 3, "B": 1, "C": 4, "D": 2}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 22, "text": "Anda harus mengirim poster acara lomba ke email panitia sebelum pukul enam sore. Ternyata, ukuran dokumen Anda melebihi yang diperbolehkan email sekolah. Anda menggunakan komputer di laboratorium sekolah, tapi karena harus digunakan bergiliran membuat waktu pakai Anda terbatas. Pada situasi tersebut, apa yang akan Anda lakukan?", "options": {"A": "Meminta perpanjangan waktu satu jam kepada panitia sambil menyiapkan versi terkompresi agar tetap terkirim hari itu juga.", "B": "Segera membagi dokumen menjadi beberapa lampiran, lalu mengirimkannya sebelum tenggat dan konfirmasi ke panitia.", "C": "Menunggu sampai Anda bisa mendapatkan giliran dan mengirimkan dokumen sebisanya di hari itu tanpa memperhatikan tenggat waktu.", "D": "Mencoba mengirimkan dokumen melalui cara lain selain email dan mengirim pemberitahuan ke panitia agar bisa menerimanya."}, "points": {"A": 2, "B": 4, "C": 1, "D": 3}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 23, "text": "Sebagai ketua panitia lomba olahraga antar kelas, Anda memutuskan menggunakan lapangan belakang sekolah untuk pertandingan final karena sudah biasa digunakan. Ternyata beberapa masalah muncul saat pertandingan: penonton sulit menyaksikan pertandingan dan lapangan licin. Setelah lomba selesai, Anda diminta melakukan evaluasi. Apa yang akan Anda lakukan?", "options": {"A": "Menyelidiki kembali kendala secara menyeluruh dan memberikan saran perbaikan untuk digunakan pada acara selanjutnya.", "B": "Menyadari adanya kendala dalam kegiatan dan fokus melakukan perbaikan pada masalah yang lebih banyak dikeluhkan.", "C": "Menelusuri kembali kendala yang terjadi dengan meminta penjelasan pada orang yang bertugas mengurus lapangan.", "D": "Merasa masalah yang terjadi bukan isu penting karena selama ini penggunaan lapangan tersebut tidak pernah menimbulkan masalah."}, "points": {"A": 4, "B": 3, "C": 2, "D": 1}, "key": "A", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 24, "text": "Ketika mengerjakan tugas kelompok yang harus dikumpulkan besok, seorang teman Anda permisi untuk mengangkat telepon. Ketika kembali, wajahnya pucat dan ia segera membereskan barangnya untuk pulang. Bagian tugasnya ternyata masih kosong dan belum dikerjakan ketika ia bergegas pulang. Apa yang akan Anda lakukan?", "options": {"A": "Menanyakan keadaannya sebelum pergi, lalu memberikan sedikit saran dan mengingatkan untuk tetap menyusulkan tugasnya.", "B": "Membiarkannya pulang dan menunggu teman tersebut menjelaskan masalahnya sambil menyelesaikan tugas.", "C": "Membiarkannya pulang, lalu mengirim pesan pribadi untuk menanyakan keadaan dan kemampuannya mengerjakan tugas.", "D": "Melanjutkan bagian tugas yang masih kosong bersama sisa teman kelompok yang lain langsung agar tugas bisa segera diselesaikan."}, "points": {"A": 2, "B": 1, "C": 4, "D": 3}, "key": "C", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}, {"number": 25, "text": "Anda tergabung dalam ekstrakurikuler paskibra yang mana saat ini sedang berada dalam masa sulit. Setelah kalah berturut-turut, beberapa teman ingin keluar dari tim karena merasa usahanya sia-sia. Anda juga ditawari untuk ikut ekstrakurikuler lain yang baru saja dibentuk. Pada situasi tersebut, apa yang akan Anda lakukan?", "options": {"A": "Memilih bertahan untuk saat ini, tetapi terbuka untuk pindah bila ekskul lain terlihat lebih menjanjikan.", "B": "Tetap bertahan di paskibra meskipun perkembangan diragukan namun tetap yakin tim bisa bangkit bersama.", "C": "Merasa kurang termotivasi untuk bertahan di paskibra karena merasa tidak ada perkembangan berarti.", "D": "Bertahan di paskibra karena bisa membuka peluang ikut kompetisi yang lebih besar atau mendapat beasiswa."}, "points": {"A": 3, "B": 4, "C": 1, "D": 2}, "key": "B", "type": "single", "category": "kepribadian", "categoryLabel": "Kepribadian"}];
