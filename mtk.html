peroleh Rp85.000 pada hari itu, maka dia akan pulang pukul ... WIB","options":{"A":"0.680555555555556","B":"0.694444444444444","C":"0.708333333333333","D":"0.722222222222222","E":"0.729166666666667"},"answer":"E","explanation":"","source":"","difficulty":"sedang","points":1,"conceptKey":"PERBANDINGAN_SENILAI_BERBALIK|faqih merupakan pekerja di pabrik pt sejahtera honor faqih di pabrik tersebut ad"},{"number":86,"id":"MTKTO1_086","category":"GEOMETRI","categoryLabel":"Geometri","type":"single","text":"Sebuah tiang bendera di Istana Merdeka memiliki tinggi 17 m. Tiang bendera tersebut memiliki bayangan dengan tinggi 5,25 m. Jika di dekat tiang bendera terdapat pohon kelapa dengan tinggi bayangan 7,8 m, maka tinggi pohon kelapa sebenarnya adalah….","options":{"A":"18,6 m","B":"21,75 m","C":"22,75 m","D":"25,26 m","E":"29 m"},"answer":"D","explanation":"","source":"","difficulty":"sedang","points":1,"conceptKey":"GEOMETRI|sebuah tiang bendera di istana merdeka memiliki tinggi 17 m tiang bendera terseb"},{"number":87,"id":"MTKTO1_087","category":"PELUANG_KOMBINATORIKA","categoryLabel":"Peluang & Kombinatorika","type":"single","text":"Alumni SIPSS (Sekolah Inspektur Polisi Sumber Sarjana) Angkatan XII mengadakan reuni di AKPOL (Akademi Kepolisian), Semarang. Reuni tersebut mengundang 30 perwira laki-laki dan 20 perwira perempuan. Jika terdapat 70% perwira laki-laki yang hadir, dan 80% perwira perempuan yang hadir, maka persentase tamu undangan yang hadir adalah.…","options":{"A":"70%","B":"71%","C":"73%","D":"74%","E":"75%"},"answer":"D","explanation":"","source":"","difficulty":"sedang","points":1,"conceptKey":"PELUANG_KOMBINATORIKA|alumni sipss sekolah inspektur polisi sumber sarjana angkatan xii mengadakan reu"},{"number":88,"id":"MTKTO1_088","category":"GEOMETRI","categoryLabel":"Geometri","type":"single","text":"Pemerintah Indonesia saat ini sedang membangun infrastruktur pembangunan jalan tol untuk pemerataan ekonomi di berbagai wilayah. Dibutuhkan 420 drum aspal un
